<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   Wiring
   ═══════════════════════════════════════════════════════════════════ */
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.className='toast on';
  clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast',2600)}

/* Re-rendering replaces #view wholesale, so every scroll container inside it is
   reborn at offset 0. Walk the tree in document order and key each element by
   tag+class plus its ordinal, so the same key finds the same box after the
   rebuild. Both passes must count EVERY element, not just scrolled ones, or the
   ordinals drift apart. */
function scrollKeys(fn){
  const n=new Map();
  document.querySelectorAll('#view *').forEach(el=>{
    const t=el.nodeName+'.'+(el.getAttribute('class')||'');
    const i=n.get(t)||0;n.set(t,i+1);
    fn(el,t+'#'+i);
  });
}
function scrollSnapshot(){
  const m=new Map();
  scrollKeys((el,k)=>{if(el.scrollTop||el.scrollLeft)m.set(k,[el.scrollTop,el.scrollLeft])});
  return m;
}
function scrollRestore(m){
  if(!m.size)return;
  scrollKeys((el,k)=>{const v=m.get(k);if(v){el.scrollTop=v[0];el.scrollLeft=v[1]}});
}

function rerenderKeepFocus(){
  const ae=document.activeElement,ds=ae&&ae.dataset?ae.dataset:null;
  const key=ds?(ds.k||ds.a):null,raw=ae?ae.value:null;
  const ss=ae&&ae.selectionStart,se=ae&&ae.selectionEnd;
  const scr=scrollSnapshot(),wx=window.scrollX,wy=window.scrollY;
  render();
  scrollRestore(scr);
  if(key){
    const el=document.querySelector(`[data-k="${CSS.escape(key)}"],[data-a="${CSS.escape(key)}"]`);
    if(el){
      /* preventScroll or the browser drags the cell into view from offset 0 and
         the pane jumps under the cursor on every keystroke. */
      el.focus({preventScroll:true});
      if(raw!=null&&el.type!=='date'&&el.value!==raw)el.value=raw;
      try{el.setSelectionRange(ss,se)}catch(e){}
    }
  }
  /* Content reflow can shorten the document and take the window with it. */
  if(window.scrollX!==wx||window.scrollY!==wy)window.scrollTo(wx,wy);
}

/* the pay week rolls forward: balances projected, recurring allocations kept */
function rollDate(d,from){
  if(!d)return'';
  let x=d,guard=0;
  while(x<from&&guard++<36){const t=parseISO(x);t.setMonth(t.getMonth()+1);x=iso(t)}
  return x;
}
/* ── deleting weeks ───────────────────────────────────────────────
   Forty weeks came across from the spreadsheet, four of them dated ahead
   and holding figures typed in advance rather than anything that happened.
   There was no way to remove a week at all, so there is one now.

   Undo covers it -- the snapshot is the whole ledger -- but a wrong click
   here costs a week of entry, so it also names what it is about to remove
   and never leaves the ledger with nothing in it. */
function deleteWeeks(){
  const k=currentWeek(),ks=weekKeys(),i=ks.indexOf(k);
  const after=ks.slice(i+1);
  const drop=list=>{
    pushUndo(null);
    for(const w of list)delete S.weeks[w];
    const left=weekKeys();
    UI.week=left.includes(k)?k:(left[left.length-1]||null);
    save();render();
    toast(`${list.length} ${list.length===1?'week':'weeks'} removed — ⌘Z to undo`);
  };
  if(ks.length<=1){toast('This is the only week — nothing to delete');return}
  /* Name what survives, not just what goes. The two options sit next to each
     other and differ by one word otherwise. */
  const body=after.length
    ? `${after.length===1?'1 week is':`${after.length} weeks are`} dated after this one: `
      +`${weekLabel(after[0])}${after.length>1?` through ${weekLabel(after[after.length-1])}`:''}. `
      +`Deleting those keeps ${weekLabel(k)} and everything in it. `
      +`Deleting this week instead removes ${weekLabel(k)}'s own balances and allocations `
      +`and leaves the later weeks alone. Either way, ⌘Z undoes it.`
    : `This week is ${weekLabel(k)}, the last in the ledger. Removing it deletes its `
      +`balances and everything assigned in it. ⌘Z undoes this.`;
  if(!after.length)return confirmModal('Delete week',body,'Delete this week',()=>drop([k]));
  confirmModal('Delete week',body,
    `Delete the ${after.length} after ${weekLabel(k)}`,()=>drop(after),
    `Delete ${weekLabel(k)} itself`,()=>drop([k]));
}

/* ── pull balances forward ────────────────────────────────────────
   `+ Next week` carries After into the next week's Balance, but it only
   builds a week that does not exist yet. Four weeks were imported from the
   spreadsheet already forward-planned, so stepping into one of those gives
   figures typed weeks ago rather than a projection of what actually
   happened. This does the carry on a week that is already there.

   Balances only. Minimums, dates and allocations in an existing week were
   entered deliberately and are not the caller's problem. Setting `projected`
   alongside `balance` is deliberate too: it turns on the drift tag, so
   correcting a balance against the bank shows what the projection missed. */
function pullForward(){
  const k=currentWeek(),ks=weekKeys(),i=ks.indexOf(k);
  if(i<=0){toast('No earlier week to pull from');return}
  const prev=ks[i-1],P=computeWeek(prev);
  const changes=[];
  for(const r of P.rows){
    if(r.a.kind==='income'||r.isRollup)continue;
    const proj=KIND_DEBT(r.a.kind)?r2(Math.max(0,r.after)):r2(r.after);
    const e=entryOf(k,r.a.id);
    if(Math.abs(n0(e.balance)-proj)>=0.005)changes.push({name:r.a.name,from:n0(e.balance),to:proj});
  }
  if(!changes.length){toast(`Already matches ${weekLabel(prev)} — nothing to pull`);return}
  const list=changes.slice(0,6).map(c=>
    `<li><span>${esc(c.name)}</span><b>${money(c.from)} → ${money(c.to)}</b></li>`).join('');
  modal(`<h3>Pull balances forward</h3>
    <p>Rewrites this week's Balance column from ${esc(weekLabel(prev))}'s After column.
      <b>${changes.length}</b> ${changes.length===1?'balance changes':'balances change'};
      minimums, dates and allocations are left alone. ⌘Z undoes it.</p>
    <ul class="pulllist">${list}${changes.length>6
      ?`<li class="more"><span>and ${changes.length-6} more</span></li>`:''}</ul>`,
    'Pull forward',()=>{
      pushUndo(null);
      for(const r of P.rows){
        if(r.a.kind==='income'||r.isRollup)continue;
        const proj=KIND_DEBT(r.a.kind)?r2(Math.max(0,r.after)):r2(r.after);
        const e=entryOf(k,r.a.id);e.balance=proj;e.projected=proj;
      }
      save();render();
      toast(`${changes.length} balances pulled from ${weekLabel(prev)} — ⌘Z to undo`);
    });
}

function newWeek(){
  const ks=weekKeys(),last=ks[ks.length-1],nk=addWeeks(last,1);
  if(S.weeks[nk]){UI.week=nk;UI.tab='sheet';render();toast('That week already exists');return}
  const C=computeWeek(last),entries={};
  for(const r of C.rows){
    const a=r.a,e=blankEntry();
    if(a.kind==='income'){e.balance=C.totals.income;e.projected=C.totals.income}
    else{
      /* `after` already includes this week's interest, so the next opening balance is just that */
      const proj=KIND_DEBT(a.kind)?r2(Math.max(0,r.after)):r.after;
      e.balance=proj;e.projected=proj;
    }
    e.minAmt=r.minAmt;
    e.close=rollDate(r.close,nk);e.due=rollDate(r.due,nk);
    /* sinking funds and loan minimums repeat every week; attack is a fresh decision */
    if(KIND_INFLOW(a.kind))e.other=r.other;
    if(a.kind==='loan')e.min=r.min;
    entries[a.id]=e;
  }
  S.weeks[nk]={income:C.totals.income,entries};
  UI.week=nk;UI.tab='sheet';save();render();
  toast('Balances projected forward — correct any that differ from the bank');
}

/* ── input ────────────────────────────────────────────────────────── */
function setWeekField(key,val){
  const k=currentWeek(),w=S.weeks[k];
  if(key==='income'){
    w.income=n0(val);
    const inc=liveAccounts().find(a=>a.kind==='income');
    if(inc)entryOf(k,inc.id).balance=w.income;
    return;
  }
  const[id,field]=key.split(':'),e=entryOf(k,id);
  e[field]=(field==='close'||field==='due')?val:n0(val);
}
function setAcctField(key,val){
  const[id,field]=key.split(':'),a=acct(id);if(!a)return;
  if(field==='name')a.name=val;
  else if(field==='kind'){a.kind=val;a.group=KIND_GROUP[val];if(!KIND_DEBT(val)){a.limit=0;a.apr=0}}
  else if(field==='aprPct')a.apr=n0(val)/100;
  else a[field]=n0(val);
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.k!=null&&t.dataset.k!==''){
    pushUndo('k:'+t.dataset.k);setWeekField(t.dataset.k,t.value);save();rerenderKeepFocus()}
  else if(t.dataset.a){
    pushUndo('a:'+t.dataset.a);setAcctField(t.dataset.a,t.value);save();rerenderKeepFocus()}
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(d.paid!=null&&d.paid!==''){
    pushUndo(null);entryOf(currentWeek(),d.paid).paid=t.checked;save();render();return}
  if(d.step){const st=planSteps().find(x=>x.id===d.step);if(st){st.on=t.checked;save();render()}return}
  if(d.cal){const c=S.plan.calendar.find(x=>x.id===d.cal);if(c){c.done=t.checked;save();render()}return}
  if(d.open){const o=S.plan.open.find(x=>x.id===d.open);if(o){o.done=t.checked;save();render()}return}
  if(d.k!=null&&d.k!==''||d.a){
    /* The `input` handler above has already committed this field and re-rendered.
       That re-render blurs the live element, which makes Chrome fire a late
       `change` right here -- and a bare render() from this point throws focus to
       <body> and resets every scroll container. That is the "page jumps to the
       top while I'm typing" bug: two renders per keystroke, the second undoing
       the first. Commit again (idempotent, and covers any control that fires
       change without input) and re-render the focus-preserving way. */
    if(RENDERING)return;
    if(d.k!=null&&d.k!=='')setWeekField(d.k,t.value); else setAcctField(d.a,t.value);
    save();rerenderKeepFocus();
  }
});

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.tab){UI.tab=d.tab;render();return}
  if(d.go){
    const ks=weekKeys(),i=ks.indexOf(currentWeek());
    const j=d.go==='prev'?i-1:i+1;
    if(ks[j]){UI.week=ks[j];render()}return;
  }
  if(d.dense!=null){UI.dense=d.dense==='1';render();return}
  if(d.mode){UI.sheetMode=d.mode;render();return}
  if(d.mgo){
    const ms=monthKeys(),j=ms.indexOf(currentMonth())+(d.mgo==='prev'?-1:1);
    if(ms[j]){UI.month=ms[j];render()}return;
  }
  if(d.strat){UI.strategy=d.strat;render();return}
  if(d.range){UI.histRange=d.range;render();return}
  if(d.porder){
    const[id,dir]=d.porder.split(':'),o=S.plan.order;
    const i=o.indexOf(id),j=i+Number(dir);
    if(i<0||j<0||j>=o.length)return;
    [o[i],o[j]]=[o[j],o[i]];save();render();return;
  }
  if(d.porderadd){S.plan.order.push(d.porderadd);save();render();return}
  if(d.move){
    const[id,dir]=d.move.split(':');
    const list=S.accounts.slice().sort((x,y)=>x.order-y.order);
    const i=list.findIndex(x=>x.id===id),j=i+Number(dir);
    if(j<0||j>=list.length)return;
    [list[i].order,list[j].order]=[list[j].order,list[i].order];
    save();render();return;
  }
  if(d.arch){
    const a=acct(d.arch);a.archived=!a.archived;save();render();
    toast(a.archived?`${a.name} archived — history keeps it`:`${a.name} restored`);return;
  }
  switch(d.act){
    case'pullfwd':pullForward();break;
    case'delweek':deleteWeeks();break;
    case'undo':undo();break;
    case'redo':redo();break;
    case'newweek':newWeek();break;
    case'startfresh':startFresh();break;
    case'theme':toggleTheme();break;
    case'toggleok':UI.showOk=!(UI.showOk!=null?UI.showOk:false);render();break;
    case'signin':signInModal();break;
    case'signout':signOut();break;
    case'hideref':S.plan.ref.show=false;save();render();toast('Hidden — it lives in your backup');break;
    case'addcal':addCalItem();break;
    case'addopen':addOpenItem();break;
    case'togglearch':UI.showArchived=!UI.showArchived;render();break;
    case'addacct':addAccount();break;
    case'export':exportBackup();break;
    case'import':$('#filepick').click();break;
    case'csv':exportCSV();break;
    case'reset':confirmModal('Reset everything?',
      'Every week you have entered goes back to what was imported from the spreadsheet. Export a backup first if you want to keep it.',
      'Reset',()=>{resetToSeed();toast('Reset to the imported sheet')});break;
  }
});

document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&!e.altKey&&(e.key==='z'||e.key==='Z')){
    e.preventDefault();
    if(e.shiftKey)redo();else undo();
    return;
  }
  /* Ask the event where it came from rather than trusting activeElement: a
     re-render between keydown and handler can leave focus on <body>, and a bare
     digit would then jump to another tab mid-edit. */
  if(e.target.closest&&e.target.closest('input,select,textarea,[contenteditable]'))return;
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName))return;
  /* The number pad is for entering money in this app, never for navigation. */
  if(e.code&&e.code.startsWith('Numpad'))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const t=TABS.find(x=>x.k===e.key);
  if(t){UI.tab=t.id;render();return}
  if(e.key==='['||e.key===']'){
    const ks=weekKeys(),i=ks.indexOf(currentWeek()),j=e.key==='['?i-1:i+1;
    if(ks[j]){UI.week=ks[j];render()}
  }
});

function download(name,text,type='application/json'){
  const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function exportBackup(){
  download(`money-backup-${iso(new Date())}.json`,JSON.stringify(S,null,1));
  toast('Backup downloaded');
}
function exportCSV(){
  const head=['week','account','type','limit','apr','balance','min_due','statement_close','due',
    'min','attack','other','total','after','usage_after'];
  const lines=[head.join(',')];
  for(const k of weekKeys()){
    const C=computeWeek(k);
    for(const r of C.rows){
      if(r.isRollup)continue;
      lines.push([k,`"${r.a.name.replace(/"/g,'""')}"`,r.a.kind,n0(r.a.limit),r.a.apr?r2(r.a.apr*100):'',
        r.balance,r.minAmt,r.close,r.due,r.min,r.attack,r.other,r.total,r.after,
        r.usageAfter!=null?r2(r.usageAfter*100):''].join(','));
    }
  }
  download(`money-${iso(new Date())}.csv`,lines.join('\n'),'text/csv');
  toast('CSV downloaded');
}
$('#filepick').onchange=ev=>{
  const f=ev.target.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const d=JSON.parse(fr.result);
      if(!d||!d.accounts||!d.weeks)throw new Error('not a Money backup');
      confirmModal('Replace everything with this backup?',
        `${d.accounts.length} accounts and ${Object.keys(d.weeks).length} weeks. What is here now is overwritten.`,
        'Import',()=>{
          const keep=S.sync;                    // stay on the same remote version
          S=d;migrate();
          if(keep)S.sync={...keep,dirty:true};
          save();UI.week=null;render();
          toast((typeof SESSION!=='undefined'&&SESSION)?'Backup restored — syncing':'Backup restored');
        });
    }catch(err){toast('That file is not a Money backup')}
    ev.target.value='';
  };
  fr.readAsText(f);
};

function confirmModal(title,body,okLabel,onOk,altLabel,onAlt){

  const root=$('#modalRoot');

      <button class="btn" data-m="alt">${esc(altLabel)}</button>
      <button class="btn pri" data-m="ok">${esc(okLabel)}</button></div></div></div>`;

}

function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
/* jsonb does not preserve key order, so comparing JSON.stringify output to what
   Postgres hands back never matches. Sort keys before comparing. */
function stableStringify(v){
  if(v===null||typeof v!=='object')return JSON.stringify(v);
  if(Array.isArray(v))return '['+v.map(stableStringify).join(',')+']';
  return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+stableStringify(v[k])).join(',')+'}';

async function pullRow(){

async function pushRow(){

  if(!await ensureToken()){setSync('signedout','Session expired — sign in again');return}
  const v=(S.sync&&S.sync.version)||0;
  const payload={user_id:SESSION.user_id,data:blobOf(),version:v+1,updated_at:new Date().toISOString()};
  setSync('busy','Saving…');

      headers:{Prefer:'return=representation'}});

  }else{
    /* compare-and-set on version: if someone else wrote, we match nothing */
    r=await sb(`/rest/v1/ledger?user_id=eq.${SESSION.user_id}&version=eq.${v}`,
      {method:'PATCH',body:JSON.stringify(payload),headers:{Prefer:'return=representation'}});
  }
  if(!r.ok){setSync('error','Could not save — '+r.status);return}
  const rows=await r.json();
  if(!rows.length){await reconcile();return}
  markSynced(rows[0]);
}
/* remote moved under us — let the person choose, never guess */
async function reconcile(){
  const row=await pullRow();
  if(!row){S.sync={...(S.sync||{}),version:0};saveLocal();return pushRow()}
  /* an empty row is a placeholder, not a version worth losing sleep over */
  if(!weekCount(row.data)&&weekCount(S)){
    S.sync={version:row.version,at:row.updated_at,email:SESSION.email,dirty:true};
    saveLocal();return pushRow();
  }
  /* same content, different version counter — adopt theirs and move on */
  if(stableStringify(blobOf())===stableStringify(row.data)){markSynced(row);return}
  setSync('conflict','Another device saved first');
  confirmModal('This was changed on another device',
    `Here: ${weekCount(S)} weeks, saved ${S.sync&&S.sync.at?timeAgo(S.sync.at):'never'}. `+
    `There: ${weekCount(row.data)} weeks, saved ${timeAgo(row.updated_at)}. Keeping one replaces the other.`,
    'Keep what is here',()=>{
      S.sync={version:row.version,at:row.updated_at,email:SESSION.email,dirty:true};
      saveLocal();pushRow();
    },'Take the other one',()=>{
      adoptRemote(row);toast('Pulled from the other device');
    });
}
async function firstSync(){
  try{
    const row=await pullRow();
    const localWeeks=weekCount(S);
    const remoteWeeks=row?weekCount(row.data):0;
    if(!row){                                   // nothing up there yet
      /* signing in on an empty browser must not publish that emptiness */
      if(!localWeeks){setSync('ok','Nothing to sync yet — import a backup');return}
      S.sync={version:0,at:null,email:SESSION.email,dirty:true};await pushRow();
      toast('Ledger uploaded');return;
    }
    if(!localWeeks&&!remoteWeeks){setSync('ok','Nothing to sync yet — import a backup');return}
    if(!remoteWeeks){                           // remote is an empty placeholder — ours wins, no prompt
      S.sync={version:row.version,at:row.updated_at,email:SESSION.email,dirty:true};
      saveLocal();await pushRow();toast('Ledger uploaded');return;
    }
    if(!localWeeks){                            // fresh device
      adoptRemote(row);toast(`Pulled ${weekCount(S)} weeks`);return;
    }
    /* The version counter says what happened; content only breaks a tie the
       first time this browser meets the row. */
    const known=(S.sync&&S.sync.version)||0;
    const dirty=!!(S.sync&&S.sync.dirty);
    if(known===row.version){
      if(!dirty){markSynced(row);return}
      S.sync={version:row.version,at:row.updated_at,email:SESSION.email,dirty:true};
      saveLocal();await pushRow();return;
    }
    if(known&&known<row.version&&!dirty){
      adoptRemote(row);toast(`Pulled ${weekCount(S)} weeks from another device`);return;
    }
    if(stableStringify(blobOf())===stableStringify(row.data)){markSynced(row);return}
    setSync('conflict','Two versions');
    confirmModal('There is already a ledger on this account',
      `Here: ${localWeeks} weeks. There: ${weekCount(row.data)} weeks, saved ${timeAgo(row.updated_at)}. `+
      `Keeping one replaces the other.`,
      'Keep what is here',()=>{
        S.sync={version:row.version,at:row.updated_at,email:SESSION.email,dirty:true};
        saveLocal();pushRow();
      },'Take the other one',()=>{
        adoptRemote(row);toast('Pulled from the account');
      });
  }catch(e){setSync('error',e.message)}
}

/* ── plumbing ─────────────────────────────────────────────────────── */
function setSync(status,msg){SYNC.status=status;SYNC.msg=msg||'';paintSync()}
function syncTouch(){
  if(!syncOn()||!SESSION)return;
  S.sync={...(S.sync||{version:0}),dirty:true};
  /* no status change here — the line only says "Saving…" once a request is
     actually in flight, so typing does not strobe the sidebar */
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{pushRow().catch(e=>setSync('error',e.message))},2500);
}
function timeAgo(iso){
  if(!iso)return'never';
  const s=Math.max(0,(Date.now()-new Date(iso).getTime())/1000);
  if(s<60)return'just now';
  if(s<3600)return Math.round(s/60)+' min ago';
  if(s<86400)return Math.round(s/3600)+' hr ago';
  return Math.round(s/86400)+' d ago';
}
function paintSync(){
  const el=$('#syncbox');if(!el)return;
  if(!syncOn()){el.innerHTML='';return}
  if(!SESSION){
    el.innerHTML=`<div class="railact"><button data-act="signin">Sign in to sync</button></div>`;
    return;
  }
  /* State in ink weight, not colour: filled when synced, hollow when pending,
     oxblood only when it has actually failed. */
  const cls={ok:'',busy:'is-pending',error:'is-failed',
    conflict:'is-failed',signedout:'is-pending'}[SYNC.status]||'is-pending';
  const line=SYNC.msg||(S.sync&&S.sync.at?'Synced '+timeAgo(S.sync.at):'Not synced yet');
  el.innerHTML=`<div class="sync ${cls}"><span class="dot"></span>${esc(line)}</div>
    <div class="railstat">${esc(SESSION.email||'')}</div>
    <div class="railact"><button data-act="signout">Sign out</button></div>`;
}
function signInModal(){
  modal(`<h3>Sign in</h3><p>We email you a link. Open it on this device and you are in —
      no password to remember or leak.</p>
    <div class="field"><label>Email</label><input type="text" id="siEmail" placeholder="you@example.com"
      value="${esc((SESSION&&SESSION.email)||'')}"></div>
    <div class="field"><label>Or paste the 6-digit code, if you got one</label>
      <input type="text" id="siCode" placeholder="000000"></div>`,
    'Send link',async()=>{
      const email=$('#siEmail').value.trim(),code=$('#siCode').value.trim();
      if(!email){toast('Email first');return false}
      try{
        if(code){
          const r=await sb('/auth/v1/verify',{method:'POST',
            body:JSON.stringify({email,token:code,type:'email'})},false);
          if(!r.ok){toast('That code did not work');return false}
          setSession(await r.json());await fetchUser();paintSync();await firstSync();return;
        }
        const back=encodeURIComponent(location.origin+location.pathname);
        const r=await sb('/auth/v1/otp?redirect_to='+back,{method:'POST',
          body:JSON.stringify({email,create_user:true})},false);
        if(!r.ok){toast('Could not send — '+r.status);return false}
        toast('Check your email');
      }catch(e){toast('Network error');return false}
    });
  setTimeout(()=>{const e=$('#siEmail');if(e)e.focus()},40);
}
function signOut(){
  SESSION=null;saveSession();
  if(S.sync){S.sync.dirty=false;saveLocal()}
  setSync('off','');render();toast('Signed out — your data stays in this browser');
}
async function syncInit(){
  if(!syncOn())return;
  loadSession();
  const fromLink=consumeAuthHash();
  if(!SESSION){setSync('off','');return}
  if(!await ensureToken()){setSync('signedout','Sign in again');return}
  if(!SESSION.user_id)await fetchUser();
  paintSync();
  await firstSync();
  if(fromLink)toast('Signed in');
}
