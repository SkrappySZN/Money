/* ── Subscriptions ────────────────────────────────────────────────
   Every recurring charge: what it costs, the card it lands on, and the next
   day it hits. Cancelling keeps the row, dated, so what was dropped stays
   visible and charges before that day still show where they billed. */
function viewSubs(el){
  const k=currentWeek(),C=computeWeek(k);
  const now=iso(new Date()),today=thisWeek();
  const all=(S.plan&&S.plan.subs)||[];
  const live=all.filter(x=>subIsLive(x,now))
    .map(x=>({x,d:subNextCharge(x,now)})).sort((p,q)=>(p.d||'9').localeCompare(q.d||'9'));
  const gone=all.filter(x=>!subIsLive(x,now)).sort((p,q)=>q.ended.localeCompare(p.ended));
  const perMo=subsMonthly(today);
  const yearly=live.filter(y=>y.x.cycle==='year');
  const subWeeks=[0,1,2,3].map(i=>{const wk=addWeeks(today,i),h=subsInWeek(wk);
    return {wk,hits:h,total:r2(h.reduce((t,x)=>t+x.amount,0))}});
  const cardName=id=>(acct(id)||{}).name||'no card';
  const when=d=>{const n=daysBetween(now,d);return n===0?'today':n===1?'tomorrow':`in ${n} days`};
  const cadence=x=>x.cycle==='year'
    ?`yearly on ${MONTH_NAMES[n0(x.month)-1]||'?'} ${n0(x.day)}`:`monthly on the ${ordinal(n0(x.day))}`;
  const bucket=()=>{const b=C&&C.rows.find(r=>r.a.id==='subscriptions');
    if(!b)return 'No bucket is funding them.';
    const card=b.a.autoOut,need=card?subsMonthly(today,card):perMo;
    const what=card?`the ones on ${esc(cardName(card))} cost`:'they cost';
    const per=r2(n0(b.minAmt)*MIN_DIVISOR),gap=r2(per-need);
    return `The Subscriptions bucket puts in ${money(n0(b.minAmt))}/week, ${money(per)} a month — `
      +(Math.abs(gap)<0.005?`exactly what ${what}.`
        :gap>0?`<b>${money(gap)} more</b> than ${what}.`:`<b>${money(-gap)} less</b> than ${what}.`)
      +(card&&need!==perMo?` The other ${money(r2(perMo-need))} a month is paid from ${
        [...new Set(live.filter(y=>y.x.card!==card).map(y=>esc(cardName(y.x.card))))].join(' and ')}, not this bucket.`:'')};

  el.innerHTML=`<main class="page">
  <header class="masthead">
    <div><h1 class="page-title">Subscriptions</h1>
      <div class="dateline">${live.length} active${gone.length?` · ${gone.length} cancelled`:''}</div></div>
    <div class="controls"><button class="ctl ctl-primary" data-act="addsub">+ Subscription</button></div>
  </header>

  <div class="strip">
    <div class="metric"><div class="m-label">Per month</div><span class="m-value">${money(perMo)}</span>
      ${yearly.length?`<div class="m-note">yearly ones spread over 12</div>`:''}</div>
    <div class="metric"><div class="m-label">Per week</div><span class="m-value">${money(r2(perMo/MIN_DIVISOR))}</span>
      <div class="m-note">a month split ${MIN_DIVISOR} ways, like the sheet</div></div>
    <div class="metric"><div class="m-label">Per year</div><span class="m-value">${money(r2(perMo*12))}</span></div>
    <div class="metric"><div class="m-label">Next charge</div>
      <span class="m-value">${live[0]&&live[0].d?money(subAmountOn(live[0].x,live[0].d)):'—'}</span>
      <div class="m-note">${live[0]&&live[0].d?`${esc(live[0].x.name)} · ${dueLabel(live[0].d)}, ${when(live[0].d)}`:''}</div></div>
  </div>

  <section class="band" aria-labelledby="sl-h">
    <h2 class="sect-label" id="sl-h">Coming up</h2>
    <p class="lede muted">${bucket()}</p>
    ${live.length?`<ul class="rank subs">${live.map(({x,d})=>`<li>
      <span class="n">${d?dueLabel(d):'—'}</span>
      <span><span class="nm">${esc(x.name)}</span>
        <div class="meta">${d?when(d):'no date'} · ${cadence(x)} · ${esc(cardName(x.card))}${x.to&&x.to.from>now
          ?` · ${money(n0(x.amt))} → ${money(n0(x.to.amt))} from ${dueLabel(x.to.from)}`:''}</div></span>
      <span class="rt"><div class="rv">${money(d?subAmountOn(x,d):subAmountOn(x,now))}</div>
        <div class="rl">${x.cycle==='year'?'per year':'per month'}</div></span>
      <span class="rt"><button class="ctl" data-subedit="${x.id}" aria-label="Edit ${esc(x.name)}">Edit</button></span>
    </li>`).join('')}</ul>`
      :'<p class="lede">Nothing tracked. Add one with <b>+ Subscription</b>.</p>'}
  </section>

  <section class="band" aria-labelledby="sw-h">
    <h2 class="sect-label" id="sw-h">What lands, by pay week</h2>
    <ul class="rank">
      ${subWeeks.map(w=>`<li><span class="n"></span>
        <span><span class="nm">${weekLabel(w.wk)}</span>
          <div class="meta">${w.hits.length?w.hits.map(h=>`${esc(h.name)} ${money(h.amount)}`).join(' · '):'nothing bills'}</div></span>
        <span class="rt"><div class="rv">${w.total?money(w.total):'—'}</div><div class="rl">${w.hits.length?`${w.hits.length} charge${w.hits.length===1?'':'s'}`:''}</div></span></li>`).join('')}
    </ul>
  </section>

  ${gone.length?`<section class="band" aria-labelledby="sc-h">
    <h2 class="sect-label" id="sc-h">Cancelled</h2>
    <ul class="rank subs">${gone.map(x=>`<li class="is-clear">
      <span class="n"></span>
      <span><span class="nm">${esc(x.name)}</span><div class="meta">cancelled ${dueLabel(x.ended)} · was ${cadence(x)}</div></span>
      <span class="rt"><div class="rv">${money(subAmountOn(x,x.ended))}</div><div class="rl">${x.cycle==='year'?'per year':'per month'}</div></span>
      <span class="rt"><button class="ctl" data-subedit="${x.id}" aria-label="Edit ${esc(x.name)}">Edit</button></span>
    </li>`).join('')}</ul>
  </section>`:''}
</main>`;
}
/* Add (no id) or edit a subscription. Cancel dates it today; Delete removes
   it outright, for one entered by mistake. Both undo with ⌘Z. */
function editSub(id){
  const list=S.plan.subs=S.plan.subs||[];
  const x=id?list.find(y=>y.id===id):null;
  if(id&&!x)return;
  const now=iso(new Date());
  /* A charge can land on a card or come straight out of a bank account on a
     debit card, so both are offered. */
  const cards=liveAccounts().filter(a=>a.kind==='card');
  const banks=liveAccounts().filter(a=>a.kind==='income'||KIND_INFLOW(a.kind));
  const defCard=x?x.card:(list.find(y=>subIsLive(y,now))||{}).card||(cards[0]||{}).id;
  const opt=a=>`<option value="${a.id}" ${a.id===defCard?'selected':''}>${esc(a.name)}</option>`;
  const yr=x&&x.cycle==='year';
  modal(`<h3>${x?'Edit subscription':'Add a subscription'}</h3>
    <div class="fieldrow"><label for="sbN">Name</label><input type="text" id="sbN" value="${esc(x?x.name:'')}" placeholder="Netflix"></div>
    <div class="f2"><div class="fieldrow"><label for="sbA">Amount</label><input id="sbA" inputmode="decimal" value="${x?n0(x.amt).toFixed(2):''}" placeholder="0.00"></div>
      <div class="fieldrow"><label for="sbC">Billed</label><select id="sbC"><option value="month">Monthly</option><option value="year" ${yr?'selected':''}>Yearly</option></select></div></div>
    <div class="f2"><div class="fieldrow"><label for="sbD">Day of month</label><input id="sbD" inputmode="numeric" value="${x?n0(x.day):''}" placeholder="1–31"></div>
      <div class="fieldrow" id="sbMw"><label for="sbM">Month</label><select id="sbM">${MONTH_NAMES.map((m,i)=>
        `<option value="${i+1}" ${(x&&n0(x.month)===i+1)||(!(x&&x.month)&&i===parseISO(now).getMonth())?'selected':''}>${m}</option>`).join('')}</select></div></div>
    <div class="fieldrow"><label for="sbK">Paid from</label><select id="sbK">
      <optgroup label="Credit cards">${cards.map(opt).join('')}</optgroup>
      <optgroup label="Bank accounts (debit card)">${banks.map(opt).join('')}</optgroup></select></div>
    <div class="f2"><div class="fieldrow"><label for="sbTA">New price (optional)</label><input id="sbTA" inputmode="decimal" value="${x&&x.to?n0(x.to.amt).toFixed(2):''}" placeholder="—"></div>
      <div class="fieldrow"><label for="sbTF">From</label><input type="date" id="sbTF" value="${x&&x.to?x.to.from:''}"></div></div>
    ${x?`<div class="mrow" style="justify-content:flex-start">
      ${x.ended?`<button class="btn" id="sbRestore">Restore</button>`:`<button class="btn" id="sbEnd">Cancel subscription</button>`}
      <button class="btn danger" id="sbDel">Delete</button></div>`:''}`,
    x?'Save':'Add',()=>{
      const name=$('#sbN').value.trim(),amt=r2(n0(String($('#sbA').value).replace(/[$,]/g,'')));
      const day=Math.round(n0($('#sbD').value));
      if(!name){toast('Give it a name');return false}
      if(!(day>=1&&day<=31)){toast('Day of month is 1 to 31');return false}
      const ta=String($('#sbTA').value).trim(),tf=$('#sbTF').value;
      if(ta&&!tf){toast('Give the new price a start date');return false}
      pushUndo(null);
      const y=x||{id:nextId(list,'sub')};
      Object.assign(y,{name,amt,day,card:$('#sbK').value,cycle:$('#sbC').value});
      if(y.cycle==='year')y.month=+$('#sbM').value;else delete y.month;
      if(ta)y.to={from:tf,amt:r2(n0(ta.replace(/[$,]/g,'')))};else delete y.to;
      if(!x)list.push(y);
      save();render();toast(`${name} ${x?'saved':'added'} — ⌘Z to undo`);
    });
  const sync=()=>{$('#sbMw').style.visibility=$('#sbC').value==='year'?'visible':'hidden'};
  $('#sbC').onchange=sync;sync();
  const close=()=>$('#modalRoot').innerHTML='';
  if(x){
    const end=$('#sbEnd'),back=$('#sbRestore');
    if(end)end.onclick=()=>{pushUndo(null);x.ended=now;close();save();render();toast(`${x.name} cancelled — ⌘Z to undo`)};
    if(back)back.onclick=()=>{pushUndo(null);delete x.ended;close();save();render();toast(`${x.name} restored`)};
    $('#sbDel').onclick=()=>{pushUndo(null);list.splice(list.indexOf(x),1);close();save();render();toast(`${x.name} deleted — ⌘Z to undo`)};
  }
  setTimeout(()=>$('#sbN')?.focus(),40);
}

/* ── History ──────────────────────────────────────────────────────── */
const METRICS={
  debt:  {l:'Total debt',      f:T=>T.debtBalance,      fmt:money0},
  cards: {l:'Card balance',    f:T=>T.cardBalance,      fmt:money0},
  util:  {l:'Utilization',     f:T=>T.usage,            fmt:v=>pct(v,0)},
  paid:  {l:'Paid to debt',    f:T=>T.debtPaid,         fmt:money0},
  attack:{l:'Attack',          f:T=>T.attack,           fmt:money0},
  income:{l:'Paycheck',        f:T=>T.income,           fmt:money0},
};
function viewHistory(el){
  const ks=weekKeys();
  const M=METRICS[UI.histMetric]||METRICS.debt;
  const series=ks.map(k=>{const C=computeWeek(k);return{k,C,T:C.totals}});
  const shown=UI.histRange==='ytd'?series.filter(s=>s.k>=`${new Date().getFullYear()}-01-01`)
    :UI.histRange==='13'?series.slice(-13):series;

  const first=shown[0],last=shown[shown.length-1];
  const delta=last&&first?r2(M.f(last.T)-M.f(first.T)):0;
  const cards=liveAccounts().filter(a=>a.kind==='card');
  const totalDrift=r2(series.reduce((s,x)=>s+x.C.rows.reduce((t,r)=>t+(r.drift&&r.drift>0?r.drift:0),0),0));

  el.innerHTML=`
  <div class="head"><div><h1>History</h1>
    <div class="sub">${series.length} weeks · ${weekLabel(ks[0])} to ${weekLabel(ks[ks.length-1])}</div></div>
    <div class="spacer"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <select id="metricPick">${Object.entries(METRICS).map(([id,m])=>
        `<option value="${id}" ${UI.histMetric===id?'selected':''}>${m.l}</option>`).join('')}</select>
      <div class="seg">${[['all','All'],['ytd','This year'],['13','13 weeks']].map(([v,l])=>
        `<button data-range="${v}" class="${UI.histRange===v?'on':''}">${l}</button>`).join('')}</div>
    </div>
  </div>

  <div class="tiles">
    <div class="tile"><div class="l">${M.l} now</div><div class="v">${M.fmt(M.f(last.T))}</div>
      <div class="d">${weekLabel(last.k)}</div></div>
    <div class="tile ${delta<0?'good':delta>0?'bad':''}"><div class="l">Change over ${shown.length} weeks</div>
      <div class="v">${delta>0?'+':''}${M.fmt(delta)}</div>
      <div class="d">from ${M.fmt(M.f(first.T))} at ${weekLabel(first.k)}</div></div>
    <div class="tile"><div class="l">Paid to debt, all weeks</div>
      <div class="v">${money0(series.reduce((s,x)=>s+x.T.debtPaid,0))}</div>
      <div class="d">${money0(series.reduce((s,x)=>s+x.T.attack,0))} of it attack</div></div>
    <div class="tile ${totalDrift>0?'warn':''}"><div class="l">Unplanned drift</div>
      <div class="v">${money0(totalDrift)}</div>
      <div class="d">balances landing above projection</div></div>
  </div>

  <div class="card">
    <div class="cap">${M.l}</div>
    <div class="chart" id="histChart" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <div class="cap">Each card, ${shown.length} weeks</div>
    <div class="sparks" style="margin-top:12px">${cards.map(a=>{
      const pts=shown.map(s=>({x:md(s.k),v:n0(s.C.byId[a.id]?.balance)}));
      const now=pts[pts.length-1].v,then=pts[0].v,d=r2(now-then);
      return`<div class="spark">
        <div class="sn"><span>${esc(a.name)}</span><span class="sv">${money0(now)}</span></div>
        <div class="sd" style="color:${d<0?'var(--good)':d>0?'var(--attack)':'var(--muted)'}">${d>0?'+':''}${money0(d)} · ${a.limit?pct(now/a.limit,0)+' used':''}</div>
        ${sparkline(pts,{accent:d<=0?'var(--spark-down)':'var(--spark-up)'})}</div>`}).join('')}
    </div>
  </div>

  <div class="card" style="padding:var(--sp-4)">
    <div class="cap" style="margin-bottom:8px">Every week</div>
    <div style="overflow-x:auto"><table class="hist" style="min-width:760px">
      <thead><tr><th>Week</th><th class="num">Paycheck</th><th class="num">Assigned</th><th class="num">Left</th>
        <th class="num">Card balance</th><th class="num">Util</th><th class="num">To debt</th><th class="num">Attack</th></tr></thead>
      <tbody>${[...shown].reverse().map(s=>`<tr class="${isPlanned(s.k)?'planned':''}">
        <td>${weekLabel(s.k)}</td>
        <td class="num">${money0(s.T.income)}</td>
        <td class="num">${money0(s.T.allocated)}</td>
        <td class="num ${Math.abs(s.T.unallocated)<0.005?'':'neg'}">${money(s.T.unallocated)}</td>
        <td class="num">${money0(s.T.cardBalance)}</td>
        <td class="num">${pct(s.T.usage,0)}</td>
        <td class="num">${money0(s.T.debtPaid)}</td>
        <td class="num">${s.T.attack?money0(s.T.attack):'—'}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>`;

  const pts=shown.map(s=>({x:md(s.k),t:weekLong(s.k),v:M.f(s.T),
    rows:[[M.l,M.fmt(M.f(s.T))],['Paid to debt',money0(s.T.debtPaid)],['Attack',money0(s.T.attack)]]}));
  requestAnimationFrame(()=>{const c=$('#histChart');if(c)lineChart(c,pts,{h:230,fmt:M.fmt,label:M.l,
    accent:UI.histMetric==='attack'||UI.histMetric==='paid'?'var(--s3)':'var(--s1)'})});
  $('#metricPick').onchange=e=>{UI.histMetric=e.target.value;render()};
}

/* ── Accounts ─────────────────────────────────────────────────────── */
const KIND_GROUP={income:'checking',cash:'buckets',savings:'savings',loan:'loans',card:'cards'};
function viewAccounts(el){
  const showArch=!!UI.showArchived;
  const list=S.accounts.slice().sort((a,b)=>a.order-b.order).filter(a=>showArch||!a.archived);
  /* Text fields with a decimal keyboard, not type=number. These commit and
     re-render on every keystroke, and a number input will not report or take
     back its caret position, so each redraw dropped the caret at the front:
     typing 450 over a selected value came out as 054. */
  el.innerHTML=`
  <div class="head"><div><h1>Accounts</h1>
    <div class="sub">${liveAccounts().length} active · edit here and every week reflows around it</div></div>
    <div class="spacer"></div>
    <div style="display:flex;gap:8px">
      <button class="btn sm ${showArch?'pri':''}" data-act="togglearch">${showArch?'Hide archived':'Show archived'}</button>
      <button class="btn pri sm" data-act="addacct">+ Account</button>
    </div>
  </div>
  <div class="card" style="padding:var(--sp-3) var(--sp-3) var(--sp-2)">
    <div class="acct hd"><div>Name</div><div>Type</div><div class="hideS">Limit</div><div class="hideS">APR</div>
      <div class="hideS">Min / month</div><div class="hideS">Weekly out</div>
      <div class="hideS" title="What a sinking fund is saving toward. Reaching it is what frees the weekly amount.">Goal</div>
      <div class="hideS" title="When the goal is needed by — for a bill that renews, the next renewal">Goal by</div>
      <div class="hideS" title="No interest while the statement balance is paid in full">Grace</div><div></div></div>
    ${GROUPS.map(g=>{
      const rows=list.filter(a=>(a.group||KIND_GROUP[a.kind])===g.id);
      if(!rows.length)return'';
      return`<div class="acct" style="border:none;padding-top:14px"><div class="cap">${g.label}</div></div>`+
        rows.map(a=>`<div class="acct ${a.archived?'arch':''}">
        <div style="display:flex;align-items:center;gap:8px;min-width:0">
          <input type="text" data-a="${a.id}:name" value="${esc(a.name)}">
        </div>
        <div><select data-a="${a.id}:kind">${Object.keys(KIND_GROUP).map(kk=>
          `<option value="${kk}" ${a.kind===kk?'selected':''}>${kk[0].toUpperCase()+kk.slice(1)}</option>`).join('')}</select></div>
        <div class="hideS">${KIND_DEBT(a.kind)?`<input type="text" inputmode="decimal" data-a="${a.id}:limit" value="${n0(a.limit)||''}" placeholder="—">`:''}</div>
        <div class="hideS">${KIND_DEBT(a.kind)?`<input type="text" inputmode="decimal" data-a="${a.id}:aprPct" value="${a.apr?r2(a.apr*100):''}" placeholder="—">`:''}</div>
        <div class="hideS"><input type="text" inputmode="decimal" data-a="${a.id}:minAmt" value="${n0(a.minAmt)||''}" placeholder="—"></div>
        <div class="hideS">${KIND_INFLOW(a.kind)?`<input type="text" inputmode="decimal" data-a="${a.id}:weeklyOutflow" value="${n0(a.weeklyOutflow)||''}" placeholder="0">`:''}</div>
        <div class="hideS">${a.target?`<input type="text" inputmode="decimal" data-a="${a.id}:targetAmt" value="${n0(a.target.amount)||''}" placeholder="—" title="Goal for ${esc(a.name)}">`:''}</div>
        <div class="hideS">${a.target?`<input type="date" data-a="${a.id}:targetBy" value="${a.target.by||''}" title="${a.target.every?`Renews every ${a.target.every} months — this is the next renewal`:'Needed by'}">`:''}</div>
        <div class="hideS">${a.kind==='card'?`<label class="gracebox" title="No interest while the whole statement balance is paid by the due date. A partial payment ends it and the APR applies to everything, retroactively."><input type="checkbox" class="paidbox" data-grace="${a.id}"${a.grace?' checked':''}><span>${a.grace?'on':'off'}</span></label>`:''}</div>
        <div style="display:flex;gap:4px;justify-content:flex-end">
          <button class="btn sm ghost" data-move="${a.id}:-1" title="Move up">↑</button>
          <button class="btn sm ghost" data-move="${a.id}:1" title="Move down">↓</button>
          <button class="btn sm ghost" data-arch="${a.id}" title="${a.archived?'Restore':'Archive'}">${a.archived?'↺':'×'}</button>
        </div></div>`).join('')}).join('')}
  </div>
  <div class="card">
    <div class="cap">Data</div>
    <p class="sub" style="margin:8px 0 14px;max-width:70ch">Everything lives in this browser's local storage — nothing is uploaded.
      Export a backup before you clear site data, switch browsers, or move to another machine.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" data-act="export">Export backup</button>
      <button class="btn" data-act="import">Import backup</button>
      <button class="btn" data-act="csv">Export CSV</button>
      <button class="btn ghost" data-act="reset" style="color:var(--bad)">Reset to imported sheet</button>
    </div>
  </div>`;
}
</script>
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   Wiring
   ═══════════════════════════════════════════════════════════════════ */
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.className='toast on';
  clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast',2600)}

/* Re-rendering replaces #view wholesale, so every scroll container inside it is
   reborn at offset 0. Walk the tree in document order and key each element by
   tag+class plus its ordinal, so the same key finds the same box after the
   rebuild. Both passes must count EVERY element, not just scrolled ones, or the
   ordinals drift apart. */
function scrollKeys(fn){
  const n=new Map();
  document.querySelectorAll('#view *').forEach(el=>{
    const t=el.nodeName+'.'+(el.getAttribute('class')||'');
    const i=n.get(t)||0;n.set(t,i+1);
    fn(el,t+'#'+i);
  });
}
function scrollSnapshot(){
  const m=new Map();
  scrollKeys((el,k)=>{if(el.scrollTop||el.scrollLeft)m.set(k,[el.scrollTop,el.scrollLeft])});
  return m;
}
function scrollRestore(m){
  if(!m.size)return;
  scrollKeys((el,k)=>{const v=m.get(k);if(v){el.scrollTop=v[0];el.scrollLeft=v[1]}});
}

function rerenderKeepFocus(){
  const ae=document.activeElement,ds=ae&&ae.dataset?ae.dataset:null;
  const key=ds?(ds.k||ds.a):null,raw=ae?ae.value:null;
  const ss=ae&&ae.selectionStart,se=ae&&ae.selectionEnd;
  const scr=scrollSnapshot(),wx=window.scrollX,wy=window.scrollY;
  render();
  scrollRestore(scr);
  if(key){
    const el=document.querySelector(`[data-k="${CSS.escape(key)}"],[data-a="${CSS.escape(key)}"]`);
    if(el){
      /* preventScroll or the browser drags the cell into view from offset 0 and
         the pane jumps under the cursor on every keystroke. */
      el.focus({preventScroll:true});
      if(raw!=null&&el.type!=='date'&&el.value!==raw)el.value=raw;
      try{el.setSelectionRange(ss,se)}catch(e){}
    }
  }
  /* Content reflow can shorten the document and take the window with it. */
  if(window.scrollX!==wx||window.scrollY!==wy)window.scrollTo(wx,wy);
}

/* the pay week rolls forward: balances projected, recurring allocations kept */
/* Advance a statement or due date by whole months until it is no longer in
   the past — the card's cycle, carried forward without being retyped.

   `setMonth(+1)` cannot do this. It overflows: Jan 31 becomes Mar 3, because
   Feb 31 does not exist, and the date then sticks on the 3rd for good. A due
   date on the 30th or 31st drifted permanently the first time it met a short
   month. The day of the month is an anchor, so it is held separately and
   clamped to each month's last day rather than allowed to spill into the
   next one — Jan 31 → Feb 28 → Mar 31, not Feb 28 → Mar 28. */
/* What a subscription costs on a given date — after a known price change,
   the new figure. */
const ordinal=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][n%10]||'th');
const subAmountOn=(x,date)=>x.to&&date>=x.to.from?n0(x.to.amt):n0(x.amt);
/* Whether a subscription bills on a date. `cycle:'year'` bills once, in
   `month`; everything else is monthly. A charge dated past the end of a short
   month bills on its last day. `ended` is the day it was cancelled: nothing
   bills from then on, and charges before it stay where they were. */
function subBillsOn(x,date){
  if(x.ended&&date>=x.ended)return false;
  const d=parseISO(date);
  if(x.cycle==='year'&&n0(x.month)!==d.getMonth()+1)return false;
  const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  return Math.min(n0(x.day),last)===d.getDate();
}
/* Which subscriptions bill inside a pay week. Walks the seven days rather than
   reasoning about months, so a week crossing a month boundary is not a special
   case. */
function subsInWeek(k){
  const list=(S.plan&&S.plan.subs)||[];
  const out=[];
  for(let i=0;i<7;i++){
    const date=addDays(k,i);
    for(const x of list)
      if(subBillsOn(x,date))out.push({...x,date,amount:subAmountOn(x,date)});
  }
  return out;
}
/* The next day on or after `from` a subscription bills, or null once cancelled. */
function subNextCharge(x,from){
  for(let i=0;i<=366;i++){const d=addDays(from,i);if(subBillsOn(x,d))return d}
  return null;
}
const subIsLive=(x,on)=>!(x.ended&&x.ended<=on);
/* A yearly charge counts as a twelfth of itself toward the monthly figure. */
const subMonthlyCost=(x,on)=>subIsLive(x,on)?r2(subAmountOn(x,on)/(x.cycle==='year'?12:1)):0;
/* `card` narrows it to what bills to one account — the Subscriptions bucket
   exists to clear one card, so a charge on a debit card is not its to cover. */
const subsMonthly=(on,card)=>r2(((S.plan&&S.plan.subs)||[]).filter(x=>!card||x.card===card)
  .reduce((t,x)=>t+subMonthlyCost(x,on||thisWeek()),0));

function rollDate(d,from,anchorDay){
  if(!d)return'';
  if(d>=from)return d;
  const src=parseISO(d),anchor=anchorDay||src.getDate();
  let y=src.getFullYear(),m=src.getMonth(),x=d,guard=0;
  while(x<from&&guard++<600){
    m++;                                       /* Date rolls m>11 into next year */
    const last=new Date(y,m+1,0).getDate();    /* last day of month m */
    x=iso(new Date(y,m,Math.min(anchor,last)));
  }
  return x;
}
/* ── finalizing a week ────────────────────────────────────────────
   Closing the books on a week that has actually been paid. Reversible,
   because a bank statement can disagree a day later and a lock you cannot
   undo is a trap rather than a safeguard — but deliberate in both
   directions, so neither happens by brushing past a control. */
function toggleLock(){
  const k=currentWeek();
  if(isLocked(k)){
    confirmModal('Reopen this week',
      `${weekLabel(k)} is finalized. Reopening lets its balances and allocations be `
      +`edited again. Anything you change here does not move later weeks on its own — `
      +`use Pull forward on the next week if a balance changes.`,
      'Reopen for editing',()=>{
        pushUndo(null);delete S.weeks[k].locked;save();render();toast(`${weekLabel(k)} reopened`);
      });
    return;
  }
  const C=computeWeek(k),off=Math.abs(C.totals.unallocated);
  const paid=C.rows.filter(r=>r.e&&r.e.paid).length;
  const payable=C.rows.filter(r=>!r.isRollup&&r.a.kind!=='income').length;
  const warn=off>=0.005
    ? ` This week is not balanced — ${money(off)} is still ${C.totals.unallocated>0?'unassigned':'over'}.`
    : '';
  confirmModal('Finalize this week',
    `${weekLabel(k)} will be closed to editing: balances, allocations, dates and the paid `
    +`ticks all stop responding. ${paid} of ${payable} rows are ticked paid.${warn} `
    +`You can reopen it at any time.`,
    'Finalize',()=>{
      pushUndo(null);S.weeks[k].locked=true;save();render();
      toast(`${weekLabel(k)} finalized — reopen it from the same button`);
    });
}

/* ── deleting weeks ───────────────────────────────────────────────
   Forty weeks came across from the spreadsheet, four of them dated ahead
   and holding figures typed in advance rather than anything that happened.
   There was no way to remove a week at all, so there is one now.

   Undo covers it -- the snapshot is the whole ledger -- but a wrong click
   here costs a week of entry, so it also names what it is about to remove
   and never leaves the ledger with nothing in it. */
function deleteWeeks(){
  const k=currentWeek(),ks=weekKeys(),i=ks.indexOf(k);
  const after=ks.slice(i+1);
  const drop=list=>{
    pushUndo(null);
    for(const w of list)delete S.weeks[w];
    const left=weekKeys();
    UI.week=left.includes(k)?k:(left[left.length-1]||null);
    save();render();
    toast(`${list.length} ${list.length===1?'week':'weeks'} removed — ⌘Z to undo`);
  };
  if(ks.length<=1){toast('This is the only week — nothing to delete');return}
  if(isLocked(k)&&!after.length){toast(`${weekLabel(k)} is finalized — reopen it first`);return}
  /* Name what survives, not just what goes. The two options sit next to each
     other and differ by one word otherwise. */
  const body=after.length
    ? `${after.length===1?'1 week is':`${after.length} weeks are`} dated after this one: `
      +`${weekLabel(after[0])}${after.length>1?` through ${weekLabel(after[after.length-1])}`:''}. `
      +`Deleting those keeps ${weekLabel(k)} and everything in it. `
      +`Deleting this week instead removes ${weekLabel(k)}'s own balances and allocations `
      +`and leaves the later weeks alone. Either way, ⌘Z undoes it.`
    : `This week is ${weekLabel(k)}, the last in the ledger. Removing it deletes its `
      +`balances and everything assigned in it. ⌘Z undoes this.`;
  if(!after.length)return confirmModal('Delete week',body,'Delete this week',()=>drop([k]));
  confirmModal('Delete week',body,
    `Delete the ${after.length} after ${weekLabel(k)}`,()=>drop(after),
    `Delete ${weekLabel(k)} itself`,()=>drop([k]),true);
}

/* ── pull balances forward ────────────────────────────────────────
   `+ Next week` carries each balance, less its payments, into the next
   week's Balance, but it only
   builds a week that does not exist yet. Four weeks were imported from the
   spreadsheet already forward-planned, so stepping into one of those gives
   figures typed weeks ago rather than a projection of what actually
   happened. This does the carry on a week that is already there.

   Balances only. Minimums, dates and allocations in an existing week were
   entered deliberately and are not the caller's problem. Setting `projected`
   alongside `balance` is deliberate too: it turns on the drift tag, so
   correcting a balance against the bank shows what the projection missed. */
function pullForward(){
  const k=currentWeek(),ks=weekKeys(),i=ks.indexOf(k);
  if(isLocked(k)){toast(`${weekLabel(k)} is finalized — reopen it first`);return}
  if(i<=0){toast('No earlier week to pull from');return}
  const prev=ks[i-1],P=computeWeek(prev);
  const changes=[];
  for(const r of P.rows){
    if(r.a.kind==='income'||r.isRollup)continue;
    const proj=KIND_DEBT(r.a.kind)?r2(Math.max(0,r.after)):r2(r.after);
    const e=entryOf(k,r.a.id);
    if(Math.abs(n0(e.balance)-proj)>=0.005)changes.push({name:r.a.name,from:n0(e.balance),to:proj});
  }
  if(!changes.length){toast(`Already matches ${weekLabel(prev)} — nothing to pull`);return}
  const list=changes.slice(0,6).map(c=>
    `<li><span>${esc(c.name)}</span><b>${money(c.from)} → ${money(c.to)}</b></li>`).join('');
  modal(`<h3>Pull balances forward</h3>
    <p>Rewrites this week's Balance column from ${esc(weekLabel(prev))}'s balances with its payments applied (no interest).
      <b>${changes.length}</b> ${changes.length===1?'balance changes':'balances change'};
      minimums, dates and allocations are left alone. ⌘Z undoes it.</p>
    <ul class="pulllist">${list}${changes.length>6
      ?`<li class="more"><span>and ${changes.length-6} more</span></li>`:''}</ul>`,
    'Pull forward',()=>{
      pushUndo(null);
      for(const r of P.rows){
        if(r.a.kind==='income'||r.isRollup)continue;
        const proj=KIND_DEBT(r.a.kind)?r2(Math.max(0,r.after)):r2(r.after);
        const e=entryOf(k,r.a.id);e.balance=proj;e.projected=proj;
      }
      save();render();
      toast(`${changes.length} balances pulled from ${weekLabel(prev)} — ⌘Z to undo`);
    });
}

function newWeek(){
  const ks=weekKeys(),last=ks[ks.length-1],nk=addWeeks(last,1);
  if(S.weeks[nk]){UI.week=nk;UI.tab='sheet';render();toast('That week already exists');return}
  const C=computeWeek(last),entries={};
  for(const r of C.rows){
    const a=r.a,e=blankEntry();
    let proj=0;
    if(a.kind==='income'){e.balance=C.totals.income;e.projected=C.totals.income}
    else{
      /* `after` is balance less payments — no interest — so it opens the next week as is */
      proj=KIND_DEBT(a.kind)?r2(Math.max(0,r.after)):r.after;
      e.balance=proj;e.projected=proj;
      /* Everything assigned last week carries. It used to carry `other` only
         for buckets and `min` only for loans, which quietly dropped the lease
         payment — that sits in Min on a cash account and matched neither rule
         — and cleared Attack every week on the theory that it is a fresh
         decision. In practice a week's allocation is mostly the same week to
         week, and retyping it is how a number goes in wrong. */
      e.min=r.min; e.attack=r.attack; e.other=r.other;
      /* Nothing carries onto a debt that is now clear: there is nothing left
         to pay, and the money should be re-aimed rather than sent anyway.
         A bucket at zero still has a job, so this is debts only. */
      if(KIND_DEBT(a.kind)&&proj<=0.005){e.min=0;e.attack=0;e.other=0}
    }
    e.minAmt=r.minAmt;
    /* The anchor day is remembered on the account, because a date that has
       been clamped through a short month can no longer say what it was: once
       the 31st becomes Feb 28 it would stay the 28th for good. Recorded here
       rather than during compute — this is the one place already writing. */
    if(r.close&&!a.closeDay)a.closeDay=parseISO(r.close).getDate();
    if(r.due&&!a.dueDay)a.dueDay=parseISO(r.due).getDate();
    e.close=rollDate(r.close,nk,a.closeDay);
    e.due=rollDate(r.due,nk,a.dueDay);
    entries[a.id]=e;
  }
  S.weeks[nk]={income:C.totals.income,entries};
  UI.week=nk;UI.tab='sheet';save();render();
  toast('Balances projected forward and last week\u2019s allocation carried — correct anything the bank disagrees with');
}

/* ── input ────────────────────────────────────────────────────────── */
/* A finalized week is closed to editing. The guard lives in the setter, not
   only in the markup: readonly attributes are a hint to a person, and every
   other path into week data -- a stray event, a paste, a handler firing after
   a re-render -- goes through here. */
const isLocked=k=>!!(S.weeks[k]&&S.weeks[k].locked);
function setWeekField(key,val){
  const k=currentWeek(),w=S.weeks[k];
  if(isLocked(k))return;
  if(key==='income'){
    w.income=n0(val);
    const inc=liveAccounts().find(a=>a.kind==='income');
    if(inc)entryOf(k,inc.id).balance=w.income;
    return;
  }
  const[id,field]=key.split(':'),e=entryOf(k,id);
  e[field]=(field==='close'||field==='due')?val:n0(val);
}
function setAcctField(key,val){
  const[id,field]=key.split(':'),a=acct(id);if(!a)return;
  if(field==='name')a.name=val;
  else if(field==='kind'){a.kind=val;a.group=KIND_GROUP[val];if(!KIND_DEBT(val)){a.limit=0;a.apr=0}}
  else if(field==='aprPct')a.apr=n0(val)/100;
  /* A goal changes when the bill it saves for does — a premium re-quoted, a
     payment renegotiated. Only the amount: its date and what reaching it frees
     are left as they are. This writes on every keystroke, so a field emptied
     on the way to a new figure is ignored rather than wiping the goal. */
  else if(field==='targetAmt'){if(a.target&&n0(val)>0)a.target.amount=r2(n0(val))}
  else if(field==='targetBy'){if(a.target){if(val)a.target.by=val;else delete a.target.by}}
  else a[field]=n0(val);
}
/* A money cell carries "$12,500.00" at rest and a bare number while it is
   being edited. Formatting live as you type would fight the caret -- every
   comma inserted moves it -- so the currency comes off on the way in and goes
   back on the way out. Without the way out, a cell kept whatever was typed
   until some unrelated thing forced a redraw, which is how a balance came to
   sit there reading as a bare number among formatted neighbours.

   Stripping on the way in matters as much: typing at the end of a formatted
   string appends to it, and n0() would read "$12,500.005" as twelve and a
   half thousand and change. */
const isMoneyCell=t=>t&&t.dataset&&t.dataset.fmt==='money';
/* A number field takes the whole figure on the way in, so typing replaces it.
   With the caret left wherever the click landed, typing 300 into "0|.00" came
   out as 3000.00. Selecting in focusin is not enough on its own: the mouseup
   that ends the same click collapses the selection back to a caret, so that
   one mouseup is swallowed. A click into a field already being edited still
   places the caret. rerenderKeepFocus refocuses programmatically and restores
   its own selection straight after, so mid-typing it is unaffected. */
const isNumField=t=>t&&t.tagName==='INPUT'&&t.type!=='date'
  &&(isMoneyCell(t)||t.inputMode==='decimal');
let swallowMouseup=null;
document.addEventListener('mousedown',e=>{
  swallowMouseup=isNumField(e.target)&&document.activeElement!==e.target?e.target:null;
});
document.addEventListener('mouseup',e=>{
  if(swallowMouseup&&e.target===swallowMouseup)e.preventDefault();
  swallowMouseup=null;
});
document.addEventListener('focusin',e=>{
  if(isMoneyCell(e.target))e.target.value=n0(e.target.value).toFixed(2);
  if(isNumField(e.target))e.target.select();
});
document.addEventListener('focusout',e=>{
  if(isMoneyCell(e.target))e.target.value=moneyInput(n0(e.target.value));
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.k!=null&&t.dataset.k!==''){
    pushUndo('k:'+t.dataset.k);setWeekField(t.dataset.k,t.value);save();rerenderKeepFocus()}
  else if(t.dataset.a){
    pushUndo('a:'+t.dataset.a);setAcctField(t.dataset.a,t.value);save();rerenderKeepFocus()}
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(d.grace){
    const a=acct(d.grace);
    if(a){
      pushUndo(null);
      if(t.checked)a.grace=true; else delete a.grace;
      save();render();
      toast(`${a.name}: grace ${t.checked?'on — pay the statement in full or it breaks':'off'}`);
    }
    return;
  }
  if(d.paid!=null&&d.paid!==''){
    if(isLocked(currentWeek())){t.checked=!t.checked;toast('This week is finalized');return}
    pushUndo(null);
    /* the day it was ticked is the day the Calendar shows a payoff on */
    const pe=entryOf(currentWeek(),d.paid);pe.paid=t.checked;pe.paidOn=t.checked?iso(new Date()):null;
    save();render();return}
  if(d.step){const st=planSteps().find(x=>x.id===d.step);if(st){st.on=t.checked;save();render()}return}
  if(d.cal){const c=S.plan.calendar.find(x=>x.id===d.cal);if(c){c.done=t.checked;save();render()}return}
  /* A reminder's date moves when the thing it waits on moves — a charge that
     posts later, a payment pushed to the next payday. */
  if(d.rr){
    const[gi,ri,f]=d.rr.split(':'),row=(refRates().groups[+gi]||{rows:[]}).rows[+ri];if(!row)return;
    pushUndo(null);const v=String(t.value).replace(/[$,]/g,'').trim();
    row[f]=v===''?null:r2(n0(v));save();
    setTimeout(()=>{const ae=document.activeElement,key=ae&&ae.dataset?ae.dataset.rr:null;
      render();const det=document.querySelector('.ref-rates');if(det)det.open=true;
      if(key){const n=document.querySelector(`[data-rr="${CSS.escape(key)}"]`);if(n)n.focus({preventScroll:true})}},0);
    return;
  }
  if(d.rf){
    const[gid,field]=d.rf.split(':'),g=refGames().find(x=>x.id===gid);if(!g)return;
    pushUndo(null);
    if(field==='paid'){g.paid=t.checked;g.paidOn=t.checked?iso(new Date()):null}
    else if(field==='rate'){g.rate=r2(n0(String(t.value).replace(/[$,]/g,'')));g.rateManual=true}
    else if(field==='date'){if(t.value)g.date=t.value}
    else g[field]=t.value.trim();
    save();
    /* `change` fires as focus is leaving, before it lands on the next field.
       Redraw once it has landed, and put it back there — otherwise tabbing
       from rink to level drops the caret on the floor. */
    setTimeout(()=>{const ae=document.activeElement,key=ae&&ae.dataset?ae.dataset.rf:null;
      render();if(key){const n=document.querySelector(`[data-rf="${CSS.escape(key)}"]`);if(n)n.focus({preventScroll:true})}},0);
    return;
  }
  if(d.wi){
    S.plan.whatIf=S.plan.whatIf||{};
    const car=S.plan.whatIf.carSale=S.plan.whatIf.carSale||{on:false,amount:12000,date:''};
    pushUndo(null);
    if(d.wi==='on')car.on=t.checked;
    else if(d.wi==='amount'){const v=n0(String(t.value).replace(/[$,]/g,''));if(v>=0)car.amount=r2(v)}
    else if(d.wi==='date')car.date=t.value||'';
    else if(d.wi==='insurance'){const v=n0(String(t.value).replace(/[$,]/g,''));if(v>=0)car.insurance=r2(v)}
    save();render();return;
  }
  if(d.caldate){const c=S.plan.calendar.find(x=>x.id===d.caldate);
    if(c&&t.value&&t.value!==c.d){pushUndo(null);c.d=t.value;save();render();toast(`Moved to ${dueLabel(t.value)} — ⌘Z to undo`)}
    return}
  if(d.open){const o=S.plan.open.find(x=>x.id===d.open);if(o){o.done=t.checked;save();render()}return}
  if(d.k!=null&&d.k!==''||d.a){
    /* The `input` handler above has already committed this field and re-rendered.
       That re-render blurs the live element, which makes Chrome fire a late
       `change` right here -- and a bare render() from this point throws focus to
       <body> and resets every scroll container. That is the "page jumps to the
       top while I'm typing" bug: two renders per keystroke, the second undoing
       the first. Commit again (idempotent, and covers any control that fires
       change without input) and re-render the focus-preserving way. */
    if(RENDERING)return;
    if(d.k!=null&&d.k!=='')setWeekField(d.k,t.value); else setAcctField(d.a,t.value);
    save();rerenderKeepFocus();
  }
});

  if(d.move){

document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&!e.altKey&&(e.key==='z'||e.key==='Z')){
    e.preventDefault();
    if(e.shiftKey)redo();else undo();
    return;
  }
  /* Ask the event where it came from rather than trusting activeElement: a
     re-render between keydown and handler can leave focus on <body>, and a bare
     digit would then jump to another tab mid-edit. */
  if(e.target.closest&&e.target.closest('input,select,textarea,[contenteditable]'))return;
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName))return;
  /* The number pad is for entering money in this app, never for navigation. */
  if(e.code&&e.code.startsWith('Numpad'))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const t=TABS.find(x=>x.k===e.key);
  if(t){UI.tab=t.id;render();return}
  if(e.key==='['||e.key===']'){
    const ks=weekKeys(),i=ks.indexOf(currentWeek()),j=e.key==='['?i-1:i+1;
    if(ks[j]){UI.week=ks[j];render()}
  }
});

function download(name,text,type='application/json'){
  const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function exportBackup(){
  download(`money-backup-${iso(new Date())}.json`,JSON.stringify(S,null,1));
  toast('Backup downloaded');
}
function exportCSV(){
  const head=['week','account','type','limit','apr','balance','min_due','statement_close','due',
    'min','attack','other','total','after','usage_after'];
  const lines=[head.join(',')];
  for(const k of weekKeys()){
    const C=computeWeek(k);
    for(const r of C.rows){
      if(r.isRollup)continue;
      lines.push([k,`"${r.a.name.replace(/"/g,'""')}"`,r.a.kind,n0(r.a.limit),r.a.apr?r2(r.a.apr*100):'',
        r.balance,r.minAmt,r.close,r.due,r.min,r.attack,r.other,r.total,r.after,
        r.usageAfter!=null?r2(r.usageAfter*100):''].join(','));
    }
  }
  download(`money-${iso(new Date())}.csv`,lines.join('\n'),'text/csv');
  toast('CSV downloaded');
}
$('#filepick').onchange=ev=>{
  const f=ev.target.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const d=JSON.parse(fr.result);
      if(!d||!d.accounts||!d.weeks)throw new Error('not a Money backup');
      confirmModal('Replace everything with this backup?',
        `${d.accounts.length} accounts and ${Object.keys(d.weeks).length} weeks. What is here now is overwritten.`,
        'Import',()=>{
          const keep=S.sync;                    // stay on the same remote version
          S=d;migrate();
          if(keep)S.sync={...keep,dirty:true};
          save();UI.week=null;render();
          toast((typeof SESSION!=='undefined'&&SESSION)?'Backup restored — syncing':'Backup restored');
        });
    }catch(err){toast('That file is not a Money backup')}
    ev.target.value='';
  };
  fr.readAsText(f);
};

function boot(){
  applyTheme(currentTheme());
  if(!storageWorks()){
    document.body.insertAdjacentHTML('afterbegin',
      `<div style="background:var(--bad-bg);border-bottom:1px solid var(--bad-line);
        color:var(--bad-ink);padding:12px 20px;font-size:13.5px;line-height:1.55">
        <b>This browser is blocking local storage, so nothing you enter will be saved.</b>

        then open <code style="background:var(--surface-3);color:var(--ink);padding:1px 6px;border-radius:5px">localhost:8777</code> — or open the hosted copy.
      </div>`);
  }
  const fresh=!load();
  /* Restoring the last view is a convenience. It must never be able to stop
     the ledger from opening — which it did: a scope error in loadUI() threw
     before render() and left nothing on the page at all. */
  try{loadUI()}catch(e){console.warn('loadUI failed, using defaults',e)}
  try{render()}
  catch(e){
    /* A blank page says nothing and offers nothing. The data is still in
       storage, so say that, and put the way to get it out within reach. */
    console.error('render failed at boot',e);
    const v=$('#view');
    if(v){
      v.className='';
      v.innerHTML=`<main class="page">
        <header class="masthead"><div><h1 class="page-title">Something broke</h1>
          <div class="dateline">The page could not draw itself</div></div></header>
        <section class="band">
          <p class="lede"><b>Your ledger is not lost.</b> It is still in this browser's storage —
            this is a fault in the page, not in your data. Take a backup now, before anything else.</p>
          <div class="mrow" style="justify-content:flex-start">
            <button class="btn pri" data-act="export">Export backup</button>
          </div>
        </section>
        <section class="band">
          <h2 class="sect-label">What went wrong</h2>
          <p class="lede muted" style="font-family:ui-monospace,monospace">${esc(String(e&&e.message||e))}</p>
        </section>
      </main>`;
    }
  }
  if(typeof syncInit==='function')syncInit().catch(e=>console.warn('sync',e));
  if(fresh&&Object.keys(S.weeks).length)toast(`Imported ${Object.keys(S.weeks).length} weeks from your spreadsheet`);
  /* charts are sized off the container, so redraw them when it changes */
  ro=new ResizeObserver(()=>{if(UI.tab==='history'||UI.tab==='payoff')render()});
  let w=window.innerWidth;
  window.addEventListener('resize',()=>{if(Math.abs(window.innerWidth-w)>60){w=window.innerWidth;render()}});
}

   Optional cross-device sync.

const SUPABASE={url:'https://ewrvtiqhnrcckemigjgx.supabase.co',key:'sb_publishable_0IiqsQubCg9FvPeh4xds4w_gbpG65FJ'};

   push, so using it here made every successful save schedule the next one. */
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
/* jsonb does not preserve key order, so comparing JSON.stringify output to what
   Postgres hands back never matches. Sort keys before comparing. */
function stableStringify(v){
  if(v===null||typeof v!=='object')return JSON.stringify(v);
  if(Array.isArray(v))return '['+v.map(stableStringify).join(',')+']';
  return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+stableStringify(v[k])).join(',')+'}';
}
function markSynced(row){

async function sb(path,opts={},auth=true){

async function ensureToken(){

    {method:'POST',body:JSON.stringify({refresh_token:SESSION.refresh_token})},false);

    expires_at:Date.now()+(parseInt(p.get('expires_in')||'3600',10)*1000),email:'',user_id:''};

/* ── the row ──────────────────────────────────────────────────────── */
const blobOf=()=>{const c={...S};delete c.sync;return c};
const weekCount=o=>Object.keys((o&&o.weeks)||{}).length;

async function pullRow(){
  if(!await ensureToken())return null;
  const r=await sb(`/rest/v1/ledger?user_id=eq.${SESSION.user_id}&select=data,version,updated_at,device`);
  if(!r.ok)throw new Error('pull failed ('+r.status+')');

}
async function pushRow(){
  if(!syncOn()||!SESSION)return;
  if(!await ensureToken()){setSync('signedout','Session expired — sign in again');return}
  const v=(S.sync&&S.sync.version)||0;
  const payload={user_id:SESSION.user_id,data:blobOf(),version:v+1,updated_at:new Date().toISOString()};
  setSync('busy','Saving…');

  if(v===0){
    r=await sb('/rest/v1/ledger',{method:'POST',body:JSON.stringify(payload),
      headers:{Prefer:'return=representation'}});

  }else{
    /* compare-and-set on version: if someone else wrote, we match nothing */
    r=await sb(`/rest/v1/ledger?user_id=eq.${SESSION.user_id}&version=eq.${v}`,
      {method:'PATCH',body:JSON.stringify(payload),headers:{Prefer:'return=representation'}});
  }
  if(!r.ok){setSync('error','Could not save — '+r.status);return}
  const rows=await r.json();
  if(!rows.length){await reconcile();return}
  markSynced(rows[0]);
}
/* remote moved under us — let the person choose, never guess */
async function reconcile(){

  /* an empty row is a placeholder, not a version worth losing sleep over */
  if(!weekCount(row.data)&&weekCount(S)){
    S.sync={version:row.version,at:row.updated_at,email:SESSION.email,dirty:true};
    saveLocal();return pushRow();
  }
  /* same content, different version counter — adopt theirs and move on */
  if(stableStringify(blobOf())===stableStringify(row.data)){markSynced(row);return}
  setSync('conflict','Another device saved first');
  confirmModal('This was changed on another device',
    `Here: ${weekCount(S)} weeks, saved ${S.sync&&S.sync.at?timeAgo(S.sync.at):'never'}. `+
    `There: ${weekCount(row.data)} weeks, saved ${timeAgo(row.updated_at)}. Keeping one replaces the other.`,
    'Keep what is here',()=>{
      S.sync={version:row.version,at:row.updated_at,email:SESSION.email,dirty:true};
      saveLocal();pushRow();
    },'Take the other one',()=>{
      adoptRemote(row);toast('Pulled from the other device');
    });
}
async function firstSync(){
  try{
    const row=await pullRow();
    const localWeeks=weekCount(S);
    const remoteWeeks=row?weekCount(row.data):0;
    if(!row){                                   // nothing up there yet
      /* signing in on an empty browser must not publish that emptiness */
      if(!localWeeks){setSync('ok','Nothing to sync yet — import a backup');return}
      S.sync={version:0,at:null,email:SESSION.email,dirty:true};await pushRow();
      toast('Ledger uploaded');return;
    }
    if(!localWeeks&&!remoteWeeks){setSync('ok','Nothing to sync yet — import a backup');return}
    if(!remoteWeeks){                           // remote is an empty placeholder — ours wins, no prompt
      S.sync={version:row.version,at:row.updated_at,email:SESSION.email,dirty:true};
      saveLocal();await pushRow();toast('Ledger uploaded');return;
    }
    if(!localWeeks){                            // fresh device
      adoptRemote(row);toast(`Pulled ${weekCount(S)} weeks`);return;
    }
    /* The version counter says what happened; content only breaks a tie the
       first time this browser meets the row. */
    const known=(S.sync&&S.sync.version)||0;
    const dirty=!!(S.sync&&S.sync.dirty);
    if(known===row.version){
      if(!dirty){markSynced(row);return}
      S.sync={version:row.version,at:row.updated_at,email:SESSION.email,dirty:true};
      saveLocal();await pushRow();return;
    }
    if(known&&known<row.version&&!dirty){
      adoptRemote(row);toast(`Pulled ${weekCount(S)} weeks from another device`);return;
    }
    if(stableStringify(blobOf())===stableStringify(row.data)){markSynced(row);return}
    setSync('conflict','Two versions');
    confirmModal('There is already a ledger on this account',
      `Here: ${localWeeks} weeks. There: ${weekCount(row.data)} weeks, saved ${timeAgo(row.updated_at)}. `+
      `Keeping one replaces the other.`,
      'Keep what is here',()=>{
        S.sync={version:row.version,at:row.updated_at,email:SESSION.email,dirty:true};
        saveLocal();pushRow();
      },'Take the other one',()=>{
        adoptRemote(row);toast('Pulled from the account');
      });
  }catch(e){setSync('error',e.message)}
}

/* ── plumbing ─────────────────────────────────────────────────────── */
function setSync(status,msg){SYNC.status=status;SYNC.msg=msg||'';paintSync()}
function syncTouch(){
  if(!syncOn()||!SESSION)return;
  S.sync={...(S.sync||{version:0}),dirty:true};
  /* no status change here — the line only says "Saving…" once a request is
     actually in flight, so typing does not strobe the sidebar */
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{pushRow().catch(e=>setSync('error',e.message))},2500);
}
function timeAgo(iso){
  if(!iso)return'never';
  const s=Math.max(0,(Date.now()-new Date(iso).getTime())/1000);
  if(s<60)return'just now';
  if(s<3600)return Math.round(s/60)+' min ago';
  if(s<86400)return Math.round(s/3600)+' hr ago';
  return Math.round(s/86400)+' d ago';
}
function paintSync(){
  const el=$('#syncbox');if(!el)return;
  if(!syncOn()){el.innerHTML='';return}
  if(!SESSION){
    el.innerHTML=`<div class="railact"><button data-act="signin">Sign in to sync</button></div>`;
    return;
  }
  /* State in ink weight, not colour: filled when synced, hollow when pending,
     oxblood only when it has actually failed. */
  const cls={ok:'',busy:'is-pending',error:'is-failed',
    conflict:'is-failed',signedout:'is-pending'}[SYNC.status]||'is-pending';
  const line=SYNC.msg||(S.sync&&S.sync.at?'Synced '+timeAgo(S.sync.at):'Not synced yet');
  el.innerHTML=`<div class="sync ${cls}"><span class="dot"></span>${esc(line)}</div>
    <div class="railstat">${esc(SESSION.email||'')}</div>
    <div class="railact"><button data-act="signout">Sign out</button></div>`;
}
function signInModal(){
  modal(`<h3>Sign in</h3><p>We email you a link. Open it on this device and you are in —
      no password to remember or leak.</p>
    <div class="fieldrow"><label>Email</label><input type="text" id="siEmail" placeholder="you@example.com"
      value="${esc((SESSION&&SESSION.email)||'')}"></div>
    <div class="fieldrow"><label>Or paste the 6-digit code, if you got one</label>
      <input type="text" id="siCode" placeholder="000000"></div>`,
    'Send link',async()=>{
      const email=$('#siEmail').value.trim(),code=$('#siCode').value.trim();
      if(!email){toast('Email first');return false}
      try{
        if(code){
          const r=await sb('/auth/v1/verify',{method:'POST',
            body:JSON.stringify({email,token:code,type:'email'})},false);
          if(!r.ok){toast('That code did not work');return false}
          setSession(await r.json());await fetchUser();paintSync();await firstSync();return;
        }
        const back=encodeURIComponent(location.origin+location.pathname);
        const r=await sb('/auth/v1/otp?redirect_to='+back,{method:'POST',
          body:JSON.stringify({email,create_user:true})},false);
        if(!r.ok){toast('Could not send — '+r.status);return false}
        toast('Check your email');
      }catch(e){toast('Network error');return false}
    });
  setTimeout(()=>{const e=$('#siEmail');if(e)e.focus()},40);
}
function signOut(){
  SESSION=null;saveSession();
  if(S.sync){S.sync.dirty=false;saveLocal()}
  setSync('off','');render();toast('Signed out — your data stays in this browser');
}
async function syncInit(){
  if(!syncOn())return;
  loadSession();
  const fromLink=consumeAuthHash();
  if(!SESSION){setSync('off','');return}
  if(!await ensureToken()){setSync('signedout','Sign in again');return}
  if(!SESSION.user_id)await fetchUser();
  paintSync();
  await firstSync();
  if(fromLink)toast('Signed in');
}
