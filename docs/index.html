<div class="toast" id="toast"></div>
<input type="file" id="filepick" accept="application/json" style="display:none">
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   Money — a weekly zero-based allocation ledger.
   Everything lives in localStorage. Nothing leaves this machine.
   ═══════════════════════════════════════════════════════════════════ */

const KEY='ccb.v1';
const WEEK_START=5;              // Friday — payday
const WPM=52/12;                 // weeks per month, for turning monthly minimums weekly
const MIN_DIVISOR=4;             // ...but the sheet has always split minimums 4 ways, so match it

/* ── tiny helpers ─────────────────────────────────────────────────── */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const n0=v=>{const x=typeof v==='number'?v:parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return Number.isFinite(x)?x:0};
const money=(n,dp=2)=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const money0=n=>money(n,0);
/* For values that live inside an <input>. Same shape as money() but with an
   ASCII hyphen, because n0() strips everything outside [0-9.-] and would read
   the typographic minus as a positive number. */
/* Editable figures are sized from their own contents. A fixed `ch` width
   clips the moment the number grows a digit, and the paycheck field was set
   narrower than the six characters a few hundred dollars and cents already
   needs -- the last digit was cut off in place, with nothing to say so.
   Separators are narrower than a digit even in tabular figures, so they
   count for less than a full ch rather than overshooting.

   No real figure goes in a comment: build.py refused this file when the
   first draft quoted one, which is the leak guard doing its job. */
const chSpan=v=>[...String(v)].reduce((w,c)=>w+(c==='.'||c===','?0.42:1),0);
const figureWidth=v=>`width:${(chSpan(v)+0.25).toFixed(2)}ch;field-sizing:content`;
const moneyInput=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(n,dp=1)=>(n*100).toFixed(dp)+'%';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

/* dates — everything is keyed to the Friday that starts the pay week */
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)};
const addWeeks=(s,n)=>addDays(s,n*7);
function weekStartOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  x.setDate(x.getDate()-((x.getDay()-WEEK_START+7)%7));return iso(x)}
const thisWeek=()=>weekStartOf(new Date());
const md=s=>{const d=parseISO(s);return`${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}`};
function weekLabel(k){return `${md(k)}–${md(addDays(k,6))}`}
function weekLong(k){const a=parseISO(k),b=parseISO(addDays(k,6));
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${M[a.getMonth()]} ${a.getDate()} – ${M[b.getMonth()]} ${b.getDate()}, ${b.getFullYear()}`}
function dueLabel(s){if(!s)return'';const d=parseISO(s);
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return`${M[d.getMonth()]} ${d.getDate()}`}
const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/864e5);

/* ── theme ────────────────────────────────────────────────────────
   Light by default; the choice is remembered per browser. */
const THEMEKEY='ccb.theme';
function currentTheme(){try{return localStorage.getItem(THEMEKEY)==='dark'?'dark':'light'}catch(e){return'light'}}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem(THEMEKEY,t)}catch(e){}
}
function toggleTheme(){
  applyTheme(currentTheme()==='dark'?'light':'dark');
  render();                     /* charts are drawn with resolved colours */
}
function themeBtnHTML(){
  const dark=currentTheme()==='dark';
  return `<button class="btn sm ghost" data-act="theme" title="${dark?'Switch to light':'Switch to dark'}"
    style="display:flex;align-items:center;gap:7px">${dark
      ? `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1M12.9 12.9l-1.1-1.1M4.2 4.2L3.1 3.1"/></svg>Light`
      : `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M13.5 9.6A6 6 0 1 1 6.4 2.5a4.8 4.8 0 0 0 7.1 7.1Z"/></svg>Dark`}</button>`;
}

/* ── state ────────────────────────────────────────────────────────── */
let S=null, UI={tab:'week', week:null, strategy:'avalanche', extra:null, histRange:'all', histMetric:'debt'};

/* ── remembering where you were ───────────────────────────────────
   UI lived only in memory, so every refresh dropped you back on This
   Week — mid-entry on the sheet, that is the wrong page.

   Split by how long each thing should outlive the tab. Which view you
   prefer is a lasting preference and goes to localStorage. WHICH WEEK
   you are on is a position in the data, and belongs to the sitting:
   sessionStorage survives a refresh, which is what was asked for, and
   clears when the tab closes — so opening the app next Friday lands on
   the current week rather than the one you were last looking at.

   Both are wrapped: storage throws outright in some privacy modes, and
   a ledger that will not open is a worse failure than a forgotten tab. */
const UI_KEY='ccb.ui', UI_LASTING=['tab','sheetMode','strategy','histRange','histMetric','dense','showOk','showArchived'];
const UI_SESSION=['week','month','calMonth','refSeason'];
let UI_LAST='';
function saveUI(){
  const keep={};for(const k of UI_LASTING)if(UI[k]!==undefined)keep[k]=UI[k];
  const pos={};for(const k of UI_SESSION)if(UI[k]!=null)pos[k]=UI[k];
  /* render() runs on every keystroke; only touch storage when this
     actually changed. */
  const sig=JSON.stringify([keep,pos]);
  if(sig===UI_LAST)return;
  UI_LAST=sig;
  try{
    localStorage.setItem(UI_KEY,JSON.stringify(keep));
    sessionStorage.setItem(UI_KEY,JSON.stringify(pos));
  }catch(e){}
}
function loadUI(){
  /* Declared out here on purpose: a `const` inside the try block is not in
     scope after it, and reading it below threw a ReferenceError that took
     boot() down with it before render() ever ran — a blank page, for the sake
     of remembering which tab you were on. */
  let stored={};
  try{
    stored=JSON.parse(localStorage.getItem(UI_KEY)||'{}');
    for(const k of UI_LASTING)if(stored[k]!==undefined)UI[k]=stored[k];
    const b=JSON.parse(sessionStorage.getItem(UI_KEY)||'{}');
    for(const k of UI_SESSION)if(b[k]!=null)UI[k]=b[k];
  }catch(e){}
  /* Never restore onto something that is no longer there. */
  /* An order set on the Plan tab is a decision; a default of `avalanche` is
     not. Only applies when nothing was stored — an explicit choice stands. */
  if(stored.strategy===undefined&&(S&&S.plan&&(S.plan.order||[]).length))UI.strategy='custom';
  if(UI.tab&&!TABS.some(t=>t.id===UI.tab))UI.tab='week';
  if(UI.week&&!(S&&S.weeks&&S.weeks[UI.week]))UI.week=null;
  if(UI.month&&!monthKeys().includes(UI.month))UI.month=null;
}

const GROUPS=[
  {id:'checking', label:'Checking'},
  {id:'buckets',  label:'Buckets & Sinking Funds'},
  {id:'savings',  label:'Savings'},
  {id:'loans',    label:'Loans'},
  {id:'cards',    label:'Credit Cards'},
];
const KIND_INFLOW=k=>k==='cash'||k==='savings';   // payments ADD to these
const KIND_DEBT=k=>k==='card'||k==='loan';        // payments SUBTRACT from these

function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);migrate();return true}}catch(e){console.warn('load failed',e)}
  /* the seed needs migrating too — it carries no plan, settings or account extras */
  S=JSON.parse(JSON.stringify(SEED));migrate();save();return false;
}
/* ── undo ─────────────────────────────────────────────────────────
   Cell edits fire on every keystroke, so one snapshot per save would make
   ctrl+Z walk back a character at a time. Snapshots coalesce by key: typing
   "300" into a cell is a single step, and touching a different cell starts a
   new one. Whole-state snapshots rather than diffs — the ledger is ~150KB, so
   the cap is what keeps this honest about memory. */
let UNDO=[],REDO=[],UNDO_KEY=null;
const UNDO_MAX=30;
const snapshot=()=>JSON.stringify({accounts:S.accounts,weeks:S.weeks,plan:S.plan,settings:S.settings,reffing:S.reffing||null});
function pushUndo(key){
  if(key!=null&&key===UNDO_KEY)return;
  UNDO_KEY=key;
  UNDO.push(snapshot());
  if(UNDO.length>UNDO_MAX)UNDO.shift();
  REDO.length=0;
}
function applySnapshot(json){
  const x=JSON.parse(json);
  S.accounts=x.accounts;S.weeks=x.weeks;S.plan=x.plan;S.settings=x.settings;
  if(x.reffing!==undefined)S.reffing=x.reffing||{games:[]};
  UNDO_KEY=null;save();render();
}
function undo(){
  if(!UNDO.length){toast('Nothing left to undo');return}
  REDO.push(snapshot());applySnapshot(UNDO.pop());toast('Undone — ⇧⌘Z to put it back');
}
function redo(){
  if(!REDO.length){toast('Nothing to redo');return}
  UNDO.push(snapshot());applySnapshot(REDO.pop());toast('Redone');
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save — storage may be full')}
  if(typeof syncTouch==='function')syncTouch();
}
/* The parts of the plan that are decisions rather than balances. Seeded once on
   first run, then yours to edit; the published copy ships this empty. */
const PLAN_SEED={source:"",order:[],steps:[],calendar:[],open:[],ref:null,minsToVerify:[]};
/* account facts from the handoff that the spreadsheet had no column for */
const ACCT_SEED={};
function migrate(){
  S.v=S.v||1; S.accounts=S.accounts||[]; S.weeks=S.weeks||{};
  S.accounts.forEach((a,i)=>{if(a.order==null)a.order=i});
  if(!S.plan)S.plan=JSON.parse(JSON.stringify(PLAN_SEED));
  S.plan.calendar=S.plan.calendar||[]; S.plan.open=S.plan.open||[];
  S.plan.steps=S.plan.steps||[]; S.plan.order=S.plan.order||[];
  S.plan.calendar.forEach((c,i)=>{if(c.id==null)c.id='c'+i});
  S.plan.open.forEach((o,i)=>{if(o.id==null)o.id='o'+i});
  for(const[id,ex]of Object.entries(ACCT_SEED)){
    const a=acct(id); if(!a)continue;
    for(const[k,v]of Object.entries(ex))if(a[k]===undefined)a[k]=v;
  }
  if(S.settings===undefined)S.settings={};
  if(S.settings.accrueInterest===undefined)S.settings.accrueInterest=true;
  migrateV2();
  migrateV3();
  migrateV4();
  migrateV5();
  migrateV6();
  migrateV7();
  migrateV8();
  migrateV9();
  migrateV10();
  migrateV11();
  migrateV12();
  migrateV13();
}
/* v2 — grouping corrections, Sept 10 2026. Runs against the ledger already
   in the browser, not just the seed: editing SEED alone would have changed
   nothing for a copy that has been in use since January.

   Car Lease Savings moves to Loans. Its kind stays `cash` — money still ADDS
   to it, because it is the account the lease payment is saved into, not the
   lease itself. Only the grouping changes.

   Apple Card Subscriptions is archived, not deleted: it is empty on every one
   of the 40 weeks, the subscriptions now bill to the Apple card and are saved
   for by the Subscriptions row, and History keeps archived accounts so nothing
   is lost. Un-archive it in Accounts if that turns out to be wrong. */
/* v3 — the income row carried the same bank name as the checking bucket
   directly beneath it, and the pair read as one thing split in two. The top
   row is the paycheck arriving, so it says so. Renamed in the data rather
   than special-cased at render, so it stays editable in Accounts.

   Unconditional on purpose: matching the old name would mean writing a real
   account name into a file that gets published, which is what `.leakwords`
   and the pre-commit hook exist to stop. This migration runs once. */
/* v4 — Car Insurance is sent onward the week it is funded, so it never holds
   a balance. Flagged by id: it is the one account with this shape, and the
   registry has no other way to say "this is a conduit, not a fund". */
/* v5 — the card-minimums bucket is a staging account for debt, not savings.
   Money lands there only on its way to a card, and classifying it as savings
   understated what actually goes to debt each week by the whole of it. */
/* v6 — the Subscriptions bucket exists to clear the Apple card, which is
   where the subscriptions now bill. Linking them means paying that card draws
   the bucket down on its own, rather than the balance sitting there looking
   untouched. */
/* v7 — the Apple Card Savings target declares `frees: 50`, but nothing ever
   read it as a budget step: the field drove the wording on This Week and
   stopped there. So the buffer reached $1,000 and the $50 a week kept going
   into a pot that was already full, in every projection. The lease bucket had
   this step and the buffer did not. */
/* v8 — three buckets state their contribution per paycheck, not per month:
   the amount typed for them is what goes in each week, and `autoOther` has
   always topped them up to it weekly. Only the column header disagreed, which
   made a weekly figure read as monthly and the derived /wk column divide a
   weekly number by four. Car Lease Savings is left alone: its $714.30 is one
   lease payment, and its own Min column has always been a quarter of it. */
/* v9 — the motorcycle premium is fully funded, so its $14.50 a week is free
   for attack. Same shape as the lease and buffer steps, which the target
   already implied and nothing read. */
/* v10 — the subscription schedule, so the sheet knows what lands and when
   rather than only that a bucket exists to pay for it. */
/* v11 — the two savings accounts earn interest and the sheet was treating
   them as inert. Stored as a rate on the account, the same field a card uses;
   the row's kind decides whether it costs or earns. */
/* v12 — weeks now carry forward without the interest estimate. Every stored
   projection was made with it, so each one is restated against the week
   before, or Unplanned keeps showing the estimate on rows already corrected.
   computeWeek writes derived fields back into entries, so the ledger is
   snapshotted and restored around it: `projected` is the only thing changed. */
/* v13 — the motorcycle premium renews every six months. `every` on a target
   marks a goal that is spent and has to be saved again each term, with `by`
   as the next renewal. */
function migrateV13(){
  if(S.v>=13)return;
  const a=acct('motorcycle-insurance');
  if(a&&a.target&&a.target.every==null)a.target.every=6;
  S.v=13;
}
function migrateV12(){
  if(S.v>=12)return;
  const ks=Object.keys(S.weeks).sort(),snap=JSON.stringify(S.weeks),carries={};
  for(let i=1;i<ks.length;i++){
    const P=computeWeek(ks[i-1]); if(!P)continue;
    carries[ks[i]]=Object.fromEntries(P.rows.filter(r=>!r.isRollup&&r.a.kind!=='income')
      .map(r=>[r.a.id,KIND_DEBT(r.a.kind)?r2(Math.max(0,r.after)):r2(r.after)]));
  }
  S.weeks=JSON.parse(snap);
  for(const [k,c] of Object.entries(carries)){
    const ents=S.weeks[k].entries||{};
    for(const [id,proj] of Object.entries(c)){
      const e=ents[id]; if(e&&e.projected!=null)e.projected=proj;
    }
  }
  S.v=12;
}
function migrateV11(){
  if(S.v>=11)return;
  const rates={'apple-card-savings':0.034,'capital-one-savings':0.03};
  for(const [id,rate] of Object.entries(rates)){
    const a=acct(id); if(a&&!a.apr)a.apr=rate;
  }
  S.v=11;
}
function migrateV10(){
  if(S.v>=10)return;
  S.plan=S.plan||{};
  if(!S.plan.subs||!S.plan.subs.length)
    S.plan.subs=JSON.parse(JSON.stringify(PLAN_SEED.subs||[]));
  S.v=10;
}
function migrateV9(){
  if(S.v>=9)return;
  S.plan=S.plan||{}; S.plan.steps=S.plan.steps||[];
  if(acct('motorcycle-insurance')&&!S.plan.steps.some(x=>x.id==='moto')){
    S.plan.steps.push({id:'moto',label:'Motorcycle insurance funded',weekly:14.50,
      trigger:{type:'target',acct:'motorcycle-insurance'},
      note:'premium covered — the weekly is free until the next term'});
  }
  const a=acct('motorcycle-insurance');
  if(a&&a.target&&a.target.frees==null)a.target.frees=14.50;
  S.v=9;
}
function migrateV8(){
  if(S.v>=8)return;
  for(const id of ['credit-card-minimums','subscriptions','motorcycle-insurance']){
    const a=acct(id); if(a)a.minPeriod='week';
  }
  S.v=8;
}
function migrateV7(){
  if(S.v>=7)return;
  S.plan=S.plan||{}; S.plan.steps=S.plan.steps||[];
  if(acct('apple-card-savings')&&!S.plan.steps.some(x=>x.id==='buffer')){
    S.plan.steps.push({id:'buffer',label:'Emergency buffer funded',weekly:50,
      trigger:{type:'target',acct:'apple-card-savings'},
      note:'$1,000 reached — refill only when drawn down'});
  }
  S.v=7;
}
function migrateV6(){
  if(S.v>=6)return;
  const a=acct('subscriptions');
  if(a&&acct('apple'))a.autoOut='apple';
  S.v=6;
}
function migrateV5(){
  if(S.v>=5)return;
  const a=acct('credit-card-minimums');
  if(a)a.fundsDebt=true;
  S.v=5;
}
function migrateV4(){
  if(S.v>=4)return;
  const a=acct('car-insurance');
  if(a)a.passthrough=true;
  S.v=4;
}
function migrateV3(){
  if(S.v>=3)return;
  const inc=S.accounts.find(a=>a.kind==='income');
  if(inc)inc.name='Income';
  S.v=3;
}
function migrateV2(){
  if(S.v>=2)return;
  const lease=acct('car-lease-savings');
  if(lease)lease.group='loans';
  const dead=acct('apple-card-subscriptions');
  if(dead)dead.archived=true;
  S.v=2;
}
function resetToSeed(){S=JSON.parse(JSON.stringify(SEED));migrate();save();UI.week=null;render()}

const acct=id=>S.accounts.find(a=>a.id===id);
const liveAccounts=()=>S.accounts.filter(a=>!a.archived).sort((a,b)=>a.order-b.order);
const weekKeys=()=>Object.keys(S.weeks).sort();
function currentWeek(){
  if(UI.week&&S.weeks[UI.week])return UI.week;
  const ks=weekKeys(),now=thisWeek();
  if(S.weeks[now])return now;
  const past=ks.filter(k=>k<=now);
  return past.length?past[past.length-1]:(ks[0]||now);
}
const isPlanned=k=>k>thisWeek();

function blankEntry(){return{balance:0,min:0,attack:0,other:0,out:0,minAmt:0,close:'',due:'',projected:null,paid:false,paidOn:null}}
function entryOf(k,id){const w=S.weeks[k];if(!w)return blankEntry();
  if(!w.entries[id])w.entries[id]=blankEntry();
  const e=w.entries[id];for(const[p,d]of Object.entries(blankEntry()))if(e[p]===undefined)e[p]=d;
  return e}

/* ── the compute engine ───────────────────────────────────────────
   One pass over the week produces every derived number the old sheet
   had as a formula, for any number of accounts.
   ───────────────────────────────────────────────────────────────── */
function computeWeek(k){
  const w=S.weeks[k];
  if(!w)return null;
  const accts=liveAccounts();
  const rows=accts.map(a=>{
    const e=entryOf(k,a.id);
    const dpr=a.apr?a.apr/365:0;
    const bal=n0(e.balance);
    const row={a,e,dpr,balance:bal,min:n0(e.min),attack:n0(e.attack),other:n0(e.other),out:n0(e.out)};
    row.minAmt=n0(e.minAmt||a.minAmt);
    row.close=e.close||''; row.due=e.due||'';
    return row;
  });
  const byId=Object.fromEntries(rows.map(r=>[r.a.id,r]));

  /* the sheet's L4: whatever of this month's card minimums isn't being paid
     straight to the card gets parked in the minimums bucket */
  /* A card another bucket exists to pay is that bucket's business: what goes
     to it is drawn from there, so counting it here too would take the same
     payment off two buckets. */
  const paidByBucket=new Set(accts.map(a=>a.autoOut).filter(Boolean));
  const cardRows=rows.filter(r=>r.a.kind==='card'&&!paidByBucket.has(r.a.id));
  for(const r of rows){
    if(r.a.autoOther==='cardMinShortfall'){
      const paidDirect=cardRows.reduce((s,c)=>s+c.min,0);
      r.other=r2(Math.max(0,r.minAmt-paidDirect));
      r.e.other=r.other;
      /* ...and the way out. Minimums paid past this week's contribution came
         out of what the bucket had saved, so they draw it down and net off
         the paycheck, as `autoOut` does for a bucket linked to one account.
         Without it a $300 minimum left the bucket untouched and read as $137
         over-allocated. The spreadsheet did this with a negative Other.
         Weeks finalized before this existed keep the Out they were closed
         with. The entry is marked the first time it draws, so finalizing a
         week later does not undo the netting and turn it over-allocated. */
      if(!isLocked(k)||r.e.drawsForCards){
        r.out=r2(Math.min(Math.max(0,paidDirect-r.minAmt),Math.max(0,r.balance)));
        r.e.out=r.out;
        r.e.drawsForCards=true;
        r.drawsForCards=true;
      }
    }
    /* `autoOut` names the account this bucket exists to pay. Whatever goes to
       that account this week is drawn out of the bucket, because that is where
       the money came from — the same idea as the minimums bucket, running the
       other way: that one fills the gap on the way in, this one records the
       drawdown on the way out.

       Capped at what the bucket actually holds. Paying more than it has is a
       real thing to do, but the excess came from general money, not from here,
       and a savings bucket that reads below zero is telling a lie about
       itself. */
    if(r.a.autoOut){
      const t=byId[r.a.autoOut];
      const paid=t?r2(t.min+t.attack+t.other):0;
      const target=n0(r.minAmt);
      /* This week's contribution pays first and the accumulated balance only
         covers what is left over — the same order the minimums bucket uses,
         and the order the spreadsheet used. It matters for what you read off
         the row: `Other` becomes what is ACTUALLY going in this week, rather
         than the full contribution with a separate withdrawal beside it
         cancelling part of it out. */
      r.other=r2(Math.max(0,target-paid));
      r.e.other=r.other;
      const fromPile=r2(Math.max(0,paid-target));
      r.out=r2(Math.min(fromPile,Math.max(0,r.balance)));
      r.e.out=r.out;
    }
  }

  /* the income row IS the paycheck cell — keep them the same number */
  for(const r of rows)if(r.a.kind==='income')r.balance=n0(w.income);
  for(const r of rows){
    r.total=r2(r.min+r.attack+r.other);
    /* A card in grace carries no interest — but only while the statement balance is
       paid in full by the due date. A partial payment ends it retroactively. */
    r.inGrace=!!(r.a.grace&&r.a.kind==='card'&&r.balance>0);
    /* BUG 1 from the handoff: the sheet computed balance − payment and never applied
       interest, under-forecasting by ~$214/week. End-of-week = opening + interest − paid. */
    /* Debt costs interest and savings earn it — the same arithmetic with the
       sign reversed. Stored on the account as a rate either way; the row's
       kind decides which direction it moves the balance. Held at the account's
       APY against a simple daily rate, which overstates by roughly $0.55 a
       year per $1,000 — smaller than the rounding on a single week. */
    r.weekInterest=S.settings.accrueInterest
      ?(KIND_DEBT(r.a.kind)&&!r.inGrace ? r2(r.balance*r.dpr*7)
        :KIND_INFLOW(r.a.kind)&&r.a.apr ? r2(r.balance*r.dpr*7) : 0)
      :0;
    if(r.a.kind==='income'){r.after=r.balance}
    /* A bucket's balance is what went in less what has since left it. `out` is
       money leaving on its way somewhere else — a subscription hitting the
       card, a minimum actually paid — and it is NOT an allocation: the
       paycheck spent that dollar the week it went in, not the week it left.
       So `out` stays out of `total`, and the week still balances to zero.

       A passthrough is the same idea with the typing removed: funded and
       emptied every week, so it never holds anything. */
    else if(KIND_INFLOW(r.a.kind)){
      r.after=r.a.passthrough?r2(r.balance)
        :r2(r.balance+r.total-n0(r.out));
    }
    else{r.after=r2(r.balance-r.total)}
    /* After is the balance with this week's payments applied and nothing else.
       Interest is left out of it on purpose: every balance is typed by hand
       from the real account each week, so the actual charge is already in the
       next figure typed. Adding an estimate on top put it into After, carried
       it into the next week, and then showed it as Unplanned the moment the
       real balance went in. Interest stays its own column, for reference. */
    if(r.a.limit>0&&r.a.kind==='card'){
      r.usage=r.balance/r.a.limit;
      r.usageAfter=r.after/r.a.limit;
      r.availAfter=r2(r.a.limit-r.after);
    }
    r.minLeft=r.minAmt?r2(r.minAmt-r.total):0;
    if(r.a.target){
      const t=r.a.target;
      r.targetPct=t.amount?clamp(r.after/t.amount,0,1):0;
      r.targetShort=r2(Math.max(0,t.amount-r.after));
      r.targetDone=r.after+0.005>=t.amount;
      r.targetWeeks=r.targetDone?0:(r.total>0?Math.ceil(r.targetShort/r.total):Infinity);
    }
    /* 6 months out at this week's rate — the sheet's Q column, ×26 weeks */
    if(KIND_INFLOW(r.a.kind)){
      if(r.a.passthrough)r.sixMo=r2(r.balance);
      else{
        const net=r.total-(n0(r.out)||n0(r.a.weeklyOutflow));
        let b=r.balance;
        for(let i=0;i<26;i++)b=b+net+b*r.dpr*7;   /* earning compounds; a flat multiply would not */
        r.sixMo=r2(b);
      }
    }
    else if(KIND_DEBT(r.a.kind))r.sixMo=r2(Math.max(0,projectDebt(r.balance,r.dpr,r.total,26)));
    r.drift=(r.e.projected!=null)?r2(r.balance-n0(r.e.projected)):null;
  }
  /* rollup rows mirror the sum of their children and never spend twice */
  for(const r of rows){
    if(r.a.rollup&&r.a.rollup.length){
      const kids=r.a.rollup.map(id=>byId[id]).filter(Boolean);
      r.isRollup=true;
      r.balance=r2(kids.reduce((s,x)=>s+x.balance,0));
      r.total=r2(kids.reduce((s,x)=>s+x.total,0));
      r.out=r2(kids.reduce((s,x)=>s+n0(x.out),0));
      r.after=r2(kids.reduce((s,x)=>s+x.after,0));
    }
  }
  const income=n0(w.income);
  /* A payment funded out of a bucket is not a fresh call on this paycheck —
     the paycheck already spent that dollar the week it went into the bucket.
     Where a bucket is LINKED to the account it pays, the sheet holds both
     sides of the same money, so the drawdown cancels the payment and the week
     still balances. Only linked buckets net off: a hand-typed Out is money
     leaving for something the sheet does not otherwise record, and there is
     nothing to double count. */
  const drawnForCardMins=r2(rows.filter(r=>r.drawsForCards&&!r.isRollup)
    .reduce((s,r)=>s+n0(r.out),0));
  const fundedFromBuckets=r2(rows.filter(r=>r.a.autoOut&&!r.isRollup)
    .reduce((s,r)=>s+n0(r.out),0)+drawnForCardMins);
  const allocated=r2(rows.filter(r=>!r.isRollup&&r.a.kind!=='income')
    .reduce((s,r)=>s+r.total,0)-fundedFromBuckets);
  const unallocated=r2(income-allocated);

  const cards=rows.filter(r=>r.a.kind==='card');
  const debts=rows.filter(r=>KIND_DEBT(r.a.kind));
  const buckets=rows.filter(r=>!r.isRollup&&KIND_INFLOW(r.a.kind));
  const totals={
    income, allocated, unallocated,
    limit:r2(cards.reduce((s,r)=>s+n0(r.a.limit),0)),
    cardBalance:r2(cards.reduce((s,r)=>s+r.balance,0)),
    cardAfter:r2(cards.reduce((s,r)=>s+r.after,0)),
    debtBalance:r2(debts.reduce((s,r)=>s+r.balance,0)),
    debtAfter:r2(debts.reduce((s,r)=>s+r.after,0)),
    debtPaid:r2(debts.reduce((s,r)=>s+r.total,0)),
    /* Partitioned by row KIND, not by column, so every dollar lands in exactly
       one bucket. Summing a column across all rows counted a cash account's
       Min and Attack twice — once here and again in savingsIn — and left the
       Other column on a debt row in no bucket at all. */
    minPaid:r2(debts.reduce((s,r)=>s+r.min,0)),
    attack:r2(debts.reduce((s,r)=>s+r.attack,0)),
    otherDebt:r2(debts.reduce((s,r)=>s+r.other,0)),
    weekInterest:r2(debts.reduce((s,r)=>s+r.weekInterest,0)),
    interestEarned:r2(rows.filter(r=>!r.isRollup&&KIND_INFLOW(r.a.kind))
      .reduce((s,r)=>s+n0(r.weekInterest),0)),
    availAfter:r2(cards.reduce((s,r)=>s+n0(r.availAfter),0)),
  };
  totals.usage=totals.limit?totals.cardBalance/totals.limit:0;
  totals.usageAfter=totals.limit?totals.cardAfter/totals.limit:0;
  totals.avgUsageAfter=cards.length?cards.reduce((s,r)=>s+n0(r.usageAfter),0)/cards.length:0;
  /* a bucket's whole contribution, whichever column it was entered in */
  /* A bucket flagged `fundsDebt` is a staging account for debt — money lands
     there on its way to a card, not as savings. It is partitioned out of
     savingsIn so the allocation bar does not read it as money set aside.

     `debtPaid` deliberately stays as it was: money that actually reached a
     debt row this week. The weekly check compares it against interest to say
     whether the debt moved, and a dollar sitting in a bucket has not moved
     any debt yet. `debtFunded` is the wider figure — everything committed to
     debt — and that is what the projections should run on. */
  const debtBuckets=buckets.filter(r=>r.a.fundsDebt);
  totals.savingsIn=r2(buckets.filter(r=>!r.a.fundsDebt).reduce((s,r)=>s+r.total,0));
  totals.debtBucket=r2(debtBuckets.reduce((s,r)=>s+r.total,0));
  /* Minimums the bucket paid from savings are in debtPaid but not new money
     from this paycheck, so they come off what the paycheck committed. */
  totals.cardMinDraw=drawnForCardMins;
  totals.debtFunded=r2(totals.debtPaid+totals.debtBucket-drawnForCardMins);

  return {key:k, rows, byId, totals, checks:runChecks(k,rows,totals)};
}

/* one debt, n weeks of interest and payment */
function projectDebt(bal,dpr,weekly,weeks){
  let b=bal;const f=1+dpr*7;
  for(let i=0;i<weeks&&b>0;i++)b=b*f-weekly;
  return b>0?b:0;
}
/* weeks until a debt clears — Infinity if the payment can't outrun the interest */
function weeksToClear(bal,dpr,weekly){
  if(bal<=0)return 0;
  if(weekly<=bal*dpr*7)return Infinity;
  let b=bal,w=0;const f=1+dpr*7;
  while(b>0&&w<5200){b=b*f-weekly;w++}
  return b<=0?w:Infinity;
}
const weeksToMonths=w=>w===Infinity?Infinity:w/WPM;
function monthsLabel(m){
  if(m===Infinity)return'never';
  if(m<1)return'<1 mo';
  if(m<24)return`${Math.round(m)} mo`;
  const y=Math.floor(m/12),r=Math.round(m%12);
  return r?`${y}y ${r}m`:`${y}y`;
}
function dateAfterWeeks(from,w){
  if(w===Infinity)return null;
  return addWeeks(from,Math.ceil(w));
}
function shortMY(s){const d=parseISO(s);
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return`${M[d.getMonth()]} '${String(d.getFullYear()).slice(2)}`}
function longDate(s){const d=parseISO(s);
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return`${M[d.getMonth()]} ${d.getFullYear()}`}

/* ── weekly plan checks ───────────────────────────────────────────── */
function runChecks(k,rows,T){
  const out=[];
  const off=Math.abs(T.unallocated);
  if(off<0.005)out.push({s:'ok',t:`Every dollar has a job. ${money(T.income)} in, ${money(T.allocated)} out, ${money(0)} left over.`});
  else if(T.unallocated>0)out.push({s:'warn',t:`<b>${money(T.unallocated)} unallocated.</b> The sheet only balanced when this hit zero — give it somewhere to go.`});
  else out.push({s:'bad',t:`<b>Over-allocated by ${money(off)}.</b> You're spending more than the ${money(T.income)} that came in.`});

  /* minimums: has enough gone toward this card since its last statement closed? */
  const today=thisWeek();
  for(const r of rows){
    if(!KIND_DEBT(r.a.kind)||!r.minAmt)continue;
    const cyclePaid=paidSinceClose(k,r);
    if(cyclePaid+0.005>=r.minAmt)continue;
    const short=r2(r.minAmt-cyclePaid);
    if(r.due&&r.due<addDays(k,7)&&r.due>=k)
      out.push({s:'bad',t:`<b>${esc(r.a.name)} is ${money(short)} short</b> of its ${money(r.minAmt)} minimum and due ${dueLabel(r.due)} — inside this week.`});
    else if(r.due&&r.due<today)
      out.push({s:'bad',t:`<b>${esc(r.a.name)} minimum was due ${dueLabel(r.due)}</b> and is still ${money(short)} short.`});
    else
      out.push({s:'warn',t:`${esc(r.a.name)} needs ${money(short)} more before ${r.due?dueLabel(r.due):'its due date'} to clear the ${money(r.minAmt)} minimum.`});
  }
  /* The shortfall loop above skips anything with no minimum recorded, so a
     card sitting at $0 produces no check at all — silence exactly where the
     sheet knows least. It cannot know the figure, but it does know when the
     statement closes, which is when you find out. Asked for only in the week
     a statement closes, or the week after if it is still missing, so it is a
     prompt at the right moment rather than a standing complaint. */
  for(const r of rows){
    if(!KIND_DEBT(r.a.kind)||r.balance<=0.005||n0(r.minAmt)||!r.close)continue;
    if(r.close<addDays(k,-7)||r.close>=addDays(k,7))continue;
    const already=r.close<k;
    out.push({s:'warn',t:`<b>${esc(r.a.name)} ${already?`closed ${dueLabel(r.close)}`:`closes ${dueLabel(r.close)}`} `
      +`and has no minimum recorded.</b> Put it in Min due /mo — until it is there nothing can tell you `
      +`if it goes unpaid, and the payoff date assumes you are paying it nothing.`});
  }
  /* Subscriptions land on a card whether or not the bucket has the money for
     them. The schedule itself lives on Subscriptions — a recurring charge you expect is
     reference, not an alarm — so this speaks only when what bills this week is
     more than the bucket holds. */
  {
    const bucket=rows.find(r=>r.a.id==='subscriptions');
    const hits=subsInWeek(k).filter(x=>!(bucket&&bucket.a.autoOut)||x.card===bucket.a.autoOut);
    if(hits.length){
      const due=r2(hits.reduce((t,x)=>t+x.amount,0));
      const held=bucket?r2(bucket.balance+bucket.total):0;
      if(due>held+0.005)
        out.push({s:'warn',t:`<b>${money(due)} of subscriptions bill this week</b> and the bucket `
          +`holds ${money(held)} — ${money(r2(due-held))} short. `
          +hits.map(x=>`${esc(x.name)} ${money(x.amount)} on ${dueLabel(x.date)}`).join(', ')+`.`});
    }
  }
  /* over limit, and utilization that'll get reported */
  for(const r of rows.filter(x=>x.a.kind==='card'&&x.a.limit>0)){
    if(r.after>r.a.limit)out.push({s:'bad',t:`<b>${esc(r.a.name)} is over its limit</b> — ${money(r.after)} against ${money0(r.a.limit)} after this week's payment.`});
    else if(r.close&&r.close>=k&&r.close<addDays(k,7)&&r.usageAfter>0.3)
      out.push({s:'warn',t:`${esc(r.a.name)} closes ${dueLabel(r.close)} at <b>${pct(r.usageAfter)}</b> utilization — that's the number that gets reported.`});
  }
  /* cash that goes negative */
  for(const r of rows.filter(x=>x.a.kind==='cash'&&!x.isRollup)){
    if(r.after<-0.005)out.push({s:'bad',t:`<b>${esc(r.a.name)} lands at ${money(r.after)}</b> — negative after this week.`});
  }
  /* grace cards: free to carry, ruinous to underpay */
  for(const r of rows.filter(x=>x.inGrace)){
    if(r.total>0.005&&r.total+0.005<r.balance)
      out.push({s:'bad',t:`<b>${esc(r.a.name)} is being paid ${money(r.total)} against a ${money(r.balance)} balance.</b> A partial payment ends grace and ${pct(n0(r.a.apr),2)} applies to the whole balance retroactively — pay it in full or leave it alone.`});
    else if(r.total+0.005>=r.balance)
      out.push({s:'ok',t:`${esc(r.a.name)} paid in full at ${money(r.balance)} — grace intact, ${money(0)} of interest.`});
    else
      out.push({s:'warn',t:`<b>${esc(r.a.name)}: ${money(r.balance)} due in full by ${r.a.graceDue?dueLabel(r.a.graceDue):(r.due?dueLabel(r.due):'the due date')}.</b> In grace, so it costs nothing to carry — but it has to go all at once.`});
  }
  /* sinking funds against their target date */
  for(const r of rows.filter(x=>x.a.target&&!x.isRollup)){
    const t=r.a.target;
    if(r.targetDone){
      const fr=weeklyOf(r)||n0(t.frees);
      out.push({s:'ok',t:`${esc(r.a.name)} is funded at ${money(r.after)} of ${money(t.amount)}${fr?` — <b>${money(fr)}/week frees up</b>`:''}.`});
      continue;
    }
    if(!t.by)continue;
    const wksLeft=Math.max(0,Math.ceil(daysBetween(k,t.by)/7));
    const need=wksLeft?r2(r.targetShort/wksLeft):r.targetShort;
    if(r.total+0.005>=need)
      out.push({s:'ok',t:`${esc(r.a.name)} on track — ${money(r.targetShort)} to go by ${dueLabel(t.by)}, ${money(need)}/week needed and ${money(r.total)} going in.`});
    else
      out.push({s:'warn',t:`<b>${esc(r.a.name)} is behind</b> — ${money(r.targetShort)} short with ${wksLeft} week${wksLeft===1?'':'s'} to ${dueLabel(t.by)}. Needs ${money(need)}/week, getting ${money(r.total)}.`});
  }
  /* anything on the calendar that lands inside this pay week */
  const end=addDays(k,7);
  for(const c of (S.plan?.calendar||[]).filter(c=>!c.done&&c.d>=k&&c.d<end))
    out.push({s:'warn',t:`<b>${dueLabel(c.d)} — ${esc(c.t)}</b>${c.n?` · ${esc(c.n)}`:''}`});

  /* the thing the old sheet could never show: are you actually going backwards? */
  /* After no longer includes interest, so these forecasts add it back
     themselves — they are about interest, and say so. */
  const debtWithInterest=r2(T.debtBalance+T.weekInterest-T.debtPaid);
  if(T.debtBalance>0&&debtWithInterest>T.debtBalance+0.005)
    out.push({s:'bad',t:`<b>Total debt grows ${money(r2(debtWithInterest-T.debtBalance))} this week.</b> ${money(T.debtPaid)} of payments against ${money(T.weekInterest)} of interest — you end the week owing ${money(debtWithInterest)}.`});
  else if(T.debtBalance>0&&T.debtPaid>0)
    out.push({s:'ok',t:`Debt drops ${money(r2(T.debtBalance-debtWithInterest))} — ${money(T.debtPaid)} paid clears the ${money(T.weekInterest)} of interest and ${money(r2(T.debtPaid-T.weekInterest))} of principal.`});

  /* a maxed card creeping toward its limit on interest alone */
  for(const r of rows.filter(x=>x.a.kind==='card'&&x.a.limit>0&&x.balance>0&&x.weekInterest>x.total+0.005)){
    let b=r2(r.balance+r.weekInterest-r.total),w=1;
    while(b<=r.a.limit&&w<520){b=b*(1+r.dpr*7)-r.total;w++}
    if(w<520&&w<=26)
      out.push({s:w<=8?'bad':'warn',t:`<b>${esc(r.a.name)} breaches its limit in about ${w} week${w===1?'':'s'}</b> — ${money(b)} against ${money0(r.a.limit)}, growing ${money(r.weekInterest)}/week with ${money(r.total)} going in. Nothing new should go on this card.`});
  }

  if(T.attack<=0&&T.debtBalance>0)
    out.push({s:'warn',t:`No attack money this week. Minimums alone cost you ${money(T.weekInterest)} in interest over the next 7 days.`});
  return out;
}
/* Everything paid toward this debt in the cycle the current minimum belongs to.
   The cycle is anchored on the due date (loans have no statement close) and runs
   the month before it — so four weekly payments of a quarter-minimum add up. */
/* What has gone to this account since its statement last closed.

   This took the stored date and stepped back exactly one month, which puts
   the window's start AFTER the current week whenever the next due date is
   more than a month out — an empty range, a sum of zero, and a minimum that
   reads as unpaid no matter what you actually paid. A card due in November
   could never register a payment made in September.

   It walks back a month at a time until the cycle start is not in the future,
   and anchors to the pay week containing it rather than to the bare date:
   weeks are keyed by their Friday, so a close falling mid-week would
   otherwise exclude the very week it belongs to. `close` leads because the
   cycle is defined by the statement closing, not by when it comes due. */
function paidSinceClose(k,r){
  const anchor=r.close||r.due;
  let from=k;
  if(anchor){
    const d=parseISO(anchor);
    let guard=0;
    do{d.setMonth(d.getMonth()-1)}while(weekStartOf(d)>k&&guard++<60);
    from=weekStartOf(d);
  }
  return r2(weekKeys().filter(w=>w>=from&&w<=k)
    .reduce((s,w)=>{const e=S.weeks[w].entries[r.a.id];return s+(e?n0(e.min)+n0(e.attack)+n0(e.other):0)},0));
}
</script>
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   Payoff simulator — week by week, with the snowball rolling forward
   as each debt clears.
   ═══════════════════════════════════════════════════════════════════ */
function debtSnapshot(k){
  const C=computeWeek(k);if(!C)return[];
  return C.rows.filter(r=>KIND_DEBT(r.a.kind)&&r.balance>0.005).map(r=>({
    id:r.a.id,name:r.a.name,kind:r.a.kind,
    /* a card in grace has no effective rate — ranking it by its nominal APR would
       rank a grace card to the top of the avalanche, which is exactly the wrong move */
    apr:r.inGrace?0:n0(r.a.apr), nominalApr:n0(r.a.apr), dpr:r.inGrace?0:r.dpr,
    grace:r.inGrace, graceDue:r.a.graceDue||'',
    balance:r.balance,limit:n0(r.a.limit),
    weeklyMin:r2(n0(r.minAmt)?(statedWeekly(r.a)?n0(r.minAmt):n0(r.minAmt)/MIN_DIVISOR):0),
    current:r.total, weekInterest:r.weekInterest,
  }));
}
/* when a budget step turns on, in weeks from `fromWeek`. null = never / resolved live */
function stepFireWeek(st,fromWeek){
  const tr=st.trigger||{};
  if(tr.type==='manual')return st.on?0:null;
  if(tr.type==='date')return tr.date?Math.max(0,Math.ceil(daysBetween(fromWeek,tr.date)/7)):null;
  if(tr.type==='target'){
    const a=acct(tr.acct); if(!a||!a.target)return null;
    const r=(computeWeek(fromWeek)||{byId:{}}).byId[tr.acct];
    if(r&&r.targetDone)return 0;
    if(a.target.by)return Math.max(0,Math.ceil(daysBetween(fromWeek,a.target.by)/7));
    /* `targetShort` is measured after this week's contribution, and week 0 of
       a simulation is this week — so the contributions still needed fill weeks
       1..n, and the money frees in the week after the last of them. Returning
       n freed it a week early, while that week's deposit was still owed. */
    if(r&&r.total>0)return Math.ceil(r.targetShort/r.total-1e-9)+1;
    return null;
  }
  return null;
}
function simulate(debts,{strategy='avalanche',budget=0,fromWeek=thisWeek(),cap=5200,steps=[],sheetFirst=false,funds=[],lumps=[],raises=[]}={}){
  const D=debts.map(d=>({...d,paidOff:null,interest:0}));
  if(!D.length)return{weeks:0,totalInterest:0,debts:D,series:[{w:0,total:0}],fired:[],endBudget:budget};
  const rank=Object.fromEntries((S.plan?.order||[]).map((id,i)=>[id,i]));
  const order=()=>{
    const live=D.filter(d=>d.balance>0.005);
    if(strategy==='snowball')return live.sort((a,b)=>a.balance-b.balance);
    if(strategy==='current')return live;
    if(strategy==='custom')return live.sort((a,b)=>(rank[a.id]??999)-(rank[b.id]??999)||b.apr-a.apr);
    return live.sort((a,b)=>b.apr-a.apr||b.balance-a.balance);
  };
  /* A fund that renews is tracked week by week instead of switching on once:
     each renewal takes the goal back out of it, and until it is refilled its
     weekly amount goes to the fund rather than to debt. `baseline` is what the
     sheet sends the fund, so the difference from it is what debt gains or loses. */
  const FU=funds.map(f=>({...f,b:n0(f.after)}));
  const fundIds=new Set(FU.map(f=>f.id));
  const fundDelta=w=>{let d=0;
    for(const f of FU){
      if(w===0)continue;
      if(f.renew.has(w))f.b-=f.amount;
      const c=f.b<f.amount-0.005?Math.min(f.weekly,f.amount-f.b):0;
      f.b+=c;d+=f.baseline-c;
    }
    return d};
  let lastBudget=budget;const weekBudget=[];
  const ST=steps.filter(st=>!fundIds.has((st.trigger||{}).acct)).map(st=>({...st,fireWeek:stepFireWeek(st,fromWeek)}));
  const firedIds=new Set(),fired=[];
  let w=0,totalInterest=0,extra=0;
  const byDebt=()=>Object.fromEntries(D.map(d=>[d.id,r2(Math.max(0,d.balance))]));
  const series=[{w:0,total:r2(D.reduce((s,d)=>s+d.balance,0)),by:byDebt()}];
  while(D.some(d=>d.balance>0.005)&&w<cap){
    /* budget steps switch on as their trigger lands, and stay on */
    for(const st of ST){
      if(firedIds.has(st.id))continue;
      const tr=st.trigger||{};
      let go=false;
      if(tr.type==='payoff'){
        const d=D.find(x=>x.id===tr.acct);
        go=d?(d.paidOff!=null&&w>=d.paidOff):true;   // already clear → already freed
      }else go=(st.fireWeek!=null&&w>=st.fireWeek);
      /* a step already in effect when the sheet was written is already in the
         sheet's own allocation — the money it freed has been placed — so
         starting from the sheet, only steps that land later add to it */
      /* Nor does a debt clearing. Starting from the sheet, the weekly total
         already holds that debt's payment — its minimum, or its share of the
         card-minimum bucket — and once the debt is gone that money simply
         moves down the order. A step saying the same money comes free would
         count it twice. */
      const already=sheetFirst&&(w===0||tr.type==='payoff');
      if(go){firedIds.add(st.id);if(!already)extra+=n0(st.weekly);fired.push({...st,week:w})}
    }
    /* `sheetFirst`: the opening week is the sheet itself, not a strategy's
       idea of it. Each debt gets exactly what the sheet sends it — a payoff
       lands, a skipped payment stays skipped — on payday, before that week's
       interest, the way the sheet's own After has it. Whatever the budget
       holds beyond that (the card-minimum bucket) pays card minimums and then
       goes where the strategy points. The strategy runs everything after. */
    let pool;
    const delta=fundDelta(w);
    /* a lasting change to what goes to debt from a given week on — a cost that
       stops or shrinks. Unlike a lump it is weekly money, so it is in the total. */
    const raise=raises.reduce((t,r)=>t+(w>=r.from?n0(r.weekly):0),0);
    lastBudget=r2(budget+extra+delta+raise);weekBudget.push(lastBudget);
    /* one-time money — a sale, a refund — joins that week's pool after the
       minimums, so it goes wherever attack goes. It is not a weekly amount and
       stays out of `weekBudget`. */
    const lump=lumps.reduce((t,l)=>t+(l.w===w&&!l.cards?n0(l.amount):0),0);
    const cardLump=lumps.reduce((t,l)=>t+(l.w===w&&l.cards?n0(l.amount):0),0);
    if(sheetFirst&&w===0){
      pool=budget+extra;
      for(const d of D){const p=Math.min(n0(d.current),d.balance,pool);d.balance-=p;pool-=p}
      pool+=lump;
      for(const d of D){if(d.balance<=0.005)continue;
        const i=d.balance*d.dpr*7;d.balance+=i;d.interest+=i;totalInterest+=i}
      const live=order();
      for(const d of live){if(d.kind!=='card'||d.grace)continue;
        const p=Math.min(d.weeklyMin,d.balance,pool);d.balance-=p;pool-=p}
      for(const d of live){if(pool<=0.005)break;if(d.grace)continue;
        const p=Math.min(pool,d.balance);d.balance-=p;pool-=p}
    }else{
    /* interest first, the way a card does it */
    for(const d of D){if(d.balance<=0.005)continue;
      const i=d.balance*d.dpr*7;d.balance+=i;d.interest+=i;totalInterest+=i}
    if(strategy==='current'){
      for(const d of D){if(d.balance<=0.005)continue;
        const p=Math.min(d.current,d.balance);d.balance-=p}
      pool=0;
    }else{
      const live=order();
      pool=Math.max(0,budget+extra+delta+raise)+lump;
      /* a grace balance is cleared in full or not at all — never partially */
      for(const d of live){if(!d.grace||d.balance<=0.005)continue;
        if(pool+0.005>=d.balance){pool-=d.balance;d.balance=0}}
      for(const d of live){if(d.grace)continue;
        const p=Math.min(d.weeklyMin,d.balance,pool);d.balance-=p;pool-=p}
      for(const d of live){if(pool<=0.005)break;if(d.grace)continue;
        const p=Math.min(pool,d.balance);d.balance-=p;pool-=p}
    }
    }
    /* Money earmarked for cards goes to them in the week's order once the
       week's own payments are made; only when every card is clear does any of
       it move on to a loan. */
    if(cardLump>0.005){
      let lp=cardLump;const live=order();
      for(const d of live){if(lp<=0.005)break;if(d.kind!=='card'||d.grace)continue;
        const p=Math.min(lp,d.balance);d.balance-=p;lp-=p}
      for(const d of live){if(lp<=0.005)break;if(d.grace)continue;
        const p=Math.min(lp,d.balance);d.balance-=p;lp-=p}
    }
    w++;
    for(const d of D)if(d.balance<=0.005&&d.paidOff==null){d.balance=0;d.paidOff=w}
    series.push({w,total:r2(D.reduce((s,d)=>s+d.balance,0)),by:byDebt()});
    /* nothing moved and no step left to change that — the payment can't outrun the interest */
    if(w>260&&series[w].total>=series[w-1].total-0.005&&series[w].total>0.005
       &&ST.every(st=>firedIds.has(st.id)||st.fireWeek==null))break;
  }
  const done=D.every(d=>d.balance<=0.005);
  return{weeks:done?w:Infinity,totalInterest:r2(totalInterest),debts:D,series,fromWeek,fired,weekBudget,
    endBudget:FU.length?lastBudget:r2(budget+extra),
    debtFreeDate:done?dateAfterWeeks(fromWeek,w):null};
}

/* ═══════════════════════════════════════════════════════════════════
   Charts — hand-rolled SVG. Thin marks, recessive axes, one hover layer.
   ═══════════════════════════════════════════════════════════════════ */
const SV='http://www.w3.org/2000/svg';
function niceTicks(min,max,n=4){
  if(max===min){max=min+1}
  const span=max-min,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const norm=step0/mag,step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,out=[];
  for(let v=lo;v<=hi+step*.001;v+=step)out.push(r2(v));
  return out;
}
/* single-series line + area over time; crosshair tooltip by default */
function lineChart(el,pts,{h=210,fmt=money0,label='',accent='var(--s1)',zeroFloor=true,xTicks=7,marks=[]}={}){
  if(pts.length<2){el.innerHTML='<div class="empty">Not enough history yet.</div>';return}
  const W=el.clientWidth||760,PL=54,PR=14,PT=12,PB=26;
  const vals=pts.map(p=>p.v);
  let lo=Math.min(...vals),hi=Math.max(...vals);
  if(zeroFloor)lo=Math.min(lo,0);
  const ticks=niceTicks(lo,hi,4);
  lo=ticks[0];hi=ticks[ticks.length-1];
  const X=i=>PL+(W-PL-PR)*(i/(pts.length-1));
  const Y=v=>PT+(h-PT-PB)*(1-(v-lo)/(hi-lo||1));
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  /* No area fill. The direction spends its only fill on the accent block, and the
     gradient under the line was a second one. Colour comes from .chartline /
     .chartdot rather than an inline accent: the old --s1 and --surface tokens are
     scoped to .legacy and resolve to nothing in a converted view. */
  el.innerHTML=`<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(label)}">
    ${ticks.map(t=>`<line class="gridline" x1="${PL}" x2="${W-PR}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>
      <text class="axl" x="${PL-8}" y="${(Y(t)+3.5).toFixed(1)}" text-anchor="end">${fmt(t)}</text>`).join('')}
    <path class="chartline" d="${line}"/>
    <g class="hov" style="opacity:0"><line class="crosshair" y1="${PT}" y2="${h-PB}"/>
      <circle class="chartdot" r="4"/></g>
    ${(()=>{let lastX=-1e9,lift=0;
      /* Numbered event marks, drawn over the hover layer so the one being read
         is never hidden by it. A label within reach of the last steps up a row. */
      return marks.map(m=>{const x=X(m.i),y=Y(pts[m.i].v);
        lift=x-lastX<18?lift+1:0;lastX=x;
        return `<g class="mark" data-i="${m.i}"><circle class="markdot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"/>`
          +`<text class="marknum" x="${x.toFixed(1)}" y="${(y-9-lift*12).toFixed(1)}" text-anchor="middle">${esc(m.n)}</text></g>`}).join('')})()}
    ${pts.map((p,i)=>i%Math.ceil(pts.length/xTicks)===0||i===pts.length-1
      ?`<text class="axl" x="${X(i).toFixed(1)}" y="${h-8}" text-anchor="middle">${esc(p.x)}</text>`:'').join('')}
    <rect x="${PL}" y="${PT}" width="${W-PL-PR}" height="${h-PT-PB}" fill="transparent" class="hit"/>
  </svg><div class="tip"></div>`;
  const svg=el.querySelector('svg'),hov=el.querySelector('.hov'),tip=el.querySelector('.tip');
  const cross=hov.querySelector('line'),dot=hov.querySelector('circle');
  const move=ev=>{
    const box=svg.getBoundingClientRect(),sx=W/box.width;
    const px=(ev.clientX-box.left)*sx;
    let i=clamp(Math.round((px-PL)/((W-PL-PR)/(pts.length-1))),0,pts.length-1);
    /* an event is a single week — within reach of a mark, land on it */
    const near=marks.map(m=>m.i).sort((a,b)=>Math.abs(X(a)-px)-Math.abs(X(b)-px))[0];
    if(near!=null&&Math.abs(X(near)-px)<=10)i=near;
    const p=pts[i];hov.style.opacity=1;
    el.querySelectorAll('.mark').forEach(g=>g.classList.toggle('on',+g.dataset.i===i));
    cross.setAttribute('x1',X(i));cross.setAttribute('x2',X(i));
    dot.setAttribute('cx',X(i));dot.setAttribute('cy',Y(p.v));
    tip.className='tip on';tip.innerHTML=`<div class="tt">${esc(p.t||p.x)}</div>`+
      (p.rows||[[label||'Value',fmt(p.v)]]).map(([a,b])=>`<div class="tr"><span>${esc(a)}</span><span class="tv">${b}</span></div>`).join('');
    /* Beside the crosshair rather than over the point, on whichever side has
       room, and on the far side of the line vertically — so the point, its
       mark and the marks either side of it stay readable. */
    const tw=tip.offsetWidth,th=tip.offsetHeight,cx=X(i)/sx,cy=Y(p.v)/sx,gap=14;
    const left=cx+gap+tw<=box.width-4?cx+gap:Math.max(4,cx-gap-tw);
    const top=cy<box.height/2?Math.min(box.height-th-2,cy+gap):Math.max(2,cy-gap-th);
    tip.style.left=left+'px';tip.style.top=top+'px';
  };
  svg.addEventListener('pointermove',move);
  svg.addEventListener('pointerleave',()=>{hov.style.opacity=0;tip.className='tip';
    el.querySelectorAll('.mark.on').forEach(g=>g.classList.remove('on'))});
}
/* tiny inline trend for one account */
function sparkline(pts,{w=190,h=38,accent='var(--s1)'}={}){
  if(pts.length<2)return'';
  const vals=pts.map(p=>p.v),lo=Math.min(...vals,0),hi=Math.max(...vals,1);
  const X=i=>(w)*(i/(pts.length-1)),Y=v=>h-2-(h-6)*((v-lo)/(hi-lo||1));
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d}L${w},${h}L0,${h}Z" fill="${accent}" opacity=".14"/>
    <path d="${d}" fill="none" stroke="${accent}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(pts.length-1).toFixed(1)}" cy="${Y(pts[pts.length-1].v).toFixed(1)}" r="2.6" fill="${accent}"/></svg>`;
}

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   Views
   ═══════════════════════════════════════════════════════════════════ */
const TABS=[
  {id:'week',    label:'This Week'},
  {id:'sheet',   label:'Allocation'},
  {id:'calendar',label:'Calendar'},
  {id:'attack',  label:'Attack',     hidden:true},
  {id:'payoff',  label:'Payoff',     hidden:true},
  {id:'projections',label:'Projections'},
  {id:'plan',    label:'Plan'},
  {id:'subs',    label:'Subscriptions'},
  {id:'history', label:'History',    hidden:true},
  {id:'accounts',label:'Accounts'},
  {id:'reffing', label:'Reffing'},
];
/* Hidden views keep their code and still render if reached, but have no place
   in the nav and no key. Keys number whatever is left, in order. */
TABS.filter(t=>!t.hidden).forEach((t,i)=>t.k=String((i+1)%10));
const CONVERTED=new Set(['week','sheet','calendar','attack','payoff','projections','plan','subs','reffing']);   // grows as each view lands
/* Replacing #view.innerHTML removes whatever input is focused, and if the user
   has typed in it the browser fires `change` at it SYNCHRONOUSLY, mid-render.
   Any handler that re-renders then re-enters us halfway through and the outer
   pass never finishes -- the page ends up scrolled to the top with focus on
   <body>. Render is a whole-view rebuild; there is never a reason to run two at
   once, so refuse the nested call and let the outer pass complete. */
let RENDERING=false;
function render(){
  if(RENDERING)return;
  RENDERING=true;
  try{renderInner();saveUI()}finally{RENDERING=false}
}
function renderInner(){
  /* a copy published without seed data starts here — nothing personal ships in the page */
  if(!S.accounts.length||!weekKeys().length){renderWelcome();return}
  if((TABS.find(t=>t.id===UI.tab)||{}).hidden)UI.tab='week';   /* a remembered tab that is no longer in the nav */
  $('#nav').innerHTML=TABS.filter(t=>!t.hidden).map(t=>
    `<button data-tab="${t.id}"${UI.tab===t.id?' aria-current="page"':''}>${t.label}<span class="key">${t.k}</span></button>`).join('');
  const k=currentWeek(),C=computeWeek(k);
  if(C)$('#railstat').innerHTML=
    `<span class="wk">${weekLabel(k)}</span><br>${money0(C.totals.debtBalance)} owed`
    +`<br>${pct(C.totals.usage)} utilization`;
  if(typeof paintSync==='function')paintSync();
  const v=$('#view');
  const fn={week:viewWeek,sheet:viewAllocation,calendar:viewCalendar,attack:viewAttack,projections:viewProjections,reffing:viewReffing,payoff:viewPayoff,
            plan:viewPlan,subs:viewSubs,history:viewHistory,accounts:viewAccounts}[UI.tab]||viewWeek;
  if(CONVERTED.has(UI.tab)){
    v.className=''; fn(v);
  }else{
    /* not restyled yet: render into the old shell, scoped so the old CSS applies */
    v.className='legacy';
    v.innerHTML='<main class="main"><div class="wrap"></div></main>';
    fn(v.querySelector('.wrap'));
  }
}

/* The empty state. It threw for months: it set `#statusdot`, and the brand
   dot was removed from the rail under C9, so `$('#statusdot')` came back null
   and the whole function died BEFORE writing any HTML. Nothing rendered, and
   because the published copy is the one that ships empty, that blank page was
   the only thing a first-time visitor ever saw. Every element below is now
   addressed defensively, and the markup is the new system rather than the
   `.card`/`.head` classes that live under `.legacy` and could never apply
   here — `#view` carries no class on this path. */
function renderWelcome(){

  </header>

    <div class="mrow" style="justify-content:flex-start">

</main>`;
}
function startFresh(){

        <div class="fbar"><i class="${r.targetDone?'done':''}"
          style="width:${clamp(n0(r.targetPct)*100,1.5,100)}%"></i></div>

    <div class="legend">${tg.map(r=>{const t=r.a.target;
      return `<span class="k">${esc(r.a.name)}: ${r.targetDone
        ?`<b>funded</b>${(weeklyOf(r)||n0(t.frees))?` — ${money(weeklyOf(r)||n0(t.frees))}/wk frees up`:''}`
        :`${money(r.targetShort)} to go${t.by?` by ${dueLabel(t.by)}`:''}`}</span>`}).join('')}

/* The track is the paycheck. What is filled is what is assigned; the gap is what
   is not. When the assignment exceeds the paycheck the bar rescales to the total
   and an oxblood rule marks where the money ran out — the overrun is hatched
   past it rather than being normalised away. */
const ALLOC_SEGS=T=>[
  ['Attack',            T.attack,     'var(--fill-emphasis)'],
  ['Other debt',        T.otherDebt,  'var(--fill-strong)'],
  ['Minimums',          r2(T.minPaid+n0(T.debtBucket)-n0(T.cardMinDraw)), 'var(--fill-mid)'],
  ['Buckets & savings', T.savingsIn,  'var(--fill-faint)'],
];
function allocSegments(T){
  const span=Math.max(T.allocated,T.income);
  if(span<=0)return'';
  const parts=ALLOC_SEGS(T).filter(([,v])=>v>0)
    .map(([,v,c])=>`<span style="width:${v/span*100}%;background:${c}"></span>`).join('');
  const over=T.allocated>T.income+0.005;
  if(!over)return parts;
  const at=T.income/span*100;
  return parts
    +`<i class="overrun" style="left:${at}%;width:${(T.allocated-T.income)/span*100}%"></i>`
    +`<i class="paycheck-line" style="left:${at}%"></i>`;
}
/* Keys the ink only. The remainder — unassigned or overrun — is the tile's job. */
function allocLegend(T){
  return ALLOC_SEGS(T).filter(([,v])=>v>0)
    .map(([n,v,c])=>`<span class="k"><i class="sw" style="background:${c}"></i>${esc(n)} <b>${money(v)}</b></span>`)
    .join('');
}
function allocLabel(T){
  const parts=ALLOC_SEGS(T).filter(([,v])=>v>0).map(([n,v])=>`${n} ${money(v)}`).join(', ');
  const tail=T.unallocated<-0.005?`Over-allocated by ${money(-T.unallocated)}.`
    :Math.abs(T.unallocated)>=0.005?`Unassigned ${money(T.unallocated)}.`
    :'Fully assigned, nothing left over.';
  return `Where the paycheck goes. Paycheck ${money(T.income)}, assigned ${money(T.allocated)}. ${parts}. ${tail}`;
}
function icon(s){
  /* a red X reads as "you broke it"; an exclamation reads as "look at this" */
  const p=s==='ok'?'M4.5 8.4l2.4 2.4 4.6-5.2':'M8 4.2v4.6M8 11.5v.1';
  return`<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${p}"/></svg>`;
}
/* R11 three-level marking, applied to the check text the app already produces:
   account name and the breach figure in oxblood, every other number set apart by
   figure style, prose in ink. Derived, never retyped. */
function markCheck(html,sev){
  const lead=html.match(/<b>(.*?)<\/b>/);
  if(lead){
    let inner=lead[1];
    for(const a of S.accounts.slice().sort((x,y)=>y.name.length-x.name.length)){
      if(inner.startsWith(a.name)){
        inner=`<span class="account">${esc(a.name)}</span>`+inner.slice(a.name.length); break;
      }
    }
    html=html.slice(0,lead.index)+inner+html.slice(lead.index+lead[0].length);
  }
  html=html.replace(/\b(\d+)\s(weeks?|days?)\b/g,'<span class="fig">$1 $2</span>');
  html=html.replace(/−?\$[\d,]+(?:\.\d\d)?/g,m=>`<span class="fig">${m}</span>`);
  if(sev!=='ok'){
    const i=html.indexOf('—');
    if(i>=0)html=html.slice(0,i)+html.slice(i).replace('<span class="fig">','<span class="fig-breach">');
  }
  return html;
}
/* Attention first and always visible; everything that is fine folds away into a count. */
function checksHTML(checks){
  if(!checks.length)return'';
  const attn=checks.filter(c=>c.s!=='ok'), fine=checks.filter(c=>c.s==='ok');
  const open=UI.showOk!=null?UI.showOk:!attn.length;
  let h='';
  if(attn.length)h+=`<h2 class="sect-label" id="attn-h">Needs attention
    <span class="count">${attn.length}</span></h2>
    <ul class="attn-list">${attn.map(c=>`<li class="attn-row"><p>${markCheck(c.t,c.s)}</p></li>`).join('')}</ul>`;
  if(fine.length)h+=`<button class="ok-head" aria-expanded="${open}" aria-controls="ok-list">
      <span class="caret"><svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg></span>
      Going well <span class="count">${fine.length}</span></button>
    <ul class="ok-list" id="ok-list"${open?'':' hidden'}>${fine.map(c=>`<li>${markCheck(c.t,'ok')}</li>`).join('')}</ul>`;
  return h;
}
function usageBar(u){
  const w=clamp(u*100,0,100),c=u>0.9?'max':u>0.6?'hi':u>0.3?'mid':'';
  return`<span class="bar"><i class="${c}" style="width:${w}%"></i></span>`;
}
/* The month view is read-only on purpose: a month is five weeks of

function viewAllocationMonth(el){

  <header class="masthead sheet-masthead">

      </select><span class="caret"><svg width="9" height="9" viewBox="0 0 12 12" fill="none"
        stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.5 4.5L6 8l3.5-3.5"/></svg></span></span>

/* ── months ───────────────────────────────────────────────────────
   A week belongs to the month its Friday falls in — the week is named
   by its start everywhere else, so it is filed by its start here too.
   September 2026 has five of them; the count is shown, because a
   five-week month moves more money and the totals look wrong without it.

   Opening is the first week's balance as recorded. Closing is the last
   week's `after`, not the following week's balance, so a month reads as
   what its own weeks did rather than depending on a week outside it. */
const monthOf=k=>k.slice(0,7);
const monthKeys=()=>[...new Set(weekKeys().map(monthOf))].sort();
const MONTH_NAMES=['January','February','March','April','May','June','July',
  'August','September','October','November','December'];
const monthLabel=ym=>`${MONTH_NAMES[+ym.slice(5,7)-1]} ${ym.slice(0,4)}`;
function currentMonth(){
  const ms=monthKeys();
  if(UI.month&&ms.includes(UI.month))return UI.month;
  const m=monthOf(currentWeek());
  return ms.includes(m)?m:(ms[ms.length-1]||m);
}
function computeMonth(ym){
  const wks=weekKeys().filter(k=>monthOf(k)===ym);
  if(!wks.length)return null;
  const per=wks.map(computeWeek);
  const first=per[0],last=per[per.length-1];
  const byId={},rows=[];
  for(const r of first.rows){
    const m={a:r.a,isRollup:r.isRollup,opening:r.balance,
             assigned:0,interest:0,out:0,closing:r.after};
    byId[r.a.id]=m;rows.push(m);
  }
  for(const C of per)for(const r of C.rows){
    const m=byId[r.a.id];if(!m)continue;
    m.assigned=r2(m.assigned+n0(r.total));
    m.interest=r2(m.interest+n0(r.weekInterest));
    m.out=r2(n0(m.out)+n0(r.out));
  }
  for(const r of last.rows){
    const m=byId[r.a.id];if(!m)continue;
    m.closing=r.after;
  }
  for(const m of rows){
    m.change=r2(m.closing-m.opening);
    /* What payments and interest predict the month should have ended at.
       The gap to the real closing balance is everything the ledger did not
       assign: new charges on a card, spending out of a bucket, or a balance
       corrected against the bank. Without this column the row simply does
       not add up, and the first instinct is to distrust the arithmetic. */
    const modelled=m.a.passthrough?r2(m.opening)
      :KIND_DEBT(m.a.kind)?r2(m.opening+m.interest-m.assigned)
      :r2(m.opening+m.assigned-n0(m.out));
    m.drift=r2(m.closing-modelled);
    if(m.a.kind==='card'&&m.a.limit>0){
      m.usageOpen=m.opening/m.a.limit;
      m.usageClose=m.closing/m.a.limit;
    }
  }
  const cards=rows.filter(m=>m.a.kind==='card');
  const sumOf=f=>r2(cards.reduce((s,m)=>s+n0(m[f]),0));
  const limit=r2(cards.reduce((s,m)=>s+n0(m.a.limit),0));
  const totals={weeks:wks.length,limit,
    opening:sumOf('opening'),assigned:sumOf('assigned'),interest:sumOf('interest'),
    closing:sumOf('closing'),change:r2(sumOf('closing')-sumOf('opening')),
    drift:sumOf('drift'),
    usageOpen:limit?sumOf('opening')/limit:0,usageClose:limit?sumOf('closing')/limit:0};
  return {ym,weeks:wks,rows,byId,totals};
}
/* A debt falling is good news and a bucket filling is good news; the two
   run in opposite directions, so direction alone cannot carry the colour. */
function changeCell(m){
  const v=m.change,flat=Math.abs(v)<0.005;
  let cls='is-flat';
  if(!flat){
    if(KIND_DEBT(m.a.kind))cls=v<0?'is-good':'is-bad';
    else cls=v>0?'is-good':'is-plain';
  }
  const sign=flat?'':(v>0?'+':'−');
  return `<td class="num chg ${cls}">${flat?'—':sign+money(Math.abs(v)).replace('−','')}</td>`;
}
const MONTH_COLS=[
  {label:'Account',cell:m=>`<th scope="row" title="${esc(m.a.name)}"><span class="acct">${esc(m.a.name)}</span></th>`},
  {label:'Limit',cell:m=>`<td class="num dim">${m.a.limit?money0(m.a.limit):'—'}</td>`},
  {label:'Opening',cell:m=>`<td class="num">${money(m.opening)}</td>`},
  {label:'Usage open',cell:m=>`<td class="num dim">${m.usageOpen!=null?pct(m.usageOpen):'—'}</td>`},
  {label:'Assigned',cell:m=>`<td class="num${n0(m.assigned)?'':' dim'}">${money(m.assigned)}</td>`},
  {label:'Out',cell:m=>`<td class="num dim">${KIND_INFLOW(m.a.kind)?money(n0(m.out)):'—'}</td>`},
  {label:'Interest',cell:m=>`<td class="num dim">${KIND_DEBT(m.a.kind)?money(m.interest):'—'}</td>`},
  {label:'Charges',cell:m=>`<td class="num ${Math.abs(n0(m.drift))<0.005?'dim':(m.drift>0&&KIND_DEBT(m.a.kind)?'neg':'')}"`
    +` title="New charges, spending, or a balance corrected against the bank — whatever payments and interest do not explain">`
    +`${Math.abs(n0(m.drift))<0.005?'—':(m.drift>0?'+':'−')+money(Math.abs(m.drift)).replace('−','')}</td>`},
  {label:'Closing',cell:m=>`<td class="num">${money(m.closing)}</td>`},
  {label:'Usage close',cell:m=>`<td class="num dim">${m.usageClose!=null?pct(m.usageClose):'—'}</td>`},
  {label:'Change',cell:changeCell},
];
function monthBody(M){
  const out=[],rendered=new Set();
  for(const g of GROUPS){
    const rows=M.rows.filter(m=>(m.a.group||'buckets')===g.id);
    if(!rows.length)continue;
    out.push(`<tr class="sect"><th scope="rowgroup" colspan="${MONTH_COLS.length}"><span>${esc(g.label)}</span></th></tr>`);
    for(const m of rows){
      if(rendered.has(m.a.id))continue;
      out.push(monthRow(m,false));rendered.add(m.a.id);
      if(m.a.rollup)for(const cid of m.a.rollup){
        const c=M.byId[cid];if(!c||rendered.has(cid))continue;
        out.push(monthRow(c,true));rendered.add(cid);
      }
    }
    if(g.id==='cards'){
      const T=M.totals;
      out.push(`<tr class="tot"><th scope="row">Total</th>`
        +`<td class="num">${money0(T.limit)}</td>`
        +`<td class="num">${money(T.opening)}</td>`
        +`<td class="num">${pct(T.usageOpen)}</td>`
        +`<td class="num">${money(T.assigned)}</td>`
        +`<td></td>`
        +`<td class="num">${money(T.interest)}</td>`
        +`<td class="num">${Math.abs(T.drift)<0.005?'—':(T.drift>0?'+':'−')+money(Math.abs(T.drift)).replace('−','')}</td>`
        +`<td class="num">${money(T.closing)}</td>`
        +`<td class="num">${pct(T.usageClose)}</td>`
        +changeCell({a:{kind:'card'},change:T.change})+`</tr>`);
    }
  }
  return out.join('');
}
function monthRow(m,child){
  const cls=(m.isRollup?'rollup':'')+(child?' child':'');
  return `<tr class="${cls}">${MONTH_COLS.map(c=>c.cell(m)).join('')}</tr>`;
}

/* ── Allocation ───────────────────────────────────────────────────
   The sheet, alone on its own tab, replacing a spreadsheet where every
   line was visible at once. That is the whole brief: all 27 rows on
   screen without scrolling. It gets its own density (`.sheet-page`,
   a ~25px row step against the 36px used elsewhere) and drops the page
   furniture — no hero, no strip, no bands — so the table starts near
   the top and the viewport is spent on rows.

   Week navigation rides in the masthead because this is now where the
   week is worked; This Week keeps its own copy for reading. */
function viewAllocation(el){

  const i=ks.indexOf(k);

  const off=Math.abs(T.unallocated);
  const state=off<0.005?'is-settled':(T.unallocated>0?'is-idle':'is-over');

    </div>
    <div class="controls">
      <span class="seg">
        <button data-mode="week" aria-pressed="true">Week</button>
        <button data-mode="month" aria-pressed="false">Month</button>
      </span>

        title="${locked?'Reopen this week for editing':'Close this week to editing'}">${

      <button class="ctl" data-act="addacct">+ Account</button>
      <button class="ctl" data-act="delweek" title="Delete this week, or the weeks after it">Delete week…</button>
      <button class="ctl" data-act="undo" title="Undo last change (⌘Z)">Undo</button>
      <button class="ctl" data-go="prev" aria-label="Previous week" ${i<=0?'disabled':''}>←</button>
      <span class="jump"><select id="weekPick" aria-label="Jump to week">
        ${ks.slice().reverse().map(w=>`<option value="${w}"${w===k?' selected':''}>${weekLabel(w)}${isPlanned(w)?'  (plan)':''}</option>`).join('')}
      </select><span class="caret"><svg width="9" height="9" viewBox="0 0 12 12" fill="none"
        stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.5 4.5L6 8l3.5-3.5"/></svg></span></span>

    </div>
  </header>

  <div class="gridwrap sheet-grid"><table class="grid">
    <thead>${gridHead(cols)}</thead>

  $('#weekPick').onchange=e=>{UI.week=e.target.value;render()};
