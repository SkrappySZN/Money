<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   Payoff simulator — week by week, with the snowball rolling forward
   as each debt clears.
   ═══════════════════════════════════════════════════════════════════ */
function debtSnapshot(k){
  const C=computeWeek(k);if(!C)return[];
  return C.rows.filter(r=>KIND_DEBT(r.a.kind)&&r.balance>0.005).map(r=>({
    id:r.a.id,name:r.a.name,kind:r.a.kind,
    /* a card in grace has no effective rate — ranking it by its nominal APR would
       rank a grace card to the top of the avalanche, which is exactly the wrong move */
    apr:r.inGrace?0:n0(r.a.apr), nominalApr:n0(r.a.apr), dpr:r.inGrace?0:r.dpr,
    grace:r.inGrace, graceDue:r.a.graceDue||'',
    balance:r.balance,limit:n0(r.a.limit),
    weeklyMin:r2(n0(r.minAmt)?(statedWeekly(r.a)?n0(r.minAmt):n0(r.minAmt)/MIN_DIVISOR):0),
    current:r.total, weekInterest:r.weekInterest,
  }));
}
/* when a budget step turns on, in weeks from `fromWeek`. null = never / resolved live */
function stepFireWeek(st,fromWeek){
  const tr=st.trigger||{};
  if(tr.type==='manual')return st.on?0:null;
  if(tr.type==='date')return tr.date?Math.max(0,Math.ceil(daysBetween(fromWeek,tr.date)/7)):null;
  if(tr.type==='target'){
    const a=acct(tr.acct); if(!a||!a.target)return null;
    const r=(computeWeek(fromWeek)||{byId:{}}).byId[tr.acct];
    if(r&&r.targetDone)return 0;
    if(a.target.by)return Math.max(0,Math.ceil(daysBetween(fromWeek,a.target.by)/7));
    if(r&&r.total>0)return Math.ceil(r.targetShort/r.total);
    return null;
  }
  return null;
}
function simulate(debts,{strategy='avalanche',budget=0,fromWeek=thisWeek(),cap=5200,steps=[]}={}){
  const D=debts.map(d=>({...d,paidOff:null,interest:0}));
  if(!D.length)return{weeks:0,totalInterest:0,debts:D,series:[{w:0,total:0}],fired:[],endBudget:budget};
  const rank=Object.fromEntries((S.plan?.order||[]).map((id,i)=>[id,i]));
  const order=()=>{
    const live=D.filter(d=>d.balance>0.005);
    if(strategy==='snowball')return live.sort((a,b)=>a.balance-b.balance);
    if(strategy==='current')return live;
    if(strategy==='custom')return live.sort((a,b)=>(rank[a.id]??999)-(rank[b.id]??999)||b.apr-a.apr);
    return live.sort((a,b)=>b.apr-a.apr||b.balance-a.balance);
  };
  const ST=steps.map(st=>({...st,fireWeek:stepFireWeek(st,fromWeek)}));
  const firedIds=new Set(),fired=[];
  let w=0,totalInterest=0,extra=0;
  const series=[{w:0,total:r2(D.reduce((s,d)=>s+d.balance,0))}];
  while(D.some(d=>d.balance>0.005)&&w<cap){
    /* budget steps switch on as their trigger lands, and stay on */
    for(const st of ST){
      if(firedIds.has(st.id))continue;
      const tr=st.trigger||{};
      let go=false;
      if(tr.type==='payoff'){
        const d=D.find(x=>x.id===tr.acct);
        go=d?(d.paidOff!=null&&w>=d.paidOff):true;   // already clear → already freed
      }else go=(st.fireWeek!=null&&w>=st.fireWeek);
      if(go){firedIds.add(st.id);extra+=n0(st.weekly);fired.push({...st,week:w})}
    }
    /* interest first, the way a card does it */
    for(const d of D){if(d.balance<=0.005)continue;
      const i=d.balance*d.dpr*7;d.balance+=i;d.interest+=i;totalInterest+=i}
    let pool;
    if(strategy==='current'){
      for(const d of D){if(d.balance<=0.005)continue;
        const p=Math.min(d.current,d.balance);d.balance-=p}
      pool=0;
    }else{
      const live=order();
      pool=budget+extra;
      /* a grace balance is cleared in full or not at all — never partially */
      for(const d of live){if(!d.grace||d.balance<=0.005)continue;
        if(pool+0.005>=d.balance){pool-=d.balance;d.balance=0}}
      for(const d of live){if(d.grace)continue;
        const p=Math.min(d.weeklyMin,d.balance,pool);d.balance-=p;pool-=p}
      for(const d of live){if(pool<=0.005)break;if(d.grace)continue;
        const p=Math.min(pool,d.balance);d.balance-=p;pool-=p}
    }
    w++;
    for(const d of D)if(d.balance<=0.005&&d.paidOff==null){d.balance=0;d.paidOff=w}
    series.push({w,total:r2(D.reduce((s,d)=>s+d.balance,0))});
    /* nothing moved and no step left to change that — the payment can't outrun the interest */
    if(w>260&&series[w].total>=series[w-1].total-0.005&&series[w].total>0.005
       &&ST.every(st=>firedIds.has(st.id)||st.fireWeek==null))break;
  }
  const done=D.every(d=>d.balance<=0.005);
  return{weeks:done?w:Infinity,totalInterest:r2(totalInterest),debts:D,series,fromWeek,fired,
    endBudget:r2(budget+extra),
    debtFreeDate:done?dateAfterWeeks(fromWeek,w):null};
}

/* ═══════════════════════════════════════════════════════════════════
   Charts — hand-rolled SVG. Thin marks, recessive axes, one hover layer.
   ═══════════════════════════════════════════════════════════════════ */
const SV='http://www.w3.org/2000/svg';
function niceTicks(min,max,n=4){
  if(max===min){max=min+1}
  const span=max-min,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const norm=step0/mag,step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,out=[];
  for(let v=lo;v<=hi+step*.001;v+=step)out.push(r2(v));
  return out;
}
/* single-series line + area over time; crosshair tooltip by default */
function lineChart(el,pts,{h=210,fmt=money0,label='',accent='var(--s1)',zeroFloor=true}={}){
  if(pts.length<2){el.innerHTML='<div class="empty">Not enough history yet.</div>';return}
  const W=el.clientWidth||760,PL=54,PR=14,PT=12,PB=26;
  const vals=pts.map(p=>p.v);
  let lo=Math.min(...vals),hi=Math.max(...vals);
  if(zeroFloor)lo=Math.min(lo,0);
  const ticks=niceTicks(lo,hi,4);
  lo=ticks[0];hi=ticks[ticks.length-1];
  const X=i=>PL+(W-PL-PR)*(i/(pts.length-1));
  const Y=v=>PT+(h-PT-PB)*(1-(v-lo)/(hi-lo||1));
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  /* No area fill. The direction spends its only fill on the accent block, and the
     gradient under the line was a second one. Colour comes from .chartline /
     .chartdot rather than an inline accent: the old --s1 and --surface tokens are
     scoped to .legacy and resolve to nothing in a converted view. */
  el.innerHTML=`<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(label)}">
    ${ticks.map(t=>`<line class="gridline" x1="${PL}" x2="${W-PR}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>
      <text class="axl" x="${PL-8}" y="${(Y(t)+3.5).toFixed(1)}" text-anchor="end">${fmt(t)}</text>`).join('')}
    <path class="chartline" d="${line}"/>
    <g class="hov" style="opacity:0"><line class="crosshair" y1="${PT}" y2="${h-PB}"/>
      <circle class="chartdot" r="4"/></g>
    ${pts.map((p,i)=>i%Math.ceil(pts.length/7)===0||i===pts.length-1
      ?`<text class="axl" x="${X(i).toFixed(1)}" y="${h-8}" text-anchor="middle">${esc(p.x)}</text>`:'').join('')}
    <rect x="${PL}" y="${PT}" width="${W-PL-PR}" height="${h-PT-PB}" fill="transparent" class="hit"/>
  </svg><div class="tip"></div>`;
  const svg=el.querySelector('svg'),hov=el.querySelector('.hov'),tip=el.querySelector('.tip');
  const cross=hov.querySelector('line'),dot=hov.querySelector('circle');
  const move=ev=>{
    const box=svg.getBoundingClientRect(),sx=W/box.width;
    const px=(ev.clientX-box.left)*sx;
    const i=clamp(Math.round((px-PL)/((W-PL-PR)/(pts.length-1))),0,pts.length-1);
    const p=pts[i];hov.style.opacity=1;
    cross.setAttribute('x1',X(i));cross.setAttribute('x2',X(i));
    dot.setAttribute('cx',X(i));dot.setAttribute('cy',Y(p.v));
    tip.className='tip on';tip.innerHTML=`<div class="tt">${esc(p.t||p.x)}</div>`+
      (p.rows||[[label||'Value',fmt(p.v)]]).map(([a,b])=>`<div class="tr"><span>${esc(a)}</span><span class="tv">${b}</span></div>`).join('');
    const tw=tip.offsetWidth,left=clamp(X(i)/sx-tw/2,4,box.width-tw-4);
    tip.style.left=left+'px';tip.style.top=Math.max(2,Y(p.v)/sx-tip.offsetHeight-12)+'px';
  };
  svg.addEventListener('pointermove',move);
  svg.addEventListener('pointerleave',()=>{hov.style.opacity=0;tip.className='tip'});
}
/* tiny inline trend for one account */
function sparkline(pts,{w=190,h=38,accent='var(--s1)'}={}){
  if(pts.length<2)return'';
  const vals=pts.map(p=>p.v),lo=Math.min(...vals,0),hi=Math.max(...vals,1);
  const X=i=>(w)*(i/(pts.length-1)),Y=v=>h-2-(h-6)*((v-lo)/(hi-lo||1));
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d}L${w},${h}L0,${h}Z" fill="${accent}" opacity=".14"/>
    <path d="${d}" fill="none" stroke="${accent}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(pts.length-1).toFixed(1)}" cy="${Y(pts[pts.length-1].v).toFixed(1)}" r="2.6" fill="${accent}"/></svg>`;
}

        <div class="fnum">${money0(r.after)} / ${money0(t.amount)}</div></div>`}).join('')}
    <div class="legend">${tg.map(r=>{const t=r.a.target;
      return `<span class="k">${esc(r.a.name)}: ${r.targetDone
        ?`<b>funded</b>${t.frees?` — ${money(t.frees)}/wk frees up`:''}`
        :`${money(r.targetShort)} to go${t.by?` by ${dueLabel(t.by)}`:''}`}</span>`}).join('')}
    </div></section>`})()}

  <section class="band">
    <button class="sheet-link" data-tab="sheet">Open the allocation sheet
      <span class="sheet-link-note">every account, every column · 2</span></button>
  </section>
</main>`;

  $('#weekPick').onchange=e=>{UI.week=e.target.value;render()};
}
/* The track is the paycheck. What is filled is what is assigned; the gap is what
   is not. When the assignment exceeds the paycheck the bar rescales to the total
   and an oxblood rule marks where the money ran out — the overrun is hatched
   past it rather than being normalised away. */
const ALLOC_SEGS=T=>[
  ['Attack',            T.attack,     'var(--fill-emphasis)'],
  ['Other debt',        T.otherDebt,  'var(--fill-strong)'],
  ['Minimums',          r2(T.minPaid+n0(T.debtBucket)), 'var(--fill-mid)'],
  ['Buckets & savings', T.savingsIn,  'var(--fill-faint)'],
];
function allocSegments(T){
  const span=Math.max(T.allocated,T.income);
  if(span<=0)return'';
  const parts=ALLOC_SEGS(T).filter(([,v])=>v>0)
    .map(([,v,c])=>`<span style="width:${v/span*100}%;background:${c}"></span>`).join('');
  const over=T.allocated>T.income+0.005;
  if(!over)return parts;
  const at=T.income/span*100;
  return parts
    +`<i class="overrun" style="left:${at}%;width:${(T.allocated-T.income)/span*100}%"></i>`
    +`<i class="paycheck-line" style="left:${at}%"></i>`;
}
/* Keys the ink only. The remainder — unassigned or overrun — is the tile's job. */
function allocLegend(T){
  return ALLOC_SEGS(T).filter(([,v])=>v>0)
    .map(([n,v,c])=>`<span class="k"><i class="sw" style="background:${c}"></i>${esc(n)} <b>${money(v)}</b></span>`)
    .join('');
}
function allocLabel(T){
  const parts=ALLOC_SEGS(T).filter(([,v])=>v>0).map(([n,v])=>`${n} ${money(v)}`).join(', ');
  const tail=T.unallocated<-0.005?`Over-allocated by ${money(-T.unallocated)}.`
    :Math.abs(T.unallocated)>=0.005?`Unassigned ${money(T.unallocated)}.`
    :'Fully assigned, nothing left over.';
  return `Where the paycheck goes. Paycheck ${money(T.income)}, assigned ${money(T.allocated)}. ${parts}. ${tail}`;
}
function icon(s){
  /* a red X reads as "you broke it"; an exclamation reads as "look at this" */
  const p=s==='ok'?'M4.5 8.4l2.4 2.4 4.6-5.2':'M8 4.2v4.6M8 11.5v.1';
  return`<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${p}"/></svg>`;
}
/* R11 three-level marking, applied to the check text the app already produces:
   account name and the breach figure in oxblood, every other number set apart by
   figure style, prose in ink. Derived, never retyped. */
function markCheck(html,sev){
  const lead=html.match(/<b>(.*?)<\/b>/);
  if(lead){
    let inner=lead[1];
    for(const a of S.accounts.slice().sort((x,y)=>y.name.length-x.name.length)){
      if(inner.startsWith(a.name)){
        inner=`<span class="account">${esc(a.name)}</span>`+inner.slice(a.name.length); break;
      }
    }
    html=html.slice(0,lead.index)+inner+html.slice(lead.index+lead[0].length);
  }
  html=html.replace(/\b(\d+)\s(weeks?|days?)\b/g,'<span class="fig">$1 $2</span>');
  html=html.replace(/−?\$[\d,]+(?:\.\d\d)?/g,m=>`<span class="fig">${m}</span>`);
  if(sev!=='ok'){
    const i=html.indexOf('—');
    if(i>=0)html=html.slice(0,i)+html.slice(i).replace('<span class="fig">','<span class="fig-breach">');
  }
  return html;
}
/* Attention first and always visible; everything that is fine folds away into a count. */
function checksHTML(checks){
  if(!checks.length)return'';
  const attn=checks.filter(c=>c.s!=='ok'), fine=checks.filter(c=>c.s==='ok');
  const open=UI.showOk!=null?UI.showOk:!attn.length;
  let h='';
  if(attn.length)h+=`<h2 class="sect-label" id="attn-h">Needs attention
    <span class="count">${attn.length}</span></h2>
    <ul class="attn-list">${attn.map(c=>`<li class="attn-row"><p>${markCheck(c.t,c.s)}</p></li>`).join('')}</ul>`;
  if(fine.length)h+=`<button class="ok-head" aria-expanded="${open}" aria-controls="ok-list">
      <span class="caret"><svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg></span>
      Going well <span class="count">${fine.length}</span></button>
    <ul class="ok-list" id="ok-list"${open?'':' hidden'}>${fine.map(c=>`<li>${markCheck(c.t,'ok')}</li>`).join('')}</ul>`;

}
function usageBar(u){
  const w=clamp(u*100,0,100),c=u>0.9?'max':u>0.6?'hi':u>0.3?'mid':'';

/* The month view is read-only on purpose: a month is five weeks of

        stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

/* ── months ───────────────────────────────────────────────────────
   A week belongs to the month its Friday falls in — the week is named
   by its start everywhere else, so it is filed by its start here too.
   September 2026 has five of them; the count is shown, because a
   five-week month moves more money and the totals look wrong without it.

   Opening is the first week's balance as recorded. Closing is the last
   week's `after`, not the following week's balance, so a month reads as
   what its own weeks did rather than depending on a week outside it. */
const monthOf=k=>k.slice(0,7);
const monthKeys=()=>[...new Set(weekKeys().map(monthOf))].sort();
const MONTH_NAMES=['January','February','March','April','May','June','July',
  'August','September','October','November','December'];
const monthLabel=ym=>`${MONTH_NAMES[+ym.slice(5,7)-1]} ${ym.slice(0,4)}`;
function currentMonth(){
  const ms=monthKeys();
  if(UI.month&&ms.includes(UI.month))return UI.month;
  const m=monthOf(currentWeek());
  return ms.includes(m)?m:(ms[ms.length-1]||m);
}
function computeMonth(ym){
  const wks=weekKeys().filter(k=>monthOf(k)===ym);
  if(!wks.length)return null;
  const per=wks.map(computeWeek);
  const first=per[0],last=per[per.length-1];
  const byId={},rows=[];
  for(const r of first.rows){
    const m={a:r.a,isRollup:r.isRollup,opening:r.balance,
             assigned:0,interest:0,out:0,closing:r.after};
    byId[r.a.id]=m;rows.push(m);
  }
  for(const C of per)for(const r of C.rows){
    const m=byId[r.a.id];if(!m)continue;
    m.assigned=r2(m.assigned+n0(r.total));
    m.interest=r2(m.interest+n0(r.weekInterest));
    m.out=r2(n0(m.out)+n0(r.out));
  }
  for(const r of last.rows){
    const m=byId[r.a.id];if(!m)continue;
    m.closing=r.after;
  }
  for(const m of rows){
    m.change=r2(m.closing-m.opening);
    /* What payments and interest predict the month should have ended at.
       The gap to the real closing balance is everything the ledger did not
       assign: new charges on a card, spending out of a bucket, or a balance
       corrected against the bank. Without this column the row simply does
       not add up, and the first instinct is to distrust the arithmetic. */
    const modelled=m.a.passthrough?r2(m.opening)
      :KIND_DEBT(m.a.kind)?r2(m.opening+m.interest-m.assigned)
      :r2(m.opening+m.assigned-n0(m.out));
    m.drift=r2(m.closing-modelled);
    if(m.a.kind==='card'&&m.a.limit>0){
      m.usageOpen=m.opening/m.a.limit;
      m.usageClose=m.closing/m.a.limit;
    }
  }
  const cards=rows.filter(m=>m.a.kind==='card');
  const sumOf=f=>r2(cards.reduce((s,m)=>s+n0(m[f]),0));
  const limit=r2(cards.reduce((s,m)=>s+n0(m.a.limit),0));
  const totals={weeks:wks.length,limit,
    opening:sumOf('opening'),assigned:sumOf('assigned'),interest:sumOf('interest'),
    closing:sumOf('closing'),change:r2(sumOf('closing')-sumOf('opening')),
    drift:sumOf('drift'),
    usageOpen:limit?sumOf('opening')/limit:0,usageClose:limit?sumOf('closing')/limit:0};
  return {ym,weeks:wks,rows,byId,totals};
}
/* A debt falling is good news and a bucket filling is good news; the two
   run in opposite directions, so direction alone cannot carry the colour. */
function changeCell(m){
  const v=m.change,flat=Math.abs(v)<0.005;
  let cls='is-flat';
  if(!flat){
    if(KIND_DEBT(m.a.kind))cls=v<0?'is-good':'is-bad';
    else cls=v>0?'is-good':'is-plain';
  }
  const sign=flat?'':(v>0?'+':'−');
  return `<td class="num chg ${cls}">${flat?'—':sign+money(Math.abs(v)).replace('−','')}</td>`;
}
const MONTH_COLS=[
  {label:'Account',cell:m=>`<th scope="row" title="${esc(m.a.name)}"><span class="acct">${esc(m.a.name)}</span></th>`},
  {label:'Limit',cell:m=>`<td class="num dim">${m.a.limit?money0(m.a.limit):'—'}</td>`},
  {label:'Opening',cell:m=>`<td class="num">${money(m.opening)}</td>`},
  {label:'Usage open',cell:m=>`<td class="num dim">${m.usageOpen!=null?pct(m.usageOpen):'—'}</td>`},
  {label:'Assigned',cell:m=>`<td class="num${n0(m.assigned)?'':' dim'}">${money(m.assigned)}</td>`},
  {label:'Out',cell:m=>`<td class="num dim">${KIND_INFLOW(m.a.kind)?money(n0(m.out)):'—'}</td>`},
  {label:'Interest',cell:m=>`<td class="num dim">${KIND_DEBT(m.a.kind)?money(m.interest):'—'}</td>`},
  {label:'Charges',cell:m=>`<td class="num ${Math.abs(n0(m.drift))<0.005?'dim':(m.drift>0&&KIND_DEBT(m.a.kind)?'neg':'')}"`
    +` title="New charges, spending, or a balance corrected against the bank — whatever payments and interest do not explain">`
    +`${Math.abs(n0(m.drift))<0.005?'—':(m.drift>0?'+':'−')+money(Math.abs(m.drift)).replace('−','')}</td>`},
  {label:'Closing',cell:m=>`<td class="num">${money(m.closing)}</td>`},
  {label:'Usage close',cell:m=>`<td class="num dim">${m.usageClose!=null?pct(m.usageClose):'—'}</td>`},
  {label:'Change',cell:changeCell},
];
function monthBody(M){
  const out=[],rendered=new Set();
  for(const g of GROUPS){
    const rows=M.rows.filter(m=>(m.a.group||'buckets')===g.id);
    if(!rows.length)continue;
    out.push(`<tr class="sect"><th scope="rowgroup" colspan="${MONTH_COLS.length}"><span>${esc(g.label)}</span></th></tr>`);
    for(const m of rows){
      if(rendered.has(m.a.id))continue;
      out.push(monthRow(m,false));rendered.add(m.a.id);
      if(m.a.rollup)for(const cid of m.a.rollup){
        const c=M.byId[cid];if(!c||rendered.has(cid))continue;
        out.push(monthRow(c,true));rendered.add(cid);
      }
    }
    if(g.id==='cards'){
      const T=M.totals;
      out.push(`<tr class="tot"><th scope="row">Total</th>`
        +`<td class="num">${money0(T.limit)}</td>`
        +`<td class="num">${money(T.opening)}</td>`
        +`<td class="num">${pct(T.usageOpen)}</td>`
        +`<td class="num">${money(T.assigned)}</td>`
        +`<td></td>`
        +`<td class="num">${money(T.interest)}</td>`
        +`<td class="num">${Math.abs(T.drift)<0.005?'—':(T.drift>0?'+':'−')+money(Math.abs(T.drift)).replace('−','')}</td>`
        +`<td class="num">${money(T.closing)}</td>`
        +`<td class="num">${pct(T.usageClose)}</td>`
        +changeCell({a:{kind:'card'},change:T.change})+`</tr>`);
    }
  }
  return out.join('');
}
function monthRow(m,child){
  const cls=(m.isRollup?'rollup':'')+(child?' child':'');
  return `<tr class="${cls}">${MONTH_COLS.map(c=>c.cell(m)).join('')}</tr>`;
}

/* ── Allocation ───────────────────────────────────────────────────

   line was visible at once. That is the whole brief: all 27 rows on
   screen without scrolling. It gets its own density (`.sheet-page`,
   a ~25px row step against the 36px used elsewhere) and drops the page
   furniture — no hero, no strip, no bands — so the table starts near

      <button class="ctl" data-act="addacct">+ Account</button>

      <button class="ctl" data-act="undo" title="Undo last change (⌘Z)">Undo</button>
      <button class="ctl" data-go="prev" aria-label="Previous week" ${i<=0?'disabled':''}>←</button>
      <span class="jump"><select id="weekPick" aria-label="Jump to week">
        <option selected disabled>Jump to week</option>
        ${ks.slice().reverse().map(w=>`<option value="${w}">${weekLabel(w)}${isPlanned(w)?'  (plan)':''}</option>`).join('')}
      </select><span class="caret"><svg width="9" height="9" viewBox="0 0 12 12" fill="none"
        stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

/* ── The sheet ────────────────────────────────────────────────────
   One spec per column, driving the header and the body from the same
   list. This replaced two hand-kept branches (dense / full) that had
   already drifted apart: the body emitted `zero`/`atk`/`empty` while
   the stylesheet only ever defined `.is-zero`/`.is-attack`, so zero
   cells were never dimmed and attack money was never accented outside
   `.legacy`. One list cannot drift from itself.

   Every column shows. There was a Core/All toggle; once 6 mo and Min left
   came out and APR and Statement close went in, it separated 16 columns
   from 17, which is not a choice worth a control.

   MIN DUE is split. `minAmt` has always held the MONTHLY obligation
   while the sheet is worked weekly, so the old single Min Due column
   showed $714.30 against a $178.58 payment. Monthly stays the field
   you edit — it is what the statement says — and weekly derives from
   it through MIN_DIVISOR, the same divisor Attack and Payoff use. */
const MONEY_W='9ch';

/* `dim` marks a figure as secondary; it still holds a number. An em-dash
   holds nothing, and only that gets faded — otherwise the Limit, Min due /wk
   and Interest columns, all of which are dim AND real, fade with it. */
const dimCell=v=>`<td class="num dim${v==='—'?' is-absent':''}">${v}</td>`;
/* Monthly unless the account says otherwise — that is what a statement
   minimum is, and what every debt here uses. */
const statedWeekly=a=>a.minPeriod==='week';

function cellNum(r,f,cls=''){
  const a=r.a,id=a.id;
  if(r.isRollup||a.kind==='income')return `<td class="num dim">${money(n0(r[f]))}</td>`;
  const ro=(a.autoOther==='cardMinShortfall'&&f==='other')||isLocked(currentWeek());
  return `<td class="num"><input class="cell ${cls}${n0(r[f])===0?' is-zero':''}" data-fmt="money"`
    +` data-k="${id}:${f}" value="${moneyInput(n0(r[f]))}"`
    +`${ro?' readonly title="Auto: card minimums not paid directly"':''}></td>`;
}
function cellDate(r,f){
  const a=r.a,id=a.id;
  if(r.isRollup||a.kind==='income')return '<td></td>';
  if(!KIND_DEBT(a.kind))return dimCell('—');
  const v=r[f]||'';
  return `<td class="num dcell${v?'':' is-empty'}"><input class="cell cell-date" type="date"`
    +`${isLocked(currentWeek())?' disabled':''}`
    +` data-k="${id}:${f}" value="${v}"></td>`;
}

const SHEET_COLS=[
  /* Marking a row paid is the ritual the spreadsheet did by filling a cell
     green. The tick rides inside the account cell so it costs no column, and
     `paid` is week data — it does not roll forward into the next week. */
  {k:'name',label:'Account',head:'l',
   cell:r=>`<th scope="row" title="${esc(r.a.name)}">`
     +(r.isRollup||r.a.kind==='income'?''
       :`<input type="checkbox" class="paidbox" data-paid="${r.a.id}"${r.e&&r.e.paid?' checked':''}`
        +`${isLocked(currentWeek())?' disabled':''}`
        +` aria-label="Mark ${esc(r.a.name)} paid this week">`)
     +`<span class="acct">${esc(r.a.name)}</span></th>`},

  /* Limit and APR live on the account, not the week, so these write through
     `data-a` and change every week at once. Only debts carry them — the
     Accounts view gates the same two fields on KIND_DEBT. */
  {k:'limit',label:'Limit',
   cell:r=>KIND_DEBT(r.a.kind)
     ?`<td class="num"><input class="cell is-registry${n0(r.a.limit)===0?' is-zero':''}" data-fmt="money"`
       +` data-a="${r.a.id}:limit" value="${r.a.limit?moneyInput(n0(r.a.limit)):''}" placeholder="—"></td>`
     :dimCell('—')},
  {k:'apr',label:'APR %',
   cell:r=>KIND_DEBT(r.a.kind)
     ?`<td class="num"><input class="cell is-registry${r.a.apr?'':' is-zero'}"`
       +` data-a="${r.a.id}:aprPct" value="${r.a.apr?r2(r.a.apr*100):''}" placeholder="—"></td>`
     :dimCell('—')},
  {k:'balance',grp:true,label:'Balance',
   cell:r=>r.isRollup||r.a.kind==='income'
     ?`<td class="num dim">${money(r.balance)}</td>`
     :`<td class="num"><input class="cell" data-fmt="money" data-k="${r.a.id}:balance"`
       +`${isLocked(currentWeek())?' readonly':''} value="${moneyInput(r.balance)}"></td>`},

  /* What the balance did that the projection did not see. `+ Next week` carries
     each row forward at its projected close; the gap to what you actually type
     is new spending on a debt, or money that left a bucket without being
     recorded. It lived as a rounded tag clipped to the balance cell, where
     $11.99 read as "+12" and there was nowhere to say what it meant.

     Direction cannot be read from the sign alone: a debt above its projection
     is bad news and a bucket above its projection is good, so the colour keys
     off kind. */
  {k:'drift',label:'Unplanned',
   cell:r=>{
     if(r.drift==null||Math.abs(r.drift)<0.005)return dimCell('—');
     const up=r.drift>0;
     const cls=KIND_DEBT(r.a.kind)?(up?'is-bad':'is-good'):(up?'is-good':'is-plain');
     return `<td class="num chg ${cls}" title="Projected ${money(n0(r.e.projected))}">`
       +`${up?'+':'−'}${money(Math.abs(r.drift))}</td>`;
   }},
  {k:'usage',label:'Usage',
   cell:r=>dimCell(r.a.kind==='card'&&r.a.limit?usageBar(n0(r.usage))+pct(n0(r.usage)):'—')},

  /* The obligation, as the statement states it. Editable on every debt
     — including cards, which carried no minimum at all until now. */
  /* `minAmt` is stated monthly on most rows and weekly on a few — a statement
     minimum arrives monthly, a bucket contribution is decided per paycheck.
     One field, two periods, so the account says which and the other column is
     derived from it. The editable cell is always the one the figure is
     actually stated in; deriving in the direction you do not type avoids a
     rounding drift back and forth through MIN_DIVISOR. */
  {k:'minAmt',grp:true,label:'Min due /mo',
   cell:r=>r.isRollup||r.a.kind==='income'?'<td></td>'
     :statedWeekly(r.a)
       ?dimCell(n0(r.minAmt)?money(r2(n0(r.minAmt)*MIN_DIVISOR)):'—')
       :`<td class="num"><input class="cell${n0(r.minAmt)===0?' is-zero':''}" data-fmt="money"`
         +`${isLocked(currentWeek())?' readonly':''}`
         +` data-k="${r.a.id}:minAmt" value="${moneyInput(n0(r.minAmt))}"></td>`},

  {k:'minWk',label:'Min due /wk',
   cell:r=>r.isRollup||r.a.kind==='income'?'<td></td>'
     :statedWeekly(r.a)
       ?`<td class="num"><input class="cell${n0(r.minAmt)===0?' is-zero':''}" data-fmt="money"`
         +`${isLocked(currentWeek())?' readonly':''}`
         +` data-k="${r.a.id}:minAmt" value="${moneyInput(n0(r.minAmt))}"></td>`
       :dimCell(n0(r.minAmt)?money(r2(n0(r.minAmt)/MIN_DIVISOR)):'—')},
  {k:'close',label:'Stmt close',cell:r=>cellDate(r,'close')},
  {k:'due',   label:'Due',  cell:r=>cellDate(r,'due')},

  {k:'min',   grp:true,label:'Min',cell:r=>cellNum(r,'min')},
  {k:'attack',label:'Attack',cell:r=>cellNum(r,'attack','is-attack')},
  {k:'other', label:'Other', cell:r=>cellNum(r,'other')},
  {k:'total',label:'Total',
   cell:r=>`<td class="num">${money(r.total)}</td>`},

  /* Money leaving a bucket. Only buckets and savings have one — nothing
     "leaves" a card except a payment, which is already the Total column. */
  {k:'out',label:'Out',
   cell:r=>!KIND_INFLOW(r.a.kind)?dimCell('—')
     :r.isRollup?`<td class="num dim">${money(n0(r.out))}</td>`
     :r.a.autoOut
       ?`<td class="num dim" title="Auto: drawn down by whatever was paid to ${esc((acct(r.a.autoOut)||{}).name||r.a.autoOut)} this week">${money(n0(r.out))}</td>`
       :cellNum(r,'out')},
  {k:'interest',grp:true,label:'Interest',
   cell:r=>`<td class="num ${r.inGrace?'pos':'dim'}${KIND_DEBT(r.a.kind)?'':' is-absent'}"`
     +`${r.inGrace?' title="In grace — no interest while the statement balance is paid in full"':''}>`
     +`${KIND_DEBT(r.a.kind)?(r.inGrace?'grace':money(r.weekInterest)):'—'}</td>`},
  {k:'after',label:'After',
   cell:r=>`<td class="num ${r.a.kind==='card'&&r.after>n0(r.a.limit)?'neg':r.after<0?'neg':''}"`
     +`${r.a.passthrough?' title="Passes straight through — funded and sent onward the same week, so nothing accumulates"':''}>`
     +`${money(r.after)}</td>`},
  {k:'usageAfter',label:'Usage aft',
   cell:r=>dimCell(r.a.kind==='card'&&r.a.limit?pct(n0(r.usageAfter)):'—')},
  {k:'availAfter',label:'Avail aft',
   cell:r=>dimCell(r.a.kind==='card'&&r.a.limit?money(n0(r.availAfter)):'—')},

];
const sheetCols=()=>SHEET_COLS;

function gridHead(cols){
  return `<tr>${cols.map((c,i)=>
    `<th scope="col" class="${i?'num':''}${c.grp?' grp':''}">${c.label}</th>`).join('')}</tr>`;
}
function gridBody(C){
  const cols=sheetCols(),out=[],byId=C.byId,rendered=new Set();
  for(const g of GROUPS){
    const rows=C.rows.filter(r=>(r.a.group||'buckets')===g.id);
    if(!rows.length)continue;
    out.push(`<tr class="sect"><th scope="rowgroup" colspan="${cols.length}"><span>${esc(g.label)}</span></th></tr>`);
    for(const r of rows){
      if(rendered.has(r.a.id))continue;
      out.push(rowHTML(r,cols,false));rendered.add(r.a.id);
      if(r.a.rollup)for(const cid of r.a.rollup){
        const c=byId[cid];if(!c||rendered.has(cid))continue;
        out.push(rowHTML(c,cols,true));rendered.add(cid);
      }
    }
    if(g.id==='cards')out.push(totalRow(C,cols));
  }
  return out.join('');
}
function rowHTML(r,cols,child){
  const cls=(r.isRollup?'rollup':'')+(child?' child':'')+(r.e&&r.e.paid?' is-paid':'');
  return `<tr class="${cls}">${cols.map(c=>markGroup(c.cell(r),c)).join('')}</tr>`;
}
/* The column spec says where a subject starts; the cell renderers do not need
   to know about it, so the class is added to whatever they returned. */
const markGroup=(html,c)=>c.grp?html.replace(/^<t([dh])( class="([^"]*)")?/,
  (m,tag,_a,cls)=>`<t${tag} class="${cls||''} grp"`):html;
/* The cards subtotal, keyed by column so it cannot fall out of step with
   the header the way a hand-counted run of <td>s does. */
function totalRow(C,cols){
  const T=C.totals;
  const cell={
    name:'<th scope="row">Total</th>',
    limit:`<td class="num">${money0(T.limit)}</td>`,
    balance:`<td class="num">${money(T.cardBalance)}</td>`,
    drift:'<td></td>',
    usage:`<td class="num">${pct(T.usage)}</td>`,
    minAmt:`<td class="num">${money(sum(C,'minAmt','card'))}</td>`,
    minWk:`<td class="num">${money(r2(sum(C,'minAmt','card')/MIN_DIVISOR))}</td>`,   /* cards are all monthly */
    min:`<td class="num">${money(sum(C,'min','card'))}</td>`,
    attack:`<td class="num">${money(sum(C,'attack','card'))}</td>`,
    other:`<td class="num">${money(sum(C,'other','card'))}</td>`,
    total:`<td class="num">${money(sum(C,'total','card'))}</td>`,
    out:'<td></td>',
    interest:`<td class="num">${money(sum(C,'weekInterest','card'))}</td>`,
    after:`<td class="num">${money(T.cardAfter)}</td>`,
    usageAfter:`<td class="num">${pct(T.usageAfter)}</td>`,
    availAfter:`<td class="num">${money(T.availAfter)}</td>`,
  };
  return `<tr class="tot">${cols.map(c=>markGroup(cell[c.k]||'<td></td>',c)).join('')}</tr>`;
}
const sum=(C,f,kind)=>r2(C.rows.filter(r=>r.a.kind===kind).reduce((s,r)=>s+n0(r[f]),0));
</script>
<script>
"use strict";
const STRATS=[{id:'avalanche',l:'Avalanche'},{id:'snowball',l:'Snowball'},{id:'custom',l:'My order'}];
/* One segmented control for Attack and Payoff. The new CSS keys on aria-pressed
   (which is what a toggle should expose anyway); `on` is only there for the old
   stylesheet still serving Payoff under .legacy, and goes when .legacy does. */
const stratSeg=cur=>`<div class="seg">${STRATS.map(x=>
  `<button data-strat="${x.id}" class="${cur===x.id?'on':''}" aria-pressed="${cur===x.id}">${x.l}</button>`).join('')}</div>`;
const planSteps=()=>(S.plan&&S.plan.steps)||[];
/* the budget the plan actually reaches once every step has fired */
function simOpts(k,budget,strategy){return{strategy,budget,fromWeek:k,steps:planSteps()}}

/* ── Attack ───────────────────────────────────────────────────────── */
function viewAttack(el){
  const k=currentWeek(),C=computeWeek(k),T=C.totals;
  const all=debtSnapshot(k);
  if(!all.length){el.innerHTML=`<main class="page">
    <header class="masthead"><div><h1 class="page-title">Attack</h1></div></header>
    <p class="lede">No balances to attack. That is the whole point.</p></main>`;return}
  const grace=all.filter(d=>d.grace), debts=all.filter(d=>!d.grace);
  const strat=UI.strategy;
  const budget=Math.max(n0(T.debtFunded),all.reduce((s,d)=>s+d.weeklyMin,0));
  const rank=Object.fromEntries((S.plan.order||[]).map((id,i)=>[id,i]));
  const ranked=[...debts].sort((a,b)=>
    strat==='snowball'?a.balance-b.balance
    :strat==='custom'?((rank[a.id]??999)-(rank[b.id]??999))
    :(b.apr-a.apr||b.balance-a.balance));
  const top=ranked[0];

  const av =simulate(all,simOpts(k,budget,'avalanche'));
  const sn =simulate(all,simOpts(k,budget,'snowball'));
  const cus=simulate(all,simOpts(k,budget,'custom'));
  const cur=simulate(all,simOpts(k,budget,'current'));
  const chosen={avalanche:av,snowball:sn,custom:cus}[strat];
  const saving=r2(cur.totalInterest-chosen.totalInterest);
  const vsAv=r2(chosen.totalInterest-av.totalInterest);

  const attackRows=C.rows.filter(r=>KIND_DEBT(r.a.kind)&&r.attack>0);
  const onTarget=attackRows.length===1&&attackRows[0].a.id===top.id;
  const why={
    avalanche:`Highest rate in the stack at <b>${pct(top.nominalApr,2)}</b>, costing <b>${money(top.weekInterest)}</b> in interest every week it sits there. Every dollar here is worth more than a dollar anywhere else.`,
    snowball:`Smallest balance at <b>${money(top.balance)}</b>. Clearing it frees its ${money(top.weeklyMin)}/wk minimum for the next one.`,
    custom:`First in your order. ${top.limit&&top.kind==='card'?`A card at <b>${pct(top.balance/top.limit,0)}</b> utilization — clearing it moves the number FICO actually scores, which rate-sorting can't see.`:`Ahead of the rate ranking by your own call.`}`,
  }[strat];

  /* Same shape checksHTML takes on This Week, so the three-level marking, the
     oxblood margin rule and the collapsed "going well" list are the one
     implementation rather than a second set that drifts. */
  const notes=[];
  for(const g of grace)notes.push({s:'warn',t:`<b>${esc(g.name)} is in grace — do not attack it.</b> ${money(g.balance)} due in full by ${g.graceDue?dueLabel(g.graceDue):'the due date'}. It costs ${money(0)} to carry, but a partial payment ends grace and ${pct(g.nominalApr,2)} applies to the whole balance.`});
  if(T.attack<=0)notes.push({s:'warn',t:`No attack money assigned this week. Minimums alone leave <b>${money(T.weekInterest)}</b> of interest on the table over the next 7 days.`});
  else if(onTarget)notes.push({s:'ok',t:`This week's <b>${money(T.attack)}</b> is already going to ${esc(top.name)}.`});
  else notes.push({s:'warn',t:`This week's attack is on <b>${attackRows.map(r=>esc(r.a.name)).join(', ')||'nothing'}</b>. ${esc(top.name)} is what your ${strat==='custom'?'order':strat} says.`});
  /* Attack ranks by whichever strategy is selected; Plan always shows the
     order you set. When those disagree the two tabs tell you to pay different
     accounts and neither mentions the other, which is how you end up putting
     money somewhere your own plan did not ask for. */
  if(strat!=='custom'&&(S.plan.order||[]).length){
    const mine=[...debts].sort((a,b)=>(rank[a.id]??999)-(rank[b.id]??999))[0];
    if(mine&&mine.id!==top.id)
      notes.push({s:'warn',t:`<b>This is the ${strat} ranking, not your order.</b> `
        +`Your order on the Plan tab leads with ${esc(mine.name)}; ${strat} leads with `
        +`${esc(top.name)} because it sorts by ${strat==='snowball'?'balance':'rate'} alone. `
        +`Switch to <b>My order</b> above to see the one you decided on.`});
  }
  if(strat==='custom'&&cus.weeks!==Infinity&&av.weeks!==Infinity)
    /* Severity keys on DIRECTION, not magnitude. Beating avalanche by $279 is not a
       thing that needs attention, and R9 keeps oxblood for what is actually wrong.
       Only your order costing meaningfully MORE is worth flagging. */
    notes.push({s:vsAv>50?'warn':'ok',t:`Your order costs <b>${vsAv>0?money0(vsAv)+' more':money0(-vsAv)+' less'}</b> in interest than pure avalanche and finishes <b>${monthsLabel(Math.abs(weeksToMonths(cus.weeks)-weeksToMonths(av.weeks)))}</b> ${cus.weeks>av.weeks?'later':'earlier'}${Math.abs(vsAv)<50?' — close enough that the utilization argument wins':''}.`});
  if(cur.weeks===Infinity&&chosen.weeks!==Infinity)
    notes.push({s:'ok',t:`Repeating this week's split forever never clears the balance — the interest outruns it. The same <b>${money(budget)}/wk</b>${chosen.endBudget>budget?`, rising to <b>${money(chosen.endBudget)}</b> as your steps land,`:''} clears everything by <b>${longDate(chosen.debtFreeDate)}</b>.`});
  else if(saving>1)
    notes.push({s:'ok',t:`Following this order pays off <b>${monthsLabel(weeksToMonths(cur.weeks)-weeksToMonths(chosen.weeks))} sooner</b> than repeating this week's split, and saves <b>${money0(saving)}</b> in interest.`});

  const bleed=debts.reduce((s,d)=>s+d.weekInterest,0);
  const rows=[['Avalanche — highest rate first',av],['Snowball — smallest balance first',sn],['Your order',cus],['Repeat this week’s split',cur]];
  const fin=rows.filter(r=>r[1].weeks!==Infinity).map(r=>r[1].weeks);
  const mx=Math.max(...(fin.length?fin:[520]));
  const best=Math.min(...rows.filter(r=>r[1].weeks!==Infinity).map(r=>r[1].totalInterest));

  el.innerHTML=`<main class="page">
  <header class="masthead">
    <div><h1 class="page-title">Attack</h1>
      <div class="dateline">${weekLabel(k)} · ${money(T.attack)} of attack money on the table</div></div>
    <div class="controls">${stratSeg(strat)}</div>
  </header>

  <div class="hero-row">
    <div class="hero-label">This week, put it here</div>
    <div class="hero-figure">${esc(top.name)}</div>
  </div>
  <p class="lede">${why}</p>

  <section class="band" aria-labelledby="attn-h">${checksHTML(notes)}</section>

  <section class="band" aria-labelledby="stack-h">
    <h2 class="sect-label" id="stack-h">The stack, ${strat==='avalanche'?'by what it costs you':strat==='snowball'?'by what clears first':'in your order'}</h2>
    <ul class="rank">
      ${ranked.map((d,i)=>`
      <li class="${i===0?'lead':''}">
        <span class="n">${i+1}</span>
        <span><span class="nm">${esc(d.name)}</span>
          <div class="meta">${money(d.balance)}${d.kind==='card'&&d.limit?` of ${money0(d.limit)} · ${pct(d.balance/d.limit,0)} used`:''} · ${pct(d.nominalApr,2)} APR${d.weeklyMin?` · ${money(d.weeklyMin)}/wk minimum`:''}</div></span>
        <span class="rt"><div class="rv">${money(d.weekInterest)}</div><div class="rl">interest / week</div></span>
      </li>`).join('')}
      ${grace.map(d=>`
      <li class="pif">
        <span class="n">PIF</span>
        <span><span class="nm">${esc(d.name)}</span>
          <div class="meta">${money(d.balance)} due in full by ${d.graceDue?dueLabel(d.graceDue):'the due date'} · ${pct(d.nominalApr,2)} APR if grace breaks</div></span>
        <span class="rt"><div class="rv">${money(0)}</div><div class="rl">interest / week</div></span>
      </li>`).join('')}
    </ul>
    <div class="legend"><span class="k">Total bleed <b>${money(bleed)}</b> per week · <b>${money(bleed*52/12)}</b> per month</span></div>
  </section>

  <section class="band" aria-labelledby="four-h">
    <h2 class="sect-label" id="four-h">Same ${money(budget)} a week, four ways</h2>
    <div class="tl">
      ${rows.map(([nm,r])=>`<div class="tlr${r.weeks!==Infinity&&r.totalInterest===best?' lead':''}">
        <div class="tln">${nm}</div>
        <div class="tlbar"><i class="${r.weeks===Infinity?'never':''}" style="width:${clamp((r.weeks===Infinity?mx:r.weeks)/mx*100,2,100)}%"></i></div>
        <div class="tlv">${r.weeks===Infinity?'never':monthsLabel(weeksToMonths(r.weeks))}</div></div>`).join('')}
    </div>
    <div class="legend">
      <span class="k">Avalanche <b>${money0(av.totalInterest)}</b></span>
      <span class="k">Snowball <b>${money0(sn.totalInterest)}</b></span>
      <span class="k">Your order <b>${money0(cus.totalInterest)}</b></span>
      <span class="k">This week's split <b>${cur.weeks===Infinity?'never clears':money0(cur.totalInterest)}</b></span>
    </div>
  </section>
  </main>`;
}

function viewPayoff(el){
  const k=currentWeek(),C=computeWeek(k),T=C.totals;
  const debts=debtSnapshot(k);
  if(!debts.length){el.innerHTML=`<main class="page">
    <header class="masthead"><div><h1 class="page-title">Payoff</h1></div></header>
    <p class="lede">Nothing left to pay off.</p></main>`;return}
  const floor=r2(debts.reduce((s,d)=>s+d.weeklyMin,0));
  if(UI.extra==null)UI.extra=Math.max(n0(T.debtFunded),floor);
  const budget=Math.max(0,n0(UI.extra));
  const strat=UI.strategy;
  const sim=simulate(debts,simOpts(k,budget,strat));
  const av =simulate(debts,simOpts(k,budget,'avalanche'));
  const sn =simulate(debts,simOpts(k,budget,'snowball'));
  const cus=simulate(debts,simOpts(k,budget,'custom'));
  const flat=simulate(debts,{strategy:strat,budget,fromWeek:k,steps:[]});
  const maxW=Math.max(...sim.debts.map(d=>d.paidOff||(sim.weeks===Infinity?520:sim.weeks)),1);
  const steps=planSteps().map(st=>({...st,fireWeek:stepFireWeek(st,k),
    fired:sim.fired.find(f=>f.id===st.id)}));
  const bleed=r2(debts.reduce((s,d)=>s+d.weekInterest,0));
  const saved=(flat.weeks===Infinity||sim.weeks===Infinity)
    ?(flat.weeks===Infinity&&sim.weeks!==Infinity?'clears it':'—')
    :monthsLabel(weeksToMonths(flat.weeks)-weeksToMonths(sim.weeks));
  const clears=[...sim.debts].sort((a,b)=>(a.paidOff||1e9)-(b.paidOff||1e9));
  const cmp=[['Avalanche','avalanche',av],['Snowball','snowball',sn],['Your order','custom',cus]];
  const cheapest=Math.min(...cmp.filter(r=>r[2].weeks!==Infinity).map(r=>r[2].totalInterest));

  el.innerHTML=`<main class="page">
  <header class="masthead">
    <div><h1 class="page-title">Payoff</h1>
      <div class="dateline">From ${weekLabel(k)} · ${money(T.debtBalance)} across ${debts.length} account${debts.length>1?'s':''}</div></div>
    <div class="controls">${stratSeg(strat)}</div>
  </header>

  <div class="hero-row">
    <div class="hero-label">Debt free</div>
    <div class="hero-figure">${sim.weeks===Infinity?'Never':longDate(sim.debtFreeDate)}</div>
    <div class="hero-note">${sim.weeks===Infinity
      ?`${money(budget)}/wk can't outrun ${money(bleed)}/wk of interest`
      :monthsLabel(weeksToMonths(sim.weeks))+' from now'}</div>
  </div>

  <div class="strip">
    <div class="metric"><div class="m-label">Weekly debt budget</div>
      <span class="m-value"><span class="mark">$</span><input class="cell inline" id="budget"
        style="${figureWidth(budget.toFixed(2))}"
        value="${budget.toFixed(2)}" aria-label="Weekly debt budget"></span>
      <div class="m-note">${money(floor)} of that is minimums${sim.endBudget>budget?` · rises to ${money(sim.endBudget)}`:''}</div></div>
    <div class="metric"><div class="m-label">Interest you'll pay</div>
      <span class="m-value">${sim.weeks===Infinity?'∞':money0(sim.totalInterest)}</span>
      <div class="m-note">on ${money0(T.debtBalance)} of principal</div></div>
    <div class="metric"><div class="m-label">What the steps buy you</div>
      <span class="m-value ${sim.endBudget>budget?'is-settled':''}">${saved}</span>
      <div class="m-note">${flat.weeks===Infinity&&sim.weeks!==Infinity
        ?`a flat ${money(budget)}/wk never finishes`
        :`against holding ${money(budget)}/wk flat`}</div></div>
  </div>

  <section class="band" aria-labelledby="chart-h">
    <h2 class="sect-label" id="chart-h">Balance from here</h2>
    <div class="chart" id="payChart"></div>
  </section>

  <section class="band" aria-labelledby="steps-h">
    <h2 class="sect-label" id="steps-h">Attack steps up as these land</h2>
    <p class="lede muted">Each one permanently frees a weekly line, and the date above already
      assumes them. The ones with a trigger fire on their own; a manual step only counts
      once you tick it.</p>
    <ul class="rank">
      ${steps.map(st=>`<li class="${st.fired?'lead':''}">
        <span class="n"><input type="checkbox" data-step="${st.id}"
          ${st.on||st.trigger.type!=='manual'?'checked':''}
          ${st.trigger.type!=='manual'?'disabled title="Fires on its trigger"':''}
          aria-label="${esc(st.label)}"></span>
        <span><span class="nm">${esc(st.label)}</span>
          <div class="meta">${esc(st.note||'')}${st.fired?` · lands ${longDate(addWeeks(k,st.fired.week))}`:st.trigger.type==='manual'?' · not done yet':' · trigger not reached'}</div></span>
        <span class="rt"><div class="rv">+${money(n0(st.weekly))}</div><div class="rl">per week</div></span>
      </li>`).join('')}
    </ul>
  </section>

  <section class="band" aria-labelledby="clears-h">
    <h2 class="sect-label" id="clears-h">What clears when</h2>
    <div class="tl">
      ${clears.map((d,i)=>`<div class="tlr${i===0?' lead':''}">
        <div class="tln" title="${esc(d.name)}">${esc(d.name)}</div>
        <div class="tlbar"><i class="${d.paidOff==null?'never':''}" style="width:${clamp((d.paidOff||maxW)/maxW*100,2,100)}%"></i></div>
        <div class="tlv">${d.paidOff==null?'never':longDate(addWeeks(k,d.paidOff))}</div></div>`).join('')}
    </div>
    <div class="legend"><span class="k">Interest paid per account</span>
      ${[...sim.debts].sort((a,b)=>b.interest-a.interest).slice(0,4).map(d=>
        `<span class="k">${esc(d.name)} <b>${money0(d.interest)}</b></span>`).join('')}</div>
  </section>

  <section class="band" aria-labelledby="cmp-h">
    <h2 class="sect-label" id="cmp-h">Three orders at ${money(budget)} a week</h2>
    <table class="cmp">
      <thead><tr><th>Order</th><th>Debt free</th><th>Months</th><th>Total interest</th></tr></thead>
      <tbody>${cmp.map(([nm,id,r])=>`<tr class="${id===strat?'lead':''}">
        <td>${nm}${r.weeks!==Infinity&&r.totalInterest===cheapest?' <span class="cheapest">cheapest</span>':''}</td>
        <td>${r.weeks===Infinity?'never':longDate(r.debtFreeDate)}</td>
        <td>${r.weeks===Infinity?'—':Math.round(weeksToMonths(r.weeks))}</td>
        <td>${r.weeks===Infinity?'—':money0(r.totalInterest)}</td></tr>`).join('')}</tbody>
    </table>
    <p class="lede muted">Your order is <b>${cus.weeks===Infinity||av.weeks===Infinity?'—':money0(Math.abs(cus.totalInterest-av.totalInterest))}</b>
      ${cus.totalInterest>av.totalInterest?'more':'less'} interest than avalanche — reorder it on the Plan tab.</p>
  </section>
  </main>`;

  const pts=sim.series.filter((_,i)=>i%Math.max(1,Math.ceil(sim.series.length/80))===0||i===sim.series.length-1)
    .map(p=>({x:shortMY(addWeeks(k,p.w)),t:longDate(addWeeks(k,p.w)),v:p.total,
      rows:[['Remaining',money0(p.total)],['From now',monthsLabel(weeksToMonths(p.w))]]}));
  requestAnimationFrame(()=>{const c=$('#payChart');if(c)lineChart(c,pts,{h:220,label:'Remaining balance'})});
  const b=$('#budget');
  if(b)b.onchange=e=>{UI.extra=n0(e.target.value);render()};
}

<script>
"use strict";
/* ── Plan ─────────────────────────────────────────────────────────── */
function viewPlan(el){
  const k=currentWeek(),C=computeWeek(k);
  const P=S.plan;
  const today=thisWeek(),weekEnd=addDays(k,7);
  const cal=[...P.calendar].sort((a,b)=>a.d.localeCompare(b.d));
  const overdue=cal.filter(c=>!c.done&&c.d<today);
  const soon=cal.filter(c=>!c.done&&c.d>=today&&c.d<addDays(today,28));
  const later=cal.filter(c=>!c.done&&c.d>=addDays(today,28));
  const done=cal.filter(c=>c.done);
  const openLeft=P.open.filter(o=>!o.done),openDone=P.open.filter(o=>o.done);

  const subs=[...(P.subs||[])].sort((a,b)=>n0(a.day)-n0(b.day));
  const subsNow=subsMonthly(today);
  /* the next four pay weeks, so the clustering is visible rather than implied */
  const subWeeks=[0,1,2,3].map(i=>{const wk=addWeeks(k,i),h=subsInWeek(wk);
    return {wk,hits:h,total:r2(h.reduce((t,x)=>t+x.amount,0))}});

  const debts=debtSnapshot(k);
  const byId=Object.fromEntries(debts.map(d=>[d.id,d]));
  const ordered=(P.order||[]).filter(id=>acct(id));
  const missing=debts.filter(d=>!ordered.includes(d.id)&&!d.grace);

  const calRow=c=>`<div class="acct" style="grid-template-columns:22px 92px 1fr;align-items:start">
    <div><input type="checkbox" data-cal="${c.id}" ${c.done?'checked':''}
      style="accent-color:var(--accent);width:15px;height:15px;margin-top:3px"></div>
    <div class="num ${!c.done&&c.d<today?'neg':'dim'}" style="text-align:left;font-size:var(--t-xs);padding-top:2px">${dueLabel(c.d)}</div>
    <div style="${c.done?'opacity:.45;text-decoration:line-through':''}">
      <div style="font-weight:600">${esc(c.t)}</div>
      ${c.n?`<div class="meta" style="color:var(--muted);font-size:var(--t-xs);line-height:1.45">${esc(c.n)}</div>`:''}</div></div>`;

  el.innerHTML=`
  <div class="head"><div><h1>Plan</h1>
    <div class="sub">${esc(P.source||'')}</div></div>
    <div class="spacer"></div>
    <div style="display:flex;gap:8px">
      <button class="btn sm" data-act="addcal">+ Date</button>
      <button class="btn sm" data-act="addopen">+ Open item</button>
    </div>
  </div>

  ${overdue.length||soon.filter(c=>c.d<weekEnd).length?`
  <div class="card">
    <div class="cap">Needs you now</div>
    <div class="checks">
      ${overdue.map(c=>`<div class="chk bad">${icon('bad')}<div><b>${dueLabel(c.d)} — ${esc(c.t)}</b>${c.n?` · ${esc(c.n)}`:''} <span style="color:var(--muted)">(${Math.abs(daysBetween(c.d,today))} days ago)</span></div></div>`).join('')}
      ${soon.filter(c=>c.d<weekEnd).map(c=>`<div class="chk warn">${icon('warn')}<div><b>${dueLabel(c.d)} — ${esc(c.t)}</b>${c.n?` · ${esc(c.n)}`:''}</div></div>`).join('')}
    </div>
  </div>`:''}

  ${subs.length?`<div class="card">
    <div class="cap">Subscriptions · ${money(subsNow)}/month</div>
    <p class="sub" style="margin:8px 0 14px;max-width:72ch">Every recurring charge and the day it bills.
      They bill to ${esc((acct(subs[0].card)||{}).name||'a card')}, and the Subscriptions bucket is what clears it —
      ${(()=>{const b=C.rows.find(r=>r.a.id==='subscriptions');
        if(!b)return 'no bucket is funding them';
        const per=r2(n0(b.minAmt)*MIN_DIVISOR),gap=r2(per-subsNow);
        return `it puts in ${money(n0(b.minAmt))}/week, ${money(per)} a month, `
          +(Math.abs(gap)<0.005?'exactly what they cost'
            :gap>0?`<b>${money(gap)} more</b> than they cost`
                  :`<b>${money(-gap)} less</b> than they cost`)})()}.</p>
    <div class="rank">
      ${subs.map(x=>{const amtNow=subAmountOn(x,today);
        return `<li><span class="n">${n0(x.day)}</span>
        <span><span class="nm">${esc(x.name)}</span>
          <div class="meta">bills on the ${ordinal(n0(x.day))}${x.to
            ? ` · ${money(n0(x.amt))} → <b>${money(n0(x.to.amt))}</b> from ${dueLabel(x.to.from)}`:''}</div></span>
        <span class="rt"><div class="rv">${money(amtNow)}</div><div class="rl">per month</div></span></li>`}).join('')}
    </div>
    <div class="cap" style="margin-top:var(--sp-5)">What lands, by pay week</div>
    <div class="rank">
      ${subWeeks.map(w=>`<li><span class="n"></span>
        <span><span class="nm">${weekLabel(w.wk)}</span>
          <div class="meta">${w.hits.length?w.hits.map(h=>`${esc(h.name)} ${money(h.amount)}`).join(' · '):'nothing bills'}</div></span>
        <span class="rt"><div class="rv">${w.total?money(w.total):'—'}</div><div class="rl">${w.hits.length?`${w.hits.length} charge${w.hits.length===1?'':'s'}`:''}</div></span></li>`).join('')}
    </div>
  </div>`:''}

  <div class="card">
    <div class="cap">Payoff order</div>
    <p class="sub" style="margin:8px 0 14px;max-width:72ch">What the <b>My order</b> strategy follows on the Attack and Payoff tabs.
      Rate-sorting can't see utilization or a freed minimum — this can.</p>
    <div class="rank">
      ${ordered.map((id,i)=>{const a=acct(id),d=byId[id];
        return`<div class="rrow" style="${d?'':'opacity:.45'}">
        <div class="n">${i+1}</div>
        <div><div class="nm">${esc(a.name)}${d?'':' <span class="tag">clear</span>'}</div>
          <div class="meta">${d?`${money(d.balance)}${d.kind==='card'&&d.limit?` · ${pct(d.balance/d.limit,0)} used`:''} · ${pct(d.nominalApr,2)} APR · ${money(d.weekInterest)}/wk`:'nothing owed'}</div></div>
        <div class="rt" style="display:flex;gap:4px">
          <button class="btn sm ghost" data-porder="${id}:-1" ${i===0?'disabled':''}>↑</button>
          <button class="btn sm ghost" data-porder="${id}:1" ${i===ordered.length-1?'disabled':''}>↓</button></div>
      </div>`}).join('')}
      ${missing.map(d=>`<div class="rrow" style="opacity:.6">
        <div class="n">—</div>
        <div><div class="nm">${esc(d.name)}</div><div class="meta">not in the order — falls to the end</div></div>
        <div class="rt"><button class="btn sm" data-porderadd="${d.id}">Add</button></div></div>`).join('')}
    </div>
  </div>

  <div class="card" style="padding:var(--sp-4)">
    <div class="cap" style="margin-bottom:10px">Open items · ${openLeft.length} left</div>
    ${openLeft.map(o=>`<div class="acct" style="grid-template-columns:22px 1fr;align-items:start">
      <div><input type="checkbox" data-open="${o.id}" style="accent-color:var(--accent);width:15px;height:15px;margin-top:3px"></div>
      <div><div style="font-weight:600">${esc(o.t)}</div>
        ${o.n?`<div style="color:var(--muted);font-size:var(--t-xs);line-height:1.5">${esc(o.n)}</div>`:''}</div></div>`).join('')
      ||'<div class="empty">Nothing open.</div>'}
    ${openDone.length?`<div class="cap" style="margin:16px 0 8px">Done</div>`+openDone.map(o=>
      `<div class="acct" style="grid-template-columns:22px 1fr;opacity:.45">
       <div><input type="checkbox" data-open="${o.id}" checked style="accent-color:var(--accent);width:15px;height:15px"></div>
       <div style="text-decoration:line-through">${esc(o.t)}</div></div>`).join(''):''}
  </div>

  ${P.ref&&P.ref.show?`
  <div class="card" style="padding:var(--sp-4)">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div class="cap">Handoff snapshot · ${dueLabel(P.ref.asOf)}</div><div class="spacer"></div>
      <button class="btn sm ghost" data-act="hideref">Hide</button>
    </div>
    <p class="sub" style="margin:0 0 12px;max-width:72ch">Reference only — <b>the weekly sheet is the source of truth</b>.
      Kept so you can eyeball the two. Rows that differ are usually the sheet being ahead of the doc.</p>
    <div style="overflow-x:auto"><table class="hist" style="min-width:520px">
      <thead><tr><th>Account</th><th class="num">Sheet ${weekLabel(k)}</th><th class="num">Handoff</th><th class="num">Δ</th></tr></thead>
      <tbody>${Object.entries(P.ref.rows).map(([id,v])=>{
        const a=acct(id); if(!a)return'';
        const r=C.byId[id]; if(!r)return'';
        const d=r2(v-r.balance);
        return`<tr><td>${esc(a.name)}</td><td class="num">${money(r.balance)}</td>
          <td class="num dim">${money(v)}</td>
          <td class="num ${Math.abs(d)<0.5?'dim':d>0?'neg':'pos'}">${Math.abs(d)<0.5?'—':(d>0?'+':'')+money(d)}</td></tr>`}).join('')}</tbody>
    </table></div>
    ${(P.minsToVerify||[]).length?`<div class="checks">${P.minsToVerify.map(m=>{
      const a=acct(m.acct);if(!a)return'';
      return`<div class="chk warn">${icon('warn')}<div><b>${esc(a.name)} minimum is an estimate</b> — ${money(m.est)} ${esc(m.n)}. Real number lands when the statement closes ${dueLabel(m.when)}.</div></div>`}).join('')}</div>`:''}
  </div>`:''}

  <div class="card" style="padding:var(--sp-4)">
    <div class="cap" style="margin-bottom:10px">Calendar</div>
    ${soon.length?`<div class="cap" style="margin:4px 0 6px;color:var(--warn)">Next four weeks</div>`+soon.map(calRow).join(''):''}
    ${later.length?`<div class="cap" style="margin:16px 0 6px">After that</div>`+later.map(calRow).join(''):''}
    ${done.length?`<div class="cap" style="margin:16px 0 6px">Done</div>`+done.map(calRow).join(''):''}
    ${cal.length?'':'<div class="empty">Nothing on the calendar.</div>'}
  </div>`;
}

/* ── History ──────────────────────────────────────────────────────── */
const METRICS={
  debt:  {l:'Total debt',      f:T=>T.debtBalance,      fmt:money0},
  cards: {l:'Card balance',    f:T=>T.cardBalance,      fmt:money0},
  util:  {l:'Utilization',     f:T=>T.usage,            fmt:v=>pct(v,0)},
  paid:  {l:'Paid to debt',    f:T=>T.debtPaid,         fmt:money0},
  attack:{l:'Attack',          f:T=>T.attack,           fmt:money0},
  income:{l:'Paycheck',        f:T=>T.income,           fmt:money0},
};
function viewHistory(el){
  const ks=weekKeys();
  const M=METRICS[UI.histMetric]||METRICS.debt;
  const series=ks.map(k=>{const C=computeWeek(k);return{k,C,T:C.totals}});
  const shown=UI.histRange==='ytd'?series.filter(s=>s.k>=`${new Date().getFullYear()}-01-01`)
    :UI.histRange==='13'?series.slice(-13):series;

  const first=shown[0],last=shown[shown.length-1];
  const delta=last&&first?r2(M.f(last.T)-M.f(first.T)):0;
  const cards=liveAccounts().filter(a=>a.kind==='card');
  const totalDrift=r2(series.reduce((s,x)=>s+x.C.rows.reduce((t,r)=>t+(r.drift&&r.drift>0?r.drift:0),0),0));

  el.innerHTML=`
  <div class="head"><div><h1>History</h1>
    <div class="sub">${series.length} weeks · ${weekLabel(ks[0])} to ${weekLabel(ks[ks.length-1])}</div></div>
    <div class="spacer"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <select id="metricPick">${Object.entries(METRICS).map(([id,m])=>
        `<option value="${id}" ${UI.histMetric===id?'selected':''}>${m.l}</option>`).join('')}</select>
      <div class="seg">${[['all','All'],['ytd','This year'],['13','13 weeks']].map(([v,l])=>
        `<button data-range="${v}" class="${UI.histRange===v?'on':''}">${l}</button>`).join('')}</div>
    </div>
  </div>

  <div class="tiles">
    <div class="tile"><div class="l">${M.l} now</div><div class="v">${M.fmt(M.f(last.T))}</div>
      <div class="d">${weekLabel(last.k)}</div></div>
    <div class="tile ${delta<0?'good':delta>0?'bad':''}"><div class="l">Change over ${shown.length} weeks</div>
      <div class="v">${delta>0?'+':''}${M.fmt(delta)}</div>
      <div class="d">from ${M.fmt(M.f(first.T))} at ${weekLabel(first.k)}</div></div>
    <div class="tile"><div class="l">Paid to debt, all weeks</div>
      <div class="v">${money0(series.reduce((s,x)=>s+x.T.debtPaid,0))}</div>
      <div class="d">${money0(series.reduce((s,x)=>s+x.T.attack,0))} of it attack</div></div>
    <div class="tile ${totalDrift>0?'warn':''}"><div class="l">Unplanned drift</div>
      <div class="v">${money0(totalDrift)}</div>
      <div class="d">balances landing above projection</div></div>
  </div>

  <div class="card">
    <div class="cap">${M.l}</div>
    <div class="chart" id="histChart" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <div class="cap">Each card, ${shown.length} weeks</div>
    <div class="sparks" style="margin-top:12px">${cards.map(a=>{
      const pts=shown.map(s=>({x:md(s.k),v:n0(s.C.byId[a.id]?.balance)}));
      const now=pts[pts.length-1].v,then=pts[0].v,d=r2(now-then);
      return`<div class="spark">
        <div class="sn"><span>${esc(a.name)}</span><span class="sv">${money0(now)}</span></div>
        <div class="sd" style="color:${d<0?'var(--good)':d>0?'var(--attack)':'var(--muted)'}">${d>0?'+':''}${money0(d)} · ${a.limit?pct(now/a.limit,0)+' used':''}</div>
        ${sparkline(pts,{accent:d<=0?'var(--spark-down)':'var(--spark-up)'})}</div>`}).join('')}
    </div>
  </div>

  <div class="card" style="padding:var(--sp-4)">
    <div class="cap" style="margin-bottom:8px">Every week</div>
    <div style="overflow-x:auto"><table class="hist" style="min-width:760px">
      <thead><tr><th>Week</th><th class="num">Paycheck</th><th class="num">Assigned</th><th class="num">Left</th>
        <th class="num">Card balance</th><th class="num">Util</th><th class="num">To debt</th><th class="num">Attack</th></tr></thead>
      <tbody>${[...shown].reverse().map(s=>`<tr class="${isPlanned(s.k)?'planned':''}">
        <td>${weekLabel(s.k)}</td>
        <td class="num">${money0(s.T.income)}</td>
        <td class="num">${money0(s.T.allocated)}</td>
        <td class="num ${Math.abs(s.T.unallocated)<0.005?'':'neg'}">${money(s.T.unallocated)}</td>
        <td class="num">${money0(s.T.cardBalance)}</td>
        <td class="num">${pct(s.T.usage,0)}</td>
        <td class="num">${money0(s.T.debtPaid)}</td>
        <td class="num">${s.T.attack?money0(s.T.attack):'—'}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>`;

  const pts=shown.map(s=>({x:md(s.k),t:weekLong(s.k),v:M.f(s.T),
    rows:[[M.l,M.fmt(M.f(s.T))],['Paid to debt',money0(s.T.debtPaid)],['Attack',money0(s.T.attack)]]}));
  requestAnimationFrame(()=>{const c=$('#histChart');if(c)lineChart(c,pts,{h:230,fmt:M.fmt,label:M.l,
    accent:UI.histMetric==='attack'||UI.histMetric==='paid'?'var(--s3)':'var(--s1)'})});
  $('#metricPick').onchange=e=>{UI.histMetric=e.target.value;render()};
}

/* ── Accounts ─────────────────────────────────────────────────────── */
const KIND_GROUP={income:'checking',cash:'buckets',savings:'savings',loan:'loans',card:'cards'};
function viewAccounts(el){
  const showArch=!!UI.showArchived;
  const list=S.accounts.slice().sort((a,b)=>a.order-b.order).filter(a=>showArch||!a.archived);
  el.innerHTML=`
  <div class="head"><div><h1>Accounts</h1>
    <div class="sub">${liveAccounts().length} active · edit here and every week reflows around it</div></div>
    <div class="spacer"></div>
    <div style="display:flex;gap:8px">
      <button class="btn sm ${showArch?'pri':''}" data-act="togglearch">${showArch?'Hide archived':'Show archived'}</button>
      <button class="btn pri sm" data-act="addacct">+ Account</button>
    </div>
  </div>
  <div class="card" style="padding:var(--sp-3) var(--sp-3) var(--sp-2)">
    <div class="acct hd"><div>Name</div><div>Type</div><div class="hideS">Limit</div><div class="hideS">APR</div>
      <div class="hideS">Min / month</div><div class="hideS">Weekly out</div>
      <div class="hideS" title="No interest while the statement balance is paid in full">Grace</div><div></div></div>
    ${GROUPS.map(g=>{
      const rows=list.filter(a=>(a.group||KIND_GROUP[a.kind])===g.id);
      if(!rows.length)return'';
      return`<div class="acct" style="border:none;padding-top:14px"><div class="cap">${g.label}</div></div>`+
        rows.map(a=>`<div class="acct ${a.archived?'arch':''}">
        <div style="display:flex;align-items:center;gap:8px;min-width:0">
          <input type="text" data-a="${a.id}:name" value="${esc(a.name)}">
        </div>
        <div><select data-a="${a.id}:kind">${Object.keys(KIND_GROUP).map(kk=>
          `<option value="${kk}" ${a.kind===kk?'selected':''}>${kk[0].toUpperCase()+kk.slice(1)}</option>`).join('')}</select></div>
        <div class="hideS">${KIND_DEBT(a.kind)?`<input type="number" step="1" data-a="${a.id}:limit" value="${n0(a.limit)||''}" placeholder="—">`:''}</div>
        <div class="hideS">${KIND_DEBT(a.kind)?`<input type="number" step="0.01" data-a="${a.id}:aprPct" value="${a.apr?r2(a.apr*100):''}" placeholder="—">`:''}</div>
        <div class="hideS"><input type="number" step="0.01" data-a="${a.id}:minAmt" value="${n0(a.minAmt)||''}" placeholder="—"></div>
        <div class="hideS">${KIND_INFLOW(a.kind)?`<input type="number" step="1" data-a="${a.id}:weeklyOutflow" value="${n0(a.weeklyOutflow)||''}" placeholder="0">`:''}</div>
        <div class="hideS">${a.kind==='card'?`<label class="gracebox" title="No interest while the whole statement balance is paid by the due date. A partial payment ends it and the APR applies to everything, retroactively."><input type="checkbox" class="paidbox" data-grace="${a.id}"${a.grace?' checked':''}><span>${a.grace?'on':'off'}</span></label>`:''}</div>
        <div style="display:flex;gap:4px;justify-content:flex-end">
          <button class="btn sm ghost" data-move="${a.id}:-1" title="Move up">↑</button>
          <button class="btn sm ghost" data-move="${a.id}:1" title="Move down">↓</button>
          <button class="btn sm ghost" data-arch="${a.id}" title="${a.archived?'Restore':'Archive'}">${a.archived?'↺':'×'}</button>
        </div></div>`).join('')}).join('')}
  </div>
  <div class="card">
    <div class="cap">Data</div>
    <p class="sub" style="margin:8px 0 14px;max-width:70ch">Everything lives in this browser's local storage — nothing is uploaded.
      Export a backup before you clear site data, switch browsers, or move to another machine.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" data-act="export">Export backup</button>
      <button class="btn" data-act="import">Import backup</button>
      <button class="btn" data-act="csv">Export CSV</button>
      <button class="btn ghost" data-act="reset" style="color:var(--bad)">Reset to imported sheet</button>
    </div>
  </div>`;
}
