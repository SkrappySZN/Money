<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Money</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   Broadsheet. Tokens first, then components, then the OLD stylesheet
   scoped under .legacy so views that have not been converted yet keep
   working exactly as they did. The .legacy block is deleted once every
   view has landed.
   ═══════════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════
   BROADSHEET — design tokens
   Every component reads from here. No literal colour, size or radius
   should appear anywhere else in the app.

   At build time this file is inlined into index.html, so the app keeps
   its single-file, zero-external-request property.
   ═══════════════════════════════════════════════════════════════════ */

/* ── Faces ─────────────────────────────────────────────────────────
   Self-hosted, subset to the glyphs this app actually renders.
   Both are variable: weight is an axis, not a separate file.
   Source Serif also carries an optical-size axis, so the hero figure
   is cut differently from a 19px subhead rather than just scaled.
   ─────────────────────────────────────────────────────────────── */
@font-face{
  font-family:"Source Serif 4";
  src:url("fonts/source-serif-4.woff2") format("woff2-variations");
  font-weight:200 900;
  font-stretch:normal;
  font-display:swap;
}
@font-face{
  font-family:"Inter Tight";
  src:url("fonts/inter-tight.woff2") format("woff2-variations");
  font-weight:100 900;
  font-stretch:normal;
  font-display:swap;
}

:root{
  color-scheme:light;

  /* ── Type families ─────────────────────────────────────────────
     Display carries page titles and every large dollar figure.
     Sans carries labels, body, tables — everything else.          */
  --font-display:"Source Serif 4", ui-serif, Georgia, "Times New Roman", serif;
  --font-sans:"Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;

  /* ── Type scale ────────────────────────────────────────────────
     Seven steps. Tight increments at the bottom where table rows
     need density; opening sharply at the top so the hero figure is
     unmistakably the loudest thing on the page — step-7 is 5.8x
     step-1. Line-heights fall as size rises.                      */
  --text-1:0.6875rem;  --leading-1:1.45;   /* 11px — uppercase labels, axis ticks   */
  --text-2:0.8125rem;  --leading-2:1.50;   /* 13px — table cells, meta, legends     */
  --text-3:0.9375rem;  --leading-3:1.60;   /* 15px — body, prose, alert text        */
  --text-4:1.1875rem;  --leading-4:1.40;   /* 19px — card headings, modal titles    */
  --text-5:1.75rem;    --leading-5:1.25;   /* 28px — page titles (display)          */
  --text-6:2.75rem;    --leading-6:1.10;   /* 44px — secondary display figures      */
  --text-7:4rem;       --leading-7:1.00;   /* 64px — the hero figure (display)      */

  /* ── Weights ───────────────────────────────────────────────────
     Both faces are variable, so these are axis positions.         */
  --weight-regular:400;
  --weight-medium:500;    /* section labels sit here, not at bold  */
  --weight-semibold:600;  /* alert card names, totals row          */

  /* ── Tracking ──────────────────────────────────────────────────  */
  --tracking-label:0.08em;   /* small uppercase section labels      */
  --tracking-body:0;
  --tracking-tight:-0.02em;  /* display sizes only                  */

  /* ── Paper & ink ───────────────────────────────────────────────
     Three paper tones: the sheet, a deeper stock for sticky table
     headers and recessed strips, and a third for hover. Ink is a
     warm near-black, never pure.                                   */
  --paper:#F6F2EA;
  --paper-deep:#EFEAE0;
  --paper-deeper:#E7E1D5;

  --ink:#1B1815;        /* headings, figures, primary prose         */
  --ink-secondary:#4A443C;
  --ink-muted:#857C6F;  /* labels, axis text, disabled              */
  --ink-absent:#B3ACA1; /* a cell holding nothing: an em-dash, a zero */

  /* ── Accent ────────────────────────────────────────────────────
     Exactly one. Primary action and active nav state only. It is
     also the single data-ink for line charts — a broadsheet prints
     charts in the same ink it prints buttons.                      */
  --accent:#20456B;
  --accent-pressed:#163350;
  --accent-on:#F6F2EA;   /* text on an accent fill                  */

  /* ── Semantic inks ─────────────────────────────────────────────
     Press marks, not browser errors. Desaturated to sit in the
     paper. Each has a wash for backgrounds at low opacity.

     RESERVATION: oxblood marks things that are actually wrong —
     breaches, overdrafts, negative balances, past-due. It is never
     a category colour. Anything merely worth noticing takes
     attention (sienna) instead.                                    */
  --negative:#8C3A2E;                          /* oxblood            */
  --negative-wash:rgba(140,58,46,0.07);
  --positive:#3E6B4F;                          /* dull forest        */
  --positive-wash:rgba(62,107,79,0.07);
  --attention:#8A6516;                         /* raw sienna         */
  --attention-wash:rgba(138,101,22,0.08);

  /* ── Rules ─────────────────────────────────────────────────────
     Hairlines replace every card border and every drop shadow.     */
  --rule-width:1px;
  --rule-opacity:0.12;
  --rule-opacity-strong:0.22;
  --rule:rgba(27,24,21,0.12);          /* default hairline           */
  --rule-strong:rgba(27,24,21,0.22);   /* under section labels, totals */
  --rule-faint:rgba(27,24,21,0.07);    /* between table rows         */
  --veil:rgba(27,24,21,0.28);          /* behind a modal             */

  /* ── Controls ──────────────────────────────────────────────────
     Minimum hit target, reached with padding rather than by enlarging
     the glyph. Focus is drawn in the accent because the boxes that
     used to imply it are gone.                                       */
  --control-target:40px;
  --focus-ink:var(--accent);
  --focus-ring-width:2px;
  --focus-ring-offset:2px;

  /* ── Radius ────────────────────────────────────────────────────
     One value in the entire app. Progress bars are the sole
     exception and take squared ends, not pills.                    */
  --radius:2px;

  /* ── Measure ───────────────────────────────────────────────────
     Cap on running prose. Anything that wraps to more than one line
     and is read as sentences takes this; tables, charts, legends and
     single-line notes do not.                                        */
  --measure-prose:78ch;

  /* ── Spacing ───────────────────────────────────────────────────
     8px base with a single 4px half-step for optical corrections.  */
  --space-half:0.25rem;   /*  4px */
  --space-1:0.5rem;       /*  8px */
  --space-2:1rem;         /* 16px */
  --space-3:1.5rem;       /* 24px */
  --space-4:2rem;         /* 32px */
  --space-5:3rem;         /* 48px */
  --space-6:4rem;         /* 64px */
  --space-7:6rem;         /* 96px — outer page margin               */
  /* Tables carry their own vertical step. 25 rows at the page rhythm is
     over 1,000px; this stays on the 8px scale rather than being an
     exception to it. */
  --table-row-step:var(--space-1);
  /* Account column cap.
     DO NOT move this onto the table cell. A max-width on a <td>/<th> is advisory:
     under table-layout:auto the column algorithm sizes from content and ignores
     it, so the column grows past the cap and never ellipsises. It has to be
     applied to a block box INSIDE the cell. Shipped once on the cell itself and
     it silently did nothing — a 28-character name rendered at 221.8px against a
     210px cap with no ellipsis. */
  --account-col:210px;

  /* ── Data ink ──────────────────────────────────────────────────
     Line charts are single-series and print in the accent.
     The allocation bar is part-to-whole of ONE quantity, so it is a
     tint ramp rather than four unrelated hues — monotonic in OKLab
     lightness (0.383 / 0.528 / 0.705 / 0.847, min step 0.141).
     Attack is the win, not a problem, so it takes the accent at full
     strength and the rest step down from it. Darkness reads as how
     hard that money is working.
     Named by weight, not by slot, so no component encodes meaning.  */
  --data-ink:#20456B;
  --fill-emphasis:#20456B;   /* Attack — extra principal            */
  --fill-strong:#4A6E96;     /* Minimums                            */
  --fill-mid:#8AA3BD;        /* Buckets & savings                   */
  --fill-faint:#C3CEDA;      /* Unassigned — money doing nothing    */

  /* A rising card balance is worth noticing but is not a breach, so
     it takes attention, not oxblood. See the reservation above.     */
  --spark-better:#3E6B4F;
  --spark-worse:#8A6516;
  --axis:rgba(27,24,21,0.10);
  --gridline:rgba(27,24,21,0.07);

  /* ── Progress bars ─────────────────────────────────────────────  */
  --bar-track:rgba(27,24,21,0.09);
  --bar-height:4px;
  --bar-radius:0;          /* squared ends, per spec                */

  /* ── Motion ────────────────────────────────────────────────────
     Carried over unchanged; not part of this restyle.              */
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-standard:cubic-bezier(.4,0,.2,1);
  --duration-1:120ms;
  --duration-2:220ms;
  --duration-3:340ms;
}
@media(prefers-reduced-motion:reduce){
  :root{--duration-1:1ms;--duration-2:1ms;--duration-3:1ms}
}


*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-sans);font-size:var(--text-3);line-height:var(--leading-3);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.page{padding:var(--space-6) var(--space-7);max-width:1180px}
.prose{max-width:var(--measure-prose)}

/* ── Masthead ─────────────────────────────────────────────────────  */
.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);
  flex-wrap:wrap;padding-bottom:var(--space-2);
  border-bottom:var(--rule-width) solid var(--rule-strong);margin-bottom:var(--space-4)}
.page-title{font-family:var(--font-display);font-size:var(--text-5);line-height:var(--leading-5);
  font-weight:var(--weight-regular);letter-spacing:var(--tracking-tight);
  font-variant-numeric:tabular-nums;font-optical-sizing:auto;color:var(--ink);margin:0}
.dateline{font-size:var(--text-1);line-height:var(--leading-1);font-weight:var(--weight-medium);
  letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);
  margin-top:var(--space-half)}
.controls{display:flex;align-items:center;gap:var(--space-1)}
.ctl{font:inherit;font-size:var(--text-2);color:var(--ink-secondary);background:none;
  border:var(--rule-width) solid transparent;border-radius:var(--radius);cursor:pointer;
  min-width:var(--control-target);min-height:var(--control-target);padding:0 var(--space-1);
  display:inline-flex;align-items:center;justify-content:center;line-height:1.6}
.ctl:hover{color:var(--ink)}
.ctl:focus-visible{outline:none;color:var(--focus-ink);text-decoration:underline;
  text-decoration-color:var(--focus-ink);text-decoration-thickness:var(--focus-ring-width);
  text-underline-offset:var(--focus-ring-offset)}
.jump{position:relative;display:inline-flex;align-items:center;min-height:var(--control-target);
  border-bottom:var(--rule-width) solid var(--rule)}
.jump:hover{border-bottom-color:var(--rule-strong)}
.jump:focus-within{border-bottom-color:var(--focus-ink);box-shadow:0 var(--rule-width) 0 0 var(--focus-ink)}
.jump:focus-within select{color:var(--focus-ink)}
.jump select{appearance:none;-webkit-appearance:none;font:inherit;font-size:var(--text-2);
  color:var(--ink-secondary);background:none;border:0;border-radius:var(--radius);
  align-self:stretch;min-height:var(--control-target);
  padding:0 calc(var(--space-2) + var(--space-half)) 0 0;cursor:pointer;line-height:1.6}
.jump select:focus{outline:none}
.jump:hover select{color:var(--ink)}
.jump .caret{position:absolute;right:0;pointer-events:none;display:flex;color:var(--ink-muted)}
.ctl-primary{background:var(--accent);color:var(--accent-on);border-color:var(--accent);
  font-weight:var(--weight-medium);min-height:var(--control-target);padding:0 var(--space-2)}
.ctl-primary:hover{background:var(--accent-pressed);border-color:var(--accent-pressed)}
.ctl-primary:focus-visible{outline:var(--focus-ring-width) solid var(--ink);
  outline-offset:var(--focus-ring-offset);text-decoration:none;color:var(--accent-on)}

/* ── Hero + four-up ───────────────────────────────────────────────  */
.hero-row{margin-bottom:var(--space-5)}
.hero-label,.m-label,.sect-label{font-size:var(--text-1);line-height:var(--leading-1);
  font-weight:var(--weight-medium);letter-spacing:var(--tracking-label);text-transform:uppercase}
.hero-label{color:var(--ink-muted);margin-bottom:var(--space-1)}
.hero-figure{font-family:var(--font-display);font-size:var(--text-7);line-height:var(--leading-7);
  letter-spacing:var(--tracking-tight);font-weight:var(--weight-regular);
  font-variant-numeric:tabular-nums;font-optical-sizing:auto;color:var(--ink);
  display:flex;align-items:baseline;gap:0.06em}
.hero-figure .mark{font-size:0.42em;color:var(--ink-secondary);letter-spacing:0;
  transform:translateY(-0.821em)}
.hero-figure input{font:inherit;font-variant-numeric:inherit;letter-spacing:inherit;color:inherit;
  background:none;border:0;border-bottom:var(--rule-width) solid transparent;padding:0;
  width:5.1ch;min-width:3ch;max-width:14ch;border-radius:var(--radius)}
.hero-figure input:focus{outline:none;border-bottom-color:var(--accent)}
.hero-note{font-size:var(--text-2);line-height:var(--leading-2);color:var(--ink-muted);
  margin-top:var(--space-1)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);
  border-top:var(--rule-width) solid var(--rule);padding-top:var(--space-2)}
.metric{padding:0 var(--space-3)}
.metric + .metric{border-left:var(--rule-width) solid var(--rule)}
.metric:first-child{padding-left:0}
.metric:last-child{padding-right:0}
.m-label{color:var(--ink-muted)}
.m-value{font-size:var(--text-4);line-height:var(--leading-4);font-variant-numeric:tabular-nums;
  color:var(--ink);margin-top:var(--space-half)}
.m-value.is-settled{color:var(--positive);font-weight:var(--weight-semibold)}
.m-value.is-idle,.m-value.is-flagged{color:var(--attention)}
.m-value.is-over{color:var(--negative);font-weight:var(--weight-semibold)}
.m-note{font-size:var(--text-2);line-height:var(--leading-2);color:var(--ink-muted);
  margin-top:var(--space-half);font-variant-numeric:tabular-nums}

/* ── Sections ─────────────────────────────────────────────────────  */
.band{margin-top:var(--space-6)}
.sect-label{color:var(--ink-secondary);padding-top:var(--space-2);
  border-top:var(--rule-width) solid var(--rule-strong);margin-bottom:var(--space-3)}
.sect-label .count{color:var(--ink-muted);font-variant-numeric:tabular-nums;margin-left:var(--space-1)}
h2.sect-label,h3.sect-label{margin-top:0;display:flex;align-items:center}

/* ── Allocation bar: one ink, four tints ──────────────────────────  */
.allocbar{display:flex;height:var(--space-3);gap:var(--rule-width);overflow:hidden;
  background:var(--bar-track);border-radius:var(--bar-radius)}
.allocbar span{display:block;height:100%}
.legend{display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:var(--text-2);
  color:var(--ink-secondary);margin-top:var(--space-2);line-height:1.8}
.legend .k{display:flex;align-items:center;gap:var(--space-1)}
.legend .sw{width:10px;height:10px;flex:0 0 auto;border-radius:var(--bar-radius)}
.legend b{color:var(--ink);font-weight:var(--weight-medium);font-variant-numeric:tabular-nums}

/* ── Alerts: three-level marking, a rule in the margin ────────────  */
.attn-list,.ok-list{list-style:none;margin:0;padding:0}
.attn-row{padding:var(--space-2) 0 var(--space-2) var(--space-2);
  border-left:var(--rule-width) solid var(--negative);
  border-bottom:var(--rule-width) solid var(--rule-faint)}
.attn-row:last-child{border-bottom:0}
.attn-row p{margin:0;max-width:var(--measure-prose);color:var(--ink-secondary)}
.account{color:var(--negative);font-weight:var(--weight-semibold)}
.fig-breach{color:var(--negative);font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums}
.fig{font-variant-numeric:tabular-nums;font-weight:var(--weight-medium);color:var(--ink)}
/* Emphasis inside alert prose resolves to the same treatment as a marked figure.
   The three levels are the whole vocabulary; a raw <b> would be a fourth. */
.attn-row p b,.ok-list li b{font-weight:var(--weight-medium);color:var(--ink)}
.ok-head{display:flex;align-items:center;gap:var(--space-1);background:none;border:0;padding:0;
  cursor:pointer;font-size:var(--text-1);font-weight:var(--weight-medium);
  letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);
  min-height:var(--control-target);margin-top:var(--space-2);
  border-top:var(--rule-width) solid var(--rule-faint);width:100%;justify-content:flex-start}
.ok-head:hover{color:var(--ink-secondary)}
.ok-head:focus-visible{outline:none;color:var(--focus-ink);text-decoration:underline;
  text-decoration-color:var(--focus-ink);text-decoration-thickness:var(--focus-ring-width);
  text-underline-offset:var(--focus-ring-offset)}
.ok-head .caret{transition:transform var(--duration-2) var(--ease);display:flex}
.ok-head[aria-expanded="true"] .caret{transform:rotate(90deg)}
.ok-list li{padding:var(--space-1) 0 var(--space-1) var(--space-2);color:var(--ink-secondary);
  max-width:var(--measure-prose);border-left:var(--rule-width) solid var(--rule)}

/* ── Sinking funds: thin, squared, muted ──────────────────────────  */
.fund{display:grid;grid-template-columns:180px 1fr 150px;gap:var(--space-3);align-items:center;
  padding:var(--space-1) 0;font-size:var(--text-2)}
.fund + .fund{border-top:var(--rule-width) solid var(--rule-faint)}
.fund .fname{color:var(--ink)}
.fbar{height:var(--bar-height);background:var(--bar-track);border-radius:var(--bar-radius);overflow:hidden}
.fbar i{display:block;height:100%;background:var(--fill-strong)}
.fbar i.done{background:var(--positive)}
.fnum{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-secondary)}
.fnum .done{color:var(--positive);font-weight:var(--weight-medium)}

/* ── Segmented control: ink weight + underline, accent stays out ──  */
.seg{display:inline-flex;gap:var(--space-3)}
.seg button{background:none;border:0;padding:var(--space-half) 0;cursor:pointer;
  font-size:var(--text-1);font-weight:var(--weight-medium);letter-spacing:var(--tracking-label);
  text-transform:uppercase;color:var(--ink-muted);min-height:var(--control-target);
  border-bottom:var(--focus-ring-width) solid transparent}
.seg button:hover{color:var(--ink-secondary)}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.seg button:focus-visible{outline:none;color:var(--focus-ink);border-bottom-color:var(--focus-ink)}

/* ── The grid ─────────────────────────────────────────────────────
   No container border. The sticky header is a deeper stock with one
   rule beneath; the sticky account column is paper with a hairline at
   its right edge. The wrapper is capped so sticky resolves inside it. */
.gridwrap{overflow:auto;max-height:max(420px,70vh)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:960px;font-size:var(--text-2)}
table.grid th,table.grid td{padding:var(--table-row-step) var(--space-2);text-align:right;
  white-space:nowrap;font-variant-numeric:tabular-nums}
table.grid thead th{position:sticky;top:0;z-index:3;background:var(--paper-deep);
  color:var(--ink-muted);font-size:var(--text-1);font-weight:var(--weight-medium);
  letter-spacing:var(--tracking-label);text-transform:uppercase;
  border-bottom:var(--rule-width) solid var(--rule-strong)}
table.grid thead th:first-child{text-align:left;left:0;z-index:4}
table.grid tbody th{text-align:left;font-weight:var(--weight-regular);position:sticky;left:0;
  z-index:2;background:var(--paper);max-width:210px;overflow:hidden;text-overflow:ellipsis;
  border-right:var(--rule-width) solid var(--rule)}
table.grid tbody tr td{border-bottom:var(--rule-width) solid var(--rule-faint)}
table.grid tbody tr:hover th,table.grid tbody tr:hover td{background:var(--paper-deep)}
tr.sect th{background:var(--paper)!important;color:var(--ink-muted);font-size:var(--text-1);
  font-weight:var(--weight-medium);letter-spacing:var(--tracking-label);text-transform:uppercase;
  text-align:left;padding-top:var(--space-3);border-bottom:var(--rule-width) solid var(--rule)}
tr.rollup th{font-style:italic;color:var(--ink-secondary)}
tr.rollup th,tr.child th{padding-left:var(--space-3)}
tr.tot th,tr.tot td{font-weight:var(--weight-semibold);
  border-top:var(--rule-width) solid var(--rule-strong);border-bottom:0}
td.dim{color:var(--ink-muted)}
input.cell{width:9ch;text-align:right;background:none;border:0;
  border-bottom:var(--rule-width) solid transparent;padding:0;color:var(--ink);font:inherit;
  font-variant-numeric:tabular-nums;border-radius:var(--radius)}
input.cell:hover{border-bottom-color:var(--rule)}
input.cell:focus{outline:none;border-bottom-color:var(--accent)}
/* Date cells: the native picker leaves an empty control looking broken,
   so an unset date reads as an em-dash until the row is hovered. These
   rules existed only under `.legacy`, which is why converted views showed
   a bare empty input. */
td.dcell{position:relative}
input.cell-date{width:118px}
td.dcell.is-empty::after{content:'—';position:absolute;right:var(--space-2);top:50%;
  transform:translateY(-50%);color:var(--ink-muted);pointer-events:none}
td.dcell.is-empty input{color:transparent}
td.dcell.is-empty:hover::after,tr:hover td.dcell.is-empty::after{opacity:0}
td.dcell.is-empty:hover input,tr:hover td.dcell.is-empty input{color:var(--ink-muted)}
td.dcell input:focus{color:var(--ink)}

/* This Week hands off to the sheet rather than repeating it. */
.sheet-link{display:flex;width:100%;align-items:baseline;gap:var(--space-3);text-align:left;
  background:none;border:0;cursor:pointer;font-family:inherit;
  color:var(--ink);font-size:var(--text-4);line-height:var(--leading-4);
  padding:var(--space-2) 0;border-bottom:var(--rule-width) solid var(--rule)}
.sheet-link:hover{color:var(--accent)}
.sheet-link:focus-visible{outline:var(--focus-ring-width) solid var(--accent);
  outline-offset:var(--space-1);border-radius:var(--radius)}
.sheet-link-note{font-size:var(--text-1);letter-spacing:var(--tracking-label);
  text-transform:uppercase;color:var(--ink-muted);font-weight:var(--weight-medium);
  margin-left:auto}

/* A paid row keeps the green the spreadsheet used, at wash strength rather
   than fill: the sheet is read as a whole and 20 saturated rows would drown
   the figures. The tick sits in the account cell so it costs no column. */
.paidbox{appearance:none;width:13px;height:13px;margin:0 var(--space-1) 0 0;
  vertical-align:-2px;border:var(--rule-width) solid var(--rule-strong);
  border-radius:var(--radius);background:var(--paper);cursor:pointer;flex:0 0 auto}
.paidbox:hover{border-color:var(--positive)}
.paidbox:checked{background:var(--positive);border-color:var(--positive)}
.paidbox:checked::after{content:'';display:block;width:3px;height:6px;margin:1px auto 0;
  border:solid var(--paper);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.paidbox:focus-visible{outline:var(--focus-ring-width) solid var(--accent);outline-offset:1px}
tr.is-paid > th,tr.is-paid > td{background:var(--positive-wash)}
tr.is-paid:hover > th,tr.is-paid:hover > td{background:var(--positive-wash)}
tr.is-paid .acct{color:var(--ink-secondary)}

/* The pull-forward preview: what changes, before it changes. */
.pulllist{list-style:none;margin:var(--space-3) 0 0;padding:0;
  font-variant-numeric:tabular-nums;font-size:var(--text-2)}
.pulllist li{display:flex;justify-content:space-between;gap:var(--space-3);
  padding:var(--space-1) 0;border-bottom:var(--rule-width) solid var(--rule-faint)}
.pulllist li:last-child{border-bottom:0}
.pulllist li.more{color:var(--ink-muted);justify-content:flex-start}
.pulllist b{font-weight:var(--weight-medium)}

/* Direction, in the month view. A debt falling and a bucket filling are
   both good, so the class carries the judgement and the sign carries the
   arithmetic — they do not always agree. */
td.chg{font-variant-numeric:tabular-nums;font-weight:var(--weight-medium)}
td.chg.is-good{color:var(--positive)}
td.chg.is-bad{color:var(--negative)}
td.chg.is-flat{color:var(--ink-muted);font-weight:var(--weight-regular)}
td.chg.is-plain{color:var(--ink-secondary);font-weight:var(--weight-regular)}

/* ── Modals and buttons ─────────────────────────────────────────
   These lived only under `.legacy`, and `#modalRoot` is a SIBLING of
   `#view` — so the selector could never match from anywhere, on any
   tab, converted or not. Every dialog in the app rendered as bare text
   at the foot of the page, and so did the welcome screen's buttons on
   the published copy, which is the first thing a new visitor sees.

   Per C7: a transient panel does not get elevation. The veil separates
   it from the page; the panel itself is paper with a strong hairline,
   the same treatment the chart tooltip settled on. */
.scrim{position:fixed;inset:0;z-index:50;background:var(--veil);
  display:flex;align-items:center;justify-content:center;padding:var(--space-4)}
.modal{background:var(--paper);border:var(--rule-width) solid var(--rule-strong);
  border-radius:var(--radius);padding:var(--space-5);
  max-width:560px;width:100%;max-height:86vh;overflow:auto}
.modal h3{font-family:var(--font-display);font-size:var(--text-4);
  line-height:var(--leading-4);font-weight:var(--weight-regular);margin:0 0 var(--space-2)}
.modal p{color:var(--ink-secondary);font-size:var(--text-2);line-height:var(--leading-2);
  margin:0 0 var(--space-3);max-width:var(--measure-prose)}
.modal p b{color:var(--ink);font-weight:var(--weight-medium)}
.mrow{display:flex;gap:var(--space-2);justify-content:flex-end;
  margin-top:var(--space-4);flex-wrap:wrap;align-items:center}

/* One solid block per cluster (C3): the confirming action. Everything
   else in the row is text, so the eye lands on the one that commits. */
.btn{font:inherit;font-size:var(--text-2);color:var(--ink-secondary);background:none;
  border:var(--rule-width) solid transparent;border-radius:var(--radius);cursor:pointer;
  min-height:var(--control-target);padding:0 var(--space-2);
  display:inline-flex;align-items:center;gap:var(--space-1);line-height:1.6}
.btn:hover{color:var(--ink)}
.btn:focus-visible{outline:none;color:var(--focus-ink);text-decoration:underline;
  text-decoration-color:var(--focus-ink);text-decoration-thickness:var(--focus-ring-width);
  text-underline-offset:var(--focus-ring-offset)}
.btn.pri{background:var(--accent);color:var(--accent-on);border-color:var(--accent);
  font-weight:var(--weight-medium)}
.btn.pri:hover{background:var(--accent-pressed);border-color:var(--accent-pressed);
  color:var(--accent-on)}
.btn.pri:focus-visible{outline:var(--focus-ring-width) solid var(--ink);
  outline-offset:var(--focus-ring-offset);text-decoration:none;color:var(--accent-on)}
.btn.ghost{color:var(--ink-muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.sm{min-height:auto;padding:var(--space-1) var(--space-2)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
/* A destructive confirm reads in oxblood — the one place R9 clearly binds. */
.btn.danger{background:var(--negative);border-color:var(--negative);color:var(--paper);
  font-weight:var(--weight-medium)}
.btn.danger:hover{background:var(--negative);border-color:var(--negative);filter:brightness(.92)}

/* The modal's own field wrapper. The bare `.field` rule styles form
   controls, so it must not also be the label-plus-input container. */
.modal .f2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.modal .fieldrow{margin-bottom:var(--space-3)}
.modal .fieldrow label{display:block;font-size:var(--text-1);line-height:var(--leading-1);
  letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);
  font-weight:var(--weight-medium);margin-bottom:var(--space-1)}
.modal .fieldrow input,.modal .fieldrow select{width:100%;font:inherit;font-size:var(--text-3);
  background:none;border:0;border-bottom:var(--rule-width) solid var(--rule);
  border-radius:var(--radius);padding:var(--space-1) 0;color:var(--ink)}
.modal .fieldrow input:focus,.modal .fieldrow select:focus{outline:none;
  border-bottom-color:var(--accent)}

/* A finalized week reads as settled rather than disabled: the figures stay
   at full strength because they are still the record, but nothing offers a
   hover or a caret, so there is no invitation to type. */
.sealed{color:var(--positive);font-weight:var(--weight-medium)}
.ctl-sealed{color:var(--positive)}
.ctl-sealed:hover{color:var(--positive)}
.sheet-page input.cell[readonly],.sheet-page input.cell:disabled{
  color:var(--ink);cursor:default;border-bottom-color:transparent!important;
  opacity:1;-webkit-text-fill-color:var(--ink)}
.sheet-page input.cell[readonly]:hover,.sheet-page input.cell:disabled:hover{
  border-bottom-color:transparent!important}
.sheet-page input.cell-date:disabled::-webkit-calendar-picker-indicator{display:none}
/* An unset date keeps its em-dash when the week is finalized. The rule above
   forces text back to full strength so readonly figures stay legible, and
   that was overriding the transparent fill that hides "mm/dd/yyyy". */
td.dcell.is-empty input:disabled{color:transparent;-webkit-text-fill-color:transparent}
.paidbox:disabled{cursor:default;opacity:1}
.paidbox:disabled:not(:checked){border-color:var(--rule)}

/* Grace toggle in the accounts list. Reuses the paid tick's mark; the word
   beside it says which way it is set, because a lone unchecked box in a
   column of them is easy to misread. */
.gracebox{display:inline-flex;align-items:center;gap:var(--space-1);cursor:pointer;
  font-size:var(--text-1);letter-spacing:var(--tracking-label);text-transform:uppercase;
  color:var(--ink-muted);font-weight:var(--weight-medium)}
.gracebox input:checked+span{color:var(--positive)}

/* Two thirds of the cells in this sheet hold nothing — an em-dash for a
   column that does not apply to the row, a zero for one you have not used.
   At full strength they compete with the figures that actually carry the
   week. Dropped a rung below muted so the eye lands on what moved. */
.sheet-page td.is-absent,.sheet-page td.chg.is-flat{color:var(--ink-absent)}
.sheet-page input.cell.is-zero{color:var(--ink-absent)}
.sheet-page td.dcell.is-empty::after{color:var(--ink-absent)}

/* Nineteen columns in one undifferentiated run gives the eye nothing to hold.
   A hairline at each change of subject — what it is, where it stands, what it
   owes, what you are giving it, where it lands — which is R5's rule rather
   than a border. */
.sheet-page table.grid th.grp,.sheet-page table.grid td.grp,
.sheet-page table.grid tbody th.grp{border-left:var(--rule-width) solid var(--rule-faint)}
.sheet-page table.grid thead th.grp{border-left-color:var(--rule)}

/* ── The allocation sheet ────────────────────────────────────────
   Its own density so all 27 rows clear the fold. 3px of padding on a
   13px/1.35 cell gives a ~25px step against the ~36px the rest of the
   app uses; the wrapper takes the viewport that is left rather than a
   fixed 70vh, so the table grows with the window instead of capping. */
/* `.shell .page` is two classes and beat this on specificity, so the sheet
   kept the standard page's 64px top and 96px bottom padding — 160px of the
   one view whose entire job is fitting on screen, spent on margin. The
   layout properties applied; only the padding lost. Matched selector depth
   rather than reaching for !important. */
/* Three classes on purpose. `.shell .page` is two and is declared later in
   the sheet, so matching its depth was not enough — order decided it and this
   lost. Depth that cannot be beaten by position is the fix; !important would
   have hidden the reason. */
.shell .page.sheet-page{padding:var(--space-3) var(--space-4) 0;
  height:100vh;display:flex;flex-direction:column;max-width:none}
.sheet-masthead{margin-bottom:var(--space-3);flex:0 0 auto;align-items:center}
.sheet-masthead .page-title{font-size:var(--text-5);line-height:var(--leading-5)}
.sheet-tally{margin-left:var(--space-5);display:flex;flex-direction:column;gap:2px}
.sheet-tally .t-label{font-size:var(--text-1);line-height:var(--leading-1);
  letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);
  font-weight:var(--weight-medium)}
.sheet-tally .t-value{font-size:var(--text-4);line-height:var(--leading-4);
  font-variant-numeric:tabular-nums}
.sheet-grid{flex:1 1 auto;min-height:0;max-height:none;
  border-top:var(--rule-width) solid var(--rule)}
.sheet-page table.grid{--table-row-step:4px;min-width:0;font-size:12.5px}
.sheet-page table.grid th,.sheet-page table.grid td{line-height:1.35;
  padding-left:5px;padding-right:5px}
.sheet-page table.grid tbody th{max-width:none}
.sheet-page tr.sect th{padding-top:var(--space-1)}
.sheet-page input.cell{width:10ch}
.sheet-page input.cell-date{width:96px}
.sheet-page input.cell-date::-webkit-calendar-picker-indicator{opacity:0;transition:opacity var(--duration-1) ease}
.sheet-page tr:hover input.cell-date::-webkit-calendar-picker-indicator{opacity:.45}
.sheet-page input.cell-date:focus::-webkit-calendar-picker-indicator{opacity:.7}
/* The tally sits between title and controls; on a narrow window it wraps
   under rather than squeezing the week picker. */
@media(max-width:1100px){
  .shell .page.sheet-page{height:auto;padding-bottom:var(--space-4)}
  .sheet-grid{max-height:none}
  .sheet-tally{margin-left:0;flex-basis:100%;order:3;flex-direction:row;
    align-items:baseline;gap:var(--space-2)}
}

/* Registry fields (limit, APR) edited from the sheet write to the account and
   so change every week at once. Marked with a dotted rest state to say that
   they are not week data. */
input.cell.is-registry{border-bottom-style:dotted;border-bottom-color:var(--rule)}
input.cell.is-registry:hover{border-bottom-style:solid;border-bottom-color:var(--rule-strong)}
input.cell.is-registry:focus{border-bottom-style:solid;border-bottom-color:var(--accent)}
input.cell.is-zero{color:var(--ink-muted)}
input.cell.is-attack{color:var(--accent);font-weight:var(--weight-medium)}
input.cell.is-attack.is-zero{color:var(--ink-muted);font-weight:var(--weight-regular)}

@media(max-width:880px){
  .page{padding:var(--space-4) var(--space-3)}
  .hero-figure{font-size:var(--text-6);line-height:var(--leading-6)}
  .strip{grid-template-columns:repeat(2,1fr);gap:var(--space-2) 0}
  .metric{padding:var(--space-2) var(--space-3)}
  .metric:nth-child(odd){padding-left:0}
  .metric:nth-child(3){border-left:0}
  .fund{grid-template-columns:130px 1fr 110px}
}

/* ══ Shared components ══════════════════════════════════════════════
   Used by more than one view. The segmented control above is shared
   too — Compact/Full sheet on This Week, strategy on Attack and Payoff.
   ═══════════════════════════════════════════════════════════════════ */

/* ── Ranked rows ──────────────────────────────────────────────────
   Attack's stack and Payoff's budget steps. No card, no fill: a rule
   between rows, and the leading row marked by ink weight alone. */
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:2ch 1fr auto;gap:var(--space-3);
  align-items:baseline;padding:var(--space-2) 0;
  border-bottom:var(--rule-width) solid var(--rule-faint)}
.rank li:last-child{border-bottom:0}
.rank .n{font-variant-numeric:tabular-nums;color:var(--ink-muted);font-size:var(--text-2)}
.rank li.lead .n{color:var(--ink);font-weight:var(--weight-medium)}
.rank .nm{font-weight:var(--weight-medium);color:var(--ink-secondary)}
.rank li.lead .nm{color:var(--ink);font-weight:var(--weight-semibold)}
.rank .meta{font-size:var(--text-2);color:var(--ink-muted);margin-top:2px;
  font-variant-numeric:tabular-nums}
.rank .rt{text-align:right;font-variant-numeric:tabular-nums}
.rank .rv{font-size:var(--text-3);color:var(--ink)}
.rank li.lead .rv{font-weight:var(--weight-semibold)}
.rank .rl{font-size:var(--text-1);color:var(--ink-muted)}
.rank .pif .n{font-size:var(--text-1);color:var(--positive);font-weight:var(--weight-medium)}

/* ── Timeline bars ────────────────────────────────────────────────
   Attack's four-ways comparison and Payoff's what-clears-when. Same
   squared, muted treatment as the sinking-fund bars (R8). */
.tl{display:flex;flex-direction:column;gap:var(--space-1)}
.tlr{display:grid;grid-template-columns:200px 1fr 110px;gap:var(--space-3);
  align-items:center;font-size:var(--text-2);padding:var(--space-half) 0}
.tln{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-secondary)}
.tlr.lead .tln{color:var(--ink);font-weight:var(--weight-medium)}
.tlbar{height:var(--bar-height);background:var(--bar-track);border-radius:var(--bar-radius)}
.tlbar i{display:block;height:100%;background:var(--fill-mid)}
.tlr.lead .tlbar i{background:var(--fill-emphasis)}
.tlbar i.never{background:repeating-linear-gradient(135deg,
  var(--negative) 0 1px,var(--bar-track) 1px 5px)}
.tlv{text-align:right;color:var(--ink-secondary);font-variant-numeric:tabular-nums}

/* ── Chart ────────────────────────────────────────────────────────  */
.chart{position:relative;margin-top:var(--space-3)}
.chart svg{display:block;width:100%;overflow:visible}
.axl{fill:var(--ink-muted);font-size:11px;font-family:var(--font-sans);
  font-variant-numeric:tabular-nums}
.gridline{stroke:var(--gridline);stroke-width:1;shape-rendering:crispEdges}
/* carries the connection now that the callout no longer shouts */
.crosshair{stroke:var(--ink-secondary);stroke-width:1;stroke-dasharray:2 3}
.chartline{fill:none;stroke:var(--data-ink);stroke-width:2;
  stroke-linejoin:round;stroke-linecap:round}
.chartdot{fill:var(--data-ink);stroke:var(--paper);stroke-width:2}

/* C7, amended: no elevation AND no fills beyond the single accent block.
   An ink ground was justifiable as a printed callout, but a panel that tracks
   the cursor should not outweigh everything static on the page — and paper with
   a hairline does the same job without spending the system's only fill. The
   crosshair carries the connection to the point. */
.tip{position:absolute;pointer-events:none;background:var(--paper);color:var(--ink);
  border:var(--rule-width) solid var(--rule-strong);border-radius:var(--radius);
  padding:var(--space-1) var(--space-2);
  font-size:var(--text-2);line-height:1.5;white-space:nowrap;z-index:5;
  /* Hidden until the pointer picks a point. Without this the empty callout sits
     under every chart -- a bordered paper box on paper, which is why it survived
     the previews unnoticed. */
  opacity:0;transition:opacity var(--duration-1) var(--ease)}
.tip.on{opacity:1}
.tip .tt{font-weight:var(--weight-medium);margin-bottom:2px}
.tip .tr{display:flex;gap:var(--space-3);justify-content:space-between}
.tip .tr span:first-child{color:var(--ink-muted)}
.tip .tv{font-variant-numeric:tabular-nums;font-weight:var(--weight-medium)}

/* ── Comparison table ─────────────────────────────────────────────  */
table.cmp{border-collapse:collapse;width:100%;font-size:var(--text-2);margin-top:var(--space-2)}
table.cmp th{text-align:right;color:var(--ink-muted);font-size:var(--text-1);
  font-weight:var(--weight-medium);letter-spacing:var(--tracking-label);
  text-transform:uppercase;padding:var(--space-1) var(--space-2);
  border-bottom:var(--rule-width) solid var(--rule)}
table.cmp th:first-child{text-align:left}
table.cmp td{padding:var(--space-1) var(--space-2);text-align:right;
  border-bottom:var(--rule-width) solid var(--rule-faint);font-variant-numeric:tabular-nums}
table.cmp td:first-child{text-align:left}
table.cmp tr.lead td{font-weight:var(--weight-medium);color:var(--ink)}
table.cmp .cheapest{color:var(--positive);font-size:var(--text-1);
  letter-spacing:var(--tracking-label);text-transform:uppercase;margin-left:var(--space-1)}

/* lede prose under a hero — the sentence that explains the figure */
.lede{max-width:var(--measure-prose);margin:0 0 var(--space-2);color:var(--ink-secondary)}
.lede b{color:var(--ink);font-weight:var(--weight-medium);font-variant-numeric:tabular-nums}
.lede.muted{color:var(--ink-muted);font-size:var(--text-2)}
.hero-figure.plain{font-family:var(--font-sans)}
.m-value .mark{font-size:0.6em;color:var(--ink-secondary);vertical-align:0.25em}
input.cell.inline{width:8ch;min-width:3ch;max-width:12ch;font:inherit;font-size:var(--text-4);
  font-variant-numeric:tabular-nums;text-align:left;padding:0}
.rank .n input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;margin:0}

/* ══ Plan ═══════════════════════════════════════════════════════════ */
/* checkable lists — open items and the calendar */
.plan-list{list-style:none;margin:0;padding:0}
.plan-list li{display:grid;grid-template-columns:20px 1fr;gap:var(--space-2);
  align-items:start;padding:var(--space-1) 0;
  border-bottom:var(--rule-width) solid var(--rule-faint)}
.plan-list li:last-child{border-bottom:0}
.plan-list.dated li{grid-template-columns:20px 92px 1fr}
.plan-list input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;
  margin:5px 0 0}
.plan-list .pt{color:var(--ink);font-weight:var(--weight-medium)}
.plan-list .pn{color:var(--ink-muted);font-size:var(--text-2);
  max-width:var(--measure-prose);line-height:1.55}
.plan-list .pd{font-size:var(--text-2);color:var(--ink-muted);
  font-variant-numeric:tabular-nums;padding-top:1px}
.plan-list .pd.is-overdue{color:var(--negative);font-weight:var(--weight-medium)}
.plan-list li.done{opacity:.45}
.plan-list li.done .pt{text-decoration:line-through}
/* C2: no chips. A state is tracked uppercase text, not a filled shape. */
.state{font-size:var(--text-1);font-weight:var(--weight-medium);
  letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);
  margin-left:var(--space-1)}
.state.clear{color:var(--positive)}
.reorder{display:flex;gap:var(--space-half)}
.reorder button{background:none;border:0;cursor:pointer;color:var(--ink-muted);
  min-width:var(--control-target);min-height:var(--control-target);
  display:inline-flex;align-items:center;justify-content:center;font-size:var(--text-2)}
.reorder button:hover{color:var(--ink)}
.reorder button:disabled{opacity:.3;cursor:not-allowed}
.reorder button:focus-visible{outline:none;color:var(--focus-ink);text-decoration:underline;
  text-decoration-color:var(--focus-ink);text-decoration-thickness:var(--focus-ring-width);
  text-underline-offset:var(--focus-ring-offset)}

/* ══ Accounts ═══════════════════════════════════════════════════════ */
.acct-head,.acct-row{display:grid;
  grid-template-columns:1fr 108px 96px 88px 104px 96px 88px;
  gap:var(--space-2);align-items:center;padding:var(--space-1) 0}
.acct-head{font-size:var(--text-1);font-weight:var(--weight-medium);
  letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-muted);
  border-bottom:var(--rule-width) solid var(--rule)}
.acct-row{border-bottom:var(--rule-width) solid var(--rule-faint)}
.acct-row:last-child{border-bottom:0}
.acct-head span:not(:first-child),.acct-row .num{text-align:right}
/* fields are a hairline underline, never a box — same as the jump control */
.field{background:none;border:0;border-bottom:var(--rule-width) solid var(--rule);
  border-radius:var(--radius);font:inherit;font-size:var(--text-2);color:var(--ink);
  padding:var(--space-half) 0;width:100%;min-height:var(--control-target)}
.field.num{text-align:right;font-variant-numeric:tabular-nums}
.field:hover{border-bottom-color:var(--rule-strong)}
.field:focus{outline:none;border-bottom-color:var(--accent);
  box-shadow:0 var(--rule-width) 0 0 var(--accent)}
select.field{appearance:none;-webkit-appearance:none;cursor:pointer;color:var(--ink-secondary)}
.acct-row .archive{background:none;border:0;cursor:pointer;color:var(--ink-muted);
  min-height:var(--control-target);font-size:var(--text-2);text-align:right}
.acct-row .archive:hover{color:var(--negative)}
.acct-row .archive:focus-visible{outline:none;color:var(--focus-ink);text-decoration:underline;
  text-decoration-color:var(--focus-ink);text-decoration-thickness:var(--focus-ring-width);
  text-underline-offset:var(--focus-ring-offset)}
.actions{display:flex;gap:var(--space-4);flex-wrap:wrap;margin-top:var(--space-2)}
.actions button{background:none;border:0;padding:0;cursor:pointer;
  min-height:var(--control-target);font-size:var(--text-2);color:var(--ink-secondary)}
.actions button:hover{color:var(--ink)}
.actions button.danger{color:var(--negative)}
.actions button:focus-visible{outline:none;color:var(--focus-ink);text-decoration:underline;
  text-decoration-color:var(--focus-ink);text-decoration-thickness:var(--focus-ring-width);
  text-underline-offset:var(--focus-ring-offset)}

/* ── Shell ────────────────────────────────────────────────────────
   The rail sits on the same paper as the page, separated by a single
   hairline. No panel, no fill, no shadow — it recedes by being the
   same surface rather than a different one. */

/* ── Foot ─────────────────────────────────────────────────────────  */
/* Sits directly under the nav. Bottom-anchoring suited a rail that was its own
   slab; on shared paper it left a block of text orphaned at the foot of an empty
   column, and it is a long look for something glanced at. */
.railfoot{display:flex;flex-direction:column;gap:var(--space-2);
  padding-top:var(--space-3);border-top:var(--rule-width) solid var(--rule)}

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   Money — a weekly zero-based allocation ledger.
   Everything lives in localStorage. Nothing leaves this machine.
   ═══════════════════════════════════════════════════════════════════ */

const KEY='ccb.v1';
const WEEK_START=5;              // Friday — payday
const WPM=52/12;                 // weeks per month, for turning monthly minimums weekly
const MIN_DIVISOR=4;             // ...but the sheet has always split minimums 4 ways, so match it

/* ── tiny helpers ─────────────────────────────────────────────────── */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const n0=v=>{const x=typeof v==='number'?v:parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return Number.isFinite(x)?x:0};
const money=(n,dp=2)=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const money0=n=>money(n,0);
/* For values that live inside an <input>. Same shape as money() but with an
   ASCII hyphen, because n0() strips everything outside [0-9.-] and would read
   the typographic minus as a positive number. */
/* Editable figures are sized from their own contents. A fixed `ch` width
   clips the moment the number grows a digit, and the paycheck field was set
   narrower than the six characters a few hundred dollars and cents already
   needs -- the last digit was cut off in place, with nothing to say so.
   Separators are narrower than a digit even in tabular figures, so they
   count for less than a full ch rather than overshooting.

   No real figure goes in a comment: build.py refused this file when the
   first draft quoted one, which is the leak guard doing its job. */
const chSpan=v=>[...String(v)].reduce((w,c)=>w+(c==='.'||c===','?0.42:1),0);
const figureWidth=v=>`width:${(chSpan(v)+0.25).toFixed(2)}ch;field-sizing:content`;
const moneyInput=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(n,dp=1)=>(n*100).toFixed(dp)+'%';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

/* dates — everything is keyed to the Friday that starts the pay week */
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)};
const addWeeks=(s,n)=>addDays(s,n*7);
function weekStartOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  x.setDate(x.getDate()-((x.getDay()-WEEK_START+7)%7));return iso(x)}
const thisWeek=()=>weekStartOf(new Date());
const md=s=>{const d=parseISO(s);return`${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}`};
function weekLabel(k){return `${md(k)}–${md(addDays(k,6))}`}
function weekLong(k){const a=parseISO(k),b=parseISO(addDays(k,6));
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${M[a.getMonth()]} ${a.getDate()} – ${M[b.getMonth()]} ${b.getDate()}, ${b.getFullYear()}`}
function dueLabel(s){if(!s)return'';const d=parseISO(s);
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return`${M[d.getMonth()]} ${d.getDate()}`}
const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/864e5);

/* ── theme ────────────────────────────────────────────────────────
   Light by default; the choice is remembered per browser. */
const THEMEKEY='ccb.theme';
function currentTheme(){try{return localStorage.getItem(THEMEKEY)==='dark'?'dark':'light'}catch(e){return'light'}}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem(THEMEKEY,t)}catch(e){}
}
function toggleTheme(){
  applyTheme(currentTheme()==='dark'?'light':'dark');
  render();                     /* charts are drawn with resolved colours */
}
function themeBtnHTML(){
  const dark=currentTheme()==='dark';
  return `<button class="btn sm ghost" data-act="theme" title="${dark?'Switch to light':'Switch to dark'}"
    style="display:flex;align-items:center;gap:7px">${dark
      ? `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1M12.9 12.9l-1.1-1.1M4.2 4.2L3.1 3.1"/></svg>Light`
      : `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M13.5 9.6A6 6 0 1 1 6.4 2.5a4.8 4.8 0 0 0 7.1 7.1Z"/></svg>Dark`}</button>`;
}

/* ── state ────────────────────────────────────────────────────────── */
let S=null, UI={tab:'week', week:null, strategy:'avalanche', extra:null, histRange:'all', histMetric:'debt'};

/* ── remembering where you were ───────────────────────────────────
   UI lived only in memory, so every refresh dropped you back on This
   Week — mid-entry on the sheet, that is the wrong page.

   Split by how long each thing should outlive the tab. Which view you
   prefer is a lasting preference and goes to localStorage. WHICH WEEK
   you are on is a position in the data, and belongs to the sitting:
   sessionStorage survives a refresh, which is what was asked for, and
   clears when the tab closes — so opening the app next Friday lands on
   the current week rather than the one you were last looking at.

   Both are wrapped: storage throws outright in some privacy modes, and
   a ledger that will not open is a worse failure than a forgotten tab. */
const UI_KEY='ccb.ui', UI_LASTING=['tab','sheetMode','strategy','histRange','histMetric','dense','showOk','showArchived'];
const UI_SESSION=['week','month'];
let UI_LAST='';
function saveUI(){
  const keep={};for(const k of UI_LASTING)if(UI[k]!==undefined)keep[k]=UI[k];
  const pos={};for(const k of UI_SESSION)if(UI[k]!=null)pos[k]=UI[k];
  /* render() runs on every keystroke; only touch storage when this
     actually changed. */
  const sig=JSON.stringify([keep,pos]);
  if(sig===UI_LAST)return;
  UI_LAST=sig;
  try{
    localStorage.setItem(UI_KEY,JSON.stringify(keep));
    sessionStorage.setItem(UI_KEY,JSON.stringify(pos));
  }catch(e){}
}
function loadUI(){
  /* Declared out here on purpose: a `const` inside the try block is not in
     scope after it, and reading it below threw a ReferenceError that took
     boot() down with it before render() ever ran — a blank page, for the sake
     of remembering which tab you were on. */
  let stored={};
  try{
    stored=JSON.parse(localStorage.getItem(UI_KEY)||'{}');
    for(const k of UI_LASTING)if(stored[k]!==undefined)UI[k]=stored[k];
    const b=JSON.parse(sessionStorage.getItem(UI_KEY)||'{}');
    for(const k of UI_SESSION)if(b[k]!=null)UI[k]=b[k];
  }catch(e){}
  /* Never restore onto something that is no longer there. */
  /* An order set on the Plan tab is a decision; a default of `avalanche` is
     not. Only applies when nothing was stored — an explicit choice stands. */
  if(stored.strategy===undefined&&(S&&S.plan&&(S.plan.order||[]).length))UI.strategy='custom';
  if(UI.tab&&!TABS.some(t=>t.id===UI.tab))UI.tab='week';
  if(UI.week&&!(S&&S.weeks&&S.weeks[UI.week]))UI.week=null;
  if(UI.month&&!monthKeys().includes(UI.month))UI.month=null;
}

const GROUPS=[
  {id:'checking', label:'Checking'},
  {id:'buckets',  label:'Buckets & Sinking Funds'},
  {id:'savings',  label:'Savings'},
  {id:'loans',    label:'Loans'},
  {id:'cards',    label:'Credit Cards'},
];
const KIND_INFLOW=k=>k==='cash'||k==='savings';   // payments ADD to these
const KIND_DEBT=k=>k==='card'||k==='loan';        // payments SUBTRACT from these

function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);migrate();return true}}catch(e){console.warn('load failed',e)}
  /* the seed needs migrating too — it carries no plan, settings or account extras */
  S=JSON.parse(JSON.stringify(SEED));migrate();save();return false;
}
/* ── undo ─────────────────────────────────────────────────────────
   Cell edits fire on every keystroke, so one snapshot per save would make
   ctrl+Z walk back a character at a time. Snapshots coalesce by key: typing
   "300" into a cell is a single step, and touching a different cell starts a
   new one. Whole-state snapshots rather than diffs — the ledger is ~150KB, so
   the cap is what keeps this honest about memory. */
let UNDO=[],REDO=[],UNDO_KEY=null;
const UNDO_MAX=30;
const snapshot=()=>JSON.stringify({accounts:S.accounts,weeks:S.weeks,plan:S.plan,settings:S.settings});
function pushUndo(key){
  if(key!=null&&key===UNDO_KEY)return;
  UNDO_KEY=key;
  UNDO.push(snapshot());
  if(UNDO.length>UNDO_MAX)UNDO.shift();
  REDO.length=0;
}
function applySnapshot(json){
  const x=JSON.parse(json);
  S.accounts=x.accounts;S.weeks=x.weeks;S.plan=x.plan;S.settings=x.settings;
  UNDO_KEY=null;save();render();
}
function undo(){
  if(!UNDO.length){toast('Nothing left to undo');return}
  REDO.push(snapshot());applySnapshot(UNDO.pop());toast('Undone — ⇧⌘Z to put it back');
}
function redo(){
  if(!REDO.length){toast('Nothing to redo');return}
  UNDO.push(snapshot());applySnapshot(REDO.pop());toast('Redone');
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save — storage may be full')}
  if(typeof syncTouch==='function')syncTouch();
}

const acct=id=>S.accounts.find(a=>a.id===id);
const liveAccounts=()=>S.accounts.filter(a=>!a.archived).sort((a,b)=>a.order-b.order);
const weekKeys=()=>Object.keys(S.weeks).sort();
function currentWeek(){
  if(UI.week&&S.weeks[UI.week])return UI.week;
  const ks=weekKeys(),now=thisWeek();
  if(S.weeks[now])return now;
  const past=ks.filter(k=>k<=now);
  return past.length?past[past.length-1]:(ks[0]||now);

const isPlanned=k=>k>thisWeek();

function blankEntry(){return{balance:0,min:0,attack:0,other:0,out:0,minAmt:0,close:'',due:'',projected:null,paid:false}}
function entryOf(k,id){const w=S.weeks[k];if(!w)return blankEntry();
  if(!w.entries[id])w.entries[id]=blankEntry();
  const e=w.entries[id];for(const[p,d]of Object.entries(blankEntry()))if(e[p]===undefined)e[p]=d;
  return e}

/* ── the compute engine ───────────────────────────────────────────
   One pass over the week produces every derived number the old sheet
   had as a formula, for any number of accounts.
   ───────────────────────────────────────────────────────────────── */
function computeWeek(k){
  const w=S.weeks[k];
  if(!w)return null;
  const accts=liveAccounts();
  const rows=accts.map(a=>{
    const e=entryOf(k,a.id);
    const dpr=a.apr?a.apr/365:0;
    const bal=n0(e.balance);
    const row={a,e,dpr,balance:bal,min:n0(e.min),attack:n0(e.attack),other:n0(e.other),out:n0(e.out)};
    row.minAmt=n0(e.minAmt||a.minAmt);
    row.close=e.close||''; row.due=e.due||'';
    return row;
  });
  const byId=Object.fromEntries(rows.map(r=>[r.a.id,r]));

  /* the sheet's L4: whatever of this month's card minimums isn't being paid
     straight to the card gets parked in the minimums bucket */
  const cardRows=rows.filter(r=>r.a.kind==='card');
  for(const r of rows){
    if(r.a.autoOther==='cardMinShortfall'){
      const paidDirect=cardRows.reduce((s,c)=>s+c.min,0);
      r.other=r2(Math.max(0,r.minAmt-paidDirect));
      r.e.other=r.other;
    }
    /* `autoOut` names the account this bucket exists to pay. Whatever goes to
       that account this week is drawn out of the bucket, because that is where
       the money came from — the same idea as the minimums bucket, running the
       other way: that one fills the gap on the way in, this one records the
       drawdown on the way out.

       Capped at what the bucket actually holds. Paying more than it has is a
       real thing to do, but the excess came from general money, not from here,
       and a savings bucket that reads below zero is telling a lie about
       itself. */
    if(r.a.autoOut){
      const t=byId[r.a.autoOut];
      const paid=t?r2(t.min+t.attack+t.other):0;
      const target=n0(r.minAmt);
      /* This week's contribution pays first and the accumulated balance only
         covers what is left over — the same order the minimums bucket uses,
         and the order the spreadsheet used. It matters for what you read off
         the row: `Other` becomes what is ACTUALLY going in this week, rather
         than the full contribution with a separate withdrawal beside it
         cancelling part of it out. */
      r.other=r2(Math.max(0,target-paid));
      r.e.other=r.other;
      const fromPile=r2(Math.max(0,paid-target));
      r.out=r2(Math.min(fromPile,Math.max(0,r.balance)));
      r.e.out=r.out;
    }
  }

  /* the income row IS the paycheck cell — keep them the same number */
  for(const r of rows)if(r.a.kind==='income')r.balance=n0(w.income);
  for(const r of rows){
    r.total=r2(r.min+r.attack+r.other);
    /* A card in grace carries no interest — but only while the statement balance is
       paid in full by the due date. A partial payment ends it retroactively. */
    r.inGrace=!!(r.a.grace&&r.a.kind==='card'&&r.balance>0);
    /* BUG 1 from the handoff: the sheet computed balance − payment and never applied
       interest, under-forecasting by ~$214/week. End-of-week = opening + interest − paid. */
    r.weekInterest=(KIND_DEBT(r.a.kind)&&!r.inGrace&&S.settings.accrueInterest)
      ?r2(r.balance*r.dpr*7):0;
    if(r.a.kind==='income'){r.after=r.balance}
    /* A bucket's balance is what went in less what has since left it. `out` is
       money leaving on its way somewhere else — a subscription hitting the
       card, a minimum actually paid — and it is NOT an allocation: the
       paycheck spent that dollar the week it went in, not the week it left.
       So `out` stays out of `total`, and the week still balances to zero.

       A passthrough is the same idea with the typing removed: funded and
       emptied every week, so it never holds anything. */
    else if(KIND_INFLOW(r.a.kind)){
      r.after=r.a.passthrough?r2(r.balance):r2(r.balance+r.total-n0(r.out));
    }
    else{r.after=r2(r.balance+r.weekInterest-r.total)}
    if(r.a.limit>0&&r.a.kind==='card'){
      r.usage=r.balance/r.a.limit;
      r.usageAfter=r.after/r.a.limit;
      r.availAfter=r2(r.a.limit-r.after);
    }
    r.minLeft=r.minAmt?r2(r.minAmt-r.total):0;
    if(r.a.target){
      const t=r.a.target;
      r.targetPct=t.amount?clamp(r.after/t.amount,0,1):0;
      r.targetShort=r2(Math.max(0,t.amount-r.after));
      r.targetDone=r.after+0.005>=t.amount;
      r.targetWeeks=r.targetDone?0:(r.total>0?Math.ceil(r.targetShort/r.total):Infinity);
    }
    /* 6 months out at this week's rate — the sheet's Q column, ×26 weeks */
    if(KIND_INFLOW(r.a.kind))r.sixMo=r.a.passthrough?r2(r.balance)
      :r2(r.balance+(r.total-(n0(r.out)||n0(r.a.weeklyOutflow)))*26);
    else if(KIND_DEBT(r.a.kind))r.sixMo=r2(Math.max(0,projectDebt(r.balance,r.dpr,r.total,26)));
    r.drift=(r.e.projected!=null)?r2(r.balance-n0(r.e.projected)):null;
  }
  /* rollup rows mirror the sum of their children and never spend twice */
  for(const r of rows){
    if(r.a.rollup&&r.a.rollup.length){
      const kids=r.a.rollup.map(id=>byId[id]).filter(Boolean);
      r.isRollup=true;
      r.balance=r2(kids.reduce((s,x)=>s+x.balance,0));
      r.total=r2(kids.reduce((s,x)=>s+x.total,0));
      r.out=r2(kids.reduce((s,x)=>s+n0(x.out),0));
      r.after=r2(kids.reduce((s,x)=>s+x.after,0));
    }
  }
  const income=n0(w.income);
  /* A payment funded out of a bucket is not a fresh call on this paycheck —
     the paycheck already spent that dollar the week it went into the bucket.
     Where a bucket is LINKED to the account it pays, the sheet holds both
     sides of the same money, so the drawdown cancels the payment and the week
     still balances. Only linked buckets net off: a hand-typed Out is money
     leaving for something the sheet does not otherwise record, and there is
     nothing to double count. */
  const fundedFromBuckets=r2(rows.filter(r=>r.a.autoOut&&!r.isRollup)
    .reduce((s,r)=>s+n0(r.out),0));
  const allocated=r2(rows.filter(r=>!r.isRollup&&r.a.kind!=='income')
    .reduce((s,r)=>s+r.total,0)-fundedFromBuckets);
  const unallocated=r2(income-allocated);

  const cards=rows.filter(r=>r.a.kind==='card');
  const debts=rows.filter(r=>KIND_DEBT(r.a.kind));
  const buckets=rows.filter(r=>!r.isRollup&&KIND_INFLOW(r.a.kind));
  const totals={
    income, allocated, unallocated,
    limit:r2(cards.reduce((s,r)=>s+n0(r.a.limit),0)),
    cardBalance:r2(cards.reduce((s,r)=>s+r.balance,0)),
    cardAfter:r2(cards.reduce((s,r)=>s+r.after,0)),
    debtBalance:r2(debts.reduce((s,r)=>s+r.balance,0)),
    debtAfter:r2(debts.reduce((s,r)=>s+r.after,0)),
    debtPaid:r2(debts.reduce((s,r)=>s+r.total,0)),
    /* Partitioned by row KIND, not by column, so every dollar lands in exactly
       one bucket. Summing a column across all rows counted a cash account's
       Min and Attack twice — once here and again in savingsIn — and left the
       Other column on a debt row in no bucket at all. */
    minPaid:r2(debts.reduce((s,r)=>s+r.min,0)),
    attack:r2(debts.reduce((s,r)=>s+r.attack,0)),
    otherDebt:r2(debts.reduce((s,r)=>s+r.other,0)),
    weekInterest:r2(debts.reduce((s,r)=>s+r.weekInterest,0)),
    availAfter:r2(cards.reduce((s,r)=>s+n0(r.availAfter),0)),
  };
  totals.usage=totals.limit?totals.cardBalance/totals.limit:0;
  totals.usageAfter=totals.limit?totals.cardAfter/totals.limit:0;
  totals.avgUsageAfter=cards.length?cards.reduce((s,r)=>s+n0(r.usageAfter),0)/cards.length:0;
  /* a bucket's whole contribution, whichever column it was entered in */
  /* A bucket flagged `fundsDebt` is a staging account for debt — money lands
     there on its way to a card, not as savings. It is partitioned out of
     savingsIn so the allocation bar does not read it as money set aside.

     `debtPaid` deliberately stays as it was: money that actually reached a
     debt row this week. The weekly check compares it against interest to say
     whether the debt moved, and a dollar sitting in a bucket has not moved
     any debt yet. `debtFunded` is the wider figure — everything committed to
     debt — and that is what the projections should run on. */
  const debtBuckets=buckets.filter(r=>r.a.fundsDebt);
  totals.savingsIn=r2(buckets.filter(r=>!r.a.fundsDebt).reduce((s,r)=>s+r.total,0));
  totals.debtBucket=r2(debtBuckets.reduce((s,r)=>s+r.total,0));
  totals.debtFunded=r2(totals.debtPaid+totals.debtBucket);

  return {key:k, rows, byId, totals, checks:runChecks(k,rows,totals)};
}

/* one debt, n weeks of interest and payment */
function projectDebt(bal,dpr,weekly,weeks){
  let b=bal;const f=1+dpr*7;
  for(let i=0;i<weeks&&b>0;i++)b=b*f-weekly;
  return b>0?b:0;
}
/* weeks until a debt clears — Infinity if the payment can't outrun the interest */
function weeksToClear(bal,dpr,weekly){
  if(bal<=0)return 0;
  if(weekly<=bal*dpr*7)return Infinity;
  let b=bal,w=0;const f=1+dpr*7;
  while(b>0&&w<5200){b=b*f-weekly;w++}
  return b<=0?w:Infinity;
}
const weeksToMonths=w=>w===Infinity?Infinity:w/WPM;
function monthsLabel(m){
  if(m===Infinity)return'never';
  if(m<1)return'<1 mo';
  if(m<24)return`${Math.round(m)} mo`;
  const y=Math.floor(m/12),r=Math.round(m%12);
  return r?`${y}y ${r}m`:`${y}y`;
}
function dateAfterWeeks(from,w){
  if(w===Infinity)return null;
  return addWeeks(from,Math.ceil(w));
}
function shortMY(s){const d=parseISO(s);
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return`${M[d.getMonth()]} '${String(d.getFullYear()).slice(2)}`}
function longDate(s){const d=parseISO(s);
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return`${M[d.getMonth()]} ${d.getFullYear()}`}

/* ── weekly plan checks ───────────────────────────────────────────── */
function runChecks(k,rows,T){
  const out=[];
  const off=Math.abs(T.unallocated);
  if(off<0.005)out.push({s:'ok',t:`Every dollar has a job. ${money(T.income)} in, ${money(T.allocated)} out, ${money(0)} left over.`});
  else if(T.unallocated>0)out.push({s:'warn',t:`<b>${money(T.unallocated)} unallocated.</b> The sheet only balanced when this hit zero — give it somewhere to go.`});
  else out.push({s:'bad',t:`<b>Over-allocated by ${money(off)}.</b> You're spending more than the ${money(T.income)} that came in.`});

  /* minimums: has enough gone toward this card since its last statement closed? */
  const today=thisWeek();
  for(const r of rows){
    if(!KIND_DEBT(r.a.kind)||!r.minAmt)continue;
    const cyclePaid=paidSinceClose(k,r);
    if(cyclePaid+0.005>=r.minAmt)continue;
    const short=r2(r.minAmt-cyclePaid);
    if(r.due&&r.due<addDays(k,7)&&r.due>=k)
      out.push({s:'bad',t:`<b>${esc(r.a.name)} is ${money(short)} short</b> of its ${money(r.minAmt)} minimum and due ${dueLabel(r.due)} — inside this week.`});
    else if(r.due&&r.due<today)
      out.push({s:'bad',t:`<b>${esc(r.a.name)} minimum was due ${dueLabel(r.due)}</b> and is still ${money(short)} short.`});
    else
      out.push({s:'warn',t:`${esc(r.a.name)} needs ${money(short)} more before ${r.due?dueLabel(r.due):'its due date'} to clear the ${money(r.minAmt)} minimum.`});
  }
  /* The shortfall loop above skips anything with no minimum recorded, so a
     card sitting at $0 produces no check at all — silence exactly where the
     sheet knows least. It cannot know the figure, but it does know when the
     statement closes, which is when you find out. Asked for only in the week
     a statement closes, or the week after if it is still missing, so it is a
     prompt at the right moment rather than a standing complaint. */
  for(const r of rows){
    if(!KIND_DEBT(r.a.kind)||r.balance<=0.005||n0(r.minAmt)||!r.close)continue;
    if(r.close<addDays(k,-7)||r.close>=addDays(k,7))continue;
    const already=r.close<k;
    out.push({s:'warn',t:`<b>${esc(r.a.name)} ${already?`closed ${dueLabel(r.close)}`:`closes ${dueLabel(r.close)}`} `
      +`and has no minimum recorded.</b> Put it in Min due /mo — until it is there nothing can tell you `
      +`if it goes unpaid, and the payoff date assumes you are paying it nothing.`});
  }
  /* Subscriptions land on a card whether or not the bucket has the money for
     them. The schedule itself lives on Plan — a recurring charge you expect is
     reference, not an alarm — so this speaks only when what bills this week is
     more than the bucket holds. */
  {
    const hits=subsInWeek(k);
    if(hits.length){
      const due=r2(hits.reduce((t,x)=>t+x.amount,0));
      const bucket=rows.find(r=>r.a.id==='subscriptions');
      const held=bucket?r2(bucket.balance+bucket.total):0;
      if(due>held+0.005)
        out.push({s:'warn',t:`<b>${money(due)} of subscriptions bill this week</b> and the bucket `
          +`holds ${money(held)} — ${money(r2(due-held))} short. `
          +hits.map(x=>`${esc(x.name)} ${money(x.amount)} on ${dueLabel(x.date)}`).join(', ')+`.`});
    }
  }
  /* over limit, and utilization that'll get reported */
  for(const r of rows.filter(x=>x.a.kind==='card'&&x.a.limit>0)){
    if(r.after>r.a.limit)out.push({s:'bad',t:`<b>${esc(r.a.name)} is over its limit</b> — ${money(r.after)} against ${money0(r.a.limit)} after this week's payment.`});
    else if(r.close&&r.close>=k&&r.close<addDays(k,7)&&r.usageAfter>0.3)
      out.push({s:'warn',t:`${esc(r.a.name)} closes ${dueLabel(r.close)} at <b>${pct(r.usageAfter)}</b> utilization — that's the number that gets reported.`});
  }
  /* cash that goes negative */
  for(const r of rows.filter(x=>x.a.kind==='cash'&&!x.isRollup)){
    if(r.after<-0.005)out.push({s:'bad',t:`<b>${esc(r.a.name)} lands at ${money(r.after)}</b> — negative after this week.`});
  }
  /* grace cards: free to carry, ruinous to underpay */
  for(const r of rows.filter(x=>x.inGrace)){
    if(r.total>0.005&&r.total+0.005<r.balance)
      out.push({s:'bad',t:`<b>${esc(r.a.name)} is being paid ${money(r.total)} against a ${money(r.balance)} balance.</b> A partial payment ends grace and ${pct(n0(r.a.apr),2)} applies to the whole balance retroactively — pay it in full or leave it alone.`});
    else if(r.total+0.005>=r.balance)
      out.push({s:'ok',t:`${esc(r.a.name)} paid in full at ${money(r.balance)} — grace intact, ${money(0)} of interest.`});
    else
      out.push({s:'warn',t:`<b>${esc(r.a.name)}: ${money(r.balance)} due in full by ${r.a.graceDue?dueLabel(r.a.graceDue):(r.due?dueLabel(r.due):'the due date')}.</b> In grace, so it costs nothing to carry — but it has to go all at once.`});
  }
  /* sinking funds against their target date */
  for(const r of rows.filter(x=>x.a.target&&!x.isRollup)){
    const t=r.a.target;
    if(r.targetDone){
      out.push({s:'ok',t:`${esc(r.a.name)} is funded at ${money(r.after)} of ${money(t.amount)}${t.frees?` — <b>${money(t.frees)}/week frees up</b>`:''}.`});
      continue;
    }
    if(!t.by)continue;
    const wksLeft=Math.max(0,Math.ceil(daysBetween(k,t.by)/7));
    const need=wksLeft?r2(r.targetShort/wksLeft):r.targetShort;
    if(r.total+0.005>=need)
      out.push({s:'ok',t:`${esc(r.a.name)} on track — ${money(r.targetShort)} to go by ${dueLabel(t.by)}, ${money(need)}/week needed and ${money(r.total)} going in.`});
    else
      out.push({s:'warn',t:`<b>${esc(r.a.name)} is behind</b> — ${money(r.targetShort)} short with ${wksLeft} week${wksLeft===1?'':'s'} to ${dueLabel(t.by)}. Needs ${money(need)}/week, getting ${money(r.total)}.`});
  }
  /* anything on the calendar that lands inside this pay week */
  const end=addDays(k,7);
  for(const c of (S.plan?.calendar||[]).filter(c=>!c.done&&c.d>=k&&c.d<end))
    out.push({s:'warn',t:`<b>${dueLabel(c.d)} — ${esc(c.t)}</b>${c.n?` · ${esc(c.n)}`:''}`});

  /* the thing the old sheet could never show: are you actually going backwards? */
  if(T.debtBalance>0&&T.debtAfter>T.debtBalance+0.005)
    out.push({s:'bad',t:`<b>Total debt grows ${money(r2(T.debtAfter-T.debtBalance))} this week.</b> ${money(T.debtPaid)} of payments against ${money(T.weekInterest)} of interest — you end the week owing ${money(T.debtAfter)}.`});
  else if(T.debtBalance>0&&T.debtPaid>0)
    out.push({s:'ok',t:`Debt drops ${money(r2(T.debtBalance-T.debtAfter))} — ${money(T.debtPaid)} paid clears the ${money(T.weekInterest)} of interest and ${money(r2(T.debtPaid-T.weekInterest))} of principal.`});

  /* a maxed card creeping toward its limit on interest alone */
  for(const r of rows.filter(x=>x.a.kind==='card'&&x.a.limit>0&&x.balance>0&&x.after>x.balance+0.005)){
    let b=r.after,w=1;
    while(b<=r.a.limit&&w<520){b=b*(1+r.dpr*7)-r.total;w++}
    if(w<520&&w<=26)
      out.push({s:w<=8?'bad':'warn',t:`<b>${esc(r.a.name)} breaches its limit in about ${w} week${w===1?'':'s'}</b> — ${money(r.after)} against ${money0(r.a.limit)}, growing ${money(r.weekInterest)}/week with ${money(r.total)} going in. Nothing new should go on this card.`});
  }

  if(T.attack<=0&&T.debtBalance>0)
    out.push({s:'warn',t:`No attack money this week. Minimums alone cost you ${money(T.weekInterest)} in interest over the next 7 days.`});
  return out;
}
/* Everything paid toward this debt in the cycle the current minimum belongs to.
   The cycle is anchored on the due date (loans have no statement close) and runs
   the month before it — so four weekly payments of a quarter-minimum add up. */
/* What has gone to this account since its statement last closed.

   This took the stored date and stepped back exactly one month, which puts
   the window's start AFTER the current week whenever the next due date is
   more than a month out — an empty range, a sum of zero, and a minimum that
   reads as unpaid no matter what you actually paid. A card due in November
   could never register a payment made in September.

   It walks back a month at a time until the cycle start is not in the future,
   and anchors to the pay week containing it rather than to the bare date:
   weeks are keyed by their Friday, so a close falling mid-week would
   otherwise exclude the very week it belongs to. `close` leads because the
   cycle is defined by the statement closing, not by when it comes due. */
function paidSinceClose(k,r){
  const anchor=r.close||r.due;
  let from=k;
  if(anchor){
    const d=parseISO(anchor);
    let guard=0;
    do{d.setMonth(d.getMonth()-1)}while(weekStartOf(d)>k&&guard++<60);
    from=weekStartOf(d);
  }
  return r2(weekKeys().filter(w=>w>=from&&w<=k)
    .reduce((s,w)=>{const e=S.weeks[w].entries[r.a.id];return s+(e?n0(e.min)+n0(e.attack)+n0(e.other):0)},0));
}
