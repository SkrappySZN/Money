<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Money</title>
<style>
/* ── Tokens ────────────────────────────────────────────────────────
   Light is the default because money is anxious enough without a
   black screen. Dark is a real second theme, stepped for its own
   ground rather than an inverted copy. Both chart palettes are
   validated for CVD separation against their own surface.
   ─────────────────────────────────────────────────────────────── */
:root{
  color-scheme:light;
  --plane:#faf9f7; --surface:#ffffff; --surface-2:#f5f3f0; --surface-3:#eae7e2;
  --ink:#1b1a18; --ink-2:#4f4b45; --muted:#8a847c;
  --hair:rgba(24,20,14,.09); --hair-2:rgba(24,20,14,.17); --row-hair:rgba(24,20,14,.055);
  --axis:#e2ded8; --scrim:rgba(38,34,28,.34);

  --accent:#4c63d2; --accent-2:#3f54bd; --accent-ink:#3a4db3;
  --accent-bg:rgba(76,99,210,.09); --accent-line:rgba(76,99,210,.28);

  --good:#0f8a52; --good-ink:#0b6b3f;
  --good-bg:rgba(15,138,82,.10); --good-line:rgba(15,138,82,.26);
  --warn:#b06a06; --warn-ink:#8c5305;
  --warn-bg:rgba(176,106,6,.10); --warn-line:rgba(176,106,6,.28);
  --bad:#c0392b; --bad-ink:#9c2b20;
  --bad-bg:rgba(192,57,43,.08); --bad-line:rgba(192,57,43,.26);
  --attack:#c85a2a; --attack-bg:rgba(200,90,42,.10); --attack-line:rgba(200,90,42,.30);

  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --spark-down:#0f8a52; --spark-up:#c85a2a;

  --t-xs:12px; --t-sm:13.5px; --t-base:15px; --t-md:16px; --t-lg:19px;
  --t-xl:24px; --t-2xl:29px; --t-3xl:37px;
  --sp-1:4px; --sp-2:8px; --sp-3:13px; --sp-4:18px; --sp-5:24px; --sp-6:34px; --sp-7:52px;
  --r-1:10px; --r-2:14px; --r-3:18px; --r-4:24px; --r-f:999px;
  --sh-1:0 1px 2px rgba(28,24,18,.05), 0 1px 1px rgba(28,24,18,.03);
  --sh-2:0 8px 24px -10px rgba(28,24,18,.18);
  --sh-3:0 24px 56px -20px rgba(28,24,18,.28);
  --ease:cubic-bezier(.22,1,.36,1); --ease-s:cubic-bezier(.4,0,.2,1);
  --d1:120ms; --d2:220ms; --d3:340ms;
  --row-h:42px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#16181d; --surface:#1c1f26; --surface-2:#23272f; --surface-3:#2d323b;
  --ink:#eef0f3; --ink-2:#b4b9c2; --muted:#828892;
  --hair:rgba(255,255,255,.085); --hair-2:rgba(255,255,255,.17); --row-hair:rgba(255,255,255,.05);
  --axis:#333844; --scrim:rgba(8,9,12,.7);

  --accent:#7d90f0; --accent-2:#5f74e0; --accent-ink:#9aa9f5;
  --accent-bg:rgba(125,144,240,.14); --accent-line:rgba(125,144,240,.34);

  --good:#43be6d; --good-ink:#6fd192;
  --good-bg:rgba(67,190,109,.13); --good-line:rgba(67,190,109,.30);
  --warn:#e0a33a; --warn-ink:#eebb63;
  --warn-bg:rgba(224,163,58,.13); --warn-line:rgba(224,163,58,.32);
  --bad:#e26d64; --bad-ink:#ef918a;
  --bad-bg:rgba(226,109,100,.12); --bad-line:rgba(226,109,100,.30);
  --attack:#e5834f; --attack-bg:rgba(229,131,79,.13); --attack-line:rgba(229,131,79,.32);

  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --spark-down:#43be6d; --spark-up:#e5834f;

  --sh-1:0 1px 2px rgba(0,0,0,.28);
  --sh-2:0 8px 24px -10px rgba(0,0,0,.5);
  --sh-3:0 24px 56px -20px rgba(0,0,0,.62);
}
@media(prefers-reduced-motion:reduce){:root{--d1:1ms;--d2:1ms;--d3:1ms}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--plane);color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
 font-size:var(--t-base);line-height:1.6;-webkit-font-smoothing:antialiased;
 -moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
 transition:background var(--d2) var(--ease-s),color var(--d2) var(--ease-s)}
.num,td.num,th.num,.tile .v,.big,.hero,input.cell,.pill,.chip .cv,.tl .tlv,.axl,.rrow .rv{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-bg)}
h1,h2,h3,h4{margin:0;font-weight:640;letter-spacing:-.015em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--accent-ink);text-decoration:none}

/* ── shell ───────────────────────────────────────────────────────── */
.shell{display:flex;min-height:100vh;align-items:stretch}
.rail{flex:0 0 218px;width:218px;border-right:1px solid var(--hair);padding:var(--sp-5) var(--sp-4);
 display:flex;flex-direction:column;gap:var(--sp-5);position:sticky;top:0;height:100vh;background:var(--surface)}
.brand{font-size:var(--t-lg);font-weight:680;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.brand .dot{width:8px;height:8px;border-radius:var(--r-f);background:var(--good);
 box-shadow:0 0 0 3px var(--good-bg);flex:0 0 auto}
.brand .dot.warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
.brand .dot.bad{background:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-1);
 color:var(--ink-2);font-size:var(--t-sm);font-weight:520;text-align:left;
 transition:background var(--d1) var(--ease-s),color var(--d1)}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-bg);color:var(--accent-ink);font-weight:600}
.nav .k{margin-left:auto;font-size:var(--t-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.nav button.on .k{color:var(--accent-ink);opacity:.7}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.railstat{font-size:var(--t-xs);color:var(--muted);line-height:1.55}
.main{flex:1;min-width:0;padding:var(--sp-6) var(--sp-6) var(--sp-7)}
.wrap{max-width:1180px;margin:0 auto}
.head{display:flex;align-items:flex-end;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-5)}
.head h1{font-size:var(--t-2xl)}
.sub{color:var(--muted);font-size:var(--t-sm)}
.spacer{flex:1}

/* ── controls ────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r-1);
 background:var(--surface);border:1px solid var(--hair);font-size:var(--t-sm);font-weight:540;
 box-shadow:var(--sh-1);
 transition:background var(--d1) var(--ease-s),border-color var(--d1),transform var(--d1)}
.btn:hover{background:var(--surface-2);border-color:var(--hair-2)}
.btn:active{transform:translateY(.5px)}
.btn.pri{background:var(--accent);border-color:transparent;color:#fff;box-shadow:var(--sh-1)}
.btn.pri:hover{background:var(--accent-2)}
.btn.ghost{background:none;box-shadow:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:var(--t-xs)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--hair);border-radius:var(--r-1);padding:3px;gap:3px}
.seg button{padding:5px 12px;border-radius:7px;font-size:var(--t-xs);font-weight:560;color:var(--muted);
 transition:background var(--d1),color var(--d1)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
select,input[type=text],input[type=number],input[type=date]{font:inherit;background:var(--surface);
 color:var(--ink);border:1px solid var(--hair);border-radius:var(--r-1);padding:7px 10px;font-size:var(--t-sm);
 transition:border-color var(--d1),box-shadow var(--d1)}
select:hover,input:hover{border-color:var(--hair-2)}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);outline:none}

/* ── cards / tiles ───────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-3);
 padding:var(--sp-5);box-shadow:var(--sh-1)}
.card + .card{margin-top:var(--sp-4)}
.card h3{font-size:var(--t-md);margin-bottom:var(--sp-1)}
/* sentence case, not shouted */
.card .cap{color:var(--ink-2);font-size:var(--t-sm);font-weight:620;letter-spacing:-.005em}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-4)}
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-2);
 padding:var(--sp-4);box-shadow:var(--sh-1)}
.tile .l{font-size:var(--t-xs);color:var(--muted);font-weight:560}
.tile .v{font-size:var(--t-xl);font-weight:660;letter-spacing:-.025em;margin-top:6px;line-height:1.2}
.tile .d{font-size:var(--t-xs);color:var(--ink-2);margin-top:4px;line-height:1.5}
.tile.good .v{color:var(--good)} .tile.bad .v{color:var(--bad)} .tile.warn .v{color:var(--warn)}
.hero{font-size:var(--t-3xl);font-weight:680;letter-spacing:-.03em;line-height:1.1}

/* ── the week grid ───────────────────────────────────────────────── */
/* overflow-x:auto makes the browser compute overflow-y:auto too, so this wrapper
   is the sticky containing block — but with no height cap it never scrolled, and
   the header rode off the page with it. The cap gives sticky something to stick
   inside. max() so a short window cannot collapse the grid to a few rows. */
.gridwrap{overflow:auto;max-height:max(420px,70vh);
  border-radius:var(--r-2);border:1px solid var(--hair);background:var(--surface)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:960px;font-size:var(--t-sm)}
table.grid th{position:sticky;top:0;z-index:3;background:var(--surface-2);color:var(--muted);
 font-size:var(--t-xs);font-weight:600;text-align:right;padding:11px 12px;
 border-bottom:1px solid var(--hair);white-space:nowrap}
table.grid th:first-child{text-align:left;position:sticky;left:0;z-index:4}
table.grid td{padding:0 12px;height:var(--row-h);border-bottom:1px solid var(--row-hair);
 text-align:right;white-space:nowrap}
/* The account column had 18.7px of headroom on the longest name and the table
   had zero horizontal slack. Cap it so one long name cannot start a scroll. */
table.grid td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:2;font-weight:530}
/* The cap goes on a block box inside the cell, never on the cell itself. A
   max-width on a table cell is advisory — table-layout:auto sizes columns from
   content and ignores it, so the column grows past the cap and never
   ellipsises. Shipped once on the cell and it did nothing: a 28-character name
   rendered at 221.8px against a 210px cap, untruncated. */
table.grid td:first-child > .acct{display:block;max-width:210px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.grid tr:hover td{background:var(--surface-2)}
table.grid tr:hover td:first-child{background:var(--surface-2)}
tr.sect td{background:var(--plane)!important;color:var(--muted);font-size:var(--t-xs);
 font-weight:640;height:34px;border-bottom:1px solid var(--hair)}
tr.tot td{font-weight:660;background:var(--surface-2)!important;border-top:1px solid var(--hair-2)}
tr.rollup td{color:var(--ink-2)}
tr.rollup td:first-child{padding-left:28px;font-weight:450;font-style:italic}
tr.child td:first-child{padding-left:28px;font-weight:450}
td.dim{color:var(--muted)}
td.pos{color:var(--good)} td.neg{color:var(--bad)}
input.cell{width:88px;text-align:right;background:transparent;border:1px solid transparent;border-radius:7px;
 padding:4px 7px;color:var(--ink);font:inherit;font-size:var(--t-sm);box-shadow:none;
 transition:border-color var(--d1),background var(--d1)}
input.cell:hover{border-color:var(--hair)}
input.cell:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-bg);outline:none}
input.cell.zero{color:var(--muted)}
input.cell.atk{color:var(--attack);font-weight:600}
input.cell.atk.zero{color:var(--muted);font-weight:450}
td.dcell{position:relative}
td.dcell.empty::after{content:'—';position:absolute;right:14px;top:50%;transform:translateY(-50%);
 color:var(--muted);pointer-events:none;transition:opacity var(--d1)}
td.dcell.empty input{color:transparent}
td.dcell.empty:hover::after,tr:hover td.dcell.empty::after{opacity:0}
td.dcell.empty:hover input,tr:hover td.dcell.empty input{color:var(--muted)}
td.dcell input:focus{color:var(--ink)}
.drift{display:inline-block;margin-left:6px;font-size:11px;padding:1px 6px;border-radius:5px;
 font-weight:600;vertical-align:1px}
.drift.up{background:var(--bad-bg);color:var(--bad-ink)}
.drift.dn{background:var(--good-bg);color:var(--good-ink)}
.bar{position:relative;display:inline-block;width:54px;height:6px;border-radius:4px;
 background:var(--surface-3);vertical-align:middle;margin-right:8px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--good);
 transition:width var(--d2) var(--ease)}
.bar i.mid{background:var(--s4)} .bar i.hi{background:var(--attack)} .bar i.max{background:var(--bad)}

/* ── allocation meter ────────────────────────────────────────────── */
.alloc{display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap}
.allocbar{flex:1;min-width:260px;height:30px;border-radius:var(--r-1);background:var(--surface-3);
 display:flex;overflow:hidden;gap:2px}
.allocbar{position:relative}
.allocbar span{display:block;height:100%;transition:width var(--d3) var(--ease)}
/* where the paycheck ran out */
.paycheck-line{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad);pointer-events:none}
/* everything past it — a print mark, not a fill */
/* The overrun always keys to --bad, never to the segment it overflows. Its own
   opaque ground, so nothing beneath can tint it — a green Buckets segment
   underneath must not make a breach read as savings. */
.overrun{position:absolute;top:0;bottom:0;pointer-events:none;
  background:repeating-linear-gradient(135deg,
    var(--bad) 0 1px,var(--surface-3) 1px 5px)}
.allocbar span:first-child{border-radius:var(--r-1) 0 0 var(--r-1)}
.allocbar span:last-child{border-radius:0 var(--r-1) var(--r-1) 0}
.legend{display:flex;gap:var(--sp-4);flex-wrap:wrap;font-size:var(--t-xs);color:var(--ink-2);
 margin-top:var(--sp-3);line-height:1.7}
.legend .k{display:flex;align-items:center;gap:7px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.legend b{color:var(--ink);font-weight:620}

/* ── checks ──────────────────────────────────────────────────────
   Attention is a left rule and an icon, not a wall of red. Colour is
   the last signal, never the only one.
   ─────────────────────────────────────────────────────────────── */
.chkgroup{margin-top:var(--sp-4)}
.chkhead{display:flex;align-items:center;gap:9px;font-size:var(--t-sm);font-weight:620;
 color:var(--ink-2);margin-bottom:var(--sp-2)}
.chkhead .count{font-size:var(--t-xs);font-weight:600;color:var(--muted);
 background:var(--surface-2);border-radius:var(--r-f);padding:1px 9px}
.chkhead.tap{cursor:pointer;user-select:none}
.chkhead.tap:hover{color:var(--ink)}
.chkhead .caret{transition:transform var(--d2) var(--ease);color:var(--muted)}
.chkhead.open .caret{transform:rotate(90deg)}
.checks{display:flex;flex-direction:column;gap:7px}
.chk{display:flex;align-items:flex-start;gap:11px;font-size:var(--t-sm);padding:11px 14px;
 border-radius:var(--r-1);background:var(--surface-2);line-height:1.55;
 border-left:3px solid transparent}
.chk .ic{flex:0 0 auto;width:16px;height:16px;margin-top:2px}
.chk.ok{color:var(--ink-2);background:transparent;padding:6px 14px}
.chk.ok .ic{color:var(--good)}
.chk.warn{background:var(--warn-bg);border-left-color:var(--warn)}
.chk.warn .ic{color:var(--warn)}
.chk.bad{background:var(--bad-bg);border-left-color:var(--bad)}
.chk.bad .ic{color:var(--bad)}
.chk b{font-weight:640;color:var(--ink)}

/* ── charts ──────────────────────────────────────────────────────── */
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.axl{fill:var(--muted);font-size:11px}
.gridline{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}
.zeroline{stroke:var(--hair-2);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--hair-2);
 border-radius:var(--r-1);padding:9px 12px;font-size:var(--t-xs);box-shadow:var(--sh-2);z-index:20;
 white-space:nowrap;opacity:0;transition:opacity var(--d1);line-height:1.6;color:var(--ink)}
.tip.on{opacity:1}
.tip .tt{font-weight:660;font-size:var(--t-sm);margin-bottom:3px}
.tip .tr{display:flex;gap:16px;justify-content:space-between}
.tip .tr span:first-child{color:var(--muted)}
.tip .tr .tv{font-variant-numeric:tabular-nums;font-weight:600}
.crosshair{stroke:var(--hair-2);stroke-width:1;stroke-dasharray:3 3}
.sparks{display:grid;grid-template-columns:repeat(auto-fit,minmax(216px,1fr));gap:var(--sp-3)}
.spark{background:var(--surface-2);border:1px solid var(--hair);border-radius:var(--r-2);padding:var(--sp-3) var(--sp-4)}
.spark .sn{font-size:var(--t-sm);font-weight:620;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.spark .sv{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:var(--t-xs)}
.spark .sd{font-size:var(--t-xs);margin-top:2px}
.spark svg{margin-top:8px;height:38px}

/* ── ranked list (attack / payoff / plan) ────────────────────────── */
.rank{display:flex;flex-direction:column;gap:var(--sp-2)}
.rrow{display:grid;grid-template-columns:30px 1fr auto;gap:var(--sp-3);align-items:center;
 background:var(--surface-2);border:1px solid transparent;border-radius:var(--r-2);padding:13px var(--sp-4);
 transition:border-color var(--d1),background var(--d1)}
.rrow.top{border-color:var(--accent-line);background:var(--accent-bg)}
.rrow .n{font-size:var(--t-md);font-weight:660;color:var(--muted);text-align:center}
.rrow.top .n{color:var(--accent-ink)}
.rrow .nm{font-weight:620}
.rrow .meta{font-size:var(--t-xs);color:var(--muted);margin-top:2px;line-height:1.5}
.rrow .rt{text-align:right}
.rrow .rt .rv{font-weight:660;font-size:var(--t-md)}
.rrow .rt .rl{font-size:var(--t-xs);color:var(--muted)}
.tl{display:flex;flex-direction:column;gap:11px}
.tlr{display:grid;grid-template-columns:140px 1fr 96px;gap:var(--sp-3);align-items:center;font-size:var(--t-sm)}
.tlr .tln{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlbar{height:18px;background:var(--surface-3);border-radius:6px;overflow:hidden;position:relative}
.tlbar i{display:block;height:100%;border-radius:6px;background:var(--s1);transition:width var(--d3) var(--ease)}
.tlbar i.never{background:repeating-linear-gradient(45deg,var(--bad),var(--bad) 4px,var(--bad-bg) 4px,var(--bad-bg) 9px)}
.tlv{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ── accounts editor ─────────────────────────────────────────────── */
.acct{display:grid;grid-template-columns:1fr 116px 96px 98px 100px 88px 100px;gap:var(--sp-2);
 align-items:center;padding:10px var(--sp-3);border-bottom:1px solid var(--row-hair);font-size:var(--t-sm)}
.acct.hd{color:var(--muted);font-size:var(--t-xs);font-weight:600;border-bottom:1px solid var(--hair)}
.acct input,.acct select{width:100%;padding:6px 8px}
.acct.arch{opacity:.45}
.tag{display:inline-block;font-size:11px;font-weight:620;letter-spacing:.01em;
 padding:2px 8px;border-radius:var(--r-f);background:var(--surface-3);color:var(--ink-2)}
.tag.card{background:var(--accent-bg);color:var(--accent-ink)}
.tag.loan{background:var(--attack-bg);color:var(--attack)}
.tag.cash{background:var(--good-bg);color:var(--good-ink)}
.tag.savings{background:var(--warn-bg);color:var(--warn-ink)}
.tag.income{background:var(--surface-3);color:var(--ink-2)}

/* ── history table ───────────────────────────────────────────────── */
table.hist{border-collapse:collapse;width:100%;font-size:var(--t-sm)}
table.hist th{text-align:right;color:var(--muted);font-size:var(--t-xs);font-weight:600;
 padding:10px 12px;border-bottom:1px solid var(--hair)}
table.hist th:first-child{text-align:left}
table.hist td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--row-hair);
 font-variant-numeric:tabular-nums}
table.hist td:first-child{text-align:left}
table.hist tr:hover td{background:var(--surface-2)}
table.hist tr.planned td:first-child::after{content:'planned';margin-left:8px;font-size:10.5px;
 font-weight:620;color:var(--warn-ink);background:var(--warn-bg);padding:1px 7px;border-radius:var(--r-f)}

/* ── modal ───────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);backdrop-filter:blur(8px);
 display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-4);padding:var(--sp-6);
 max-width:540px;width:100%;box-shadow:var(--sh-3);max-height:86vh;overflow:auto}
.modal h3{font-size:var(--t-lg);margin-bottom:var(--sp-2)}
.modal p{color:var(--ink-2);font-size:var(--t-sm);margin:0 0 var(--sp-4);line-height:1.6}
.mrow{display:flex;gap:var(--sp-2);justify-content:flex-end;margin-top:var(--sp-5);flex-wrap:wrap}
.field{margin-bottom:var(--sp-3)}
.field label{display:block;font-size:var(--t-xs);color:var(--muted);font-weight:580;margin-bottom:5px}
.field input,.field select{width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);z-index:60;
 background:var(--ink);color:var(--plane);border-radius:var(--r-1);padding:10px 18px;
 font-size:var(--t-sm);font-weight:520;box-shadow:var(--sh-2);opacity:0;pointer-events:none;
 transition:opacity var(--d2),transform var(--d2) var(--ease)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--muted);font-size:var(--t-sm);text-align:center;padding:var(--sp-6) 0}

@media(max-width:880px){
  .shell{flex-direction:column}
  .rail{position:static;height:auto;width:100%;flex:0 0 auto;flex-direction:row;align-items:center;
   gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);overflow-x:auto;border-right:none;
   border-bottom:1px solid var(--hair)}
  .nav{flex-direction:row;gap:4px}
  .nav .k{display:none}
  .railfoot{margin-top:0;flex-direction:row;align-items:center;gap:6px}
  .railfoot .railstat,.railfoot #syncbox .railstat{display:none}
  .main{padding:var(--sp-4) var(--sp-4) var(--sp-7)}
  .head h1{font-size:var(--t-xl)}
  .acct{grid-template-columns:1fr 96px 100px;gap:7px}
  .acct .hideS{display:none}
  .tlr{grid-template-columns:104px 1fr 84px}
}
</style>

<body>
<div class="shell">
  <nav class="rail">
    <div class="brand"><span class="dot" id="statusdot"></span><span>Money</span></div>
    <div class="nav" id="nav"></div>
    <div class="railfoot">
      <div id="themebox"></div>
      <div class="railstat" id="railstat"></div>
      <div id="syncbox"></div>
      <button class="btn sm ghost" id="btnExport">Export backup</button>
      <button class="btn sm ghost" id="btnImport">Import backup</button>
    </div>
  </nav>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<input type="file" id="filepick" accept="application/json" style="display:none">
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   Money — a weekly zero-based allocation ledger.
   Everything lives in localStorage. Nothing leaves this machine.
   ═══════════════════════════════════════════════════════════════════ */

const KEY='ccb.v1';
const WEEK_START=5;              // Friday — payday
const WPM=52/12;                 // weeks per month, for turning monthly minimums weekly
const MIN_DIVISOR=4;             // ...but the sheet has always split minimums 4 ways, so match it

/* ── tiny helpers ─────────────────────────────────────────────────── */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const n0=v=>{const x=typeof v==='number'?v:parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return Number.isFinite(x)?x:0};
const money=(n,dp=2)=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const money0=n=>money(n,0);
const pct=(n,dp=1)=>(n*100).toFixed(dp)+'%';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

/* dates — everything is keyed to the Friday that starts the pay week */
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)};
const addWeeks=(s,n)=>addDays(s,n*7);
function weekStartOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  x.setDate(x.getDate()-((x.getDay()-WEEK_START+7)%7));return iso(x)}
const thisWeek=()=>weekStartOf(new Date());
const md=s=>{const d=parseISO(s);return`${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}`};
function weekLabel(k){return `${md(k)}–${md(addDays(k,6))}`}
function weekLong(k){const a=parseISO(k),b=parseISO(addDays(k,6));
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${M[a.getMonth()]} ${a.getDate()} – ${M[b.getMonth()]} ${b.getDate()}, ${b.getFullYear()}`}
function dueLabel(s){if(!s)return'';const d=parseISO(s);
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return`${M[d.getMonth()]} ${d.getDate()}`}
const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/864e5);

/* ── theme ────────────────────────────────────────────────────────
   Light by default; the choice is remembered per browser. */
const THEMEKEY='ccb.theme';
function currentTheme(){try{return localStorage.getItem(THEMEKEY)==='dark'?'dark':'light'}catch(e){return'light'}}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem(THEMEKEY,t)}catch(e){}
}
function toggleTheme(){
  applyTheme(currentTheme()==='dark'?'light':'dark');
  render();                     /* charts are drawn with resolved colours */
}
function themeBtnHTML(){
  const dark=currentTheme()==='dark';
  return `<button class="btn sm ghost" data-act="theme" title="${dark?'Switch to light':'Switch to dark'}"
    style="display:flex;align-items:center;gap:7px">${dark
      ? `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1M12.9 12.9l-1.1-1.1M4.2 4.2L3.1 3.1"/></svg>Light`
      : `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M13.5 9.6A6 6 0 1 1 6.4 2.5a4.8 4.8 0 0 0 7.1 7.1Z"/></svg>Dark`}</button>`;
}

/* ── state ────────────────────────────────────────────────────────── */
let S=null, UI={tab:'week', week:null, strategy:'avalanche', extra:null, histRange:'all', histMetric:'debt'};

const GROUPS=[
  {id:'checking', label:'Checking'},
  {id:'buckets',  label:'Buckets & Sinking Funds'},
  {id:'savings',  label:'Savings'},
  {id:'loans',    label:'Loans'},
  {id:'cards',    label:'Credit Cards'},
];
const KIND_INFLOW=k=>k==='cash'||k==='savings';   // payments ADD to these
const KIND_DEBT=k=>k==='card'||k==='loan';        // payments SUBTRACT from these

function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);migrate();return true}}catch(e){console.warn('load failed',e)}
  /* the seed needs migrating too — it carries no plan, settings or account extras */
  S=JSON.parse(JSON.stringify(SEED));migrate();save();return false;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save — storage may be full')}
  if(typeof syncTouch==='function')syncTouch();
}
/* The parts of the plan that are decisions rather than balances. Seeded once on
   first run, then yours to edit; the published copy ships this empty. */
const PLAN_SEED={source:"",order:[],steps:[],calendar:[],open:[],ref:null,minsToVerify:[]};
/* account facts from the handoff that the spreadsheet had no column for */
const ACCT_SEED={};
function migrate(){
  S.v=S.v||1; S.accounts=S.accounts||[]; S.weeks=S.weeks||{};
  S.accounts.forEach((a,i)=>{if(a.order==null)a.order=i});
  if(!S.plan)S.plan=JSON.parse(JSON.stringify(PLAN_SEED));
  S.plan.calendar=S.plan.calendar||[]; S.plan.open=S.plan.open||[];
  S.plan.steps=S.plan.steps||[]; S.plan.order=S.plan.order||[];
  S.plan.calendar.forEach((c,i)=>{if(c.id==null)c.id='c'+i});
  S.plan.open.forEach((o,i)=>{if(o.id==null)o.id='o'+i});
  for(const[id,ex]of Object.entries(ACCT_SEED)){
    const a=acct(id); if(!a)continue;
    for(const[k,v]of Object.entries(ex))if(a[k]===undefined)a[k]=v;
  }
  if(S.settings===undefined)S.settings={};
  if(S.settings.accrueInterest===undefined)S.settings.accrueInterest=true;
}
function resetToSeed(){S=JSON.parse(JSON.stringify(SEED));migrate();save();UI.week=null;render()}

const acct=id=>S.accounts.find(a=>a.id===id);
const liveAccounts=()=>S.accounts.filter(a=>!a.archived).sort((a,b)=>a.order-b.order);
const weekKeys=()=>Object.keys(S.weeks).sort();
function currentWeek(){
  if(UI.week&&S.weeks[UI.week])return UI.week;
  const ks=weekKeys(),now=thisWeek();
  if(S.weeks[now])return now;
  const past=ks.filter(k=>k<=now);
  return past.length?past[past.length-1]:(ks[0]||now);
}
const isPlanned=k=>k>thisWeek();

function blankEntry(){return{balance:0,min:0,attack:0,other:0,minAmt:0,close:'',due:'',projected:null}}
function entryOf(k,id){const w=S.weeks[k];if(!w)return blankEntry();
  if(!w.entries[id])w.entries[id]=blankEntry();
  const e=w.entries[id];for(const[p,d]of Object.entries(blankEntry()))if(e[p]===undefined)e[p]=d;
  return e}

/* ── the compute engine ───────────────────────────────────────────
   One pass over the week produces every derived number the old sheet
   had as a formula, for any number of accounts.
   ───────────────────────────────────────────────────────────────── */
function computeWeek(k){
  const w=S.weeks[k];
  if(!w)return null;
  const accts=liveAccounts();
  const rows=accts.map(a=>{
    const e=entryOf(k,a.id);
    const dpr=a.apr?a.apr/365:0;
    const bal=n0(e.balance);
    const row={a,e,dpr,balance:bal,min:n0(e.min),attack:n0(e.attack),other:n0(e.other)};
    row.minAmt=n0(e.minAmt||a.minAmt);
    row.close=e.close||''; row.due=e.due||'';
    return row;
  });
  const byId=Object.fromEntries(rows.map(r=>[r.a.id,r]));

  /* the sheet's L4: whatever of this month's card minimums isn't being paid
     straight to the card gets parked in the minimums bucket */
  const cardRows=rows.filter(r=>r.a.kind==='card');
  for(const r of rows){
    if(r.a.autoOther==='cardMinShortfall'){
      const paidDirect=cardRows.reduce((s,c)=>s+c.min,0);
      r.other=r2(Math.max(0,r.minAmt-paidDirect));
      r.e.other=r.other;
    }
  }

  /* the income row IS the paycheck cell — keep them the same number */
  for(const r of rows)if(r.a.kind==='income')r.balance=n0(w.income);
  for(const r of rows){
    r.total=r2(r.min+r.attack+r.other);
    /* A card in grace carries no interest — but only while the statement balance is
       paid in full by the due date. A partial payment ends it retroactively. */
    r.inGrace=!!(r.a.grace&&r.a.kind==='card'&&r.balance>0);
    /* BUG 1 from the handoff: the sheet computed balance − payment and never applied
       interest, under-forecasting by ~$214/week. End-of-week = opening + interest − paid. */
    r.weekInterest=(KIND_DEBT(r.a.kind)&&!r.inGrace&&S.settings.accrueInterest)
      ?r2(r.balance*r.dpr*7):0;
    if(r.a.kind==='income'){r.after=r.balance}
    else if(KIND_INFLOW(r.a.kind)){r.after=r2(r.balance+r.total)}
    else{r.after=r2(r.balance+r.weekInterest-r.total)}
    if(r.a.limit>0&&r.a.kind==='card'){
      r.usage=r.balance/r.a.limit;
      r.usageAfter=r.after/r.a.limit;
      r.availAfter=r2(r.a.limit-r.after);
    }
    r.minLeft=r.minAmt?r2(r.minAmt-r.total):0;
    if(r.a.target){
      const t=r.a.target;
      r.targetPct=t.amount?clamp(r.after/t.amount,0,1):0;
      r.targetShort=r2(Math.max(0,t.amount-r.after));
      r.targetDone=r.after+0.005>=t.amount;
      r.targetWeeks=r.targetDone?0:(r.total>0?Math.ceil(r.targetShort/r.total):Infinity);
    }
    /* 6 months out at this week's rate — the sheet's Q column, ×26 weeks */
    if(KIND_INFLOW(r.a.kind))r.sixMo=r2(r.balance+(r.total-n0(r.a.weeklyOutflow))*26);
    else if(KIND_DEBT(r.a.kind))r.sixMo=r2(Math.max(0,projectDebt(r.balance,r.dpr,r.total,26)));
    r.drift=(r.e.projected!=null)?r2(r.balance-n0(r.e.projected)):null;
  }
  /* rollup rows mirror the sum of their children and never spend twice */
  for(const r of rows){
    if(r.a.rollup&&r.a.rollup.length){
      const kids=r.a.rollup.map(id=>byId[id]).filter(Boolean);
      r.isRollup=true;
      r.balance=r2(kids.reduce((s,x)=>s+x.balance,0));
      r.total=r2(kids.reduce((s,x)=>s+x.total,0));
      r.after=r2(kids.reduce((s,x)=>s+x.after,0));
    }
  }
  const income=n0(w.income);
  const allocated=r2(rows.filter(r=>!r.isRollup&&r.a.kind!=='income').reduce((s,r)=>s+r.total,0));
  const unallocated=r2(income-allocated);

  const cards=rows.filter(r=>r.a.kind==='card');
  const debts=rows.filter(r=>KIND_DEBT(r.a.kind));
  const buckets=rows.filter(r=>!r.isRollup&&KIND_INFLOW(r.a.kind));
  const totals={
    income, allocated, unallocated,
    limit:r2(cards.reduce((s,r)=>s+n0(r.a.limit),0)),
    cardBalance:r2(cards.reduce((s,r)=>s+r.balance,0)),
    cardAfter:r2(cards.reduce((s,r)=>s+r.after,0)),
    debtBalance:r2(debts.reduce((s,r)=>s+r.balance,0)),
    debtAfter:r2(debts.reduce((s,r)=>s+r.after,0)),
    debtPaid:r2(debts.reduce((s,r)=>s+r.total,0)),
    /* Partitioned by row KIND, not by column, so every dollar lands in exactly
       one bucket. Summing a column across all rows counted a cash account's
       Min and Attack twice — once here and again in savingsIn — and left the
       Other column on a debt row in no bucket at all. */
    minPaid:r2(debts.reduce((s,r)=>s+r.min,0)),
    attack:r2(debts.reduce((s,r)=>s+r.attack,0)),
    otherDebt:r2(debts.reduce((s,r)=>s+r.other,0)),
    weekInterest:r2(debts.reduce((s,r)=>s+r.weekInterest,0)),
    availAfter:r2(cards.reduce((s,r)=>s+n0(r.availAfter),0)),
  };
  totals.usage=totals.limit?totals.cardBalance/totals.limit:0;
  totals.usageAfter=totals.limit?totals.cardAfter/totals.limit:0;
  totals.avgUsageAfter=cards.length?cards.reduce((s,r)=>s+n0(r.usageAfter),0)/cards.length:0;
  /* a bucket's whole contribution, whichever column it was entered in */
  totals.savingsIn=r2(buckets.reduce((s,r)=>s+r.total,0));

  return {key:k, rows, byId, totals, checks:runChecks(k,rows,totals)};
}

/* one debt, n weeks of interest and payment */
function projectDebt(bal,dpr,weekly,weeks){
  let b=bal;const f=1+dpr*7;
  for(let i=0;i<weeks&&b>0;i++)b=b*f-weekly;
  return b>0?b:0;
}
/* weeks until a debt clears — Infinity if the payment can't outrun the interest */
function weeksToClear(bal,dpr,weekly){
  if(bal<=0)return 0;
  if(weekly<=bal*dpr*7)return Infinity;
  let b=bal,w=0;const f=1+dpr*7;
  while(b>0&&w<5200){b=b*f-weekly;w++}
  return b<=0?w:Infinity;
}
const weeksToMonths=w=>w===Infinity?Infinity:w/WPM;
function monthsLabel(m){
  if(m===Infinity)return'never';
  if(m<1)return'<1 mo';
  if(m<24)return`${Math.round(m)} mo`;
  const y=Math.floor(m/12),r=Math.round(m%12);
  return r?`${y}y ${r}m`:`${y}y`;
}
function dateAfterWeeks(from,w){
  if(w===Infinity)return null;
  return addWeeks(from,Math.ceil(w));
}
function shortMY(s){const d=parseISO(s);
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return`${M[d.getMonth()]} '${String(d.getFullYear()).slice(2)}`}
function longDate(s){const d=parseISO(s);
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return`${M[d.getMonth()]} ${d.getFullYear()}`}

/* ── weekly plan checks ───────────────────────────────────────────── */
function runChecks(k,rows,T){
  const out=[];
  const off=Math.abs(T.unallocated);
  if(off<0.005)out.push({s:'ok',t:`Every dollar has a job. ${money(T.income)} in, ${money(T.allocated)} out, ${money(0)} left over.`});
  else if(T.unallocated>0)out.push({s:'warn',t:`<b>${money(T.unallocated)} unallocated.</b> The sheet only balanced when this hit zero — give it somewhere to go.`});
  else out.push({s:'bad',t:`<b>Over-allocated by ${money(off)}.</b> You're spending more than the ${money(T.income)} that came in.`});

  /* minimums: has enough gone toward this card since its last statement closed? */
  const today=thisWeek();
  for(const r of rows){
    if(!KIND_DEBT(r.a.kind)||!r.minAmt)continue;
    const cyclePaid=paidSinceClose(k,r);
    if(cyclePaid+0.005>=r.minAmt)continue;
    const short=r2(r.minAmt-cyclePaid);
    if(r.due&&r.due<addDays(k,7)&&r.due>=k)
      out.push({s:'bad',t:`<b>${esc(r.a.name)} is ${money(short)} short</b> of its ${money(r.minAmt)} minimum and due ${dueLabel(r.due)} — inside this week.`});
    else if(r.due&&r.due<today)
      out.push({s:'bad',t:`<b>${esc(r.a.name)} minimum was due ${dueLabel(r.due)}</b> and is still ${money(short)} short.`});
    else
      out.push({s:'warn',t:`${esc(r.a.name)} needs ${money(short)} more before ${r.due?dueLabel(r.due):'its due date'} to clear the ${money(r.minAmt)} minimum.`});
  }
  /* over limit, and utilization that'll get reported */
  for(const r of rows.filter(x=>x.a.kind==='card'&&x.a.limit>0)){
    if(r.after>r.a.limit)out.push({s:'bad',t:`<b>${esc(r.a.name)} is over its limit</b> — ${money(r.after)} against ${money0(r.a.limit)} after this week's payment.`});
    else if(r.close&&r.close>=k&&r.close<addDays(k,7)&&r.usageAfter>0.3)
      out.push({s:'warn',t:`${esc(r.a.name)} closes ${dueLabel(r.close)} at <b>${pct(r.usageAfter)}</b> utilization — that's the number that gets reported.`});
  }
  /* cash that goes negative */
  for(const r of rows.filter(x=>x.a.kind==='cash'&&!x.isRollup)){
    if(r.after<-0.005)out.push({s:'bad',t:`<b>${esc(r.a.name)} lands at ${money(r.after)}</b> — negative after this week.`});
  }
  /* grace cards: free to carry, ruinous to underpay */
  for(const r of rows.filter(x=>x.inGrace)){
    if(r.total>0.005&&r.total+0.005<r.balance)
      out.push({s:'bad',t:`<b>${esc(r.a.name)} is being paid ${money(r.total)} against a ${money(r.balance)} balance.</b> A partial payment ends grace and ${pct(n0(r.a.apr),2)} applies to the whole balance retroactively — pay it in full or leave it alone.`});
    else if(r.total+0.005>=r.balance)
      out.push({s:'ok',t:`${esc(r.a.name)} paid in full at ${money(r.balance)} — grace intact, ${money(0)} of interest.`});
    else
      out.push({s:'warn',t:`<b>${esc(r.a.name)}: ${money(r.balance)} due in full by ${r.a.graceDue?dueLabel(r.a.graceDue):'the due date'}.</b> In grace, so it costs nothing to carry — but it has to go all at once.`});
  }
  /* sinking funds against their target date */
  for(const r of rows.filter(x=>x.a.target&&!x.isRollup)){
    const t=r.a.target;
    if(r.targetDone){
      out.push({s:'ok',t:`${esc(r.a.name)} is funded at ${money(r.after)} of ${money(t.amount)}${t.frees?` — <b>${money(t.frees)}/week frees up</b>`:''}.`});
      continue;
    }
    if(!t.by)continue;
    const wksLeft=Math.max(0,Math.ceil(daysBetween(k,t.by)/7));
    const need=wksLeft?r2(r.targetShort/wksLeft):r.targetShort;
    if(r.total+0.005>=need)
      out.push({s:'ok',t:`${esc(r.a.name)} on track — ${money(r.targetShort)} to go by ${dueLabel(t.by)}, ${money(need)}/week needed and ${money(r.total)} going in.`});
    else
      out.push({s:'warn',t:`<b>${esc(r.a.name)} is behind</b> — ${money(r.targetShort)} short with ${wksLeft} week${wksLeft===1?'':'s'} to ${dueLabel(t.by)}. Needs ${money(need)}/week, getting ${money(r.total)}.`});
  }
  /* anything on the calendar that lands inside this pay week */
  const end=addDays(k,7);
  for(const c of (S.plan?.calendar||[]).filter(c=>!c.done&&c.d>=k&&c.d<end))
    out.push({s:'warn',t:`<b>${dueLabel(c.d)} — ${esc(c.t)}</b>${c.n?` · ${esc(c.n)}`:''}`});

  /* the thing the old sheet could never show: are you actually going backwards? */
  if(T.debtBalance>0&&T.debtAfter>T.debtBalance+0.005)
    out.push({s:'bad',t:`<b>Total debt grows ${money(r2(T.debtAfter-T.debtBalance))} this week.</b> ${money(T.debtPaid)} of payments against ${money(T.weekInterest)} of interest — you end the week owing ${money(T.debtAfter)}.`});
  else if(T.debtBalance>0&&T.debtPaid>0)
    out.push({s:'ok',t:`Debt drops ${money(r2(T.debtBalance-T.debtAfter))} — ${money(T.debtPaid)} paid clears the ${money(T.weekInterest)} of interest and ${money(r2(T.debtPaid-T.weekInterest))} of principal.`});

  /* a maxed card creeping toward its limit on interest alone */
  for(const r of rows.filter(x=>x.a.kind==='card'&&x.a.limit>0&&x.balance>0&&x.after>x.balance+0.005)){
    let b=r.after,w=1;
    while(b<=r.a.limit&&w<520){b=b*(1+r.dpr*7)-r.total;w++}
    if(w<520&&w<=26)
      out.push({s:w<=8?'bad':'warn',t:`<b>${esc(r.a.name)} breaches its limit in about ${w} week${w===1?'':'s'}</b> — ${money(r.after)} against ${money0(r.a.limit)}, growing ${money(r.weekInterest)}/week with ${money(r.total)} going in. Nothing new should go on this card.`});
  }

  if(T.attack<=0&&T.debtBalance>0)
    out.push({s:'warn',t:`No attack money this week. Minimums alone cost you ${money(T.weekInterest)} in interest over the next 7 days.`});
  return out;
}
/* Everything paid toward this debt in the cycle the current minimum belongs to.
   The cycle is anchored on the due date (loans have no statement close) and runs
   the month before it — so four weekly payments of a quarter-minimum add up. */
function paidSinceClose(k,r){
  const anchor=r.due||r.close;
  let from=k;
  if(anchor){const d=parseISO(anchor);d.setMonth(d.getMonth()-1);from=iso(d)}
  return r2(weekKeys().filter(w=>w>=from&&w<=k)
    .reduce((s,w)=>{const e=S.weeks[w].entries[r.a.id];return s+(e?n0(e.min)+n0(e.attack)+n0(e.other):0)},0));
}
</script>
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   Payoff simulator — week by week, with the snowball rolling forward
   as each debt clears.
   ═══════════════════════════════════════════════════════════════════ */
function debtSnapshot(k){
  const C=computeWeek(k);if(!C)return[];
  return C.rows.filter(r=>KIND_DEBT(r.a.kind)&&r.balance>0.005).map(r=>({
    id:r.a.id,name:r.a.name,kind:r.a.kind,
    /* a card in grace has no effective rate — ranking it by its nominal APR would
       rank a grace card to the top of the avalanche, which is exactly the wrong move */
    apr:r.inGrace?0:n0(r.a.apr), nominalApr:n0(r.a.apr), dpr:r.inGrace?0:r.dpr,
    grace:r.inGrace, graceDue:r.a.graceDue||'',
    balance:r.balance,limit:n0(r.a.limit),
    weeklyMin:r2(r.minAmt?r.minAmt/MIN_DIVISOR:0),
    current:r.total, weekInterest:r.weekInterest,
  }));
}
/* when a budget step turns on, in weeks from `fromWeek`. null = never / resolved live */
function stepFireWeek(st,fromWeek){
  const tr=st.trigger||{};
  if(tr.type==='manual')return st.on?0:null;
  if(tr.type==='date')return tr.date?Math.max(0,Math.ceil(daysBetween(fromWeek,tr.date)/7)):null;
  if(tr.type==='target'){
    const a=acct(tr.acct); if(!a||!a.target)return null;
    const r=(computeWeek(fromWeek)||{byId:{}}).byId[tr.acct];
    if(r&&r.targetDone)return 0;
    if(a.target.by)return Math.max(0,Math.ceil(daysBetween(fromWeek,a.target.by)/7));
    if(r&&r.total>0)return Math.ceil(r.targetShort/r.total);
    return null;
  }
  return null;
}
function simulate(debts,{strategy='avalanche',budget=0,fromWeek=thisWeek(),cap=5200,steps=[]}={}){
  const D=debts.map(d=>({...d,paidOff:null,interest:0}));
  if(!D.length)return{weeks:0,totalInterest:0,debts:D,series:[{w:0,total:0}],fired:[],endBudget:budget};
  const rank=Object.fromEntries((S.plan?.order||[]).map((id,i)=>[id,i]));
  const order=()=>{
    const live=D.filter(d=>d.balance>0.005);
    if(strategy==='snowball')return live.sort((a,b)=>a.balance-b.balance);
    if(strategy==='current')return live;
    if(strategy==='custom')return live.sort((a,b)=>(rank[a.id]??999)-(rank[b.id]??999)||b.apr-a.apr);
    return live.sort((a,b)=>b.apr-a.apr||b.balance-a.balance);
  };
  const ST=steps.map(st=>({...st,fireWeek:stepFireWeek(st,fromWeek)}));
  const firedIds=new Set(),fired=[];
  let w=0,totalInterest=0,extra=0;
  const series=[{w:0,total:r2(D.reduce((s,d)=>s+d.balance,0))}];
  while(D.some(d=>d.balance>0.005)&&w<cap){
    /* budget steps switch on as their trigger lands, and stay on */
    for(const st of ST){
      if(firedIds.has(st.id))continue;
      const tr=st.trigger||{};
      let go=false;
      if(tr.type==='payoff'){
        const d=D.find(x=>x.id===tr.acct);
        go=d?(d.paidOff!=null&&w>=d.paidOff):true;   // already clear → already freed
      }else go=(st.fireWeek!=null&&w>=st.fireWeek);
      if(go){firedIds.add(st.id);extra+=n0(st.weekly);fired.push({...st,week:w})}
    }
    /* interest first, the way a card does it */
    for(const d of D){if(d.balance<=0.005)continue;
      const i=d.balance*d.dpr*7;d.balance+=i;d.interest+=i;totalInterest+=i}
    let pool;
    if(strategy==='current'){
      for(const d of D){if(d.balance<=0.005)continue;
        const p=Math.min(d.current,d.balance);d.balance-=p}
      pool=0;
    }else{
      const live=order();
      pool=budget+extra;
      /* a grace balance is cleared in full or not at all — never partially */
      for(const d of live){if(!d.grace||d.balance<=0.005)continue;
        if(pool+0.005>=d.balance){pool-=d.balance;d.balance=0}}
      for(const d of live){if(d.grace)continue;
        const p=Math.min(d.weeklyMin,d.balance,pool);d.balance-=p;pool-=p}
      for(const d of live){if(pool<=0.005)break;if(d.grace)continue;
        const p=Math.min(pool,d.balance);d.balance-=p;pool-=p}
    }
    w++;
    for(const d of D)if(d.balance<=0.005&&d.paidOff==null){d.balance=0;d.paidOff=w}
    series.push({w,total:r2(D.reduce((s,d)=>s+d.balance,0))});
    /* nothing moved and no step left to change that — the payment can't outrun the interest */
    if(w>260&&series[w].total>=series[w-1].total-0.005&&series[w].total>0.005
       &&ST.every(st=>firedIds.has(st.id)||st.fireWeek==null))break;
  }
  const done=D.every(d=>d.balance<=0.005);
  return{weeks:done?w:Infinity,totalInterest:r2(totalInterest),debts:D,series,fromWeek,fired,
    endBudget:r2(budget+extra),
    debtFreeDate:done?dateAfterWeeks(fromWeek,w):null};
}

/* ═══════════════════════════════════════════════════════════════════
   Charts — hand-rolled SVG. Thin marks, recessive axes, one hover layer.
   ═══════════════════════════════════════════════════════════════════ */
const SV='http://www.w3.org/2000/svg';
function niceTicks(min,max,n=4){
  if(max===min){max=min+1}
  const span=max-min,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const norm=step0/mag,step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,out=[];
  for(let v=lo;v<=hi+step*.001;v+=step)out.push(r2(v));
  return out;
}
/* single-series line + area over time; crosshair tooltip by default */
function lineChart(el,pts,{h=210,fmt=money0,label='',accent='var(--s1)',zeroFloor=true}={}){
  if(pts.length<2){el.innerHTML='<div class="empty">Not enough history yet.</div>';return}
  const W=el.clientWidth||760,PL=54,PR=14,PT=12,PB=26;
  const vals=pts.map(p=>p.v);
  let lo=Math.min(...vals),hi=Math.max(...vals);
  if(zeroFloor)lo=Math.min(lo,0);
  const ticks=niceTicks(lo,hi,4);
  lo=ticks[0];hi=ticks[ticks.length-1];
  const X=i=>PL+(W-PL-PR)*(i/(pts.length-1));
  const Y=v=>PT+(h-PT-PB)*(1-(v-lo)/(hi-lo||1));
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const area=`${line}L${X(pts.length-1).toFixed(1)},${Y(lo).toFixed(1)}L${X(0).toFixed(1)},${Y(lo).toFixed(1)}Z`;
  const gid='g'+Math.random().toString(36).slice(2,8);
  el.innerHTML=`<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(label)}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${accent}" stop-opacity=".28"/>
      <stop offset="100%" stop-color="${accent}" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t=>`<line class="gridline" x1="${PL}" x2="${W-PR}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>
      <text class="axl" x="${PL-8}" y="${(Y(t)+3.5).toFixed(1)}" text-anchor="end">${fmt(t)}</text>`).join('')}
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${accent}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <g class="hov" style="opacity:0"><line class="crosshair" y1="${PT}" y2="${h-PB}"/>
      <circle r="4.5" fill="${accent}" stroke="var(--surface)" stroke-width="2"/></g>
    ${pts.map((p,i)=>i%Math.ceil(pts.length/7)===0||i===pts.length-1
      ?`<text class="axl" x="${X(i).toFixed(1)}" y="${h-8}" text-anchor="middle">${esc(p.x)}</text>`:'').join('')}
    <rect x="${PL}" y="${PT}" width="${W-PL-PR}" height="${h-PT-PB}" fill="transparent" class="hit"/>
  </svg><div class="tip"></div>`;
  const svg=el.querySelector('svg'),hov=el.querySelector('.hov'),tip=el.querySelector('.tip');
  const cross=hov.querySelector('line'),dot=hov.querySelector('circle');
  const move=ev=>{
    const box=svg.getBoundingClientRect(),sx=W/box.width;
    const px=(ev.clientX-box.left)*sx;
    const i=clamp(Math.round((px-PL)/((W-PL-PR)/(pts.length-1))),0,pts.length-1);
    const p=pts[i];hov.style.opacity=1;
    cross.setAttribute('x1',X(i));cross.setAttribute('x2',X(i));
    dot.setAttribute('cx',X(i));dot.setAttribute('cy',Y(p.v));
    tip.className='tip on';tip.innerHTML=`<div class="tt">${esc(p.t||p.x)}</div>`+
      (p.rows||[[label||'Value',fmt(p.v)]]).map(([a,b])=>`<div class="tr"><span>${esc(a)}</span><span class="tv">${b}</span></div>`).join('');
    const tw=tip.offsetWidth,left=clamp(X(i)/sx-tw/2,4,box.width-tw-4);
    tip.style.left=left+'px';tip.style.top=Math.max(2,Y(p.v)/sx-tip.offsetHeight-12)+'px';
  };
  svg.addEventListener('pointermove',move);
  svg.addEventListener('pointerleave',()=>{hov.style.opacity=0;tip.className='tip'});
}
/* tiny inline trend for one account */
function sparkline(pts,{w=190,h=38,accent='var(--s1)'}={}){
  if(pts.length<2)return'';
  const vals=pts.map(p=>p.v),lo=Math.min(...vals,0),hi=Math.max(...vals,1);
  const X=i=>(w)*(i/(pts.length-1)),Y=v=>h-2-(h-6)*((v-lo)/(hi-lo||1));
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d}L${w},${h}L0,${h}Z" fill="${accent}" opacity=".14"/>
    <path d="${d}" fill="none" stroke="${accent}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(pts.length-1).toFixed(1)}" cy="${Y(pts[pts.length-1].v).toFixed(1)}" r="2.6" fill="${accent}"/></svg>`;
}

const ALLOC_SEGS=T=>[
  ['Attack',            T.attack,     'var(--s2)'],
  ['Other debt',        T.otherDebt,  'var(--s1)'],
  ['Minimums',          T.minPaid,    'var(--s1)'],
  ['Buckets & savings', T.savingsIn,  'var(--s3)'],
];
function allocSegments(T){
  const span=Math.max(T.allocated,T.income);
  if(span<=0)return'';
  const parts=ALLOC_SEGS(T).filter(([,v])=>v>0)
    .map(([,v,c])=>`<span style="width:${v/span*100}%;background:${c}"></span>`).join('');
  const over=T.allocated>T.income+0.005;
  if(!over)return parts;
  const at=T.income/span*100;
  return parts
    +`<i class="overrun" style="left:${at}%;width:${(T.allocated-T.income)/span*100}%"></i>`
    +`<i class="paycheck-line" style="left:${at}%"></i>`;
}
/* Keys the ink only. The remainder — unassigned or overrun — is the tile's job. */
function allocLegend(T){
  return ALLOC_SEGS(T).filter(([,v])=>v>0)
    .map(([n,v,c])=>`<span class="k"><i class="sw" style="background:${c}"></i>${esc(n)} <b>${money(v)}</b></span>`)
    .join('');
}
function allocLabel(T){
  const parts=ALLOC_SEGS(T).filter(([,v])=>v>0).map(([n,v])=>`${n} ${money(v)}`).join(', ');
  const tail=T.unallocated<-0.005?`Over-allocated by ${money(-T.unallocated)}.`
    :Math.abs(T.unallocated)>=0.005?`Unassigned ${money(T.unallocated)}.`
    :'Fully assigned, nothing left over.';
  return `Where the paycheck goes. Paycheck ${money(T.income)}, assigned ${money(T.allocated)}. ${parts}. ${tail}`;
}
function icon(s){
  /* a red X reads as "you broke it"; an exclamation reads as "look at this" */
  const p=s==='ok'?'M4.5 8.4l2.4 2.4 4.6-5.2':'M8 4.2v4.6M8 11.5v.1';
  return`<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${p}"/></svg>`;
}
/* Attention first and always visible; everything that is fine folds away into a count. */
function checksHTML(checks){
  if(!checks.length)return'';
  const row=c=>`<div class="chk ${c.s}">${icon(c.s)}<div>${c.t}</div></div>`;
  const attn=checks.filter(c=>c.s!=='ok'), fine=checks.filter(c=>c.s==='ok');
  const open=UI.showOk!=null?UI.showOk:!attn.length;
  let h='';
  if(attn.length)h+=`<div class="chkgroup">
    <div class="chkhead">Needs attention <span class="count">${attn.length}</span></div>
    <div class="checks">${attn.map(row).join('')}</div></div>`;
  if(fine.length)h+=`<div class="chkgroup">
    <div class="chkhead tap ${open?'open':''}" data-act="toggleok">
      <svg class="caret" width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5l5 4.5-5 4.5"/></svg>
      Going well <span class="count">${fine.length}</span></div>
    ${open?`<div class="checks">${fine.map(row).join('')}</div>`:''}</div>`;
  return h;
}
function usageBar(u){
  const w=clamp(u*100,0,100),c=u>0.9?'max':u>0.6?'hi':u>0.3?'mid':'';
  return`<span class="bar"><i class="${c}" style="width:${w}%"></i></span>`;
}
function gridBody(C,dense){
  const out=[];
  const byId=C.byId;
  const rendered=new Set();
  for(const g of GROUPS){
    const rows=C.rows.filter(r=>(r.a.group||'buckets')===g.id);
    if(!rows.length)continue;
    out.push(`<tr class="sect"><td colspan="${dense?10:17}">${g.label}</td></tr>`);
    for(const r of rows){
      if(rendered.has(r.a.id))continue;
      out.push(rowHTML(r,dense,false));rendered.add(r.a.id);
      if(r.a.rollup)for(const cid of r.a.rollup){
        const c=byId[cid];if(!c||rendered.has(cid))continue;
        out.push(rowHTML(c,dense,true));rendered.add(cid);
      }
    }
    if(g.id==='cards'){
      const T=C.totals;
      const cInt=sum(C,'weekInterest','card');
      out.push(`<tr class="tot"><td>Total</td>`+(dense
        ?`<td class="num">${money(T.cardBalance)}</td><td></td><td></td>
          <td class="num">${money(sum(C,'min','card'))}</td><td class="num">${money(sum(C,'attack','card'))}</td>
          <td class="num">${money(sum(C,'other','card'))}</td><td class="num">${money(sum(C,'total','card'))}</td>
          <td class="num">${money(cInt)}</td><td class="num">${money(T.cardAfter)}</td>`
        :`<td class="num">${money0(T.limit)}</td><td></td><td class="num">${money(T.cardBalance)}</td>
          <td class="num">${pct(T.usage)}</td><td></td><td></td><td></td>
          <td class="num">${money(sum(C,'min','card'))}</td><td class="num">${money(sum(C,'attack','card'))}</td>
          <td class="num">${money(sum(C,'other','card'))}</td><td class="num">${money(sum(C,'total','card'))}</td>
          <td class="num">${money(cInt)}</td>
          <td class="num">${money(T.cardAfter)}</td><td class="num">${pct(T.usageAfter)}</td>
          <td class="num">${money(T.availAfter)}</td><td></td>`)+`</tr>`);
    }
  }
  return out.join('');
}
const sum=(C,f,kind)=>r2(C.rows.filter(r=>r.a.kind===kind).reduce((s,r)=>s+n0(r[f]),0));

function rowHTML(r,dense,child){
  const a=r.a,id=a.id;
  const inp=(f,v,cls='')=>r.isRollup||a.kind==='income'
    ?`<td class="num dim">${money(n0(r[f]))}</td>`
    :`<td class="num"><input class="cell ${cls} ${n0(v)===0?'zero':''}" data-k="${id}:${f}" value="${n0(v).toFixed(2)}"${a.autoOther==='cardMinShortfall'&&f==='other'?' readonly title="Auto: card minimums not paid directly"':''}></td>`;
  const dt=(f,v)=>r.isRollup||a.kind==='income'?'<td></td>'
    :`<td class="num dcell ${v?'':'empty'}"><input class="cell" type="date" style="width:118px" data-k="${id}:${f}" value="${v||''}"></td>`;
  const bal=r.isRollup||a.kind==='income'
    ?`<td class="num dim">${money(r.balance)}</td>`
    :`<td class="num"><input class="cell" data-k="${id}:balance" value="${r.balance.toFixed(2)}">${driftTag(r)}</td>`;
  const after=`<td class="num ${a.kind==='card'&&r.after>n0(a.limit)?'neg':r.after<0?'neg':''}">${money(r.after)}</td>`;
  const cls=(r.isRollup?'rollup':'')+(child?' child':'');
  /* full name stays reachable when the column ellipsises it */
  const name=`<td title="${esc(a.name)}"><span class="acct">${esc(a.name)}</span></td>`;
  const intr=`<td class="num ${r.inGrace?'pos':'dim'}" ${r.inGrace?'title="In grace — no interest while the statement balance is paid in full"':''}>${
    KIND_DEBT(a.kind)?(r.inGrace?'grace':money(r.weekInterest)):'—'}</td>`;
  if(dense)return`<tr class="${cls}">${name}${bal}
    <td class="num dim">${r.minAmt?money(r.minAmt):'—'}</td>
    <td class="num dim">${r.due?dueLabel(r.due):'—'}</td>
    ${inp('min',r.min)}${inp('attack',r.attack,'atk')}${inp('other',r.other)}
    <td class="num">${money(r.total)}</td>${intr}${after}</tr>`;
  return`<tr class="${cls}">${name}
    <td class="num dim">${a.limit?money0(a.limit):'—'}</td>
    <td class="num dim">${a.apr?pct(a.apr,2):'—'}</td>
    ${bal}
    <td class="num dim">${a.kind==='card'&&a.limit?usageBar(n0(r.usage))+pct(n0(r.usage)):'—'}</td>
    ${r.isRollup||a.kind==='income'?'<td></td>':`<td class="num"><input class="cell ${r.minAmt?'':'zero'}" data-k="${id}:minAmt" value="${r.minAmt.toFixed(2)}"></td>`}
    ${dt('close',r.close)}${dt('due',r.due)}
    ${inp('min',r.min)}${inp('attack',r.attack,'atk')}${inp('other',r.other)}
    <td class="num">${money(r.total)}</td>${intr}${after}
    <td class="num dim">${a.kind==='card'&&a.limit?pct(n0(r.usageAfter)):'—'}</td>
    <td class="num dim">${a.kind==='card'&&a.limit?money(n0(r.availAfter)):'—'}</td>
    <td class="num dim">${r.sixMo!=null?money0(r.sixMo):'—'}</td></tr>`;
}
function driftTag(r){
  if(r.drift==null||Math.abs(r.drift)<0.5)return'';
  const up=r.drift>0;
  return`<span class="drift ${up?'up':'dn'}" title="Projected ${money(n0(r.e.projected))} — ${up?'higher':'lower'} than planned">${up?'+':'−'}${money(Math.abs(r.drift),0).slice(1)}</span>`;
}
</script>
<script>
"use strict";
const STRATS=[{id:'avalanche',l:'Avalanche'},{id:'snowball',l:'Snowball'},{id:'custom',l:'My order'}];
const stratSeg=cur=>`<div class="seg">${STRATS.map(x=>
  `<button data-strat="${x.id}" class="${cur===x.id?'on':''}">${x.l}</button>`).join('')}</div>`;
const planSteps=()=>(S.plan&&S.plan.steps)||[];
/* the budget the plan actually reaches once every step has fired */
function simOpts(k,budget,strategy){return{strategy,budget,fromWeek:k,steps:planSteps()}}

/* ── Attack ───────────────────────────────────────────────────────── */
function viewAttack(el){
  const k=currentWeek(),C=computeWeek(k),T=C.totals;
  const all=debtSnapshot(k);
  if(!all.length){el.innerHTML='<div class="head"><h1>Attack</h1></div><div class="card"><div class="empty">No balances to attack. That is the whole point.</div></div>';return}
  const grace=all.filter(d=>d.grace), debts=all.filter(d=>!d.grace);
  const strat=UI.strategy;
  const budget=Math.max(T.debtPaid,all.reduce((s,d)=>s+d.weeklyMin,0));
  const rank=Object.fromEntries((S.plan.order||[]).map((id,i)=>[id,i]));
  const ranked=[...debts].sort((a,b)=>
    strat==='snowball'?a.balance-b.balance
    :strat==='custom'?((rank[a.id]??999)-(rank[b.id]??999))
    :(b.apr-a.apr||b.balance-a.balance));
  const top=ranked[0];

  const av =simulate(all,simOpts(k,budget,'avalanche'));
  const sn =simulate(all,simOpts(k,budget,'snowball'));
  const cus=simulate(all,simOpts(k,budget,'custom'));
  const cur=simulate(all,simOpts(k,budget,'current'));
  const chosen={avalanche:av,snowball:sn,custom:cus}[strat];
  const saving=r2(cur.totalInterest-chosen.totalInterest);
  const vsAv=r2(chosen.totalInterest-av.totalInterest);

  const attackRows=C.rows.filter(r=>KIND_DEBT(r.a.kind)&&r.attack>0);
  const onTarget=attackRows.length===1&&attackRows[0].a.id===top.id;
  const why={
    avalanche:`Highest rate in the stack at <b>${pct(top.nominalApr,2)}</b>, costing <b>${money(top.weekInterest)}</b> in interest every week it sits there. Every dollar here is worth more than a dollar anywhere else.`,
    snowball:`Smallest balance at <b>${money(top.balance)}</b>. Clearing it frees its ${money(top.weeklyMin)}/wk minimum for the next one.`,
    custom:`First in your order. ${top.limit&&top.kind==='card'?`A card at <b>${pct(top.balance/top.limit,0)}</b> utilization — clearing it moves the number FICO actually scores, which rate-sorting can't see.`:`Ahead of the rate ranking by your own call.`}`,
  }[strat];

  el.innerHTML=`
  <div class="head"><div><h1>Attack</h1>
    <div class="sub">${weekLabel(k)} · ${money(T.attack)} of attack money on the table</div></div>
    <div class="spacer"></div>${stratSeg(strat)}
  </div>

  <div class="card">
    <div class="cap">This week, put it here</div>
    <div class="hero" style="margin:8px 0 4px">${esc(top.name)}</div>
    <div class="sub" style="font-size:var(--t-sm);color:var(--ink-2);max-width:72ch">${why}</div>
    <div class="checks">
      ${grace.map(g=>`<div class="chk warn">${icon('warn')}<div><b>${esc(g.name)} is in grace — do not attack it.</b>
        ${money(g.balance)} due in full by ${g.graceDue?dueLabel(g.graceDue):'the due date'}. It costs ${money(0)} to carry, but a partial payment ends grace and ${pct(g.nominalApr,2)} applies to the whole balance.</div></div>`).join('')}
      ${T.attack<=0
        ?`<div class="chk warn">${icon('warn')}<div>No attack money assigned this week. Minimums alone leave <b>${money(T.weekInterest)}</b> of interest on the table over the next 7 days.</div></div>`
        :onTarget
        ?`<div class="chk ok">${icon('ok')}<div>This week's <b>${money(T.attack)}</b> is already going to ${esc(top.name)}.</div></div>`
        :`<div class="chk warn">${icon('warn')}<div>This week's attack is on <b>${attackRows.map(r=>esc(r.a.name)).join(', ')||'nothing'}</b>. ${esc(top.name)} is what your ${strat==='custom'?'order':strat} says.</div></div>`}
      ${strat==='custom'&&cus.weeks!==Infinity&&av.weeks!==Infinity
        ?`<div class="chk ${Math.abs(vsAv)<50?'ok':'warn'}">${icon(Math.abs(vsAv)<50?'ok':'warn')}<div>Your order costs <b>${vsAv>0?money0(vsAv)+' more':money0(-vsAv)+' less'}</b> in interest than pure avalanche and finishes <b>${monthsLabel(Math.abs(weeksToMonths(cus.weeks)-weeksToMonths(av.weeks)))}</b> ${cus.weeks>av.weeks?'later':'earlier'}${Math.abs(vsAv)<50?' — close enough that the utilization argument wins':''}.</div></div>`:''}
      ${cur.weeks===Infinity&&chosen.weeks!==Infinity
        ?`<div class="chk ok">${icon('ok')}<div>Repeating this week's split forever never clears the balance — the interest outruns it. The same <b>${money(budget)}/wk</b>${chosen.endBudget>budget?`, rising to <b>${money(chosen.endBudget)}</b> as your steps land,`:''} clears everything by <b>${longDate(chosen.debtFreeDate)}</b>.</div></div>`
        :saving>1
        ?`<div class="chk ok">${icon('ok')}<div>Following this order pays off <b>${monthsLabel(weeksToMonths(cur.weeks)-weeksToMonths(chosen.weeks))} sooner</b> than repeating this week's split, and saves <b>${money0(saving)}</b> in interest.</div></div>`:''}
    </div>
  </div>

  <div class="card">
    <div class="cap">The stack, ${strat==='avalanche'?'by what it costs you':strat==='snowball'?'by what clears first':'in your order'}</div>
    <div class="rank" style="margin-top:12px">
      ${ranked.map((d,i)=>`
      <div class="rrow ${i===0?'top':''}">
        <div class="n">${i+1}</div>
        <div><div class="nm">${esc(d.name)}</div>
          <div class="meta">${money(d.balance)}${d.kind==='card'&&d.limit?` of ${money0(d.limit)} · ${pct(d.balance/d.limit,0)} used`:''} · ${pct(d.nominalApr,2)} APR${d.weeklyMin?` · ${money(d.weeklyMin)}/wk minimum`:''}</div></div>
        <div class="rt"><div class="rv">${money(d.weekInterest)}</div><div class="rl">interest / week</div></div>
      </div>`).join('')}
      ${grace.map(d=>`
      <div class="rrow" style="opacity:.75">
        <div class="n" style="font-size:var(--t-xs);font-weight:700;color:var(--good)">PIF</div>
        <div><div class="nm">${esc(d.name)} <span class="tag cash">in grace</span></div>
          <div class="meta">${money(d.balance)} due in full by ${d.graceDue?dueLabel(d.graceDue):'the due date'} · ${pct(d.nominalApr,2)} APR if grace breaks</div></div>
        <div class="rt"><div class="rv" style="color:var(--good)">${money(0)}</div><div class="rl">interest / week</div></div>
      </div>`).join('')}
    </div>
    <div class="legend"><span class="k">Total bleed: <b>${money(debts.reduce((s,d)=>s+d.weekInterest,0))}</b> per week · <b>${money(debts.reduce((s,d)=>s+d.weekInterest,0)*52/12)}</b> per month</span></div>
  </div>

  <div class="card">
    <div class="cap">Same ${money(budget)} a week, four ways</div>
    <div class="tl" style="margin-top:14px">
      ${(()=>{const rs=[['Avalanche — highest rate first',av],['Snowball — smallest balance first',sn],['Your order',cus],['Repeat this week’s split',cur]];
        const fin=rs.filter(r=>r[1].weeks!==Infinity).map(r=>r[1].weeks);
        const mx=Math.max(...(fin.length?fin:[520]));
        const best=Math.min(...rs.filter(r=>r[1].weeks!==Infinity).map(r=>r[1].totalInterest));
        return rs.map(([nm,r])=>`<div class="tlr"><div class="tln">${nm}</div>
          <div class="tlbar"><i class="${r.weeks===Infinity?'never':''}" style="width:${clamp((r.weeks===Infinity?mx:r.weeks)/mx*100,2,100)}%;${r.weeks!==Infinity&&r.totalInterest===best?'background:var(--s3)':''}"></i></div>
          <div class="tlv">${r.weeks===Infinity?'never':monthsLabel(weeksToMonths(r.weeks))}</div></div>`).join('')})()}
    </div>
    <div class="legend">
      <span class="k">Avalanche <b>${money0(av.totalInterest)}</b></span>
      <span class="k">Snowball <b>${money0(sn.totalInterest)}</b></span>
      <span class="k">Your order <b>${money0(cus.totalInterest)}</b></span>
      <span class="k">This week's split <b>${cur.weeks===Infinity?'never clears':money0(cur.totalInterest)}</b></span>
    </div>
  </div>`;
}

/* ── Payoff ───────────────────────────────────────────────────────── */
function viewPayoff(el){
  const k=currentWeek(),C=computeWeek(k),T=C.totals;
  const debts=debtSnapshot(k);
  if(!debts.length){el.innerHTML='<div class="head"><h1>Payoff</h1></div><div class="card"><div class="empty">Nothing left to pay off.</div></div>';return}
  const floor=r2(debts.reduce((s,d)=>s+d.weeklyMin,0));
  if(UI.extra==null)UI.extra=Math.max(T.debtPaid,floor);
  const budget=Math.max(0,n0(UI.extra));
  const strat=UI.strategy;
  const sim=simulate(debts,simOpts(k,budget,strat));
  const av =simulate(debts,simOpts(k,budget,'avalanche'));
  const sn =simulate(debts,simOpts(k,budget,'snowball'));
  const cus=simulate(debts,simOpts(k,budget,'custom'));
  const flat=simulate(debts,{strategy:strat,budget,fromWeek:k,steps:[]});
  const plus50=simulate(debts,simOpts(k,budget+50,strat));
  const maxW=Math.max(...sim.debts.map(d=>d.paidOff||(sim.weeks===Infinity?520:sim.weeks)),1);
  const steps=planSteps().map(st=>({...st,fireWeek:stepFireWeek(st,k),
    fired:sim.fired.find(f=>f.id===st.id)}));

  el.innerHTML=`
  <div class="head"><div><h1>Payoff</h1>
    <div class="sub">From ${weekLabel(k)} · ${money(T.debtBalance)} across ${debts.length} account${debts.length>1?'s':''}</div></div>
    <div class="spacer"></div>${stratSeg(strat)}
  </div>

  <div class="tiles">
    <div class="tile"><div class="l">Weekly debt budget</div>
      <div class="v"><span style="opacity:.55">$</span><input class="cell" id="budget" style="width:118px;font:inherit;font-size:var(--t-xl);font-weight:680;text-align:left;padding-left:2px" value="${budget.toFixed(2)}"></div>
      <div class="d">${money(floor)} of that is minimums${sim.endBudget>budget?` · rises to <b>${money(sim.endBudget)}</b>`:''}</div></div>
    <div class="tile ${sim.weeks===Infinity?'bad':'good'}"><div class="l">Debt free</div>
      <div class="v">${sim.weeks===Infinity?'Never':longDate(sim.debtFreeDate)}</div>
      <div class="d">${sim.weeks===Infinity?`${money(budget)}/wk can't outrun ${money(r2(debts.reduce((s,d)=>s+d.weekInterest,0)))}/wk of interest`:monthsLabel(weeksToMonths(sim.weeks))+' from now'}</div></div>
    <div class="tile"><div class="l">Interest you'll pay</div><div class="v">${sim.weeks===Infinity?'∞':money0(sim.totalInterest)}</div>
      <div class="d">on ${money0(T.debtBalance)} of principal</div></div>
    <div class="tile ${sim.endBudget>budget?'good':''}"><div class="l">What the steps buy you</div>
      <div class="v">${(flat.weeks===Infinity||sim.weeks===Infinity)?(flat.weeks===Infinity&&sim.weeks!==Infinity?'clears it':'—'):monthsLabel(weeksToMonths(flat.weeks)-weeksToMonths(sim.weeks))}</div>
      <div class="d">${flat.weeks===Infinity&&sim.weeks!==Infinity?`a flat ${money(budget)}/wk never finishes`:`sooner than holding ${money(budget)}/wk flat`}</div></div>
  </div>

  <div class="card">
    <div class="cap">Balance from here</div>
    <div class="chart" id="payChart" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <div class="cap">Attack steps up as these land</div>
    <p class="sub" style="margin:8px 0 14px;max-width:72ch">Each one permanently frees a weekly line. The dates above already assume them —
      untick a step to see what it is worth.</p>
    <div class="rank">
      ${steps.map(st=>`<div class="rrow" style="${st.fired?'':'opacity:.6'}">
        <div class="n" style="font-size:var(--t-sm)">
          <input type="checkbox" data-step="${st.id}" ${st.on||st.trigger.type!=='manual'?'checked':''}
            ${st.trigger.type!=='manual'?'disabled title="Fires on its trigger"':''} style="accent-color:var(--accent);width:15px;height:15px"></div>
        <div><div class="nm">${esc(st.label)}</div>
          <div class="meta">${esc(st.note||'')}${st.fired?` · lands ${longDate(addWeeks(k,st.fired.week))}`:st.trigger.type==='manual'?' · not done yet':' · trigger not reached'}</div></div>
        <div class="rt"><div class="rv" style="color:var(--s3)">+${money(n0(st.weekly))}</div><div class="rl">per week</div></div>
      </div>`).join('')}
    </div>
  </div>

  <div class="card">
    <div class="cap">What clears when</div>
    <div class="tl" style="margin-top:14px">
      ${[...sim.debts].sort((a,b)=>(a.paidOff||1e9)-(b.paidOff||1e9)).map(d=>`
        <div class="tlr"><div class="tln" title="${esc(d.name)}">${esc(d.name)}${d.grace?' <span class="tag cash">grace</span>':''}</div>
          <div class="tlbar"><i class="${d.paidOff==null?'never':''}" style="width:${clamp((d.paidOff||maxW)/maxW*100,2,100)}%"></i></div>
          <div class="tlv">${d.paidOff==null?'never':longDate(addWeeks(k,d.paidOff))}</div></div>`).join('')}
    </div>
    <div class="legend"><span class="k">Interest paid per account:</span>
      ${[...sim.debts].sort((a,b)=>b.interest-a.interest).slice(0,4).map(d=>
        `<span class="k">${esc(d.name)} <b>${money0(d.interest)}</b></span>`).join('')}</div>
  </div>

  <div class="card">
    <div class="cap">Three orders at ${money(budget)} a week</div>
    <table class="hist" style="margin-top:10px">
      <thead><tr><th>Order</th><th class="num">Debt free</th><th class="num">Months</th><th class="num">Total interest</th></tr></thead>
      <tbody>
        ${(()=>{const rs=[['Avalanche',av],['Snowball',sn],['Your order',cus]];
          const best=Math.min(...rs.filter(r=>r[1].weeks!==Infinity).map(r=>r[1].totalInterest));
          return rs.map(([nm,r])=>`<tr>
          <td>${nm}${r.weeks!==Infinity&&r.totalInterest===best?' <span class="tag cash">cheapest</span>':''}</td>
          <td class="num">${r.weeks===Infinity?'never':longDate(r.debtFreeDate)}</td>
          <td class="num">${r.weeks===Infinity?'—':Math.round(weeksToMonths(r.weeks))}</td>
          <td class="num">${r.weeks===Infinity?'—':money0(r.totalInterest)}</td></tr>`).join('')})()}
      </tbody></table>
    <div class="legend"><span class="k">Your order is <b>${cus.weeks===Infinity||av.weeks===Infinity?'—':money0(Math.abs(cus.totalInterest-av.totalInterest))}</b>
      ${cus.totalInterest>av.totalInterest?'more':'less'} interest than avalanche — reorder it on the Plan tab</span></div>
  </div>`;

  const pts=sim.series.filter((_,i)=>i%Math.max(1,Math.ceil(sim.series.length/80))===0||i===sim.series.length-1)
    .map(p=>({x:shortMY(addWeeks(k,p.w)),t:longDate(addWeeks(k,p.w)),v:p.total,
      rows:[['Remaining',money0(p.total)],['From now',monthsLabel(weeksToMonths(p.w))]]}));
  requestAnimationFrame(()=>{const c=$('#payChart');if(c)lineChart(c,pts,{h:220,label:'Remaining balance'})});
  const b=$('#budget');
  if(b)b.onchange=e=>{UI.extra=n0(e.target.value);render()};
}

<script>
"use strict";
/* ── Plan ─────────────────────────────────────────────────────────── */
function viewPlan(el){
  const k=currentWeek(),C=computeWeek(k);
  const P=S.plan;
  const today=thisWeek(),weekEnd=addDays(k,7);
  const cal=[...P.calendar].sort((a,b)=>a.d.localeCompare(b.d));
  const overdue=cal.filter(c=>!c.done&&c.d<today);
  const soon=cal.filter(c=>!c.done&&c.d>=today&&c.d<addDays(today,28));
  const later=cal.filter(c=>!c.done&&c.d>=addDays(today,28));
  const done=cal.filter(c=>c.done);
  const openLeft=P.open.filter(o=>!o.done),openDone=P.open.filter(o=>o.done);

  const debts=debtSnapshot(k);
  const byId=Object.fromEntries(debts.map(d=>[d.id,d]));
  const ordered=(P.order||[]).filter(id=>acct(id));
  const missing=debts.filter(d=>!ordered.includes(d.id)&&!d.grace);

  const calRow=c=>`<div class="acct" style="grid-template-columns:22px 92px 1fr;align-items:start">
    <div><input type="checkbox" data-cal="${c.id}" ${c.done?'checked':''}

    <div class="num ${!c.done&&c.d<today?'neg':'dim'}" style="text-align:left;font-size:var(--t-xs);padding-top:2px">${dueLabel(c.d)}</div>
    <div style="${c.done?'opacity:.45;text-decoration:line-through':''}">
      <div style="font-weight:600">${esc(c.t)}</div>
      ${c.n?`<div class="meta" style="color:var(--muted);font-size:var(--t-xs);line-height:1.45">${esc(c.n)}</div>`:''}</div></div>`;

  el.innerHTML=`
  <div class="head"><div><h1>Plan</h1>
    <div class="sub">${esc(P.source||'')}</div></div>
    <div class="spacer"></div>
    <div style="display:flex;gap:8px">
      <button class="btn sm" data-act="addcal">+ Date</button>
      <button class="btn sm" data-act="addopen">+ Open item</button>
    </div>
  </div>

  ${overdue.length||soon.filter(c=>c.d<weekEnd).length?`
  <div class="card">
    <div class="cap">Needs you now</div>
    <div class="checks">
      ${overdue.map(c=>`<div class="chk bad">${icon('bad')}<div><b>${dueLabel(c.d)} — ${esc(c.t)}</b>${c.n?` · ${esc(c.n)}`:''} <span style="color:var(--muted)">(${Math.abs(daysBetween(c.d,today))} days ago)</span></div></div>`).join('')}
      ${soon.filter(c=>c.d<weekEnd).map(c=>`<div class="chk warn">${icon('warn')}<div><b>${dueLabel(c.d)} — ${esc(c.t)}</b>${c.n?` · ${esc(c.n)}`:''}</div></div>`).join('')}
    </div>
  </div>`:''}

  <div class="card">

      Rate-sorting can't see utilization or a freed minimum — this can.</p>
    <div class="rank">
      ${ordered.map((id,i)=>{const a=acct(id),d=byId[id];
        return`<div class="rrow" style="${d?'':'opacity:.45'}">

        <div><div class="nm">${esc(a.name)}${d?'':' <span class="tag">clear</span>'}</div>
          <div class="meta">${d?`${money(d.balance)}${d.kind==='card'&&d.limit?` · ${pct(d.balance/d.limit,0)} used`:''} · ${pct(d.nominalApr,2)} APR · ${money(d.weekInterest)}/wk`:'nothing owed'}</div></div>

/* ── History ──────────────────────────────────────────────────────── */
const METRICS={
  debt:  {l:'Total debt',      f:T=>T.debtBalance,      fmt:money0},
  cards: {l:'Card balance',    f:T=>T.cardBalance,      fmt:money0},

        ${sparkline(pts,{accent:d<=0?'var(--spark-down)':'var(--spark-up)'})}</div>`}).join('')}
    </div>
  </div>

  <div class="card" style="padding:var(--sp-4)">
    <div class="cap" style="margin-bottom:8px">Every week</div>
    <div style="overflow-x:auto"><table class="hist" style="min-width:760px">
      <thead><tr><th>Week</th><th class="num">Paycheck</th><th class="num">Assigned</th><th class="num">Left</th>
        <th class="num">Card balance</th><th class="num">Util</th><th class="num">To debt</th><th class="num">Attack</th></tr></thead>

        <td class="num ${Math.abs(s.T.unallocated)<0.005?'':'neg'}">${money(s.T.unallocated)}</td>

    </table></div>
  </div>`;

  const pts=shown.map(s=>({x:md(s.k),t:weekLong(s.k),v:M.f(s.T),
    rows:[[M.l,M.fmt(M.f(s.T))],['Paid to debt',money0(s.T.debtPaid)],['Attack',money0(s.T.attack)]]}));
  requestAnimationFrame(()=>{const c=$('#histChart');if(c)lineChart(c,pts,{h:230,fmt:M.fmt,label:M.l,
    accent:UI.histMetric==='attack'||UI.histMetric==='paid'?'var(--s3)':'var(--s1)'})});
  $('#metricPick').onchange=e=>{UI.histMetric=e.target.value;render()};

/* ── Accounts ─────────────────────────────────────────────────────── */
const KIND_GROUP={income:'checking',cash:'buckets',savings:'savings',loan:'loans',card:'cards'};
function viewAccounts(el){

      <div class="hideS">Min / month</div><div class="hideS">Weekly out</div><div></div></div>
    ${GROUPS.map(g=>{

          `<option value="${kk}" ${a.kind===kk?'selected':''}>${kk[0].toUpperCase()+kk.slice(1)}</option>`).join('')}</select></div>
        <div class="hideS">${KIND_DEBT(a.kind)?`<input type="number" step="1" data-a="${a.id}:limit" value="${n0(a.limit)||''}" placeholder="—">`:''}</div>
        <div class="hideS">${KIND_DEBT(a.kind)?`<input type="number" step="0.01" data-a="${a.id}:aprPct" value="${a.apr?r2(a.apr*100):''}" placeholder="—">`:''}</div>

          <button class="btn sm ghost" data-move="${a.id}:1" title="Move down">↓</button>

  </div>
  <div class="card">
    <div class="cap">Data</div>
