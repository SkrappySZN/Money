/* ── The sheet ────────────────────────────────────────────────────
   One spec per column, driving the header and the body from the same
   list. This replaced two hand-kept branches (dense / full) that had
   already drifted apart: the body emitted `zero`/`atk`/`empty` while
   the stylesheet only ever defined `.is-zero`/`.is-attack`, so zero
   cells were never dimmed and attack money was never accented outside
   `.legacy`. One list cannot drift from itself.

   Every column shows. There was a Core/All toggle; once 6 mo and Min left
   came out and APR and Statement close went in, it separated 16 columns
   from 17, which is not a choice worth a control.

   MIN DUE is split. `minAmt` has always held the MONTHLY obligation
   while the sheet is worked weekly, so the old single Min Due column
   showed $714.30 against a $178.58 payment. Monthly stays the field
   you edit — it is what the statement says — and weekly derives from
   it through MIN_DIVISOR, the same divisor Attack and Payoff use. */
const MONEY_W='9ch';

/* `dim` marks a figure as secondary; it still holds a number. An em-dash
   holds nothing, and only that gets faded — otherwise the Limit, Min due /wk
   and Interest columns, all of which are dim AND real, fade with it. */
const dimCell=v=>`<td class="num dim${v==='—'?' is-absent':''}">${v}</td>`;
/* Monthly unless the account says otherwise — that is what a statement
   minimum is, and what every debt here uses. */
const statedWeekly=a=>a.minPeriod==='week';
/* A row's weekly obligation, whichever period it is stated in — rounded up,
   since a quarter of a monthly figure can land on a half-cent. */
const weeklyOf=r=>!r?0:statedWeekly(r.a)?r2(n0(r.minAmt)):Math.ceil(n0(r.minAmt)/MIN_DIVISOR*100-1e-6)/100;
/* A sinking fund's step frees whatever the fund actually takes each week.
   The step carries its own figure from when the plan was written; once the
   weekly amount is changed on the sheet, that is the number that comes free. */
function stepsFor(k){
  const C=computeWeek(k);
  return planSteps().map(st=>{
    if(!st.trigger||st.trigger.type!=='target'||!C)return st;
    const w=weeklyOf(C.byId[st.trigger.acct]);
    return w>0?{...st,weekly:w}:st;
  });
}

function cellNum(r,f,cls=''){
  const a=r.a,id=a.id;
  if(r.isRollup||a.kind==='income')return `<td class="num dim">${money(n0(r[f]))}</td>`;
  const ro=(a.autoOther==='cardMinShortfall'&&f==='other')||isLocked(currentWeek());
  return `<td class="num"><input class="cell ${cls}${n0(r[f])===0?' is-zero':''}" data-fmt="money"`
    +` data-k="${id}:${f}" value="${moneyInput(n0(r[f]))}"`
    +`${ro?' readonly title="Auto: card minimums not paid directly"':''}></td>`;
}
function cellDate(r,f){
  const a=r.a,id=a.id;
  if(r.isRollup||a.kind==='income')return '<td></td>';
  if(!KIND_DEBT(a.kind))return dimCell('—');
  const v=r[f]||'',k=currentWeek();
  /* A close or due date inside this sheet's own week is the one to act on
     while the sheet is being worked — a statement minimum to enter, a
     payment to make. Worth noticing, not wrong, so it takes attention. */
  const now=v&&v>=k&&v<=addDays(k,6);
  return `<td class="num dcell${v?'':' is-empty'}${now?' is-thisweek':''}"`
    +`${now?` title="${f==='close'?'Statement closes':'Due'} ${dueLabel(v)} — this week"`:''}>`
    +`<input class="cell cell-date" type="date"`
    +`${isLocked(k)?' disabled':''}`
    +` data-k="${id}:${f}" value="${v}"></td>`;
}

const SHEET_COLS=[
  /* Marking a row paid is the ritual the spreadsheet did by filling a cell
     green. The tick rides inside the account cell so it costs no column, and
     `paid` is week data — it does not roll forward into the next week. */
  {k:'name',label:'Account',head:'l',
   cell:r=>`<th scope="row" title="${esc(r.a.name)}">`
     +(r.isRollup||r.a.kind==='income'?''
       :`<input type="checkbox" class="paidbox" data-paid="${r.a.id}"${r.e&&r.e.paid?' checked':''}`
        +`${isLocked(currentWeek())?' disabled':''}`
        +` aria-label="Mark ${esc(r.a.name)} paid this week">`)
     +`<span class="acct">${esc(r.a.name)}</span></th>`},

  /* Limit and APR live on the account, not the week, so these write through
     `data-a` and change every week at once. Only debts carry them — the
     Accounts view gates the same two fields on KIND_DEBT. */
  {k:'limit',label:'Limit',
   cell:r=>KIND_DEBT(r.a.kind)
     ?`<td class="num"><input class="cell is-registry${n0(r.a.limit)===0?' is-zero':''}" data-fmt="money"`
       +` data-a="${r.a.id}:limit" value="${r.a.limit?moneyInput(n0(r.a.limit)):''}" placeholder="—"></td>`
     :dimCell('—')},
  {k:'apr',label:'APR %',
   cell:r=>KIND_DEBT(r.a.kind)||(r.a.kind==='savings'&&!r.isRollup)
     ?`<td class="num"><input class="cell is-registry${r.a.apr?'':' is-zero'}"`
       +` data-a="${r.a.id}:aprPct" value="${r.a.apr?r2(r.a.apr*100):''}" placeholder="—"></td>`
     :dimCell('—')},
  {k:'balance',grp:true,label:'Balance',
   cell:r=>r.isRollup||r.a.kind==='income'
     ?`<td class="num dim">${money(r.balance)}</td>`
     :`<td class="num"><input class="cell" data-fmt="money" data-k="${r.a.id}:balance"`
       +`${isLocked(currentWeek())?' readonly':''} value="${moneyInput(r.balance)}"></td>`},

  /* What the balance did that the projection did not see. `+ Next week` carries
     each row forward at its projected close; the gap to what you actually type
     is new spending on a debt, or money that left a bucket without being
     recorded. It lived as a rounded tag clipped to the balance cell, where
     $11.99 read as "+12" and there was nowhere to say what it meant.

     Direction cannot be read from the sign alone: a debt above its projection
     is bad news and a bucket above its projection is good, so the colour keys
     off kind.

     Not shown for Loans: a loan takes no new spending, and its balance moves
     by the servicer's own accounting, so the gap there says nothing useful. */
  {k:'drift',label:'Unplanned',
   cell:r=>{
     if((r.a.group||'buckets')==='loans')return dimCell('—');
     if(r.drift==null||Math.abs(r.drift)<0.005)return dimCell('—');
     const up=r.drift>0;
     const cls=KIND_DEBT(r.a.kind)?(up?'is-bad':'is-good'):(up?'is-good':'is-plain');
     return `<td class="num chg ${cls}" title="Projected ${money(n0(r.e.projected))}">`
       +`${up?'+':'−'}${money(Math.abs(r.drift))}</td>`;
   }},
  {k:'usage',label:'Usage',
   cell:r=>dimCell(r.a.kind==='card'&&r.a.limit?usageBar(n0(r.usage))+pct(n0(r.usage)):'—')},

  /* The obligation, as the statement states it. Editable on every debt
     — including cards, which carried no minimum at all until now. */
  /* `minAmt` is stated monthly on most rows and weekly on a few — a statement
     minimum arrives monthly, a bucket contribution is decided per paycheck.
     One field, two periods, so the account says which and the other column is
     derived from it. The editable cell is always the one the figure is
     actually stated in; deriving in the direction you do not type avoids a
     rounding drift back and forth through MIN_DIVISOR. */
  {k:'minAmt',grp:true,label:'Min due /mo',
   cell:r=>r.isRollup||r.a.kind==='income'?'<td></td>'
     :statedWeekly(r.a)
       ?dimCell(n0(r.minAmt)?money(r2(n0(r.minAmt)*MIN_DIVISOR)):'—')
       :`<td class="num"><input class="cell${n0(r.minAmt)===0?' is-zero':''}" data-fmt="money"`
         +`${isLocked(currentWeek())?' readonly':''}`
         +` data-k="${r.a.id}:minAmt" value="${moneyInput(n0(r.minAmt))}"></td>`},

  {k:'minWk',label:'Min due /wk',
   cell:r=>r.isRollup||r.a.kind==='income'?'<td></td>'
     :statedWeekly(r.a)
       ?`<td class="num"><input class="cell${n0(r.minAmt)===0?' is-zero':''}" data-fmt="money"`
         +`${isLocked(currentWeek())?' readonly':''}`
         +` data-k="${r.a.id}:minAmt" value="${moneyInput(n0(r.minAmt))}"></td>`
       :dimCell(n0(r.minAmt)?money(r2(n0(r.minAmt)/MIN_DIVISOR)):'—')},
  {k:'close',label:'Stmt close',cell:r=>cellDate(r,'close')},
  {k:'due',   label:'Due',  cell:r=>cellDate(r,'due')},

  {k:'min',   grp:true,label:'Min',cell:r=>cellNum(r,'min')},
  {k:'attack',label:'Attack',cell:r=>cellNum(r,'attack','is-attack')},
  {k:'other', label:'Other', cell:r=>cellNum(r,'other')},
  {k:'total',label:'Total',
   cell:r=>`<td class="num">${money(r.total)}</td>`},

  /* Money leaving a bucket. Only buckets and savings have one — nothing
     "leaves" a card except a payment, which is already the Total column. */
  {k:'out',label:'Out',
   cell:r=>!KIND_INFLOW(r.a.kind)?dimCell('—')
     :r.isRollup?`<td class="num dim">${money(n0(r.out))}</td>`
     :r.a.autoOut
       ?`<td class="num dim" title="Auto: drawn down by whatever was paid to ${esc((acct(r.a.autoOut)||{}).name||r.a.autoOut)} this week">${money(n0(r.out))}</td>`
     :r.drawsForCards
       ?`<td class="num dim" title="Auto: card minimums paid beyond this week's contribution">${money(n0(r.out))}</td>`
       :cellNum(r,'out')},
  /* A debt is charged interest and savings earn it. Both land here, marked
     apart by sign and colour so a gain cannot be read as a cost. */
  {k:'interest',grp:true,label:'Interest',
   cell:r=>{
     if(KIND_INFLOW(r.a.kind)&&r.a.apr&&!r.isRollup){
       /* A rate on a near-empty account earns nothing this week. Saying
          "+$0.00" is noise where the em-dash already means "nothing here". */
       if(n0(r.weekInterest)<0.005)
         return `<td class="num dim is-absent" title="Earns ${pct(r.a.apr,2)} APY — too small to show this week">—</td>`;
       return `<td class="num pos" title="Earned at ${pct(r.a.apr,2)} APY">`
         +`+${money(n0(r.weekInterest))}</td>`;
     }
     return `<td class="num ${r.inGrace?'pos':'dim'}${KIND_DEBT(r.a.kind)?'':' is-absent'}"`
       +`${r.inGrace?' title="In grace — no interest while the statement balance is paid in full"':''}>`
       +`${KIND_DEBT(r.a.kind)?(r.inGrace?'grace':money(r.weekInterest)):'—'}</td>`;
   }},
  {k:'after',label:'After',
   cell:r=>`<td class="num ${r.a.kind==='card'&&r.after>n0(r.a.limit)?'neg':r.after<0?'neg':''}"`
     +`${r.a.passthrough?' title="Passes straight through — funded and sent onward the same week, so nothing accumulates"':''}>`
     +`${money(r.after)}</td>`},
  {k:'usageAfter',label:'Usage aft',
   cell:r=>dimCell(r.a.kind==='card'&&r.a.limit?pct(n0(r.usageAfter)):'—')},
  {k:'availAfter',label:'Avail aft',
   cell:r=>dimCell(r.a.kind==='card'&&r.a.limit?money(n0(r.availAfter)):'—')},

];
const sheetCols=()=>SHEET_COLS;

function gridHead(cols){
  return `<tr>${cols.map((c,i)=>
    `<th scope="col" class="${i?'num':''}${c.grp?' grp':''}">${c.label}</th>`).join('')}</tr>`;
}
function gridBody(C){
  const cols=sheetCols(),out=[],byId=C.byId,rendered=new Set();
  for(const g of GROUPS){
    const rows=C.rows.filter(r=>(r.a.group||'buckets')===g.id);
    if(!rows.length)continue;
    out.push(`<tr class="sect"><th scope="rowgroup" colspan="${cols.length}"><span>${esc(g.label)}</span></th></tr>`);
    for(const r of rows){
      if(rendered.has(r.a.id))continue;
      out.push(rowHTML(r,cols,false));rendered.add(r.a.id);
      if(r.a.rollup)for(const cid of r.a.rollup){
        const c=byId[cid];if(!c||rendered.has(cid))continue;
        out.push(rowHTML(c,cols,true));rendered.add(cid);
      }
    }
    if(g.id==='cards')out.push(totalRow(C,cols));
  }
  return out.join('');
}
function rowHTML(r,cols,child){
  const cls=(r.isRollup?'rollup':'')+(child?' child':'')+(r.e&&r.e.paid?' is-paid':'');
  return `<tr class="${cls}">${cols.map(c=>markGroup(c.cell(r),c)).join('')}</tr>`;
}
/* The column spec says where a subject starts; the cell renderers do not need
   to know about it, so the class is added to whatever they returned. */
const markGroup=(html,c)=>c.grp?html.replace(/^<t([dh])( class="([^"]*)")?/,
  (m,tag,_a,cls)=>`<t${tag} class="${cls||''} grp"`):html;
/* The cards subtotal, keyed by column so it cannot fall out of step with
   the header the way a hand-counted run of <td>s does. */
function totalRow(C,cols){
  const T=C.totals;
  const cell={
    name:'<th scope="row">Total</th>',
    limit:`<td class="num">${money0(T.limit)}</td>`,
    balance:`<td class="num">${money(T.cardBalance)}</td>`,
    drift:'<td></td>',
    usage:`<td class="num">${pct(T.usage)}</td>`,
    minAmt:`<td class="num">${money(sum(C,'minAmt','card'))}</td>`,
    minWk:`<td class="num">${money(r2(sum(C,'minAmt','card')/MIN_DIVISOR))}</td>`,   /* cards are all monthly */
    min:`<td class="num">${money(sum(C,'min','card'))}</td>`,
    attack:`<td class="num">${money(sum(C,'attack','card'))}</td>`,
    other:`<td class="num">${money(sum(C,'other','card'))}</td>`,
    total:`<td class="num">${money(sum(C,'total','card'))}</td>`,
    out:'<td></td>',
    interest:`<td class="num">${money(sum(C,'weekInterest','card'))}</td>`,
    after:`<td class="num">${money(T.cardAfter)}</td>`,
    usageAfter:`<td class="num">${pct(T.usageAfter)}</td>`,
    availAfter:`<td class="num">${money(T.availAfter)}</td>`,
  };
  return `<tr class="tot">${cols.map(c=>markGroup(cell[c.k]||'<td></td>',c)).join('')}</tr>`;
}
const sum=(C,f,kind)=>r2(C.rows.filter(r=>r.a.kind===kind).reduce((s,r)=>s+n0(r[f]),0));
</script>
<script>
"use strict";
const STRATS=[{id:'avalanche',l:'Avalanche'},{id:'snowball',l:'Snowball'},{id:'custom',l:'My order'}];
/* One segmented control for Attack and Payoff. The new CSS keys on aria-pressed
   (which is what a toggle should expose anyway); `on` is only there for the old
   stylesheet still serving Payoff under .legacy, and goes when .legacy does. */
const stratSeg=cur=>`<div class="seg">${STRATS.map(x=>
  `<button data-strat="${x.id}" class="${cur===x.id?'on':''}" aria-pressed="${cur===x.id}">${x.l}</button>`).join('')}</div>`;
const planSteps=()=>(S.plan&&S.plan.steps)||[];
/* the budget the plan actually reaches once every step has fired */
function simOpts(k,budget,strategy){return{strategy,budget,fromWeek:k,steps:stepsFor(k)}}

/* ── Attack ───────────────────────────────────────────────────────── */
function viewAttack(el){
  const k=currentWeek(),C=computeWeek(k),T=C.totals;
  const all=debtSnapshot(k);
  if(!all.length){el.innerHTML=`<main class="page">
    <header class="masthead"><div><h1 class="page-title">Attack</h1></div></header>
    <p class="lede">No balances to attack. That is the whole point.</p></main>`;return}
  const grace=all.filter(d=>d.grace), debts=all.filter(d=>!d.grace);
  const strat=UI.strategy;
  const budget=Math.max(n0(T.debtFunded),all.reduce((s,d)=>s+d.weeklyMin,0));
  const rank=Object.fromEntries((S.plan.order||[]).map((id,i)=>[id,i]));
  const ranked=[...debts].sort((a,b)=>
    strat==='snowball'?a.balance-b.balance
    :strat==='custom'?((rank[a.id]??999)-(rank[b.id]??999))
    :(b.apr-a.apr||b.balance-a.balance));
  const top=ranked[0];

  const av =simulate(all,simOpts(k,budget,'avalanche'));
  const sn =simulate(all,simOpts(k,budget,'snowball'));
  const cus=simulate(all,simOpts(k,budget,'custom'));
  const cur=simulate(all,simOpts(k,budget,'current'));
  const chosen={avalanche:av,snowball:sn,custom:cus}[strat];
  const saving=r2(cur.totalInterest-chosen.totalInterest);
  const vsAv=r2(chosen.totalInterest-av.totalInterest);

  const attackRows=C.rows.filter(r=>KIND_DEBT(r.a.kind)&&r.attack>0);
  const onTarget=attackRows.length===1&&attackRows[0].a.id===top.id;
  const why={
    avalanche:`Highest rate in the stack at <b>${pct(top.nominalApr,2)}</b>, costing <b>${money(top.weekInterest)}</b> in interest every week it sits there. Every dollar here is worth more than a dollar anywhere else.`,
    snowball:`Smallest balance at <b>${money(top.balance)}</b>. Clearing it frees its ${money(top.weeklyMin)}/wk minimum for the next one.`,
    custom:`First in your order. ${top.limit&&top.kind==='card'?`A card at <b>${pct(top.balance/top.limit,0)}</b> utilization — clearing it moves the number FICO actually scores, which rate-sorting can't see.`:`Ahead of the rate ranking by your own call.`}`,
  }[strat];

  /* Same shape checksHTML takes on This Week, so the three-level marking, the
     oxblood margin rule and the collapsed "going well" list are the one
     implementation rather than a second set that drifts. */
  const notes=[];
  for(const g of grace)notes.push({s:'warn',t:`<b>${esc(g.name)} is in grace — do not attack it.</b> ${money(g.balance)} due in full by ${g.graceDue?dueLabel(g.graceDue):'the due date'}. It costs ${money(0)} to carry, but a partial payment ends grace and ${pct(g.nominalApr,2)} applies to the whole balance.`});
  if(T.attack<=0)notes.push({s:'warn',t:`No attack money assigned this week. Minimums alone leave <b>${money(T.weekInterest)}</b> of interest on the table over the next 7 days.`});
  else if(onTarget)notes.push({s:'ok',t:`This week's <b>${money(T.attack)}</b> is already going to ${esc(top.name)}.`});
  else notes.push({s:'warn',t:`This week's attack is on <b>${attackRows.map(r=>esc(r.a.name)).join(', ')||'nothing'}</b>. ${esc(top.name)} is what your ${strat==='custom'?'order':strat} says.`});
  /* Attack ranks by whichever strategy is selected; Plan always shows the
     order you set. When those disagree the two tabs tell you to pay different
     accounts and neither mentions the other, which is how you end up putting
     money somewhere your own plan did not ask for. */
  if(strat!=='custom'&&(S.plan.order||[]).length){
    const mine=[...debts].sort((a,b)=>(rank[a.id]??999)-(rank[b.id]??999))[0];
    if(mine&&mine.id!==top.id)
      notes.push({s:'warn',t:`<b>This is the ${strat} ranking, not your order.</b> `
        +`Your order on the Plan tab leads with ${esc(mine.name)}; ${strat} leads with `
        +`${esc(top.name)} because it sorts by ${strat==='snowball'?'balance':'rate'} alone. `
        +`Switch to <b>My order</b> above to see the one you decided on.`});
  }
  if(strat==='custom'&&cus.weeks!==Infinity&&av.weeks!==Infinity)
    /* Severity keys on DIRECTION, not magnitude. Beating avalanche by $279 is not a
       thing that needs attention, and R9 keeps oxblood for what is actually wrong.
       Only your order costing meaningfully MORE is worth flagging. */
    notes.push({s:vsAv>50?'warn':'ok',t:`Your order costs <b>${vsAv>0?money0(vsAv)+' more':money0(-vsAv)+' less'}</b> in interest than pure avalanche and finishes <b>${monthsLabel(Math.abs(weeksToMonths(cus.weeks)-weeksToMonths(av.weeks)))}</b> ${cus.weeks>av.weeks?'later':'earlier'}${Math.abs(vsAv)<50?' — close enough that the utilization argument wins':''}.`});
  if(cur.weeks===Infinity&&chosen.weeks!==Infinity)
    notes.push({s:'ok',t:`Repeating this week's split forever never clears the balance — the interest outruns it. The same <b>${money(budget)}/wk</b>${chosen.endBudget>budget?`, rising to <b>${money(chosen.endBudget)}</b> as your steps land,`:''} clears everything by <b>${longDate(chosen.debtFreeDate)}</b>.`});
  else if(saving>1)
    notes.push({s:'ok',t:`Following this order pays off <b>${monthsLabel(weeksToMonths(cur.weeks)-weeksToMonths(chosen.weeks))} sooner</b> than repeating this week's split, and saves <b>${money0(saving)}</b> in interest.`});

  const bleed=debts.reduce((s,d)=>s+d.weekInterest,0);
  const rows=[['Avalanche — highest rate first',av],['Snowball — smallest balance first',sn],['Your order',cus],['Repeat this week’s split',cur]];
  const fin=rows.filter(r=>r[1].weeks!==Infinity).map(r=>r[1].weeks);
  const mx=Math.max(...(fin.length?fin:[520]));
  const best=Math.min(...rows.filter(r=>r[1].weeks!==Infinity).map(r=>r[1].totalInterest));

  el.innerHTML=`<main class="page">
  <header class="masthead">
    <div><h1 class="page-title">Attack</h1>
      <div class="dateline">${weekLabel(k)} · ${money(T.attack)} of attack money on the table</div></div>
    <div class="controls">${stratSeg(strat)}</div>
  </header>

  <div class="hero-row">
    <div class="hero-label">This week, put it here</div>
    <div class="hero-figure">${esc(top.name)}</div>
  </div>
  <p class="lede">${why}</p>

  <section class="band" aria-labelledby="attn-h">${checksHTML(notes)}</section>

  <section class="band" aria-labelledby="stack-h">
    <h2 class="sect-label" id="stack-h">The stack, ${strat==='avalanche'?'by what it costs you':strat==='snowball'?'by what clears first':'in your order'}</h2>
    <ul class="rank">
      ${ranked.map((d,i)=>`
      <li class="${i===0?'lead':''}">
        <span class="n">${i+1}</span>
        <span><span class="nm">${esc(d.name)}</span>
          <div class="meta">${money(d.balance)}${d.kind==='card'&&d.limit?` of ${money0(d.limit)} · ${pct(d.balance/d.limit,0)} used`:''} · ${pct(d.nominalApr,2)} APR${d.weeklyMin?` · ${money(d.weeklyMin)}/wk minimum`:''}</div></span>
        <span class="rt"><div class="rv">${money(d.weekInterest)}</div><div class="rl">interest / week</div></span>
      </li>`).join('')}
      ${grace.map(d=>`
      <li class="pif">
        <span class="n">PIF</span>
        <span><span class="nm">${esc(d.name)}</span>
          <div class="meta">${money(d.balance)} due in full by ${d.graceDue?dueLabel(d.graceDue):'the due date'} · ${pct(d.nominalApr,2)} APR if grace breaks</div></span>
        <span class="rt"><div class="rv">${money(0)}</div><div class="rl">interest / week</div></span>
      </li>`).join('')}
    </ul>
    <div class="legend"><span class="k">Total bleed <b>${money(bleed)}</b> per week · <b>${money(bleed*52/12)}</b> per month</span></div>
  </section>

  <section class="band" aria-labelledby="four-h">
    <h2 class="sect-label" id="four-h">Same ${money(budget)} a week, four ways</h2>
    <div class="tl">
      ${rows.map(([nm,r])=>`<div class="tlr${r.weeks!==Infinity&&r.totalInterest===best?' lead':''}">
        <div class="tln">${nm}</div>
        <div class="tlbar"><i class="${r.weeks===Infinity?'never':''}" style="width:${clamp((r.weeks===Infinity?mx:r.weeks)/mx*100,2,100)}%"></i></div>
        <div class="tlv">${r.weeks===Infinity?'never':monthsLabel(weeksToMonths(r.weeks))}</div></div>`).join('')}
    </div>
    <div class="legend">
      <span class="k">Avalanche <b>${money0(av.totalInterest)}</b></span>
      <span class="k">Snowball <b>${money0(sn.totalInterest)}</b></span>
      <span class="k">Your order <b>${money0(cus.totalInterest)}</b></span>
      <span class="k">This week's split <b>${cur.weeks===Infinity?'never clears':money0(cur.totalInterest)}</b></span>
    </div>
  </section>
  </main>`;
}

function viewPayoff(el){
  const k=currentWeek(),C=computeWeek(k),T=C.totals;
  /* Starts from the sheet, like Projections: the opening week is the sheet as
     entered, card minimums come out of the card-minimum bucket, and a renewing
     fund takes its weekly amount back while it refills. Only the weekly budget
     is a what-if. */
  const debts=sheetDebts(k),funds=sheetFunds(k);
  if(!debts.length){el.innerHTML=`<main class="page">
    <header class="masthead"><div><h1 class="page-title">Payoff</h1></div></header>
    <p class="lede">Nothing left to pay off.</p></main>`;return}
  const floor=r2(debts.reduce((s,d)=>s+d.weeklyMin,0));
  if(UI.extra==null)UI.extra=Math.max(n0(T.debtFunded),floor);
  const budget=Math.max(0,n0(UI.extra));
  const strat=UI.strategy;
  const sim=simulate(debts,sheetSimOpts(k,budget,strat,funds));
  const av =simulate(debts,sheetSimOpts(k,budget,'avalanche',funds));
  const sn =simulate(debts,sheetSimOpts(k,budget,'snowball',funds));
  const cus=simulate(debts,sheetSimOpts(k,budget,'custom',funds));
  const flat=simulate(debts,{strategy:strat,budget,fromWeek:k,steps:[],sheetFirst:true,lumps:sheetLumps(k)});
  const fundOf=Object.fromEntries(funds.map(f=>[f.id,f]));
  /* What each step really does once the sheet is the starting point. */
  const stepSays=st=>{
    const tr=st.trigger||{},f=fundOf[tr.acct],at=st.fired?longDate(addWeeks(k,st.fired.week)):'';
    if(f)return{rv:money(f.weekly),rl:'to the premium',
      meta:`renews every ${f.every} months, so its weekly goes back to refilling it`};
    if(tr.type==='payoff')return{rv:'rolls over',rl:'',
      meta:`its payment moves down the order when it clears${at?` · ${at}`:''} — already in the weekly total`};

const rateRow=key=>{if(!key)return null;const[gi,ri]=key.split(':').map(Number);

/* what a game pays: the division's rate for the role, plus the single-game fee if claimed */
function refPay(key,role,fee){
  const x=rateRow(key);if(!x)return null;
  const base=role==='lines'&&x.r.lines!=null?x.r.lines:x.r.ref;
  if(base==null)return null;
  const f=fee&&!x.r.noFee?n0(x.r.fee!=null?x.r.fee:x.g.fee):0;
  return r2(n0(base)+f);
}
const refFeeFor=key=>{const x=rateRow(key);return !x||x.r.noFee?0:n0(x.r.fee!=null?x.r.fee:x.g.fee)};

/* the rate a level paid last time — at this rink if it has been reffed here */
function refRateFor(rink,level){
  const g=refGames().filter(x=>x.level===level).sort((a,b)=>b.date.localeCompare(a.date));
  const here=g.find(x=>x.rink===rink)||g[0];
  return here?n0(here.rate):null;
}
function addRefGame(){

      ${R.groups.map((g,gi)=>`<optgroup label="${esc(g.name)}">${g.rows.map((r,ri)=>`<option value="${rateKey(gi,ri)}">${esc(r.div)}</option>`).join('')}</optgroup>`).join('')}</select></div>

    <div class="fieldrow"><label style="text-transform:none;letter-spacing:0;font-size:var(--text-2)"><input type="checkbox" id="rgP" style="width:auto;margin-right:6px">Already paid</label></div>`,
    'Add game',()=>{

        role:$('#rgO').value,div,fee:!!(div&&$('#rgF').checked&&refFeeFor(div)),paid,paidOn:paid?iso(new Date()):null});

    });
  /* A division on the rate sheet sets the level's name and the rate for the

    $('#rgL')?.addEventListener('change',sync);
    sync();$('#rgV')?.focus();
  },40);

/* Rows copied out of the spreadsheet arrive tab-separated: date, rink, level,

/* ── Timetoscore assignments ──────────────────────────────────────
   The LAHOA portal's games table, copied and pasted. Columns: Game, Date,
   Time, Rink, League, Level, Away, Home, Type, then the officials — Referee,
   Linesman, Linesman, Referee, Supervisor, Evaluator. A paste may keep its
   tabs and line breaks or lose both, so rows are found by their shape rather
   than by lines: a game number followed by a date like "Sat Sep 26" and a
   time. The role is the column the user's name sits in; with the empty
   columns collapsed it falls back to order (first name referee, next two

const TTS_DATE=/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{1,2})$/;

    const ri=R.groups[gi].rows.findIndex(test);return ri<0?'':rateKey(gi,ri)};

  if(/ADHSHL/.test(L+' '+G)){
    if(/JV|JR|JUNIOR/.test(L))return find('hs',r=>has(r.div,'ADHSHL JV'));
    return find('hs',r=>has(r.div,'ADHSHL VARSITY')&&(/\b[23]\b/.test(L)?has(r.div,'2 & 3'):has(r.div,'VARSITY 1')));
  }
  if(/USPHL/.test(L+' '+G))return find('hs',r=>has(r.div,'USPHL')&&(/NCDC/.test(L)?has(r.div,'NCDC'):has(r.div,'PREMIER')));
  if(/\bACHA\b/.test(L+' '+G))return find('hs',r=>r.div.toUpperCase()==='ACHA');

    const ages=[...d.matchAll(/(\d{1,2})U/g)].map(x=>+x[1]);if(!ages.includes(age))return false;
    if(age<=8)return true;
    const tiers=(d.trim().split(/\s+/).pop()||'').split('/');return tier&&tiers.includes(tier)};

function parseTimetoscore(text,sy,me){
  const tabbed=text.includes('\t');
  const cells=(tabbed?text.replace(/\r?\n/g,'\t').split('\t'):text.split(/\s{2,}|\r?\n/)).map(x=>x.trim());
  const starts=[];
  for(let i=0;i+2<cells.length;i++)if(cells[i]&&TTS_DATE.test(cells[i+1])&&TTS_TIME.test(cells[i+2]))starts.push(i);
  const MON={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
  const rows=starts.map((i,j)=>{
    const c=cells.slice(i,starts[j+1]??cells.length);
    const dm=c[1].match(TTS_DATE),mo=MON[dm[2]],yr=mo>=9?sy:sy+1;
    const officials=c.slice(9,15);
    const clean=n=>n.replace(/\[.*?\]/g,'').trim();
    return{gameNo:c[0],date:iso(new Date(yr,mo-1,+dm[3])),time:c[2].toUpperCase().replace(/\s+/,' '),
      rink:c[3]||'',league:c[4]||'',level:c[5]||'',away:c[6]||'',home:c[7]||'',type:c[8]||'',
      officials:officials.map(clean),named:officials.map(clean).filter(Boolean)};
  });

     game pasted, or a crew that never changes, every name is on every game —
     then nobody is guessed, and the import asks. */
  if(!me){const count={};for(const r of rows)for(const n of new Set(r.named))count[n]=(count[n]||0)+1;
    const all=Object.keys(count).filter(n=>count[n]===rows.length);me=all.length===1?all[0]:''}
  const mins=t=>{const m=t.match(/(\d{1,2}):(\d{2})\s*([AP])M/i);if(!m)return 0;return(+m[1]%12+(m[3].toUpperCase()==='P'?12:0))*60+ +m[2]};
  for(const r of rows){
    const pos=r.officials.indexOf(me);

    if(r.named.length===2&&r.named.includes(me))role='ref';
    else if(tabbed&&pos>=0)role=pos===0||pos===3?'ref':pos===1||pos===2?'lines':null;
    else{const k=r.named.indexOf(me);role=k===0||k===3?'ref':k===1||k===2?'lines':null}

     rink within three hours of it (LAHOA: different rinks, or more than an hour
     and a half between games). An estimate, shown for review before import. */
  /* games already logged count as company too; one logged without a time is
     assumed close, since a fee wrongly claimed is worse than one missed */
  const logged=((S.reffing&&S.reffing.games)||[]).filter(g=>!rows.some(r=>r.gameNo&&r.gameNo===g.gameNo));
  for(const r of rows){
    const near=rows.some(o=>o!==r&&o.date===r.date&&o.rink===r.rink&&Math.abs(mins(o.time)-mins(r.time))<=180)
      ||logged.some(g=>g.date===r.date&&g.rink===r.rink&&(!g.time||Math.abs(mins(g.time)-mins(r.time))<=180));
    r.fee=!near&&!!refFeeFor(r.div);
    r.rate=r.role&&r.div?refPay(r.div,r.role,r.fee):null;
    if(r.rate==null&&r.level){const last=refRateFor(r.rink,r.level);if(last!=null)r.rate=last}
  }
  return{rows:rows.filter(r=>r.role),skipped:rows.filter(r=>!r.role),me};
}
function importTimetoscore(text,sy){
  const R=S.reffing=S.reffing||{games:[]};
  const typed=(($('#refMe')||{}).value||'').trim();
  const {rows,skipped,me}=parseTimetoscore(text,sy,typed||R.me||'');
  if(!me){toast('Type your name as it appears on the portal, then import again');$('#refMe')?.focus();return}
  if(!rows.length){toast(skipped.length?`None of those games have ${me} on them`:'No games found in that paste');return}
  const games=refGames(),known=new Set(games.map(g=>g.gameNo).filter(Boolean));
  const fresh=rows.filter(r=>!known.has(r.gameNo));
  /* A game already here whose role the portal now shows differently from the
     last time it was read — the crew settled after it was first posted. Only
     a change on the portal's side counts: a role switched here by hand, ahead
     of the portal catching up, is not undone by pasting the old schedule. */
  const byNo=Object.fromEntries(games.filter(g=>g.gameNo).map(g=>[g.gameNo,g]));
  const portalWas=g=>g.portalRole!=null?g.portalRole:g.role;

  if(caught)save();   /* the portal caught up with a switch made here — nothing to ask */
  const dup=rows.length-fresh.length-moved.length;
  if(!fresh.length&&!moved.length){toast(`Nothing new — ${dup} game${dup===1?' is':'s are'} already here`);return}
  const title=[fresh.length?`import ${fresh.length} game${fresh.length===1?'':'s'}`:'',moved.length?`update ${moved.length} role${moved.length===1?'':'s'}`:''].filter(Boolean).join(', ');
  modal(`<h3>${title[0].toUpperCase()+title.slice(1)}</h3>
    <p>Read as <b>${esc(me)}</b>.${dup?` ${dup} already here, unchanged.`:''}${skipped.length?` ${skipped.length} without you on them, left out.`:''} Check the rates, then import — anything can be edited afterwards.</p>
    ${moved.length?`<div class="cmp-wrap"><table class="ref"><thead><tr><th>Role changed</th><th>Level</th><th>Now</th><th class="r">Rate</th></tr></thead><tbody>
    ${moved.map(r=>{const g=byNo[r.gameNo],pay=g.div&&!g.rateManual?refPay(g.div,r.role,g.fee):null;
      return `<tr><td>${dueLabel(r.date)} · ${esc(r.time)}</td><td>${esc(r.level)}</td><td>${r.role==='ref'?'Referee':'Linesperson'}</td>
      <td class="r">${money(n0(g.rate))} → ${money(pay!=null?pay:n0(g.rate))}</td></tr>`}).join('')}</tbody></table></div>`:''}
    ${fresh.length?`<div class="cmp-wrap"><table class="ref"><thead><tr><th>Date</th><th>Level</th><th>Role</th><th class="r">Rate</th></tr></thead><tbody>
    ${fresh.map(r=>`<tr><td>${dueLabel(r.date)} · ${esc(r.time)}</td><td>${esc(r.level)}${r.div?'':' <span class="wi-now">not on the rate sheet</span>'}</td>
      <td>${r.role==='ref'?'Referee':'Linesperson'}</td>
      <td class="r">${r.rate==null?'<span class="wi-now">set after</span>':money(r.rate)}${r.fee?` <span class="wi-now">incl. ${money(refFeeFor(r.div))} fee</span>`:''}</td></tr>`).join('')}
    </tbody></table></div>`:''}`,
    fresh.length?`Import ${fresh.length}`:'Update',()=>{
      pushUndo(null);

        const pay=g.div&&!g.rateManual?refPay(g.div,r.role,g.fee):null;if(pay!=null)g.rate=pay}

        level:r.level,rate:r.rate==null?0:r2(r.rate),role:r.role,portalRole:r.role,div:r.div,fee:r.fee,paid:false,paidOn:null});
      UI.refSeason=sy;save();render();
      toast(`${[fresh.length?`${fresh.length} imported`:'',moved.length?`${moved.length} role${moved.length===1?'':'s'} updated`:''].filter(Boolean).join(', ')} — ⌘Z to undo`);
    });
}
function importRefGames(){
  const text=($('#refPaste')||{}).value||'',sy=+(($('#refPasteSeason')||{}).value||seasonOf(iso(new Date())));
  if(looksLikeTimetoscore(text))return importTimetoscore(text,sy);
  const games=refGames(),have={},took={};
  for(const g of games){const kk=[g.date,g.rink,g.level,r2(n0(g.rate))].join('|');have[kk]=(have[kk]||0)+1}
  let added=0,skipped=0;const fresh=[];
  for(const line of text.split(/\r?\n/)){
    const c=line.split(/\t|\s{2,}/).map(x=>x.trim());
    const dm=(c[0]||'').match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
    if(!dm)continue;
    const mo=+dm[1],da=+dm[2];
    let yr=dm[3]?+dm[3]:(mo>=9?sy:sy+1);if(yr<100)yr+=2000;
    const rate=n0(String(c[3]||'').replace(/[$,]/g,''));
    if(!c[1]&&!c[2]&&!rate){skipped++;continue}
    const date=iso(new Date(yr,mo-1,da));
    const paid=/^(true|yes|y|x|✓|✔|paid)$/i.test(c[4]||'');
    const key=[date,c[1]||'',c[2]||'',r2(rate)].join('|');
    took[key]=(took[key]||0)+1;
    if(took[key]<=(have[key]||0)){skipped++;continue}
    fresh.push({date,rink:c[1]||'',level:c[2]||'',rate:r2(rate),paid,paidOn:null});
  }
  if(!fresh.length){toast(skipped?'Nothing new — those games are already here':'No games found in that paste');return}
  pushUndo(null);
  for(const g of fresh){g.id=nextId(games,'g');games.push(g);added++}
  UI.refSeason=sy;save();render();
  toast(`${added} game${added===1?'':'s'} imported${skipped?`, ${skipped} skipped`:''} — ⌘Z to undo`);
}

/* ── Starting from the sheet ──────────────────────────────────────
   Shared by Payoff and Projections, so the two can never tell different
   stories about the same sheet. */

/* The sheet's debts, with card minimums filled in. A card has no minimum on
   the sheet until its statement closes, so left alone the simulator pays it
   nothing: the card-minimum bucket's money all goes to whichever debt is being
   attacked, and every other card climbs on interest — past its limit, in a
   chart meant to be the best case. That money really does pay card minimums,
   so it is split across the cards without one, weighted the way issuers set a
   minimum: a month's interest plus 1% of the balance. Cards with a minimum
   entered are paid first. */
function sheetDebts(k){
  const C=computeWeek(k),debts=debtSnapshot(k);
  if(!C)return debts;
  const noMin=debts.filter(d=>d.kind==='card'&&d.weeklyMin<=0&&!d.grace);
  const spare=r2(n0(C.totals.debtBucket)-debts.filter(d=>d.kind==='card'&&d.weeklyMin>0).reduce((t,d)=>t+d.weeklyMin,0));
  const weight=d=>d.balance*(d.nominalApr/12+0.01),totalW=noMin.reduce((t,d)=>t+weight(d),0);
  if(spare>0&&totalW>0)for(const d of noMin)d.weeklyMin=r2(spare*weight(d)/totalW);
  return debts;

/* Funds whose goal is spent and saved again every term. */
function sheetFunds(k){
  const C=computeWeek(k);if(!C)return[];
  return C.rows.filter(r=>!r.isRollup&&r.a.target&&r.a.target.every&&r.a.target.by&&n0(r.a.target.amount)>0&&weeklyOf(r)>0)
    .map(r=>{const t=r.a.target,renew=new Set();
      const anchor=parseISO(t.by).getDate();
      for(let i=0;i<240;i++){const d0=parseISO(t.by);
        const x=monthlyOn(d0.getFullYear(),d0.getMonth()+i*t.every,anchor);
        const wk=Math.floor(daysBetween(k,x)/7);
        if(wk>=1)renew.add(wk)}

/* Reffing pay not yet received, from games already logged. Each lands two

const REF_LAG_DAYS=14;

  const by={};
  for(const g of ((S.reffing&&S.reffing.games)||[])){
    if(g.paid||n0(g.rate)<=0||!g.date)continue;
    const w=Math.max(1,Math.floor(daysBetween(k,addDays(g.date,REF_LAG_DAYS))/7));

}
const sheetSimOpts=(k,budget,strategy,funds)=>({...simOpts(k,budget,strategy),sheetFirst:true,funds:funds||sheetFunds(k),lumps:sheetLumps(k)});

  const budget=Math.max(n0(T.debtFunded),floor);

        style="${figureWidth(n0(car.insurance).toFixed(2))}" value="${n0(car.insurance).toFixed(2)}" aria-label="Car insurance per week after the sale">/wk
        <span class="wi-now">now ${money(insNow)}</span></label>`:''}
      <span class="wi-says">${isWhatIf
        ?(base.weeks===Infinity||sim.weeks===Infinity?'':`Debt free <b>${longDate(sim.debtFreeDate)}</b> instead of ${longDate(base.debtFreeDate)}`
          +` — ${monthsLabel(weeksToMonths(base.weeks)-weeksToMonths(sim.weeks))} sooner, ${money0(base.totalInterest-sim.totalInterest)} less interest`)
        :'Off — the projection below is without it.'}${carLumps.length&&raises.length?`<span class="wi-now"> · includes ${money(insSave)}/wk off insurance</span>`:''}</span>
    </div>
  </section>

  <section class="band" aria-labelledby="pt-h">
    <h2 class="sect-label" id="pt-h">All loans and cards</h2>
    <p class="lede muted">The first week is this sheet exactly as entered. After that, the same total goes to
      debt every week with nothing new charged, interest at each account's rate, card minimums paid from the
      card-minimum bucket, and attack moving down the order as each debt clears. A fund that renews takes its weekly
      amount back while it refills. It updates whenever the sheet does.${refN?` Includes <b>${money(refOwed)}</b> of reffing
      pay still owed for ${refN} game${refN===1?'':'s'}, going to the cards two weeks after each game.`:''}</p>
    <div class="chart" id="projTotal"></div>
  </section>

  ${events.length?`<section class="band" aria-labelledby="pe-h">

    <p class="lede muted">Attack is what is left each week after every open debt gets its minimum. Numbers match the marks on the chart above.</p>
    <div class="cmp-wrap"><table class="cmp ev-table">
      <thead><tr><th>#</th><th>When</th><th>What changes</th><th>Attack gains</th><th>Attack each week</th></tr></thead>
      <tbody>
        <tr><td></td><td>${dayYear(when(1))}</td><td>Starting point, after this sheet${(()=>{const c=sim.debts.filter(d=>d.paidOff===1);
          return c.length?` pays off ${c.map(d=>esc(d.name)).join(' and ')}`:''})()}</td><td></td><td>${money(attackAt(1))}</td></tr>
        ${events.map(e=>e.here.map((x,j)=>`<tr>
          <td>${j===0?e.n:''}</td><td>${j===0?dayYear(when(e.w)):''}</td><td>${esc(x.what)}</td>
          <td class="${x.gain<0?'ev-down':'ev-up'}">${x.gain<0?'−':'+'}${money(Math.abs(x.gain))}${x.once?' once':''}</td>
          <td>${j===e.here.length-1?money(e.after):''}</td></tr>`).join('')).join('')}
      </tbody>

  <section class="band" aria-labelledby="pa-h">
    <h2 class="sect-label" id="pa-h">Each account<span class="count">same timeline · each on its own scale</span></h2>
    <div class="proj-grid">${accts.map((d,i)=>`<div class="proj">
      <div class="proj-hd"><span class="nm" title="${esc(d.name)}">${esc(d.name)}</span>
        <span class="when${d.paidOff==null?' never':''}">${d.paidOff==null?'not cleared':'clears '+longDate(when(d.paidOff))}</span></div>
      <div class="proj-meta">${money(debts.find(x=>x.id===d.id).balance)} now · ${money0(d.interest)} interest</div>
      <div class="chart" id="projA${i}"></div></div>`).join('')}</div>
  </section>

  requestAnimationFrame(()=>{
    const tot=$('#projTotal');
    const evAt=Object.fromEntries(events.map(e=>[e.w,e]));
    if(tot)lineChart(tot,idx.map(i=>{const p=sim.series[i],e=evAt[p.w];return{x:shortMY(when(p.w)),t:(e?e.n+' · ':'')+dayYear(when(p.w)),v:p.total,
      rows:[['All debt',money0(p.total)],...(e?e.here.map(x=>[x.what,(x.gain<0?'−':'+')+money(Math.abs(x.gain))]):[]),
        ...(e?[['Attack each week',money(e.after)]]:[])]}}),
      {h:240,label:'All loans and cards',marks:events.filter(e=>evW.has(e.w)).map(e=>({i:idx.indexOf(e.w),n:e.n}))});
    accts.forEach((d,i)=>{
      const c=$('#projA'+i);if(!c)return;
      lineChart(c,idx.map(j=>{const p=sim.series[j],v=n0(p.by&&p.by[d.id]);
        return{x:shortMY(when(p.w)),t:dueLabel(when(p.w))+' '+when(p.w).slice(0,4),v,rows:[[d.name,money(v)]]}}),
        {h:140,label:`${d.name} projected balance`,xTicks:4});
    });
  });
}

/* ── Calendar ─────────────────────────────────────────────────────
   Dates come from the week that is actually happening, not whichever week
   is open on the sheet: a forward-planned week has its dates rolled ahead
   and would put this month's due dates a month late. */
function realWeek(){
  const ks=weekKeys(),now=thisWeek();
  if(S.weeks[now])return now;
  const past=ks.filter(k=>k<=now);
  return past.length?past[past.length-1]:ks[0];
}
const lastDayOf=(y,m)=>new Date(y,m+1,0).getDate();
/* The day a monthly date recurs on. A date clamped into a short month (the
   31st landing on the 30th) says less than the account remembers, so the
   remembered day wins when the stored one is exactly that clamp. */
function anchorDay(date,remembered){
  const d=parseISO(date),day=d.getDate();
  return remembered&&remembered>day&&day===lastDayOf(d.getFullYear(),d.getMonth())?remembered:day;
}
function monthlyOn(y,m,anchor){return iso(new Date(y,m,Math.min(anchor,lastDayOf(y,m))))}
/* Every occurrence of a monthly date inside [from, to]. */
function recurring(date,remembered,from,to){
  if(!date)return[];
  const anchor=anchorDay(date,remembered),out=[];
  const a=parseISO(from);
  for(let i=-1;i<=2;i++){
    const x=monthlyOn(a.getFullYear(),a.getMonth()+i,anchor);
    if(x>=from&&x<=to)out.push(x);
  }
  return out;
}
const monthBefore=(date,remembered)=>{const d=parseISO(date);
  return monthlyOn(d.getFullYear(),d.getMonth()-1,anchorDay(date,remembered))};
const centsUp=n=>Math.ceil(n*100-1e-6)/100;   /* a quarter can land on a half-cent; rounding first would lose it */

/* Can a payday be skipped before the next due date?

   A sheet is worked on the Friday AFTER the week it is named for: the
   9.11–9.17 sheet is done, and paid, on payday the 18th. So each payday reads
   the sheet that ended the day before it — `sheetFor(payday)`.

   Paydays that have already happened count only if they fall on or after the
   previous due date — before that, they paid the previous month. Paydays
   still to come, today's included, all count, because moving the due date
   forward on the sheet is how a paid month is recorded. A sheet already in
   the ledger contributes what its Min actually says, so a skip entered there
   is seen here; one not built yet is assumed to get the usual weekly amount. */
const sheetFor=payday=>addWeeks(payday,-1);
function skipCheck(r,today){
  const amount=r2(n0(r.minAmt)),weekly=centsUp(amount/MIN_DIVISOR),due=r.due;
  const prev=monthBefore(due,r.a.dueDay);
  let setAside=0;const future=[];
  for(let f=weekStartOf(parseISO(prev));f<due;f=addWeeks(f,1)){
    const sk=sheetFor(f),e=S.weeks[sk]&&S.weeks[sk].entries[r.a.id];
    if(f<today){if(f>=prev&&e)setAside=r2(setAside+n0(e.min))}
    else future.push({f,sheet:sk,amt:S.weeks[sk]?n0(e&&e.min):weekly,planned:!!S.weeks[sk]});
  }
  const plan=r2(setAside+future.reduce((t,x)=>t+x.amt,0));
  const slack=r2(plan-amount);
  const skipped=future.filter(x=>x.planned&&x.amt<0.005).length;
  const live=future.filter(x=>x.amt>=0.005);
  const canSkip=slack<-0.005?0:Math.min(live.length,Math.floor((slack+0.005)/weekly));
  return{amount,weekly,due,late:due<today,setAside,future,skipped,
    short:slack<-0.005?r2(-slack):0,canSkip,spare:r2(slack-canSkip*weekly),
    first:live[0],last:future.length?future[future.length-1].f:null};
}

function viewCalendar(el){
  const today=iso(new Date());
  const ym=UI.calMonth||monthOf(today);
  const y=+ym.slice(0,4),m=+ym.slice(5,7)-1;
  const first=`${ym}-01`,last=monthlyOn(y,m,31);
  /* Laid out Sunday to Saturday like any wall calendar. The ledger still runs
     Friday to Thursday; paydays are marked on their Fridays instead of being
     the edge of every row, which made the month hard to read. */
  const sundayOf=d=>addDays(d,-parseISO(d).getDay());
  const gridFrom=sundayOf(first),gridTo=addDays(sundayOf(last),6);
  const rk=realWeek(),C=computeWeek(rk);
  const rows=C?C.rows.filter(r=>!r.isRollup&&r.a.kind!=='income'):[];

  /* everything dated, keyed by day */
  const byDay={};
  const put=(d,ev)=>{if(d<gridFrom||d>gridTo)return;(byDay[d]=byDay[d]||[]).push(ev)};
  /* A debt at $0 with nothing billing to it gets no statement and no minimum,
     so its close and due dates are noise. The exception is a card a bucket
     exists to pay — it reads $0 on the sheet while charges build on it all
     month, and its dates are when that bucket has to pay. */
  const paidByBucket=new Set(liveAccounts().map(a=>a.autoOut).filter(Boolean));
  for(const r of rows){
    if(KIND_DEBT(r.a.kind)&&r.balance<=0.005&&!paidByBucket.has(r.a.id))continue;
    const amt=n0(r.minAmt)>0&&!statedWeekly(r.a)?r2(r.minAmt):0;
    for(const d of recurring(r.due,r.a.dueDay,gridFrom,gridTo))
      put(d,{rank:0,cls:'ev-due'+(d<r.due?' is-done':d<today?' is-late':''),
        name:r.a.name,amt,title:`${r.a.name} due ${dueLabel(d)}${amt?` · ${money(amt)}`:''}`
          +(d<r.due?' — the sheet has already moved past this one':'')});
    for(const d of recurring(r.close,r.a.closeDay,gridFrom,gridTo))
      put(d,{rank:1,cls:'ev-close'+(d<today?' is-done':''),name:r.a.name,amt:0,
        title:`${r.a.name} statement closes ${dueLabel(d)}`});
  }
  for(let k=gridFrom;k<=gridTo;k=addWeeks(k,1))
    for(const x of subsInWeek(k))
      put(x.date,{rank:3,cls:'ev-sub'+(x.date<today?' is-done':''),name:x.name,amt:x.amount,
        title:`${x.name} bills ${dueLabel(x.date)} · ${money(x.amount)}`});
  /* Plan reminders were written by hand before the calendar could see due
     dates, closes and subscriptions for itself, so many of them now say the
     same thing twice on the same day. A reminder is split on its " · "
     separators and each part is dropped when it says nothing beyond an event
     already on that day — the same name, the same amount, and only the words
     that event implies. Whatever says more ("in full", "rises to") stays. A
     note on a dropped part moves onto the event it duplicated. */
  const words=t=>String(t).toLowerCase().replace(/\$[\d,]+(\.\d+)?/g,' ').match(/[a-z0-9+]+/g)||[];
  const amounts=t=>(String(t).match(/\$[\d,]+(\.\d+)?/g)||[]).map(x=>n0(x.replace(/[$,]/g,'')));
  const IMPLIED={0:['due','payment','pay','minimum','min'],1:['statement','closes','close','closing'],3:['bills','charge']};
  const saysNoMore=(part,e)=>{
    const known=new Set([...words(e.name),...(IMPLIED[e.rank]||[])]);
    const w=words(part);
    if(!w.some(x=>words(e.name).includes(x))||w.some(x=>!known.has(x)))return false;
    return amounts(part).every(v=>e.amt&&Math.abs(v-e.amt)<0.01);
  };
  /* A payoff is shown when it happens, not when it was hoped for: a debt ticked
     paid on the sheet whose payments clear its balance. It lands on the day
     the box was ticked, or — for a box ticked before that was recorded — on
     the payday the sheet is done on. */
  const debtAccts=liveAccounts().filter(a=>KIND_DEBT(a.kind));
  for(const k of weekKeys()){
    for(const a of debtAccts){
      const e=S.weeks[k].entries[a.id];
      if(!e||!e.paid)continue;
      const bal=n0(e.balance),paidAmt=r2(n0(e.min)+n0(e.attack)+n0(e.other));
      if(bal<=0.005||paidAmt+0.005<bal)continue;
      const on=e.paidOn||addWeeks(k,1);
      put(on,{rank:-1,cls:'ev-paid',name:`${a.name} paid in full`,amt:r2(bal),
        title:`${a.name} paid in full ${dueLabel(on)} · ${money(bal)} — ticked paid on the ${weekLabel(k)} sheet`});
    }
  }
  /* "…in full" reminders were the plan for exactly that event, so they are
     not drawn; the payoff above appears instead once it is real. */
  const namesAcct=(part,a)=>{const w=words(part);return words(a.name).every(x=>w.includes(x))};
  for(const c of (S.plan&&S.plan.calendar)||[]){
    if(c.done)continue;
    const auto=(byDay[c.d]||[]).filter(e=>e.rank!==2);
    const left=[];
    for(const part of c.t.split(/\s+·\s+/)){
      if(/\bin full\b/i.test(part)&&debtAccts.some(a=>namesAcct(part,a)))continue;
      const dup=auto.find(e=>saysNoMore(part,e));
      if(dup){if(c.n)dup.title+=` — ${c.n}`}
      else left.push(part);
    }
    /* one line per part: a cell is a seventh of the page, and three payments
       run together on one line only ever showed the first of them */
    for(const t of left)
      put(c.d,{rank:2,cls:'ev-note'+(c.d<today?' is-done':''),name:t,amt:0,title:t+(c.n?` — ${c.n}`:'')});
  }

  const inMonth=d=>d>=first&&d<=last;
  const paydays=[];for(let k=weekStartOf(parseISO(first));k<=last;k=addWeeks(k,1))if(inMonth(k))paydays.push(k);
  const dueSum=r2(Object.entries(byDay).filter(([d])=>inMonth(d))
    .reduce((t,[,evs])=>t+evs.filter(e=>e.rank===0&&!/is-done/.test(e.cls)).reduce((s,e)=>s+e.amt,0),0));
  const subSum=r2(Object.entries(byDay).filter(([d])=>inMonth(d))
    .reduce((t,[,evs])=>t+evs.filter(e=>e.rank===3).reduce((s,e)=>s+e.amt,0),0));

  const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  /* A payday is done on the sheet for the week that just ended, so the marker
     names that sheet and opens it. */
  const payMark=d=>{const sk=sheetFor(d),has=!!S.weeks[sk];
    return `<button class="cal-pay" data-calweek="${sk}" ${has?`title="Done on the ${weekLabel(sk)} sheet — open it"`
      :'disabled title="That sheet is not in the ledger yet"'}>Payday<span class="pre"> · ${weekLabel(sk)} sheet</span></button>`};
  let grid=DOW.map(x=>`<div class="cal-hd">${x}</div>`).join('');
  for(let k=gridFrom;k<=gridTo;k=addWeeks(k,1)){
    for(let i=0;i<7;i++){
      const d=addDays(k,i),evs=(byDay[d]||[]).sort((a,b)=>a.rank-b.rank);
      const pay=parseISO(d).getDay()===WEEK_START;
      const quiet=!evs.length&&!pay&&d!==today;
      grid+=`<div class="cal-day${inMonth(d)?'':' is-out'}${d===today?' is-today':''}${quiet?' is-quiet':''}${i===0?' is-wkstart':''}">
        <div class="cal-top"><span class="cal-n"><span class="dow">${DOW[i]}</span>${inMonth(d)?parseISO(d).getDate():dueLabel(d)}</span>${pay?payMark(d):''}</div>
        <div>${evs.map(e=>`<div class="ev ${e.cls}" title="${esc(e.title)}"><span class="mk"></span>`
          +`<span class="en">${esc(e.name)}</span>${e.amt?`<span class="ea">${money(e.amt)}</span>`:''}</div>`).join('')}</div>
      </div>`;
    }
  }

  const loans=rows.filter(r=>r.a.kind==='loan'&&r.due&&n0(r.minAmt)>0&&!statedWeekly(r.a))
    .map(r=>({r,k:skipCheck(r,today)})).sort((a,b)=>a.k.due.localeCompare(b.k.due));
  const skipCell=({k})=>{
    if(k.late)return `<td class="sk-late">Due date passed<span class="sk-meta">move it forward on the sheet</span></td>`;
    if(k.short)return `<td class="sk-short">Short ${money(k.short)}<span class="sk-meta">every payday is needed</span></td>`;
    if(k.canSkip)return `<td class="sk-yes">${k.canSkip} payday${k.canSkip>1?'s':''}`
      +`<span class="sk-meta">earliest ${dueLabel(k.first.f)}, the ${weekLabel(k.first.sheet)} sheet · ${money(k.spare)} spare after</span></td>`;
    return `<td>None<span class="sk-meta">${k.skipped?`${k.skipped} already skipped · `:''}${money(k.spare)} spare</span></td>`;
  };

  el.innerHTML=`<main class="page">
  <header class="masthead">
    <div><h1 class="page-title">Calendar</h1>
      <div class="dateline">${monthLabel(ym)}</div></div>
    <div class="controls">
      <button class="ctl" data-cgo="prev" aria-label="Previous month">←</button>
      <button class="ctl" data-cgo="today" ${ym===monthOf(today)?'disabled':''}>Today</button>
      <button class="ctl" data-cgo="next" aria-label="Next month">→</button>
    </div>
  </header>

  <div class="strip">
    <div class="metric"><div class="m-label">Paydays</div>
      <span class="m-value">${paydays.length}</span>
      <div class="m-note">${paydays.map(dueLabel).join(' · ')}</div></div>
    <div class="metric"><div class="m-label">Minimums still due</div>
      <span class="m-value">${money(dueSum)}</span></div>
    <div class="metric"><div class="m-label">Subscriptions</div>
      <span class="m-value">${money(subSum)}</span></div>
  </div>

  ${loans.length?`<section class="band" aria-labelledby="skip-h">
    <h2 class="sect-label" id="skip-h">Can a payday be skipped?</h2>
    <p class="lede muted">Counts the paydays left before each due date against what is still owed on it.
      Each payday reads the sheet for the week that just ended, so a $0 Min entered there shows up here.</p>
    <div class="cmp-wrap"><table class="cmp">
      <thead><tr><th>Loan</th><th>Due</th><th>Amount</th><th>Per week</th><th>Paydays left</th><th>Can skip</th></tr></thead>
      <tbody>${loans.map(x=>{const k=x.k;return `<tr>
        <td>${esc(x.r.a.name)}</td>
        <td>${dueLabel(k.due)}</td>
        <td>${money(k.amount)}</td>
        <td>${money(k.weekly)}</td>
        <td>${k.future.length}${k.last?`<span class="sk-meta">last ${dueLabel(k.last)}${k.setAside?` · ${money(k.setAside)} set aside`:''}</span>`:''}</td>
        ${skipCell(x)}</tr>`}).join('')}</tbody>
    </table></div>
  </section>`:''}

  <section class="band" aria-labelledby="cal-h">
    <h2 class="sect-label" id="cal-h">${monthLabel(ym)}</h2>
    <div class="cal">${grid}</div>
    <div class="legend cal-legend">
      <span class="k"><span class="mk fill"></span>Due</span>
      <span class="k paid"><span class="mk fill"></span>Paid in full</span>
      <span class="k"><span class="mk"></span>Statement closes</span>
      <span class="k"><span class="mk dot"></span>Reminder from Plan</span>
      <span class="k">· Subscription</span>
    </div>
  </section>
</main>`;
}
</script>
<script>
"use strict";
/* ── Plan ─────────────────────────────────────────────────────────── */
function viewPlan(el){
  const k=currentWeek(),C=computeWeek(k);
  const P=S.plan;
  const today=thisWeek(),weekEnd=addDays(k,7);
  const cal=[...P.calendar].sort((a,b)=>a.d.localeCompare(b.d));
  const overdue=cal.filter(c=>!c.done&&c.d<today);
  const soon=cal.filter(c=>!c.done&&c.d>=today&&c.d<addDays(today,28));
  const later=cal.filter(c=>!c.done&&c.d>=addDays(today,28));
  const done=cal.filter(c=>c.done);
  const openLeft=P.open.filter(o=>!o.done),openDone=P.open.filter(o=>o.done);

  const liveSubs=(P.subs||[]).filter(x=>subIsLive(x,today));
  const subsNow=subsMonthly(today);
  const nextSub=liveSubs.map(x=>({x,d:subNextCharge(x,iso(new Date()))})).filter(y=>y.d)
    .sort((p,q)=>p.d.localeCompare(q.d))[0];

  const debts=debtSnapshot(k);
  const byId=Object.fromEntries(debts.map(d=>[d.id,d]));
  const ordered=(P.order||[]).filter(id=>acct(id));
  const missing=debts.filter(d=>!ordered.includes(d.id)&&!d.grace);
  const nowRows=[...overdue.map(c=>({c,late:true})),...soon.filter(c=>c.d<weekEnd).map(c=>({c,late:false}))];

  const calRow=c=>`<li class="${c.done?'done':''}">
    <span><input type="checkbox" data-cal="${c.id}" ${c.done?'checked':''} aria-label="Done: ${esc(c.t)}"></span>
    <span class="pd${!c.done&&c.d<today?' is-overdue':''}"><input type="date" data-caldate="${c.id}" value="${c.d}"
      aria-label="Date for ${esc(c.t)}" title="Change the date"></span>
    <span><div class="pt">${esc(c.t)}</div>${c.n?`<div class="pn">${esc(c.n)}</div>`:''}</span></li>`;

  el.innerHTML=`<main class="page">
  <header class="masthead">
    <div><h1 class="page-title">Plan</h1>
      ${P.source?`<div class="dateline">${esc(P.source)}</div>`:''}</div>
    <div class="controls">
      <button class="ctl" data-act="addcal">+ Date</button>
      <button class="ctl" data-act="addopen">+ Open item</button>
    </div>
  </header>

  ${nowRows.length?`<section class="band tight" aria-labelledby="now-h">
    <h2 class="sect-label" id="now-h">Needs you now</h2>
    <ul class="attn-list">${nowRows.map(({c,late})=>`<li class="attn-row${late?'':' upcoming'}"><p>
      <span class="${late?'fig-breach':'when'}">${dueLabel(c.d)}</span> — ${esc(c.t)}${c.n?`. ${esc(c.n)}`:''}${late
        ?` <span class="pn-inline">${Math.abs(daysBetween(c.d,today))} days ago</span>`:''}</p></li>`).join('')}</ul>
  </section>`:''}

  <section class="band${nowRows.length?'':' tight'}" aria-labelledby="subs-h">
    <h2 class="sect-label" id="subs-h">Subscriptions<span class="count">${money(subsNow)}/month</span>
      <button class="ctl sect-action" data-tab="subs">Open Subscriptions</button></h2>
    <p class="lede muted">${liveSubs.length
      ?`${liveSubs.length} active${nextSub?` · next is ${esc(nextSub.x.name)}, ${money(subAmountOn(nextSub.x,nextSub.d))} on ${dueLabel(nextSub.d)}`:''}.`
      :'None tracked yet.'}</p>
  </section>

        <span class="rt reorder">

        <span><span class="nm">${esc(d.name)}</span><div class="meta">not in the order — falls to the end</div></span>

  <section class="band" aria-labelledby="open-h">

      <span><input type="checkbox" data-open="${o.id}" aria-label="Done: ${esc(o.t)}"></span>
      <span><div class="pt">${esc(o.t)}</div>${o.n?`<div class="pn">${esc(o.n)}</div>`:''}</span></li>`).join('')}</ul>`

    ${openDone.length?`<h3 class="sub-label">Done</h3><ul class="plan-list">${openDone.map(o=>`<li class="done">

      <span><div class="pt">${esc(o.t)}</div></span></li>`).join('')}</ul>`:''}
  </section>

  ${P.ref&&P.ref.show?`<section class="band" aria-labelledby="ref-h">
    <h2 class="sect-label" id="ref-h">Handoff snapshot · ${dueLabel(P.ref.asOf)}
      <button class="ctl sect-action" data-act="hideref">Hide</button></h2>
    <p class="lede muted">Reference only — <b>the weekly sheet is the source of truth</b>.
      Rows that differ are usually the sheet being ahead of the doc.</p>
    <div class="cmp-wrap"><table class="cmp">
      <thead><tr><th>Account</th><th>Sheet ${weekLabel(k)}</th><th>Handoff</th><th>Δ</th></tr></thead>
      <tbody>${Object.entries(P.ref.rows).map(([id,v])=>{
        const a=acct(id); if(!a)return'';
        const r=C.byId[id]; if(!r)return'';
        const d=r2(v-r.balance);
        return `<tr><td>${esc(a.name)}</td><td>${money(r.balance)}</td><td>${money(v)}</td>
          <td>${Math.abs(d)<0.5?'—':(d>0?'+':'−')+money(Math.abs(d))}</td></tr>`}).join('')}</tbody>
    </table></div>
    ${(P.minsToVerify||[]).length?`<ul class="attn-list" style="margin-top:var(--space-3)">${P.minsToVerify.map(m=>{
      const a=acct(m.acct);if(!a)return'';
      return `<li class="attn-row upcoming"><p><b>${esc(a.name)}</b> minimum is an estimate — <span class="fig">${money(m.est)}</span>, ${esc(m.n)}. Real number lands when the statement closes ${dueLabel(m.when)}.</p></li>`}).join('')}</ul>`:''}

  <section class="band" aria-labelledby="pcal-h">
    <h2 class="sect-label" id="pcal-h">Calendar</h2>

    ${done.length?`<h3 class="sub-label">Done</h3><ul class="plan-list dated">${done.map(calRow).join('')}</ul>`:''}
